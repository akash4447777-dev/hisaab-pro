      '<button class="btn sm" data-act="ctClearItems">✕ Lines khaali karo</button>' +
      '<span class="ct-note" id="ctItemsCount"></span>' +
      '<div class="ct-totalbox"><small>Item ka total</small><b id="ctTotalBig">' + moneyS(ctDraftAmount(d)) + "</b></div>" +
    "</div>";
}

function ctRowHTML(i, it, isTotal) {
  const amt = isTotal ? null : r2(num(it.qty) * num(it.rate));
  const units = CT_UNITS.slice();
  if (it.unit && units.indexOf(it.unit) < 0) units.push(it.unit);
  const unitSel = '<select class="inp" data-ct-item="' + i + '" data-ct-f="unit">' +
    units.map((u) => '<option value="' + esc(u) + '"' + (u === (it.unit || "kg") ? " selected" : "") + ">" + esc(u) + "</option>").join("") + "</select>";
  return '<div class="ct-row" data-row="' + i + '">' +
    '<input class="inp" list="ctItemNames" placeholder="Item ka naam" value="' + esc(it.name) + '" data-ct-item="' + i + '" data-ct-f="name" autocomplete="off">' +
    '<input class="inp" type="number" min="0" step="0.5" placeholder="Qty" value="' + (num(it.qty) || "") + '" data-ct-item="' + i + '" data-ct-f="qty">' +
    unitSel +
    (isTotal
      ? '<input class="inp" value="—" disabled style="text-align:center;color:var(--faint)" title="Ek-saath total mode me item ka rate nahi likhte">'
      : '<input class="inp" type="number" min="0" step="0.5" placeholder="Rate ₹" value="' + (num(it.rate) || "") + '" data-ct-item="' + i + '" data-ct-f="rate">') +
    '<span class="amt' + (amt ? "" : " zero") + '">' + (amt == null ? "—" : moneyS(amt)) + "</span>" +
    '<button class="del" data-act="ctDelItem" data-i="' + i + '" title="Line hatao">✕</button>' +
  "</div>";
}

function ctRepaintItems() {
  const wrap = $("#ctItemsWrap");
  if (!wrap) return;
  const scroll = window.scrollY;
  wrap.innerHTML = ctItemsWrapHTML();
  window.scrollTo(0, scroll);
  ctPatchTotals();
}
function ctPatchTotals() {
  const d = ctUI().edit;
  if (!d) return;
  const amt = ctDraftAmount(d);
  const big = $("#ctTotalBig");
  if (big) big.textContent = moneyS(amt);
  const paidEl = $("#ctPaid");
  const balEl = $("#ctBal");
  if (balEl) balEl.value = moneyS(Math.max(0, amt - num(paidEl ? paidEl.value : d.paid)));
  const cnt = $("#ctItemsCount");
  if (cnt) {
    const n = (d.items || []).filter((i) => i.name || num(i.qty) || num(i.rate)).length;
    cnt.textContent = n ? n + " item line" + (n > 1 ? "s" : "") : "Koi item nahi";
  }
  const hint = $("#ctKindHint");
  if (hint) hint.textContent = ctKindHint(d.kind);
}

/* modal ke andar ka input — draft update + sirf totals patch (focus nahi tootta) */
function ctFieldInput(el) {
  const d = ctUI().edit;
  if (!d || !el) return;
  const idx = el.dataset ? el.dataset.ctItem : null;
  if (idx !== undefined && idx !== null && idx !== "") {
    const i = Number(idx), f = el.dataset.ctF;
    const it = (d.items || [])[i];
    if (!it) return;
    if (f === "name" || f === "unit") it[f] = el.value;
    else it[f] = Math.max(0, num(el.value));
    const row = el.closest ? el.closest(".ct-row") : null;
    if (row && d.mode !== "total") {
      const a = $(".amt", row);
      if (a) { const v = r2(num(it.qty) * num(it.rate)); a.textContent = v ? moneyS(v) : "—"; a.classList.toggle("zero", !v); }
    }
    ctPatchTotals();
    return;
  }
  const id = el.id;
  if (id === "ctLump") { d.amount = Math.max(0, num(el.value)); ctPatchTotals(); }
  else if (id === "ctPaid") { d.paid = Math.max(0, num(el.value)); ctPatchTotals(); }
  else if (id === "ctParty") d.party = el.value;
  else if (id === "ctBill") d.billNo = el.value;
  else if (id === "ctNote") d.note = el.value;
  else if (id === "ctDateM") { if (el.value) d.date = el.value; }
  else if (id === "ctPayMode") { d.payMode = CT_PAY[el.value] ? el.value : "cash"; }
}
/* item ka naam blur/change hone par rate list se rate + unit bhar do */
function ctAutoRate(el) {
  const d = ctUI().edit;
  if (!d || d.mode === "total" || !el || el.dataset.ctF !== "name") return;
  const i = Number(el.dataset.ctItem);
  const it = (d.items || [])[i];
  if (!it) return;
  const hit = ctRateFor(el.value) || ctLastRateInfo(el.value);
  if (!hit) return;
  const rate = num(hit.rate);
  if (!rate) return;
  if (!num(it.rate)) {
    it.rate = rate;
    const row = el.closest(".ct-row");
    const rInp = row ? $('[data-ct-f="rate"]', row) : null;
    if (rInp) rInp.value = rate;
  }
  if (hit.unit && it.unit !== hit.unit) {
    it.unit = hit.unit;
    const row = el.closest(".ct-row");
    const uSel = row ? $('[data-ct-f="unit"]', row) : null;
    if (uSel) {
      if (!Array.from(uSel.options).some((o) => o.value === hit.unit)) uSel.add(new Option(hit.unit, hit.unit));
      uSel.value = hit.unit;
    }
  }
  ctPatchTotals();
  const row = el.closest(".ct-row");
  if (row) { const a = $(".amt", row); if (a) { const v = r2(num(it.qty) * num(it.rate)); a.textContent = v ? moneyS(v) : "—"; a.classList.toggle("zero", !v); } }
}

/* ------------------------- 21j. SAVE / DELETE ------------------------- */
function ctSave() {
  const d = ctUI().edit;
  if (!d) return;
  const el = (id) => document.getElementById(id);
  const party = el("ctParty") ? el("ctParty").value.trim() : String(d.party || "");
  const billNo = el("ctBill") ? el("ctBill").value.trim() : String(d.billNo || "");
  const note = el("ctNote") ? el("ctNote").value.trim() : String(d.note || "");
  const date = el("ctDateM") && el("ctDateM").value ? el("ctDateM").value : d.date;
  const payMode = el("ctPayMode") && CT_PAY[el("ctPayMode").value] ? el("ctPayMode").value : d.payMode;
  const paidRaw = Math.max(0, num(el("ctPaid") ? el("ctPaid").value : d.paid));
  const lumpRaw = Math.max(0, num(el("ctLump") ? el("ctLump").value : d.amount));

  const items = (d.items || []).map(normCtItem).filter((i) => i.name || i.qty || i.rate);
  const itemsTotal = r2(items.reduce((t, i) => t + i.qty * i.rate, 0));
  const amount = d.mode === "total" ? r2(lumpRaw) : itemsTotal;

  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date))) return toast("Sahi date chuno", "bad");
  if (amount <= 0 && !items.length) return toast("Kuch to likho — item ka rate ya pura total", "bad");
  if (amount <= 0 && d.mode !== "total") {
    return toast("Rate nahi bhara. Ya har item ka rate likho, ya “Σ Ek saath pura total” chuno.", "bad");
  }
  if (amount <= 0 && d.mode === "total") return toast("Pura total (₹) likho — jaise 3450", "bad");

  const isNew = !d.id;
  const C = ct();
  const prev = isNew ? null : (C.entries.find((x) => x.id === d.id) || null);
  const prevSnap = prev ? JSON.parse(JSON.stringify(prev)) : null;

  const entry = normCtEntry({
    id: isNew ? uid() : d.id,
    date: date, kind: d.kind, mode: d.mode, items: items, amount: amount,
    party: party, billNo: billNo, paid: r2(clamp(paidRaw, 0, amount)), payMode: payMode, note: note,
    createdAt: prevSnap ? prevSnap.createdAt : Date.now(), updatedAt: Date.now()
  });

  if (isNew) C.entries.push(entry);
  else {
    const i = C.entries.findIndex((x) => x.id === entry.id);
    if (i >= 0) C.entries[i] = entry; else C.entries.push(entry);
  }
  ctSyncRates(entry);
  ctLogIt(isNew ? "add" : "edit", entry, prevSnap, ctLogText(entry) + (isNew ? "" : " — edited"));

  Store.save();
  closeModal();
  const u = ctUI();
  u.edit = null;
  u.date = entry.date;
  if (UI.view === "canteen") { const p = ctParts(entry.date); UI.year = p.y; UI.month = p.m; }
  if (UI.view !== "canteen") go("canteen"); else render();

  if (isNew) {
    setUndo(() => {
      const CC = ct();
      const j = CC.entries.findIndex((x) => x.id === entry.id);
      if (j >= 0) CC.entries.splice(j, 1);
      ctLogIt("delete", entry, entry, ctLogText(entry) + " — undo");
      Store.save(); render(); toast("Entry hata di", "ok");
    }, "Entry save ho gayi — " + ctKindOf(entry).label + " " + money0(entry.amount));
  } else {
    toast("Entry update ho gayi ✔", "ok");
  }
}

function ctCsvList() {
  const u = ctUI();
  if (u.tab === "day") return ctOnDate(u.date);
  if (u.tab === "entries") return ctFilteredEntries();
  return ctInMonth(UI.year, UI.month);
}
function ctCsv() {
  const list = ctCsvList();
  if (!list.length) return toast("Export karne ke liye koi entry nahi", "bad");
  const head = ["Date", "Day", "Type", "Party", "Bill no", "Mode", "Item", "Qty", "Unit", "Rate", "Item amount",
                "Entry total", "Paid", "Balance", "Pay mode", "Note"];
  const lines = [head.join(",")];
  list.slice().sort((a, b) => (a.date === b.date ? num(a.createdAt) - num(b.createdAt) : (a.date < b.date ? -1 : 1))).forEach((e) => {
    const its = (e.items || []).filter((i) => i.name || i.qty || i.rate);
    const base = [e.date, ctDayName(e.date), ctKindOf(e).en, e.party || "", e.billNo || "",
                  e.mode === "total" ? "Lump-sum total" : "Item-wise rate"];
    const tail = [ctAmount(e), Math.min(ctPaid(e), ctAmount(e)), ctBalance(e), CT_PAY[e.payMode] || "Cash", e.note || ""];
    if (e.mode === "itemized" && its.length) {
      its.forEach((i) => lines.push(base.concat([i.name, num(i.qty), i.unit, num(i.rate), r2(num(i.qty) * num(i.rate))], tail).map(csvCell).join(",")));
    } else {
      lines.push(base.concat([its.length ? ctItemLabel(e) : "(ek saath total)", "", "", "", ""], tail).map(csvCell).join(","));
    }
  });
  const t = ctTotals(list);
  lines.push([]);
  lines.push(["TOTALS", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""].map(csvCell).join(","));
  lines.push(["", "", "Purchase (saman)", "", "", "", "", "", "", "", "", t.purchase].map(csvCell).join(","));
  lines.push(["", "", "Sale", "", "", "", "", "", "", "", "", t.sale].map(csvCell).join(","));
  lines.push(["", "", "Expense", "", "", "", "", "", "", "", "", t.expense].map(csvCell).join(","));
  lines.push(["", "", "Net", "", "", "", "", "", "", "", "", t.net].map(csvCell).join(","));
  lines.push(["", "", "Paid", "", "", "", "", "", "", "", "", t.paid].map(csvCell).join(","));
  lines.push(["", "", "Balance", "", "", "", "", "", "", "", "", t.balance].map(csvCell).join(","));
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const u = ctUI();
  a.download = u.tab === "day" ? "Canteen_Din_" + u.date + ".csv"
    : u.tab === "entries" ? "Canteen_Entries_" + isoDate(new Date()) + ".csv"
    : "Canteen_" + MONTHS_S[UI.month] + "-" + UI.year + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Canteen CSV download ho gayi", "ok");
}

      "</div><div>" +
        mRow("Saman aaya", money(t.purchase)) + mRow("Bikri", money(t.sale)) + mRow("Kharcha", money(t.expense)) +
      "</div></div>" +
      '<h4 class="sec">Entries</h4>' +
      (list.length
        ? "<table><thead><tr><th>Type</th><th>Party</th><th>Bill</th><th>Mode</th><th>Saman</th>" +
          '<th class="r">Amount (₹)</th><th class="r">Paid</th><th class="r">Baki</th></tr></thead><tbody>' +
          list.slice().reverse().map((e) => "<tr><td>" + esc(ctKindOf(e).en) + "</td><td>" + esc(e.party || "—") + "</td>" +
            "<td>" + esc(e.billNo || "—") + "</td><td>" + (e.mode === "total" ? "Lump-sum" : "Item-wise") + "</td>" +
            "<td>" + esc(ctItemLabel(e) || "—") + "</td>" +
            '<td class="r">' + money(ctAmount(e)) + "</td>" +
            '<td class="r">' + money(Math.min(ctPaid(e), ctAmount(e))) + "</td>" +
            '<td class="r">' + money(ctBalance(e)) + "</td></tr>").join("") +
          "</tbody></table>"
        : "<p style='color:#6b7280'>Is din koi entry nahi.</p>") +
      (items.length
        ? '<h4 class="sec">Saman item-wise (rate ke saath)</h4>' +
          "<table><thead><tr><th>Item</th><th class=\"r\">Qty</th><th>Unit</th>" +
          '<th class="r">Avg rate</th><th class="r">Amount (₹)</th></tr></thead><tbody>' +
          items.map((i) => "<tr><td>" + esc(i.name) + '</td><td class="r">' + num(i.qty) + "</td><td>" + esc(i.unit) + "</td>" +
            '<td class="r">' + money(i.avgRate) + '</td><td class="r">' + money(i.amt) + "</td></tr>").join("") +
          '<tr><td colspan="4"><b>Item-wise total</b></td><td class="r"><b>' + money(t.itemizedAmt) + "</b></td></tr></tbody></table>"
        : "") +
      (t.totalModeCount ? '<div class="inwords">Σ ' + t.totalModeCount + " entry me sirf ek-saath total likha hai (item ka alag rate nahi) — " +
        "<b>" + money(t.totalModeAmt) + "</b>.</div>" : "") +
      '<div class="net"><div><div class="l">Din ka net (bikri − saman − kharcha)</div>' +
        '<div style="font-size:11px;opacity:.75">Paid ' + money(t.paid) + " · Baki " + money(t.balance) + "</div></div>" +
        '<div class="v">' + (t.net < 0 ? "−" : "") + money(Math.abs(t.net)) + "</div></div>" +
      '<div class="sign"><div>Prepared by</div><div>' + esc(Store.data.settings.ownerName || "Authorised signatory") + "</div></div>" +
      '<div class="ft"><span>' + esc(Store.data.settings.statementNote || "") + "</span><span>Hisaab Pro v" + APP_VERSION + "</span></div>" +
      "</div></div>";
  }
  const list = ctInMonth(y, m);
  const t = ctTotals(list);
  const days = ctMonthDays(y, m).filter((d) => d.list.length);
  const items = ctItemAgg(list);
  const parties = ctPartyAgg(list);
  return '<div class="stmt"><div class="pad">' +
    ctStmtHead("CANTEEN MONTHLY LEDGER", monthLabel(y, m), "Generated " + new Date().toLocaleString("en-IN")) +
    '<div class="meta"><div>' +
      mRow("Saman aaya (purchase)", money(t.purchase)) + mRow("Bikri / income", money(t.sale)) + mRow("Kharcha", money(t.expense)) +
    "</div><div>" +
      mRow("Entries", t.count + " (" + days.length + " din)") + mRow("Paisa diya (paid)", money(t.paid)) + mRow("Baki / udhaar", money(t.balance)) +
    "</div></div>" +
    '<h4 class="sec">Din-wise ledger</h4>' +
    (days.length
      ? "<table><thead><tr><th>Date</th><th>Din</th>" + '<th class="r">Entries</th><th class="r">Saman</th><th class="r">Bikri</th>' +
        '<th class="r">Kharcha</th><th class="r">Net</th><th class="r">Paid</th><th class="r">Baki</th></tr></thead><tbody>' +
        days.map((d) => "<tr><td>" + esc(ctPretty(d.iso)) + "</td><td>" + esc(d.day.slice(0, 3)) + "</td>" +
          '<td class="r">' + d.list.length + '</td><td class="r">' + money0(d.t.purchase) + '</td><td class="r">' + money0(d.t.sale) + "</td>" +
          '<td class="r">' + money0(d.t.expense) + '</td><td class="r"><b>' + (d.t.net < 0 ? "−" : "") + money0(Math.abs(d.t.net)) + "</b></td>" +
          '<td class="r">' + money0(d.t.paid) + '</td><td class="r">' + money0(d.t.balance) + "</td></tr>").join("") +
        '<tr><td colspan="2"><b>Mahine ka total</b></td><td class="r"><b>' + t.count + '</b></td><td class="r"><b>' + money0(t.purchase) + "</b></td>" +
        '<td class="r"><b>' + money0(t.sale) + '</b></td><td class="r"><b>' + money0(t.expense) + "</b></td>" +
        '<td class="r"><b>' + (t.net < 0 ? "−" : "") + money0(Math.abs(t.net)) + '</b></td><td class="r"><b>' + money0(t.paid) + "</b></td>" +
        '<td class="r"><b>' + money0(t.balance) + "</b></td></tr></tbody></table>"
      : "<p style='color:#6b7280'>Is mahine koi entry nahi.</p>") +
    (items.length
      ? '<h4 class="sec">Item-wise summary (rate wali entries)</h4>' +
        "<table><thead><tr><th>Item</th>" + '<th class="r">Qty</th><th>Unit</th><th class="r">Avg rate</th>' +
        '<th class="r">Amount</th><th class="r">Entries</th></tr></thead><tbody>' +
        items.map((i) => "<tr><td>" + esc(i.name) + '</td><td class="r">' + num(i.qty) + "</td><td>" + esc(i.unit) + "</td>" +
          '<td class="r">' + money(i.avgRate) + '</td><td class="r">' + money(i.amt) + '</td><td class="r">' + i.n + "</td></tr>").join("") +
        "</tbody></table>"
      : "") +
    (parties.length
      ? '<h4 class="sec">Party / supplier-wise</h4>' +
        "<table><thead><tr><th>Party</th>" + '<th class="r">Entries</th><th class="r">Total</th><th class="r">Paid</th><th class="r">Baki</th></tr></thead><tbody>' +
        parties.map((p) => "<tr><td>" + esc(p.name) + '</td><td class="r">' + p.n + '</td><td class="r">' + money(p.amt) + "</td>" +
          '<td class="r">' + money(p.paid) + '</td><td class="r">' + money(p.bal) + "</td></tr>").join("") +
        "</tbody></table>"
      : "") +
    '<div class="net"><div><div class="l">Mahine ka net (bikri − saman − kharcha)</div>' +
      '<div style="font-size:11px;opacity:.75">' + monthLabel(y, m) + " · Paid " + money(t.paid) + " · Baki " + money(t.balance) + "</div></div>" +
      '<div class="v">' + (t.net < 0 ? "−" : "") + money(Math.abs(t.net)) + "</div></div>" +
    '<div class="inwords">Amount in words: <b>' + esc(inWords(Math.abs(t.net))) + "</b></div>" +
    '<div class="sign"><div>Prepared by</div><div>' + esc(Store.data.settings.ownerName || "Authorised signatory") + "</div></div>" +
    '<div class="ft"><span>' + esc(Store.data.settings.statementNote || "") + "</span><span>Hisaab Pro v" + APP_VERSION + "</span></div>" +
    "</div></div>";
}
function ctPrintDay() {
  const iso = ctUI().date;
  if (!ctOnDate(iso).length) return toast("Is din koi entry nahi — print karne ko kuch nahi", "bad");
  $("#print-root").innerHTML = ctPrintHTML("day", iso);
  setTimeout(() => window.print(), 60);
}
function ctPrintMonth() {
  if (!ctInMonth(UI.year, UI.month).length) return toast("Is mahine koi entry nahi", "bad");
  $("#print-root").innerHTML = ctPrintHTML("month");
  setTimeout(() => window.print(), 80);
}
function ctShareDay() {
  const u = ctUI();
  const iso = u.date;
  const list = ctOnDate(iso).slice().reverse();
  const t = ctTotals(list);
  const s = Store.data.settings;
  const L = [];
  L.push("*" + (s.shopName || "Hisaab Pro") + " — Canteen Ledger*");
  L.push(ctPretty(iso) + " (" + ctDayName(iso) + ")");
  L.push("");
  if (!list.length) L.push("Is din koi entry nahi.");
  list.forEach((e) => {
    L.push(ctKindOf(e).ico + " *" + ctKindOf(e).label + "* — " + (e.party || "—"));
    const il = ctItemLabel(e);
    if (il) L.push("   " + il);
    L.push("   " + (e.mode === "total" ? "Ek saath total: " : "Total: ") + money(ctAmount(e)) +
      (ctBalance(e) > 0.005 ? " (baki " + money(ctBalance(e)) + ")" : " (paid)"));
  });
  L.push("");
  L.push("Saman: −" + money(t.purchase));
  L.push("Bikri: +" + money(t.sale));
  L.push("Kharcha: −" + money(t.expense));
  L.push("*DIN KA NET: " + (t.net < 0 ? "−" : "") + money(Math.abs(t.net)) + "*");
  if (t.balance) L.push("Baki / udhaar: " + money(t.balance));
  window.open("https://wa.me/?text=" + encodeURIComponent(L.join("\n")), "_blank");
  toast("WhatsApp khol rahe hain…", "ok");
}

/* ------------------------------ 16. EVENTS ------------------------------ */
document.addEventListener("click", (e) => {
  const nav = e.target.closest("#nav button");
  if (nav) { UI.search = ""; UI.filter = "all"; go(nav.dataset.view); return; }

  if (e.target.closest("input, select, textarea, label")) return;
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const wid = btn.dataset.wid;
  const Y = btn.dataset.y ? Number(btn.dataset.y) : UI.year;
  const M2 = btn.dataset.m !== undefined && btn.dataset.y ? Number(btn.dataset.m) : UI.month;

  switch (act) {
    case "prevMonth": UI.month--; if (UI.month < 0) { UI.month = 11; UI.year--; } render(); break;
    case "nextMonth": UI.month++; if (UI.month > 11) { UI.month = 0; UI.year++; } render(); break;
    case "todayMonth": UI.year = today.getFullYear(); UI.month = today.getMonth(); render(); break;
    case "addWorker": openWorkerModal(); break;
    case "editWorker": openWorkerModal(wid); break;
    case "delWorker":
      const w = Store.worker(wid);
      confirmDialog("Delete worker?", "Remove <b>" + esc(w ? w.name : "") + "</b> and all of their salary records? This cannot be undone.", "Delete worker", () => {
        Store.data.workers = Store.data.workers.filter((x) => x.id !== wid);
        Store.data.records = Store.data.records.filter((r) => r.workerId !== wid);
        Store.save(); render(); toast("Worker deleted");
      }, true); break;
    case "workerHistory": { const ww = Store.worker(wid); UI.search = ww ? ww.name : ""; UI.filter = "all"; go("records"); break; }
    case "closeModal": closeModal(); break;
    case "closeDrawer": closeDrawer(); break;
    case "openProfile": closeModal(); openProfile(wid); break;
    case "toggleThemeIcon": toggleTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); break;
    case "toggleTheme": toggleTheme(btn.dataset.theme); break;
    case "setFilter": UI.filter = btn.dataset.filter; render(); break;
    case "exportCsv": exportCsv(); break;
    case "shareWa": shareWa(wid, Y, M2); break;
    case "doUndo": doUndo(); break;
    case "openCmdk": openCmdk(); break;
    case "openRec": openRecordModal(wid, UI.year, UI.month); break;
    case "openRecAt": openRecordModal(wid, Y, M2); break;
    case "printRec": printStatement(wid, UI.year, UI.month); break;
    case "printRecAt": printStatement(wid, Y, M2); break;
    case "pdfRec": downloadStatementPdf(wid, UI.year, UI.month); break;
    case "pdfRecAt": downloadStatementPdf(wid, Y, M2); break;
    case "togglePaid": togglePaid(wid, UI.year, UI.month); render(); break;
    case "gotoHisaab": go("hisaab"); break;
    case "autoFillAll": autoFillAll(); break;
    case "copyPrev": copyPreviousMonth(); break;
    case "markAllPaid": markAllPaid(); break;
    case "printAll": printAll(); break;
    case "pdfAll": downloadAllPdfs(); break;
    case "addAdv": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      const d = new Date();
      rec.advances.push({ id: uid(), date: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"), note: "", amount: 0 });
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal();
      const rows = $$("#advList .adv-row"); const last = rows[rows.length - 1];
      if (last) { const n = $(".a-note", last); if (n) n.focus(); }
      break;
    }
    case "delAdv": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.advances = rec.advances.filter((a) => a.id !== btn.dataset.id);
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal(); break;
    }
    case "addDed": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.deductions.push({ id: uid(), label: "", amount: 0 });
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal();
      const rows = $$("#dedList .ded-row"); const last = rows[rows.length - 1];
      if (last) { const n = $(".d-label", last); if (n) n.focus(); }
      break;
    }
    case "delDed": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.deductions = rec.deductions.filter((d) => d.id !== btn.dataset.id);
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal(); break;
    }
    case "fillFull": {
      const rec = currentModalRec(); if (!rec) return;
      const meta = monthMeta(rec.year, rec.month);
      const wd = rec.includeSundays ? meta.dim : meta.workingDays;
      $("#mPresent").value = wd; $("#mAbsent").value = 0;
      commitModal(); refreshRecModal(); break;
    }
    case "quickAbsent": {
      const rec = currentModalRec(); if (!rec) return;
      const meta = monthMeta(rec.year, rec.month);
      const wd = rec.includeSundays ? meta.dim : meta.workingDays;
      const n = Number(btn.dataset.n);
      $("#mAbsent").value = n; $("#mPresent").value = Math.max(0, wd - n);
      commitModal(); refreshRecModal(); break;
    }
    case "delRec":
      confirmDialog("Delete record?", "Delete the " + monthLabel(UI.openRec.y, UI.openRec.m) + " hisaab for this worker?", "Delete", () => {
        const st = UI.openRec;
        Store.data.records = Store.data.records.filter((r) => !(r.workerId === st.wid && r.year === st.y && r.month === st.m));
        Store.save(); closeModal(); render(); toast("Record deleted");
      }, true); break;
    case "saveRecClose": commitModal(); closeModal(); render(); toast("Saved", "ok"); break;
    case "printRecModal": { const st = UI.openRec; commitModal(); printStatement(st.wid, st.y, st.m); break; }
    case "pdfRecModal": { const st = UI.openRec; commitModal(); downloadStatementPdf(st.wid, st.y, st.m); break; }
    case "saveSettings": {
      const s = Store.data.settings;
      s.shopName = $("#sShop").value.trim() || "My Shop";
      s.ownerName = $("#sOwner").value.trim();
      s.phone = $("#sPhone").value.trim();
      s.address = $("#sAddress").value.trim();
      s.statementNote = $("#sNote").value;
      Store.save(); render(); toast("Settings saved", "ok"); break;
    }
    case "keepDemo": Store.data.settings.demo = false; Store.save(); render(); break;
    case "clearDemo":
      confirmDialog("Start fresh?", "Erase the demo workers and records so you can add your own. <b>Your shop details in Settings are kept.</b>" +
        (ct().demo ? " Demo canteen entries bhi hat jayengi." : " <b>Aapki canteen entries safe rahengi.</b>"), "Start fresh", () => {
        const keep = { ...Store.data.settings, demo: false };
        const keepCt = ct().demo ? blankCanteen() : ct();
        Store.data = { settings: keep, workers: [], records: [], canteen: keepCt };
        Store.save(); render(); toast("Demo data cleared — add your first worker", "ok");
      }, true); break;
    /* ------------------------- CANTEEN MODULE ------------------------- */
    case "gotoCanteen": ctUI().tab = ctUI().tab || "day"; go("canteen"); break;
    case "ctTab": { const u = ctUI(); u.tab = btn.dataset.tab || "day"; render(); break; }
    case "ctDayShift": {
      const u = ctUI();
      u.date = ctShiftDate(u.date, Number(btn.dataset.d) || 0);
      const p = ctParts(u.date); UI.year = p.y; UI.month = p.m;
      render(); break;
    }
    case "ctGoToday": {
      const u = ctUI(); u.date = isoDate(new Date());
      const p = ctParts(u.date); UI.year = p.y; UI.month = p.m;
      render(); break;
    }
    case "ctOpenDay": {
      const u = ctUI();
      if (btn.dataset.date) u.date = btn.dataset.date;
      u.tab = "day";
      const p = ctParts(u.date); UI.year = p.y; UI.month = p.m;
      render(); break;
    }
    case "ctAdd": openCtModal(null, btn.dataset.date || undefined); break;
    case "ctEdit": openCtModal(btn.dataset.id); break;
    case "ctDel": ctDelEntry(btn.dataset.id); break;
    case "ctDup": ctDupEntry(btn.dataset.id); break;
    case "ctPay": ctPayModal(btn.dataset.id); break;
    case "ctPaySave": ctPaySave(btn.dataset.id); break;
    case "ctPayZero": ctPayZero(btn.dataset.id); break;
    case "ctSave": ctSave(); break;
    case "ctSetKind": {
      const d = ctUI().edit; if (!d) break;
      if (CT_KINDS.indexOf(btn.dataset.kind) >= 0) d.kind = btn.dataset.kind;
      ctRenderModal(!!d.id); break;
    }
    case "ctSetMode": {
      const d = ctUI().edit; if (!d) break;
      const mode = btn.dataset.mode === "total" ? "total" : "itemized";
      if (mode === d.mode) break;
      /* item-wise ka bana hua total, lump-sum box me carry kar lo */
      if (mode === "total" && !num(d.amount)) d.amount = ctDraftAmount(d);
      d.mode = mode;
      ctRenderModal(!!d.id);
      break;
    }
    case "ctAddItem": { const d = ctUI().edit; if (!d) break; d.items = (d.items || []).concat([ctBlankItem()]); ctRepaintItems(); break; }
    case "ctDelItem": {
      const d = ctUI().edit; if (!d) break;
      const i = Number(btn.dataset.i);
      if (!isNaN(i) && Array.isArray(d.items) && d.items.length > i) d.items.splice(i, 1);
      if (!d.items.length) d.items = [ctBlankItem()];
      ctRepaintItems(); break;
    }
    case "ctClearItems": { const d = ctUI().edit; if (!d) break; d.items = [ctBlankItem()]; ctRepaintItems(); break; }
    case "ctPayFull": {
      const d = ctUI().edit; if (!d) break;
      const amt = ctDraftAmount(d);
      d.paid = amt;
      const p = $("#ctPaid"); if (p) p.value = amt || "";
      const pm = $("#ctPayMode"); if (pm && pm.value === "udhaar") { pm.value = "cash"; d.payMode = "cash"; }
      ctPatchTotals();
      toast(amt ? "Poora " + money0(amt) + " paid likh diya" : "Pehle saman ka total bharo", amt ? "ok" : "bad");
      break;
    }
    case "ctPayNone": {
      const d = ctUI().edit; if (!d) break;
      d.paid = 0; d.payMode = "udhaar";
      const p = $("#ctPaid"); if (p) p.value = "";
      const pm = $("#ctPayMode"); if (pm) pm.value = "udhaar";
      ctPatchTotals(); toast("Poora udhaar — baki me chala gaya"); break;
    }
    case "ctScope": {
      const u = ctUI(); const s = btn.dataset.scope;
      u.scope = s === "all" ? "all" : (s === "custom" ? "custom" : "month");
      if (u.scope !== "custom") { u.from = ""; u.to = ""; }
      else { if (!u.from) u.from = monthFirst(UI.year, UI.month); if (!u.to) u.to = monthLast(UI.year, UI.month); }
      render(); break;
    }
    case "ctLogScope": { const u = ctUI(); u.logScope = btn.dataset.scope === "all" ? "all" : "month"; render(); break; }
    case "ctResetFilter": {
      const u = ctUI(); u.q = ""; u.kind = "all"; u.from = ""; u.to = ""; u.scope = "month";
      render(); toast("Filter reset"); break;
    }
    case "ctRateAdd": ctRateAdd(); break;
    case "ctRateEdit": ctRateEditModal(btn.dataset.id); break;
    case "ctRateSave": ctRateSave(btn.dataset.id); break;
    case "ctRateDel": ctRateDel(btn.dataset.id); break;
    case "ctCsv": ctCsv(); break;
    case "ctPrintDay": ctPrintDay(); break;
    case "ctPrintMonth": ctPrintMonth(); break;
    case "ctShareDay": ctShareDay(); break;
    case "ctRestore": ctRestoreLog(btn.dataset.log); break;
    case "ctWipe": ctWipe(); break;

    case "lcMode": Cloud.mode = btn.dataset.mode; showLogin(true); break;
    case "continueOffline": showLogin(false); toast("Bina login — data sirf is device par save hoga"); break;
    case "cloudConnect": connectCloud(); break;
    case "cloudLogin": Cloud.mode = "in"; showLogin(true); break;
    case "cloudLogout": Cloud.signOut(); break;
    case "cloudDisconnect": disconnectCloud(); break;
    case "cloudSyncNow":
      Cloud.pushNow().then(() => { toast("Cloud par sync ho gaya ✔", "ok"); render(); });
      break;
    case "useCloud":
      if (Cloud._pending) { adoptRemote(Cloud._pending); Cloud._pending = null; toast("Cloud ka data load ho gaya ✔", "ok"); }
      break;
    case "useLocal":
      closeModal();
      Cloud.pushNow().then(() => { toast("Is device ka data cloud par upload ho gaya ✔", "ok"); render(); });
      break;
    case "exportData": exportData(); break;
    case "importData": importData(); break;
    case "loadSample":
      confirmDialog("Load sample data?", "This replaces all current workers and records with a demo set.", "Load sample", () => {
        Store.data = sampleData(); Store.save(); render(); toast("Sample data loaded", "ok");
      }, true); break;
    case "wipeData":
      confirmDialog("Erase all data?", "This deletes <b>all workers and salary records</b> from this browser. Download a backup first if unsure.", "Erase everything", () => {
        Store.data = blankData(); Store.save(); render(); toast("All data erased");
      }, true); break;
  }
});

/* month / year pickers */
document.addEventListener("change", (e) => {
  if (e.target.id === "selMonth") { UI.month = Number(e.target.value); render(); }
  if (e.target.id === "selYear") { UI.year = Number(e.target.value); render(); }
  if (e.target.id === "hisaabFilter" || e.target.id === "recordFilter") { UI.filter = e.target.value; render(); }
});

/* search inputs (debounced, focus preserved) */
let searchTimer = null;
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "hisaabSearch" || id === "workerSearch" || id === "recordSearch") {
    UI.search = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const pos = e.target.selectionStart;
      render();
      const n = document.getElementById(id);
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
    }, 220);
  }
  /* inline attendance editing in the hisaab table */
  if (e.target.classList && e.target.classList.contains("cell-inp")) {
    const inp = e.target;
    const f = inp.dataset.f;
    const wid2 = inp.dataset.wid;
    const rec = Store.ensureRecord(wid2, UI.year, UI.month, true);
    const meta = monthMeta(UI.year, UI.month);
    const wd = rec.includeSundays ? meta.dim : meta.workingDays;
    if (f === "totalHours") {
      rec.totalHours = Math.max(0, num(inp.value));
    } else {
      let v = clamp(Math.round(num(inp.value)), 0, wd);
      rec[f] = v;
      if (f === "presentDays") rec.absentDays = Math.max(0, wd - v);
      else rec.presentDays = Math.max(0, wd - v);
    }
    Store.persistRecord(rec);
    patchRow(wid2);
    patchAllTotals();
  }
  /* modal advance/deduction amount edits */
  if (e.target.closest && e.target.closest("#advList, #dedList")) {
    commitModal(); refreshRecModal();
  }
});
document.addEventListener("change", (e) => {
  if (e.target.classList && e.target.classList.contains("cell-inp")) patchAllTotals();
});

/* ---------------- canteen: modal inputs, din chunna, entry filters ---------------- */
const CT_MODAL_IDS = ["ctLump", "ctPaid", "ctParty", "ctBill", "ctNote", "ctDateM", "ctPayMode"];
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el) return;
  if (el.dataset && el.dataset.ctItem !== undefined) { ctFieldInput(el); return; }
  if (el.id && CT_MODAL_IDS.indexOf(el.id) >= 0) { ctFieldInput(el); return; }
  if (el.id === "ctSearch") {
    /* sirf table dobara banao — search box ka focus nahi tootega */
    ctUI().q = el.value;
    const body = document.getElementById("ctEntriesBody");
    if (body) body.innerHTML = ctEntriesTable();
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (!el) return;
  if (el.dataset && el.dataset.ctItem !== undefined) {
    ctFieldInput(el);
    if (el.dataset.ctF === "name") ctAutoRate(el);
    return;
  }
  if (el.id === "ctDatePick") {
    const u = ctUI();
    if (el.value) { u.date = el.value; const p = ctParts(el.value); UI.year = p.y; UI.month = p.m; }
    render();
  } else if (el.id === "ctFrom" || el.id === "ctTo") {
    const u = ctUI();
    u[el.id === "ctFrom" ? "from" : "to"] = el.value || "";
    if (u.from || u.to) u.scope = "custom";
    render();
  } else if (el.id === "ctKindSel") {
    ctUI().kind = CT_KINDS.indexOf(el.value) >= 0 ? el.value : "all";
    render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#overlay")) closeModal(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) { try { Cloud.maybePull(); } catch (e) {} } });
setInterval(() => { try { Cloud.maybePull(); } catch (e) {} }, 60000);

/* patch one hisaab row after inline edit (keeps focus) */
function patchRow(wid) {
  const tr = $('tr[data-wid="' + wid + '"]');
  if (!tr || !tr.querySelector(".cell-inp")) return;
  const rec = Store.record(wid, UI.year, UI.month);
  const w = Store.worker(wid);
  if (!rec || !w) return;
  const c = calc(w, rec, Store.data.settings);
  $$(".cell-inp", tr).forEach((inp) => {
    const f = inp.getAttribute("data-f");
    if (f === "presentDays" && document.activeElement !== inp) inp.value = c.present;
    if (f === "absentDays" && document.activeElement !== inp) inp.value = c.absent;
    if (f === "totalHours" && document.activeElement !== inp) inp.value = c.totalHours;
    inp.classList.toggle("bad", f === "totalHours" ? c.needsHours : c.overAttendance);
  });
  const cell = (k) => $('[data-cell="' + k + '"]', tr);
  if (cell("sundays")) cell("sundays").textContent = c.sundays;
  if (cell("wd")) cell("wd").textContent = c.workingDays;
  if (cell("perDay")) cell("perDay").innerHTML = c.isHourly ? '<span class="muted">' + money0(w.rate) + "/hr</span>" : money(c.perDay);
  if (cell("gross")) cell("gross").textContent = moneyS(c.grossEarnings);
  if (cell("adv")) { cell("adv").textContent = c.advTotal ? "−" + moneyS(c.advTotal) : "—"; cell("adv").style.color = "#dc2626"; }
  if (cell("ded")) { cell("ded").textContent = c.dedTotal ? "−" + moneyS(c.dedTotal) : "—"; cell("ded").style.color = "#dc2626"; }
  if (cell("net")) cell("net").textContent = moneyS(c.net);
}

/* recompute totals without re-rendering the table (keeps input focus) */
function patchAllTotals() {
  let g = 0, a = 0, d = 0, n = 0;
  rowsForMonth(UI.year, UI.month).forEach(({ c }) => { g += c.grossEarnings; a += c.advTotal; d += c.dedTotal; n += c.net; });
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("totGross", moneyS(g)); set("totAdv", a ? "−" + moneyS(a) : "—"); set("totDed", d ? "−" + moneyS(d) : "—"); set("totNet", moneyS(n));
  set("sumGross", moneyS(g)); set("sumAdv", a ? "−" + moneyS(a) : moneyS(0));
  set("sumDed", d ? "−" + moneyS(d) : moneyS(0)); set("sumNet", moneyS(n));
}

/* ----------------------------- 17. BOOTSTRAP ---------------------------- */
Store.load();
initTheme();

/* ---- keyboard shortcuts: Ctrl/Cmd+K = command palette, g+key = pages ---- */
let gKey = false, gTimer = null;
document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmdk(); return; }
  if (e.key === "Escape") { closeCmdk(); closeDrawer(); return; }
  if (typing) return;
  if (e.key.toLowerCase() === "g") { gKey = true; clearTimeout(gTimer); gTimer = setTimeout(() => { gKey = false; }, 900); return; }
  if (gKey) {
    gKey = false;
    const map = { d: "dashboard", h: "hisaab", w: "workers", l: "ledger", c: "canteen", r: "records", s: "settings" };
    const v = map[e.key.toLowerCase()];
    if (v) { e.preventDefault(); UI.search = ""; UI.filter = "all"; go(v); }
  }
});

/* ---- global search box in the topbar ---- */
document.addEventListener("input", (e) => {
  if (e.target.id !== "gSearch") return;
  UI.search = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const pos = e.target.selectionStart;
    if (UI.view !== "hisaab" && UI.view !== "workers" && UI.view !== "records") UI.view = "hisaab";
    $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === UI.view));
    const m = VIEW_META[UI.view] || ["", ""];
    if ($("#viewTitle")) $("#viewTitle").textContent = m[0];
    if ($("#viewSub")) $("#viewSub").textContent = m[1];
    render();
    const g = document.getElementById("gSearch");
    if (g) { g.focus(); try { g.setSelectionRange(pos, pos); } catch (err) {} }
  }, 200);
});

syncMonthPickers();
go("dashboard");
try { Cloud.boot(); } catch (e) {}
window.Hisaab = { Store, calc, monthMeta, PdfDoc, inWords, UI, render, go, Cloud,
  /* canteen module API */
  canteen: { data: ct, totals: ctTotals, entries: ctAll, onDate: ctOnDate, inMonth: ctInMonth,
             dayLedger: ctDayLedger, monthLedger: ctMonthLedger, openModal: openCtModal, save: ctSave,
             csv: ctCsv, printDay: ctPrintDay, printMonth: ctPrintMonth, blank: blankCanteen } };
})();
