<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab Pro — Worker Monthly Salary &amp; Hisaab Panel</title>
<style>
/* ============================================================
   HISAAB PRO v3 — design system
   Light + dark theme, aurora accents, soft depth
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#f4f6fc;
  --bg-grad:radial-gradient(1200px 620px at 12% -8%,#e9edff 0%,transparent 60%),
            radial-gradient(900px 520px at 100% 0%,#e6fbff 0%,transparent 55%);
  --surface:#ffffff;
  --surface-2:#f8fafd;
  --surface-3:#f1f5fb;
  --ink:#0c1424;
  --ink-2:#2c3a52;
  --muted:#6b7a91;
  --faint:#8fa0b6;
  --line:#e5eaf3;
  --line-2:#eef2f8;
  --primary:#4f46e5;
  --primary-2:#7c3aed;
  --primary-soft:#eef1ff;
  --primary-ink:var(--primary-ink);
  --cyan:#0891b2;
  --cyan-soft:#e0f7fb;
  --ok:#059669;
  --ok-soft:#e7f8f1;
  --warn:#d97706;
  --warn-soft:#fef4e3;
  --bad:#dc2626;
  --bad-soft:#fdeceb;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
  --shadow-2:0 10px 24px -12px rgba(15,23,42,.22),0 2px 6px rgba(15,23,42,.05);
  --shadow-3:0 26px 60px -22px rgba(15,23,42,.4);
  --r-sm:9px; --r:13px; --r-lg:18px; --r-xl:24px;
  --side-w:250px;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#22d3ee 130%);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#070c16;
  --bg-grad:radial-gradient(1100px 600px at 10% -10%,#1b2450 0%,transparent 60%),
            radial-gradient(900px 520px at 100% 0%,#06303c 0%,transparent 55%);
  --surface:#0e1729;
  --surface-2:#121d33;
  --surface-3:#182541;
  --ink:#eaf1ff;
  --ink-2:#c3d0e6;
  --muted:#8ea0bd;
  --faint:#6f81a0;
  --line:#1e2b45;
  --line-2:#19253c;
  --primary:#7c83ff;
  --primary-2:#a78bfa;
  --primary-soft:#1b2246;
  --primary-ink:#c7cbff;
  --cyan:#38bdf8;
  --cyan-soft:#0f2f42;
  --ok:#34d399;
  --ok-soft:#0e2f27;
  --warn:#fbbf24;
  --warn-soft:#33260c;
  --bad:#f87171;
  --bad-soft:#3a1618;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 14px 34px -18px rgba(0,0,0,.85);
  --shadow-3:0 30px 70px -24px rgba(0,0,0,.9);
}
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
a{color:var(--primary);text-decoration:none}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
.num,.tnum{font-variant-numeric:tabular-nums}

/* ---------------- shell ---------------- */
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:var(--side-w);flex:0 0 var(--side-w);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;padding:18px 14px 14px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  border-right:1px solid var(--line);
  backdrop-filter:blur(14px);z-index:40;
}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 14px}
.brand .logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--grad);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;
  box-shadow:0 10px 22px -10px rgba(99,102,241,.9),inset 0 1px 0 rgba(255,255,255,.45)
}
.brand h1{font-size:15.5px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-radius:11px;padding:9px 11px;cursor:pointer;
  color:var(--muted);font-size:13.2px;font-weight:600;text-align:left;transition:.16s ease;
}
.nav button .ico{
  width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;border-radius:7px;
  background:var(--surface-3);color:var(--muted);font-size:12px;transition:.16s ease
}
.nav button:hover{background:var(--surface-3);color:var(--ink)}
.nav button.active{background:var(--primary-soft);color:var(--primary-ink)}
.nav button.active .ico{background:var(--grad);color:#fff;box-shadow:0 6px 14px -8px rgba(99,102,241,.9)}
.nav .nav-badge{margin-left:auto;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:12px 8px 4px;border-top:1px solid var(--line);line-height:1.6}
.side-foot b{color:var(--ink-2);font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px var(--ok-soft)}

.main{flex:1;min-width:0;padding:0 22px 44px;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:35;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:16px 0 12px;margin-bottom:4px;
  background:linear-gradient(colvar(--bg),var(--bg));
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;
}
.topbar h2{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.topbar p{font-size:12.4px;color:var(--muted);margin-top:3px}
.topbar-actions{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.mp{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow-1)}
.mp select{
  border:0;background:none;color:var(--ink);font-size:12.6px;font-weight:700;padding:6px 4px;
  cursor:pointer;outline:none;max-width:106px;font-family:inherit;border-radius:8px
}
.mp select:hover{background:var(--surface-3)}
.mp button{border:0;background:none;color:var(--muted);width:26px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1}
.mp button:hover{background:var(--surface-3);color:var(--ink)}
.gsearch{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:7px 11px;min-width:170px;box-shadow:var(--shadow-1);transition:.16s
}
.gsearch:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
.gsearch input{border:0;outline:0;background:none;font-family:inherit;font-size:12.6px;color:var(--ink);width:100%}
.gsearch input::placeholder{color:var(--faint)}
.gsearch kbd{font-family:inherit;font-size:9.5px;font-weight:800;color:var(--faint);border:1px solid var(--line);padding:1px 4px;border-radius:5px}

/* ---------------- buttons ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 13px;font-size:12.8px;font-weight:700;cursor:pointer;
  transition:.15s ease;box-shadow:var(--shadow-1);white-space:nowrap
}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--line));color:var(--ink);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 10px 22px -12px rgba(99,102,241,.95),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line));background:var(--bad-soft)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line));background:var(--ok-soft)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.xs{padding:4px 7px;font-size:11.5px;border-radius:8px;min-width:26px}
.btn.icon{width:34px;height:34px;padding:0;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.iconbtn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:10px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);box-shadow:var(--shadow-1);
  transition:.15s
}
.iconbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--primary) 35%,var(--line));transform:translateY(-1px)}

/* ---------------- cards / grids ---------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.card-h{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{font-size:14.2px;font-weight:800;letter-spacing:-.01em}
.card-h .sub{font-size:11.6px;color:var(--muted);margin-top:2px}
.card-b{padding:16px 18px}
.card-pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------------- KPI ---------------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi2{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 16px 14px;box-shadow:var(--shadow-1);overflow:hidden;transition:.18s
}
.kpi2:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.kpi2::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.9}
.kpi2.k-ok::after{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi2.k-warn::after{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.kpi2.k-bad::after{background:linear-gradient(90deg,#ef4444,#fb7185)}
.kpi2.k-cyan::after{background:linear-gradient(90deg,#06b6d4,#38bdf8)}
.kpi2 .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi2 .k-lbl{font-size:10.4px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi2 .k-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);font-size:13px}
.kpi2 .k-val{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:9px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi2 .k-sub{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:10.6px;font-weight:800;padding:2px 6px;border-radius:99px}
.delta.up{background:var(--ok-soft);color:var(--ok)}
.delta.down{background:var(--bad-soft);color:var(--bad)}
.delta.flat{background:var(--surface-3);color:var(--muted)}

/* ---------------- chips / tags / avatars ---------------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.6px;font-weight:800;padding:2.5px 8px;border-radius:99px;letter-spacing:.01em}
.tag.m{background:var(--primary-soft);color:var(--primary-ink)}
.tag.h{background:var(--cyan-soft);color:var(--cyan)}
.tag.grey{background:var(--surface-3);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface-3);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.av{
  width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:12.5px;color:#fff;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)
}
.av.sm{width:27px;height:27px;flex-basis:27px;border-radius:9px;font-size:11px}
.av.lg{width:46px;height:46px;flex-basis:46px;border-radius:14px;font-size:16px}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who .nm{font-weight:800;font-size:13.2px;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------------- segmented / toolbar ---------------- */
.seg{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font-size:12.2px;font-weight:700;color:var(--muted);cursor:pointer;transition:.14s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------------- inputs ---------------- */
.inp{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:13px;color:var(--ink);font-family:inherit;outline:none;transition:.15s;box-shadow:var(--shadow-1)
}
.inp:hover{border-color:color-mix(in srgb,var(--primary) 22%,var(--line))}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
.inp:disabled{background:var(--surface-3);color:var(--muted);box-shadow:none}
textarea.inp{resize:vertical;min-height:64px}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.6px;font-weight:800;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:10.9px;color:var(--faint)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.4px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}

/* ---------------- tables ---------------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;min-width:640px}
table.tbl th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);
  font-size:9.9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  padding:10px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap
}
table.tbl th.num{text-align:right}
table.tbl td{padding:9px 9px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl .strong{font-weight:800}
table.tbl tfoot td{padding:11px 9px;background:var(--surface-2);font-weight:800;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.tbl.has-actions{min-width:940px}
@media(min-width:721px){
  table.tbl.has-actions th{padding:9px 5px;font-size:9.4px;letter-spacing:.05em}
  table.tbl.has-actions td{padding:7px 5px}
  table.tbl.has-actions .cell-inp{width:46px}
  table.tbl.has-actions .tag{font-size:9.6px;padding:2px 6px}
  table.tbl.has-actions .who .nm{font-size:12.6px}
  table.tbl.has-actions .row-actions{gap:3px}
  table.tbl.has-actions .btn.xs{width:25px;height:25px;padding:0;font-size:11px}
  table.tbl.has-actions .av.sm{width:26px;height:26px;flex-basis:26px;border-radius:8px;font-size:10.5px}
}
table.tbl.has-actions th:last-child,table.tbl.has-actions td:last-child{
  position:sticky;right:0;background:var(--surface);z-index:3;box-shadow:-8px 0 12px -10px rgba(15,23,42,.4)
}
table.tbl.has-actions thead th:last-child{background:var(--surface-2);z-index:4}
table.tbl.has-actions tbody tr:hover td:last-child{background:var(--surface-2)}
.cell-inp{
  width:56px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:5px 6px;font-size:12.6px;font-weight:700;text-align:center;color:var(--ink);
  font-family:inherit;outline:none;transition:.14s;font-variant-numeric:tabular-nums
}
.cell-inp:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.cell-inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
.cell-inp.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.cell-inp:disabled{background:transparent;border-color:transparent;color:var(--faint)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.clickable{cursor:pointer}
.bar-cell{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.mini-bar{height:4px;width:56px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}

/* ---------------- banners / misc ---------------- */
.banner{display:flex;gap:11px;align-items:flex-start;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 22%,var(--line));
  border-radius:var(--r);padding:12px 14px;font-size:12.4px;color:var(--ink-2);margin-bottom:14px;line-height:1.55}
.banner span{font-size:15px;line-height:1.2}
.banner b{color:var(--ink)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.banner.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,var(--line))}
.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty .big{width:62px;height:62px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:var(--surface-3);font-size:26px;color:var(--faint)}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:12.6px;margin-bottom:16px}
.sec-title{display:flex;align-items:center;gap:10px;font-size:10.6px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:20px 0 11px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:12.6px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}

/* ---------------- advances / deductions ---------------- */
.adv-list{display:flex;flex-direction:column;gap:7px}
.adv-item{display:grid;grid-template-columns:118px 1fr 92px 30px;gap:7px;align-items:center}
.adv-item .a-note{min-width:0}
.adv-item .a-del{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--bad);cursor:pointer;font-size:13px;line-height:1}
.adv-item .a-del:hover{background:var(--bad-soft)}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-size:12.6px;padding:5px 0}
.sum-line b{font-variant-numeric:tabular-nums}
.sum-line.plus b{color:var(--ok)}
.sum-line.minus b{color:var(--bad)}
.netbox{display:flex;justify-content:space-between;align-items:center;gap:16px;border-radius:var(--r);padding:15px 18px;color:#fff;
  background:linear-gradient(135deg,#0f766e,#059669);box-shadow:0 18px 34px -22px rgba(5,150,105,.9)}
.netbox.neg{background:linear-gradient(135deg,#b91c1c,#ef4444);box-shadow:0 18px 34px -22px rgba(239,68,68,.9)}
.netbox .l{font-size:10.6px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;opacity:.85}
.netbox .words{font-size:11.4px;opacity:.85;margin-top:3px}
.netbox .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------------- charts ---------------- */
.chartcard .card-b{padding:18px 16px 10px}
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:8px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--primary-2),var(--primary));
  position:relative;transition:.2s;min-height:4px;box-shadow:0 10px 20px -14px rgba(79,70,229,.9)}
.chart .col:hover .bar{filter:brightness(1.1)}
.chart .col.now .bar{background:linear-gradient(180deg,#22d3ee,#0891b2);box-shadow:0 12px 22px -12px rgba(8,145,178,.9)}
.chart .cap{font-size:10.5px;font-weight:700;color:var(--muted)}
.chart .val{font-size:10.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut-legend{display:flex;flex-direction:column;gap:9px;font-size:12.3px;min-width:150px}
.donut-legend div{display:flex;align-items:center;gap:8px}
.donut-legend .sw{width:9px;height:9px;border-radius:3px}
.donut-legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.spark{display:block;overflow:visible}

/* ---------------- toast / modal ---------------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);z-index:400;
  background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:12.8px;font-weight:700;
  box-shadow:var(--shadow-3);opacity:0;pointer-events:none;transition:.24s ease;max-width:92vw;text-align:center
}
html[data-theme="dark"] .toast{background:#e8eefb;color:#0b1220}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:linear-gradient(135deg,#059669,#10b981)}
.toast.bad{background:linear-gradient(135deg,#dc2626,#ef4444)}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(9,14,26,.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto;animation:fade .16s ease-out}
.modal{width:100%;max-width:760px;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-3);
  border:1px solid var(--line);animation:pop .18s ease-out;margin:auto}
.modal.sm{max-width:440px}
.modal-h{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.modal-h h3{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.modal-h .sub{font-size:11.8px;color:var(--muted);margin-top:3px}
.modal-h .x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);cursor:pointer;font-size:15px;line-height:1;flex:0 0 32px}
.modal-h .x:hover{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--surface-2);flex-wrap:wrap}
.modal-f .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------------- worker cards ---------------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.worker-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;box-shadow:var(--shadow-1);
  transition:.18s;position:relative;overflow:hidden}
.worker-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:color-mix(in srgb,var(--primary) 25%,var(--line))}
.worker-card .wc-top{display:flex;gap:11px;align-items:center;margin-bottom:13px}
.worker-card .wc-name{font-weight:800;font-size:14px;letter-spacing:-.01em;line-height:1.2}
.worker-card .wc-role{font-size:11.4px;color:var(--muted);margin-top:2px}
.worker-card .wc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.worker-card .wc-grid > div{background:var(--surface-2);border-radius:10px;padding:8px 9px}
.worker-card .wc-grid small{display:block;font-size:9.6px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:800;margin-bottom:3px}
.worker-card .wc-grid b{font-size:13px;font-variant-numeric:tabular-nums}
.worker-card .wc-foot{display:flex;gap:6px;border-top:1px solid var(--line-2);padding-top:11px;margin-top:11px}
.worker-card.off{opacity:.62}

/* ---------------- stat strips ---------------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip > div{background:var(--surface);padding:12px 14px}
.strip small{display:block;font-size:10.2px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800;margin-bottom:4px}
.strip b{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strip .sub{font-size:10.8px;color:var(--muted);margin-top:2px}

/* ---------------- profile drawer ---------------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:320;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:slidein .2s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:center}
.drawer-body{padding:16px 18px 24px;overflow-y:auto;flex:1;min-height:0}
.drawer .modal-f{border-radius:0;padding:12px 14px;gap:6px;flex-wrap:nowrap;overflow-x:auto}
.drawer .modal-f .btn{flex:0 0 auto}
.drawer .modal-f .left{gap:6px}

/* ---------------- command palette ---------------- */
.cmdk{position:fixed;inset:0;z-index:360;background:rgba(9,14,26,.5);backdrop-filter:blur(3px);display:flex;justify-content:center;padding-top:12vh}
.cmdk-box{width:min(560px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-3);overflow:hidden;height:max-content}
.cmdk-inp{width:100%;border:0;border-bottom:1px solid var(--line);padding:15px 18px;font-size:14.5px;background:none;color:var(--ink);outline:none;font-family:inherit}
.cmdk-list{max-height:46vh;overflow-y:auto;padding:6px}
.cmdk-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.cmdk-item.on,.cmdk-item:hover{background:var(--primary-soft);color:var(--primary-ink)}
.cmdk-item .k{margin-left:auto;font-size:10px;color:var(--faint);font-weight:800}

/* ---------------- print statement (unchanged design) ---------------- */
#print-root{display:none}
.stmt{background:#fff;color:#111827;max-width:820px;margin:0 auto;font-size:12px;box-shadow:0 20px 40px -30px rgba(0,0,0,.6);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.stmt .pad{padding:26px 28px}
.stmt .top{display:flex;justify-content:space-between;gap:18px;border-bottom:2.5px solid #0f172a;padding-bottom:14px}
.stmt .shop{font-size:19px;font-weight:800;letter-spacing:-.01em}
.stmt .addr{font-size:11px;color:#4b5563;margin-top:3px;line-height:1.5}
.stmt .doc{text-align:right}
.stmt .doc b{font-size:15px;letter-spacing:.03em;display:block}
.stmt .doc small{font-size:10.5px;color:#6b7280;display:block;margin-top:2px}
.stmt .pill{display:inline-block;border:1px solid #0f172a;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.06em;margin-top:6px}
.stmt .pill.paid{border-color:#059669;color:#059669}
.stmt .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin:16px 0}
.stmt .meta .r{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:4px 0;border-bottom:1px dashed #e5e7eb}
.stmt .meta .r span{color:#6b7280}
.stmt .meta .r b{font-weight:700}
.stmt h4.sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#374151;margin:18px 0 7px;padding-bottom:5px;border-bottom:1px solid #e5e7eb}
.stmt table{width:100%;border-collapse:collapse;font-size:12px}
.stmt th{background:#f3f4f6;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#374151;text-align:left;padding:7px 9px;border:1px solid #e5e7eb}
.stmt td{padding:7px 9px;border:1px solid #e5e7eb}
.stmt td.r, .stmt th.r{text-align:right;font-variant-numeric:tabular-nums}
.stmt .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stmt .net{display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:#fff;padding:13px 16px;border-radius:10px;margin-top:16px}
.stmt .net .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-weight:700}
.stmt .net .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stmt .inwords{margin-top:9px;font-size:11.5px;color:#374151;background:#f9fafb;border:1px dashed #d1d5db;padding:9px 12px;border-radius:8px}
.stmt .inwords b{color:#111827}
.stmt .sign{display:flex;justify-content:space-between;gap:30px;margin-top:52px;font-size:11px;color:#4b5563}
.stmt .sign div{border-top:1px solid #9ca3af;padding-top:6px;width:180px;text-align:center}
.stmt .ft{margin-top:26px;border-top:1px solid #e5e7eb;padding-top:9px;font-size:10px;color:#9ca3af;display:flex;justify-content:space-between}

/* ---------------- login screen ---------------- */
#loginRoot:not(:empty){display:block}
.login-wrap{position:fixed;inset:0;z-index:250;background:radial-gradient(1200px 600px at 50% -15%,#1e293b,#0b1220 55%,#070c16 100%);
  display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.login-card{width:100%;max-width:392px;background:#fff;border-radius:20px;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.75);animation:pop .2s ease-out;color:#0c1424}
.lc-head{display:flex;gap:11px;align-items:center}
.lc-head .logo{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee 130%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.lc-head h2{font-size:18px;line-height:1.15;color:#0c1424}
.lc-head p{margin:3px 0 0;font-size:12px;color:#6b7a91}
.login-card .seg{display:flex}
.login-card .inp{padding:10px 12px;background:#fff;color:#0c1424;border-color:#e5eaf3}
.login-card label{color:#2c3a52}
.login-card .hint{color:#8fa0b6}
.cloud-pill{display:inline-flex;align-items:center;gap:4px}

}

/* ---------------- print ---------------- */
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff !important;color:#000}
  .app,.toast,.overlay,.drawer,.cmdk,.sidebar,.topbar{display:none !important}

<script>
/* ============================================================================
   HISAAB PRO — Worker Monthly Salary & Hisaab Panel
   Single-file app. Data is stored in this browser (localStorage).
   Salary rule: monthly salary is ALWAYS divided by 30 (fixed 30-day month).
   Sundays are auto-excluded from payable working days.
   ========================================================================== */
(function () {
"use strict";

/* ----------------------------- 1. UTILITIES ----------------------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const APP_VERSION = "3.1";
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function money(n, dec) {
  const d = dec === undefined ? 2 : dec;
  const v = isFinite(n) ? n : 0;
  return "₹" + v.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
}
const money0 = (n) => money(n, 0);
/* compact money for dense tables: no ".00" when the amount is a whole number */
const moneyS = (n) => (Math.abs((n || 0) - Math.round(n || 0)) < 0.005 ? money(n, 0) : money(n, 2));
const signed = (n) => (n < 0 ? "−" : "") + money(Math.abs(n));

/* Indian number-to-words (for salary statements) */
function inWords(amount) {
  let n = Math.round(Math.abs(amount) * 100) / 100;
  const paise = Math.round((n - Math.floor(n)) * 100);
  let whole = Math.floor(n);
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = (x) => (x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? " " + a[x % 10] : ""));
  const three = (x) => (x >= 100 ? a[Math.floor(x / 100)] + " Hundred" + (x % 100 ? " " + two(x % 100) : "") : two(x));
  let out = "";
  const crore = Math.floor(whole / 10000000); whole %= 10000000;
  const lakh  = Math.floor(whole / 100000);   whole %= 100000;
  const thou  = Math.floor(whole / 1000);     whole %= 1000;
  if (crore) out += three(crore) + " Crore ";
  if (lakh)  out += three(lakh) + " Lakh ";
  if (thou)  out += three(thou) + " Thousand ";
  if (whole) out += three(whole);
  out = out.trim() || "Zero";
  let s = "Rupees " + out;
  if (paise) s += " and " + two(paise) + " Paise";
  return s + " Only";
}

/* ------------------------- 2. MONTH / SUNDAY MATH ------------------------ */
/* Month meta: how many days, how many Sundays, working days = days - Sundays */
function monthMeta(year, month) {
  const dim = new Date(year, month + 1, 0).getDate();
  let sundays = 0;
  const list = [];
  for (let d = 1; d <= dim; d++) {
    if (new Date(year, month, d).getDay() === 0) { sundays++; list.push(d); }
  }
  return { dim, sundays, sundayDates: list, workingDays: dim - sundays };
}
const monthLabel = (y, m) => MONTHS[m] + " " + y;

/* ------------------------------- 3. STORE ------------------------------- */
const KEY = "hisaabPro.v1";

const DEFAULT_SETTINGS = {
  shopName: "Sharma Traders",
  ownerName: "Proprietor",
  address: "Shop No. 12, Main Market, Delhi",
  phone: "",
  hoursPerDay: 8,
  otMultiplier: 1.5,
  statementNote: "This is a computer-generated salary statement. Please verify all figures before payment.",
  paidLabel: "PAID"
};

function blankData() {
  return { settings: { ...DEFAULT_SETTINGS }, workers: [], records: [], canteen: blankCanteen() };
}

function sampleData() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const pm = m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 };
  const workers = [
    { id: uid(), name: "Ramesh Kumar",  role: "Tailor / Master", phone: "98765 43210", type: "monthly", rate: 21000, active: true, note: "Full-time, 6 days a week" },
    { id: uid(), name: "Sunita Devi",   role: "Helper",          phone: "98111 22334", type: "monthly", rate: 13500, active: true, note: "" },
    { id: uid(), name: "Imran Ali",     role: "Machine Operator",phone: "99999 11223", type: "hourly",  rate: 95,    active: true, note: "₹95 per hour" },
    { id: uid(), name: "Pooja Sharma",  role: "Accountant",      phone: "90000 55667", type: "monthly", rate: 18500, active: true, note: "Part-time evenings" }
  ];
  const recs = [];
  const mk = (w, yy, mm, present, absent, adv, status, bonus) => {
    const meta = monthMeta(yy, mm);
    recs.push({
      id: uid(), workerId: w.id, year: yy, month: mm,
      presentDays: present, absentDays: absent, includeSundays: false,
      totalHours: w.type === "hourly" ? present * 8 : 0, bonus: bonus || 0,
      advances: adv.map((a, i) => ({ id: uid(), date: yy + "-" + String(mm + 1).padStart(2, "0") + "-" + String(5 + i * 9).padStart(2, "0"), note: a.n, amount: a.amt })),
      deductions: [],
      note: "", status, paidOn: status === "paid" ? yy + "-" + String(mm + 1).padStart(2, "0") + "-" + String(meta.dim).padStart(2, "0") : "",
      updatedAt: Date.now()
    });
  };
  const meta = monthMeta(y, m);
  mk(workers[0], y, m, meta.workingDays - 1, 1, [{ n: "Festival advance", amt: 3000 }, { n: "Medical", amt: 1500 }], "pending");
  mk(workers[1], y, m, meta.workingDays - 2, 2, [{ n: "Cash advance", amt: 2000 }], "pending");
  mk(workers[2], y, m, meta.workingDays, 0, [], "paid");
  const pmeta = monthMeta(pm.y, pm.m);
  mk(workers[0], pm.y, pm.m, pmeta.workingDays, 0, [{ n: "Advance", amt: 2000 }], "paid");
  mk(workers[1], pm.y, pm.m, pmeta.workingDays - 3, 3, [], "paid");
  mk(workers[2], pm.y, pm.m, pmeta.workingDays - 1, 1, [], "paid");
  mk(workers[3], pm.y, pm.m, pmeta.workingDays, 0, [], "paid", 1000);
  return { settings: { ...DEFAULT_SETTINGS, demo: true }, workers, records: recs, canteen: sampleCanteen(y, m, pm) };
}

const Store = {
  data: blankData(),
  load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) { this.data = sampleData(); this.save(true); return; }
    try {
      const d = JSON.parse(raw);
      this.data = {
        settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) },
        workers: Array.isArray(d.workers) ? d.workers : [],
        records: Array.isArray(d.records) ? d.records : [],
        canteen: normCanteen(d.canteen)
      };
    } catch (e) { this.data = blankData(); }
    this.migrate();
  },
  /* one-time cleanup: old records had overtime fields / hourly day-hours */
  migrate() {
    let changed = false;
    (this.data.records || []).forEach((r) => {
      const w = this.data.workers.find((x) => x.id === r.workerId);
      if (w && w.type === "hourly" && typeof r.totalHours !== "number") {
        r.totalHours = r2(clamp(num(r.presentDays), 0, 999) * 8);
        changed = true;
      }
      if (r.otHours !== undefined) { delete r.otHours; changed = true; }
      if (r.otMultiplier !== undefined) { delete r.otMultiplier; changed = true; }
    });
    /* v3.1 — canteen module: purane backup me canteen key nahi hoti thi */
    if (!this.data.canteen || typeof this.data.canteen !== "object" || !Array.isArray(this.data.canteen.entries)) {
      this.data.canteen = normCanteen(this.data.canteen);
      changed = true;
    }
    if (changed) this.save(true);
  },
  save(silent) {
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {
      if (!silent) toast("Could not save — browser storage full or blocked", "bad");
    }
    if (!silent) flashSaved();
    try { Cloud.schedulePush(); } catch (e) {}
  },
  workers() { return this.data.workers; },
  activeWorkers() { return this.data.workers.filter((w) => w.active !== false); },
  worker(id) { return this.data.workers.find((w) => w.id === id); },
  record(workerId, year, month) {
    return this.data.records.find((r) => r.workerId === workerId && r.year === year && r.month === month) || null;
  },
  ensureRecord(workerId, year, month, create) {
    let rec = this.record(workerId, year, month);
    if (rec) return rec;
    const w = this.worker(workerId);
    const meta = monthMeta(year, month);
    rec = {
      id: uid(), workerId, year, month,
      presentDays: meta.workingDays, absentDays: 0, includeSundays: false,
      totalHours: 0, bonus: 0, advances: [], deductions: [],
      note: "", status: "pending", paidOn: "", updatedAt: Date.now()
    };
    if (create) { this.data.records.push(rec); this.save(); }
    return rec;
  },
  persistRecord(rec) { rec.updatedAt = Date.now(); this.save(); }
};

/* ---------------------------- 4. CALCULATIONS --------------------------- */
/* Core salary engine. Every figure the panel shows comes from here. */
function calc(w, rec, settings) {
  const s = settings || Store.data.settings;
  const meta = monthMeta(rec.year, rec.month);
  const includeSundays = !!rec.includeSundays;
  const sundays = includeSundays ? 0 : meta.sundays;
  const workingDays = meta.dim - sundays;

  const present = clamp(num(rec.presentDays), 0, 999);
  const absentRaw = clamp(num(rec.absentDays), 0, 999);
  const rate = num(w.rate);
  const isHourly = w.type === "hourly";

  /* HOURLY workers: working hours are NOT fixed -> pay = rate × total hours worked.
     No per-day hour assumption, no overtime.                                  */
  const totalHours = isHourly ? Math.max(0, num(rec.totalHours)) : 0;
  const perHour = isHourly ? rate : 0;
  /* MONTHLY workers: salary is ALWAYS divided by 30 (fixed 30-day month)      */
  const perDay = isHourly ? 0 : rate / 30;

  const earned = isHourly ? rate * totalHours : perDay * present;
  const absentValue = isHourly ? 0 : perDay * absentRaw;
  const bonus = num(rec.bonus);
  const needsHours = isHourly && totalHours === 0 && present > 0;

  const advances = (rec.advances || []).filter((a) => num(a.amount) !== 0 || (a.note || "").trim());
  const advTotal = advances.reduce((t, a) => t + num(a.amount), 0);
  const deductions = (rec.deductions || []).filter((d) => num(d.amount) !== 0 || (d.label || "").trim());
  const dedTotal = deductions.reduce((t, d) => t + num(d.amount), 0);

  const grossEarnings = earned + bonus;
  const totalDeductions = advTotal + dedTotal;
  const net = r2(grossEarnings - totalDeductions);

  return {
    meta, sundays, workingDays, includeSundays, present, absent: absentRaw,
    rate, isHourly, totalHours, perDay: r2(perDay), perHour: r2(perHour),
    earned: r2(earned), absentValue: r2(absentValue), bonus: r2(bonus), needsHours,
    advances, deductions, advTotal: r2(advTotal), dedTotal: r2(dedTotal),
    grossEarnings: r2(grossEarnings), totalDeductions: r2(totalDeductions), net,
    overAttendance: present + absentRaw > workingDays,
    negative: net < 0
  };
}

function rowsForMonth(year, month) {
  return Store.activeWorkers().map((w) => {
    const rec = Store.ensureRecord(w.id, year, month, false);
    return { w, rec, c: calc(w, rec, Store.data.settings) };
  });
}

/* ------------------------------ 5. UI STATE ----------------------------- */
const today = new Date();
const UI = {
  view: "dashboard",
  year: today.getFullYear(),
  month: today.getMonth(),
  search: "",
  filter: "all",
  openRec: null,
  /* canteen module state (tab / date / filters) — see ctUI() */
  ct: { tab: "day", date: isoDate(today), kind: "all", q: "", from: "", to: "", scope: "month", logScope: "month", edit: null }
};
let saveTimer = null;

function toast(msg, kind, undoable) {
  const t = $("#toast");
  if (!t) return;
  t.innerHTML = esc(msg) + (undoable ? ' &nbsp;·&nbsp; <span data-act="doUndo" style="text-decoration:underline;cursor:pointer">Undo</span>' : "");
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast"; }, undoable ? 5200 : 2600);
}
function flashSaved() {
  clearTimeout(saveTimer);
  const el = $("#sideStats");
  if (el) el.innerHTML = '<span style="color:#34d399">✔ Saved just now</span>';
  saveTimer = setTimeout(updateSideStats, 2200);
}
function updateSideStats() {
  const el = $("#sideStats");
  const act = Store.activeWorkers().length;
  const ctCount = ((Store.data.canteen && Store.data.canteen.entries) || []).length;
  if (el) el.textContent = act + " active worker" + (act === 1 ? "" : "s") + " · " + Store.data.records.length + " records" +
    (ctCount ? " · " + ctCount + " canteen" : "");
  const badge = $("#navPend");
  if (badge) {
    const pend = rowsForMonth(UI.year, UI.month).filter(({ rec }) => !rec || rec.status !== "paid").length;
    badge.textContent = pend;
    badge.style.display = pend ? "inline-block" : "none";
  }
  /* canteen nav badge: is mahine kitni entry ka paisa baki (udhaar) hai */
  const ctBadge = $("#navCtBal");
  if (ctBadge) {
    let bal = 0;
    try { bal = ctInMonth(UI.year, UI.month).filter((e) => ctBalance(e) > 0.005).length; } catch (err) { bal = 0; }
    ctBadge.textContent = bal;
    ctBadge.style.display = bal ? "inline-block" : "none";
  }
}

/* ------------------------------ 6. ROUTER ------------------------------- */
const VIEW_META = {
  dashboard: ["Dashboard", "Monthly overview of wages, advances & payments"],
  hisaab:    ["Monthly Hisaab", "Attendance, advances and final payable for every worker"],
  workers:   ["Workers", "Add, edit, search and manage your workforce"],
  ledger:    ["Ledger", "Is mahine ke saare advances aur deductions ek jagah"],
  canteen:   ["Canteen", "Saman entry (rate-wise ya ek-saath total) · din aur mahine ka ledger · poori activity"],
  records:   ["Records & History", "Month-wise salary records with payment status"],
  settings:  ["Settings", "Shop details, salary rules and your data"]
};

function go(view) {
  UI.view = view;
  $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  const m = VIEW_META[view] || ["", ""];
  $("#viewTitle").textContent = m[0];
  $("#viewSub").textContent = m[1];
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const root = $("#viewRoot");
  if (UI.view === "dashboard") root.innerHTML = viewDashboard();
  else if (UI.view === "hisaab") root.innerHTML = viewHisaab();
  else if (UI.view === "workers") root.innerHTML = viewWorkers();
  else if (UI.view === "ledger") root.innerHTML = viewLedger();
  else if (UI.view === "canteen") root.innerHTML = viewCanteen();
  else if (UI.view === "records") root.innerHTML = viewRecords();
  else if (UI.view === "settings") root.innerHTML = viewSettings();
  updateSideStats();
  syncMonthPickers();
  document.querySelectorAll("[data-ver]").forEach((el) => { el.textContent = APP_VERSION; });
  /* topbar ka primary button canteen view par entry add karta hai */
  const topAdd = document.querySelector(".topbar-actions .btn.primary");
  if (topAdd) {
    if (UI.view === "canteen") { topAdd.dataset.act = "ctAdd"; topAdd.textContent = "＋ Canteen entry"; }
    else { topAdd.dataset.act = "addWorker"; topAdd.textContent = "+ Add Worker"; }
  }
  /* on phones the top bar scrolls sideways — keep the active tab visible */
  const bar = document.querySelector(".sidebar"), act = document.querySelector(".nav button.active");
  if (bar && act && bar.scrollWidth > bar.clientWidth + 4) bar.scrollLeft = Math.max(0, act.offsetLeft - 70);
}

function syncMonthPickers() {
  const ms = $("#selMonth"), ys = $("#selYear");
  if (!ms || !ys) return;
  if (ms.options.length !== 12) {
    ms.innerHTML = MONTHS.map((m, i) => '<option value="' + i + '">' + m + "</option>").join("");
  }
  ms.value = String(UI.month);
  const years = new Set([today.getFullYear() - 3, today.getFullYear() - 2, today.getFullYear() - 1, today.getFullYear(), today.getFullYear() + 1, today.getFullYear() + 2, UI.year]);
  Store.data.records.forEach((r) => years.add(r.year));
  ((Store.data.canteen && Store.data.canteen.entries) || []).forEach((e) => years.add(ctParts(e.date).y));
  const list = Array.from(years).sort((a, b) => a - b);
  ys.innerHTML = list.map((y) => '<option value="' + y + '">' + y + "</option>").join("");
  ys.value = String(UI.year);
}

/* ----------------------------- 7. DASHBOARD ----------------------------- */
function viewDashboard(){
  const rows = rowsForMonth(UI.year, UI.month);
  const prevM = UI.month === 0 ? 11 : UI.month - 1;
  const prevY = UI.month === 0 ? UI.year - 1 : UI.year;
  const prevRows = rowsForMonth(prevY, prevM);

  let gross=0, adv=0, ded=0, net=0, paidNet=0;
  rows.forEach(({c})=>{ gross+=c.grossEarnings; adv+=c.advTotal; ded+=c.dedTotal; net+=c.net; });
  let prevNet=0; prevRows.forEach(({c})=>prevNet+=c.net);
  const paidRows = rows.filter(r=>r.rec && r.rec.status==="paid");
  const paidSum = paidRows.reduce((t,r)=>t+r.c.net,0);
  const pendSum = net - paidSum;
  const active = Store.data.workers.filter(w=>w.active!==false).length;
  const meta = monthMeta(UI.year, UI.month);

  /* last 6 months net for spark + chart */
  const trend = [];
  for (let i=5;i>=0;i--){
    let m = UI.month - i, y = UI.year;
    while (m < 0){ m += 12; y--; }
    const rr = rowsForMonth(y, m);
    trend.push({ y, m, label: MONTHS_S[m], val: rr.reduce((t,r)=>t+r.c.net,0), now: i===0 });
  }
  const maxTrend = Math.max.apply(null, trend.map(t=>t.val)) || 1;
  const sparkVals = trend.map(t=>t.val);

  const demoBanner = Store.data.demo
    ? '<div class="banner info"><span>👋</span><div><b>Demo data loaded</b> — kuch workers already bhare hue hain taki aap sab features dekh sako. '+
      'Jab ready ho, "Start fresh" dabao aur apne workers add karo.</div>'+
      '<div style="margin-left:auto;display:flex;gap:7px"><button class="btn sm" data-act="loadSample">Keep exploring</button>'+
      '<button class="btn sm primary" data-act="clearDemo">Start fresh</button></div></div>'
    : "";

  const absentTotal = rows.reduce((t,r)=>t+r.c.absent,0);
  const presentTotal = rows.reduce((t,r)=>t+r.c.present,0);

  return (
    demoBanner +
    '<div class="kpis">' +
      kpiCard({ label:"Net payable — "+MONTHS_S[UI.month], value:money0(net), icon:"₹", tone:"",
        delta:moneyDelta(net, prevNet), spark:sparkVals, sub:active+" active workers · advances kate hue" }) +
      kpiCard({ label:"Gross earnings", value:money0(gross), icon:"↑", tone:"k-ok",
        delta:moneyDelta(gross, prevRows.reduce((t,r)=>t+r.c.grossEarnings,0)), sub:"Wages + bonus (no overtime)" }) +
      kpiCard({ label:"Advances + deductions", value:money0(adv+ded), icon:"↓", tone:"k-warn",
        sub:"Advances "+money0(adv)+" · Other "+money0(ded) }) +
      kpiCard({ label:"Pending to pay", value:money0(pendSum), icon:"⏳", tone: pendSum>0?"k-bad":"k-ok",
        sub:(rows.length-paidRows.length)+" of "+rows.length+" unpaid"+(paidSum?" · Paid "+money0(paidSum):"") }) +
    '</div>' +

    '<div class="grid g2 dash-charts" style="margin-bottom:14px">' +
      '<div class="card chartcard"><div class="card-h"><div><h3>Payout trend</h3>'+
        '<div class="sub">Last 6 months ka net salary</div></div>'+
        '<span class="tag grey">'+monthLabel(UI.year, UI.month)+'</span></div>'+
        '<div class="card-b"><div class="chart">'+
          trend.map(t=>'<div class="col'+(t.now?" now":"")+'" title="'+money0(t.val)+'">'+
            '<div class="val">'+money0(t.val)+'</div>'+
            '<div class="bar" style="height:'+Math.max(6,(t.val/maxTrend)*100)+'%"></div>'+
            '<div class="cap">'+t.label+'</div></div>').join("")+
        '</div></div></div>' +

      '<div class="card"><div class="card-h"><div><h3>Payout breakdown</h3>'+
        '<div class="sub">Kahan se kahan gaya</div></div></div>'+
        '<div class="card-b"><div class="donut-wrap">'+
          donutSVG([
            { label:"Wages", value:Math.max(0, gross), color:"#6366f1" },
            { label:"Advances", value:Math.max(0, adv), color:"#f59e0b" },
            { label:"Other", value:Math.max(0, ded), color:"#ef4444" }
          ], 132, { l:"NET", v: money0(net) }) +
          '<div class="donut-legend">'+
            '<div><span class="sw" style="background:#6366f1"></span>Wages<b>'+money0(gross)+'</b></div>'+
            '<div><span class="sw" style="background:#f59e0b"></span>Advances<b>'+money0(adv)+'</b></div>'+
            '<div><span class="sw" style="background:#ef4444"></span>Other<b>'+money0(ded)+'</b></div>'+
            '<div><span class="sw" style="background:#10b981"></span>Net<b>'+money0(net)+'</b></div>'+
          '</div></div></div></div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:14px"><div class="card-h"><div><h3>This month at a glance</h3>'+
      '<div class="sub">'+monthLabel(UI.year, UI.month)+'</div></div>'+
      '<button class="btn sm" data-act="gotoHisaab">Open Monthly Hisaab →</button></div>'+
      '<div class="strip">'+
        '<div><small>Days in month</small><b>'+meta.dim+'</b><div class="sub">calendar days</div></div>'+
        '<div><small>Sundays</small><b>'+meta.sundays+'</b><div class="sub">auto-excluded</div></div>'+
        '<div><small>Working days</small><b>'+meta.workingDays+'</b><div class="sub">payable</div></div>'+
        '<div><small>Present days</small><b>'+presentTotal+'</b><div class="sub">of '+(meta.workingDays*rows.length)+'</div></div>'+
        '<div><small>Absent days</small><b>'+absentTotal+'</b><div class="sub">unpaid</div></div>'+
        '<div><small>Salary base</small><b style="font-size:13px">Monthly ÷ 30</b><div class="sub">fixed rule</div></div>'+
      '</div></div>' +

    '<div class="card"><div class="card-h"><div><h3>Worker-wise summary</h3>'+
      '<div class="sub">Row par tap karo — poora hisaab khulega</div></div>'+
      '<div class="toolbar">'+
        '<button class="btn sm" data-act="exportCsv">⤓ CSV</button>'+
        '<button class="btn sm primary" data-act="gotoHisaab">Monthly Hisaab</button>'+
      '</div></div>'+
      (rows.length ? dashboardTable(rows) : emptyState("No workers yet","Add your first worker to start the monthly hisaab.","addWorker","+ Add Worker")) +
    '</div>'
  );
}

function kpi(label, val, hint, kind) {
  return '<div class="kpi ' + (kind || "") + '"><div class="lbl">' + esc(label) + '</div><div class="val">' + val + '</div><div class="hint">' + esc(hint) + "</div></div>";
}
function glance(l, v, sub) {
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9">' +
    '<div><div style="font-size:12.5px;font-weight:600;color:#334155">' + esc(l) + '</div>' +
    (sub ? '<div style="font-size:10.8px;color:#94a3b8">' + esc(sub) + "</div>" : "") + "</div>" +
    '<div style="font-weight:750;font-size:13px;font-variant-numeric:tabular-nums">' + esc(v) + "</div></div>";
}

function statusTag(rec) {
  return rec && rec.status === "paid"
    ? '<span class="tag ok" style="white-space:nowrap">✔ Paid<span class="st-date">' + (rec.paidOn ? " " + esc(rec.paidOn.slice(5).split("-").reverse().join("/")) : "") + "</span></span>"
    : '<span class="tag warn" style="white-space:nowrap">● Pending</span>';
}

function dashboardTable(rows){
  let t = { net:0, adv:0, gross:0 };
  const body = rows.map(({w, rec, c}) => {
    t.net += c.net; t.adv += c.advTotal; t.gross += c.grossEarnings;
    const pct = c.workingDays ? Math.min(100, Math.round((c.present/c.workingDays)*100)) : 0;
    return '<tr class="clickable" data-act="openRec" data-wid="'+w.id+'">'+
      '<td><div class="who">'+av(w.name)+'<div style="min-width:0"><div class="nm">'+esc(w.name)+'</div>'+
        '<div class="rl">'+esc(w.role||(w.type==="monthly"?"Monthly salary":"Hourly wage"))+'</div></div></div></td>'+
      '<td><span class="tag '+(w.type==="monthly"?"m":"h")+'">'+(w.type==="monthly"?"Monthly":"Hourly")+'</span></td>'+
      '<td class="num">'+c.present+'</td>'+
      '<td class="num muted">'+c.absent+'</td>'+
      '<td class="num muted">'+c.sundays+'</td>'+
      '<td class="num">'+(c.isHourly? '<span class="muted">'+money0(w.rate)+'/hr</span>' : money(c.perDay))+'</td>'+
      '<td class="num">'+money(c.grossEarnings)+'</td>'+
      '<td class="num" style="color:var(--bad)">'+(c.advTotal? "−"+money(c.advTotal):"—")+'</td>'+
      '<td class="num strong">'+money(c.net)+'</td>'+
      '<td><div class="bar-cell"><span class="mini-bar"><i style="width:'+pct+'%"></i></span>'+
        '<span style="font-size:10px;color:var(--muted)">'+pct+'%</span></div></td>'+
      '<td>'+statusTag(rec)+'</td></tr>';
  }).join("");
  return '<div class="twrap"><table class="tbl dashTbl"><thead><tr>'+
    '<th>Worker</th><th>Type</th><th class="num">Present</th><th class="num">Absent</th><th class="num">Sun</th>'+
    '<th class="num">Rate</th><th class="num">Gross</th><th class="num">Advances</th><th class="num">Net payable</th>'+
    '<th class="num">Attd</th><th>Status</th></tr></thead><tbody>'+body+'</tbody>'+
    '<tfoot><tr><td>Total ('+rows.length+' workers)</td><td></td><td></td><td></td><td></td><td></td>'+
    '<td class="num">'+money(t.gross)+'</td><td class="num" style="color:var(--bad)">−'+money(t.adv)+'</td>'+
    '<td class="num">'+money(t.net)+'</td><td></td><td></td></tr></tfoot></table></div>';
}

function emptyState(title, msg, act, btn) {
  return '<div class="empty"><div class="big">₹</div><h4>' + esc(title) + "</h4><p>" + esc(msg) + "</p>" +

/* --------------------------- 8. MONTHLY HISAAB -------------------------- */
function viewHisaab(){
  const all = rowsForMonth(UI.year, UI.month);
  const q = UI.search.trim().toLowerCase();
  const rows = all.filter(({w,rec,c}) => {
    if (q && !(w.name+" "+(w.role||"")).toLowerCase().includes(q)) return false;
    if (UI.filter === "pending" && rec && rec.status === "paid") return false;
    if (UI.filter === "paid" && (!rec || rec.status !== "paid")) return false;
    if (UI.filter === "advance" && !c.advTotal) return false;
    return true;
  });
  const meta = monthMeta(UI.year, UI.month);
  let gross=0, adv=0, ded=0, net=0;
  rows.forEach(({c}) => { gross+=c.grossEarnings; adv+=c.advTotal; ded+=c.dedTotal; net+=c.net; });
  const noHours = rows.filter(({c}) => c.needsHours).map(({w}) => w.name);
  const pendCount = all.filter(({rec}) => !rec || rec.status !== "paid").length;

  return (
    (noHours.length ? '<div class="banner warn"><span>⏱️</span><div><b>Total hours missing:</b> '+esc(noHours.join(", "))+
      ' — hourly worker ki pay <b>hours × rate</b> se banti hai. Table ke <b>Hours</b> column me hours daalo.</div></div>' : "") +

    '<div class="card" style="margin-bottom:14px"><div class="card-h" style="padding:13px 16px">'+
      '<div class="toolbar">'+
        '<div class="seg">'+
          [["all","Sab"],["pending","Pending"],["paid","Paid"],["advance","Advance"]].map(([v,l])=>
            '<button class="'+(UI.filter===v?"on":"")+'" data-act="setFilter" data-filter="'+v+'">'+l+'</button>').join("")+
        '</div>'+
        '<div class="gsearch" style="min-width:190px"><span>🔍</span>'+
          '<input id="hisaabSearch" data-role="hisaabSearch" placeholder="Worker dhoondo…" value="'+esc(UI.search)+'">'+
        '</div>'+
      '</div>'+
      '<div class="toolbar">'+
        '<button class="btn sm" data-act="autoFillAll" title="Har worker ke present days = working days">⚡ Auto-fill</button>'+
        '<button class="btn sm" data-act="copyPrev" title="Pichhle mahine ki attendance copy karo">▤ Copy prev</button>'+
        '<button class="btn sm '+(pendCount?"ok":"")+'" data-act="markAllPaid">✔ Mark all paid</button>'+
        '<button class="btn sm" data-act="printAll">🖨 Print</button>'+
        '<button class="btn sm" data-act="pdfAll">⬇ PDFs</button>'+
        '<button class="btn sm" data-act="exportCsv">⤓ CSV</button>'+
      '</div></div>'+
      (rows.length ? hisaabTable(rows) : emptyState("Koi worker match nahi hua","Search badlo ya naya worker add karo.","addWorker","+ Add Worker")) +
      (rows.length ? '<div class="card-b" style="border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end;font-size:12.8px;background:var(--surface-2)">'+
        '<div>Gross: <b id="sumGross">'+moneyS(gross)+'</b></div>'+
        '<div>Advances: <b id="sumAdv" style="color:var(--bad)">'+(adv? "−"+moneyS(adv): moneyS(0))+'</b></div>'+
        '<div>Other: <b id="sumDed" style="color:var(--bad)">'+(ded? "−"+moneyS(ded): moneyS(0))+'</b></div>'+
        '<div style="font-size:14px">Net payable: <b id="sumNet" style="color:var(--primary)">'+moneyS(net)+'</b></div></div>' : "") +
    '</div>'+

    '<div class="banner info" style="margin-bottom:0"><span>ℹ️</span><div><b>'+monthLabel(UI.year, UI.month)+':</b> '+
      meta.dim+' days · <b>'+meta.sundays+' Sundays</b> auto-excluded → <b>'+meta.workingDays+' payable days</b>. '+
      'Monthly salary ÷ <b>30</b> (fixed). Hourly workers: <b>hours × rate</b>.</div></div>'

      '<td class="num" data-cell="gross">'+moneyS(c.grossEarnings)+'</td>'+

      '</div></td></tr>';
  }).join("");

  return '<div class="twrap"><table class="tbl has-actions"><thead><tr>'+
    '<th>Worker</th><th class="num">Present</th><th class="num">Absent</th><th class="num">Sun</th><th class="num">Days</th>'+
    '<th class="num" title="Hourly workers ke liye">Hours</th><th class="num">Rate/day</th><th class="num">Gross</th>'+
    '<th class="num">Adv</th><th class="num">Other</th><th class="num">Net</th><th>Status</th><th></th>'+

    '<tfoot><tr><td colspan="7">Totals ('+rows.length+' workers)</td>'+

    '<td class="num" id="totAdv">'+(t.adv? "−"+moneyS(t.adv):"—")+'</td>'+

/* ======================= 16. UI KIT (v3) ======================= */
const HUES = ["#6366f1","#8b5cf6","#0891b2","#0ea5e9","#10b981","#f59e0b","#ef4444","#ec4899","#14b8a6","#6366f1"];
function hashStr(s){ let h=0; const t=String(s||""); for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0; return h; }
function initials(name){ const p=String(name||"?").trim().split(/\s+/); return (((p[0]||"?")[0]||"?") + (p[1]?p[1][0]:"")).toUpperCase(); }
function av(name, cls){ const c=HUES[hashStr(name)%HUES.length];
  return '<span class="av '+(cls||"")+'" style="background:linear-gradient(140deg,'+c+','+c+'b3)">'+esc(initials(name))+'</span>'; }
function moneyDelta(cur, prev){
  if (!prev) return { dir:"flat", txt:"—" };
  const pct = ((cur - prev) / Math.abs(prev)) * 100;
  return { dir: pct > 0.5 ? "up" : pct < -0.5 ? "down" : "flat", txt: (pct>0?"+":"") + pct.toFixed(0) + "%" };
}
function deltaChip(d){
  if (!d || d.dir === "flat") return '<span class="delta flat">—</span>';
  return '<span class="delta '+d.dir+'">'+(d.dir==="up"?"▲":"▼")+" "+d.txt+'</span>';
}
function sparkline(values, w, h, color){
  const v = (values||[]).map(n=>num(n));
  if (!v.length) return "";
  w = w || 74; h = h || 26;
  const mn = Math.min.apply(null, v), mx = Math.max.apply(null, v);
  const rng = (mx - mn) || 1;
  const pts = v.map((x,i)=>{
    const px = v.length === 1 ? w/2 : (i/(v.length-1))*w;
    const py = h - ((x - mn)/rng)*(h-4) - 2;
    return px.toFixed(1)+","+py.toFixed(1);
  });
  const c = color || "var(--primary)";
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>'+
    '<polyline points="0,'+h+' '+pts.join(" ")+' '+w+','+h+'" fill="'+c+'" opacity=".09" stroke="none"/></svg>';
}
function donutSVG(parts, size, center){
  center = center || { l:"TOTAL", v:"" };
  size = size || 132;
  const total = parts.reduce((t,p)=>t+Math.max(0,num(p.value)),0) || 1;
  const r = size/2 - 12, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  let off = 0;
  const rings = parts.map(p=>{
    const frac = Math.max(0,num(p.value))/total;
    const seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+p.color+'" stroke-width="13" '+
      'stroke-dasharray="'+(frac*circ).toFixed(2)+' '+(circ-frac*circ).toFixed(2)+'" '+
      'stroke-dashoffset="'+(-off*circ).toFixed(2)+'" stroke-linecap="butt" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off += frac; return seg;
  }).join("");
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="13"/>'+ rings +
    '<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--muted)" letter-spacing="1">'+esc(center.l)+'</text>'+
    '<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">'+esc(center.v)+'</text>'+
    '</svg>';
}
function kpiCard(o){
  return '<div class="kpi2 '+(o.tone||"")+'">'+
    '<div class="k-top"><span class="k-lbl">'+esc(o.label)+'</span>'+
      '<span class="k-ico">'+(o.icon||"₹")+'</span></div>'+
    '<div class="k-val">'+o.value+'</div>'+
    '<div class="k-sub">'+(o.delta?deltaChip(o.delta):"")+(o.spark?sparkline(o.spark,70,22,o.sparkColor):"")+
      '<span>'+o.sub+'</span></div></div>';
}

function viewDashboard(){
  const rows = rowsForMonth(UI.year, UI.month);
  const prevM = UI.month === 0 ? 11 : UI.month - 1;
  const prevY = UI.month === 0 ? UI.year - 1 : UI.year;
  const prevRows = rowsForMonth(prevY, prevM);

  let gross=0, adv=0, ded=0, net=0, paidNet=0;
  rows.forEach(({c})=>{ gross+=c.grossEarnings; adv+=c.advTotal; ded+=c.dedTotal; net+=c.net; });
  let prevNet=0; prevRows.forEach(({c})=>prevNet+=c.net);
  const paidRows = rows.filter(r=>r.rec && r.rec.status==="paid");
  const paidSum = paidRows.reduce((t,r)=>t+r.c.net,0);
  const pendSum = net - paidSum;
  const active = Store.data.workers.filter(w=>w.active!==false).length;
  const meta = monthMeta(UI.year, UI.month);

  /* last 6 months net for spark + chart */

  for (let i=5;i>=0;i--){
    let m = UI.month - i, y = UI.year;
    while (m < 0){ m += 12; y--; }

    trend.push({ y, m, label: MONTHS_S[m], val: rr.reduce((t,r)=>t+r.c.net,0), now: i===0 });
  }
  const maxTrend = Math.max.apply(null, trend.map(t=>t.val)) || 1;

  const demoBanner = Store.data.demo
    ? '<div class="banner info"><span>👋</span><div><b>Demo data loaded</b> — kuch workers already bhare hue hain taki aap sab features dekh sako. '+

      kpiCard({ label:"Gross earnings", value:money0(gross), icon:"↑", tone:"k-ok",
        delta:moneyDelta(gross, prevRows.reduce((t,r)=>t+r.c.grossEarnings,0)), sub:"Wages + bonus (no overtime)" }) +
      kpiCard({ label:"Advances + deductions", value:money0(adv+ded), icon:"↓", tone:"k-warn",
        sub:"Advances "+money0(adv)+" · Other "+money0(ded) }) +
      kpiCard({ label:"Pending to pay", value:money0(pendSum), icon:"⏳", tone: pendSum>0?"k-bad":"k-ok",
        sub:(rows.length-paidRows.length)+" of "+rows.length+" unpaid"+(paidSum?" · Paid "+money0(paidSum):"") }) +
    '</div>' +

    '<div class="grid g2 dash-charts" style="margin-bottom:14px">' +
      '<div class="card chartcard"><div class="card-h"><div><h3>Payout trend</h3>'+
        '<div class="sub">Last 6 months ka net salary</div></div>'+
        '<span class="tag grey">'+monthLabel(UI.year, UI.month)+'</span></div>'+
        '<div class="card-b"><div class="chart">'+
          trend.map(t=>'<div class="col'+(t.now?" now":"")+'" title="'+money0(t.val)+'">'+
            '<div class="val">'+money0(t.val)+'</div>'+

/* ========================= 8. MONTHLY HISAAB ========================= */
function viewHisaab(){
  const all = rowsForMonth(UI.year, UI.month);
  const q = UI.search.trim().toLowerCase();
  const rows = all.filter(({w,rec,c}) => {
    if (q && !(w.name+" "+(w.role||"")).toLowerCase().includes(q)) return false;
    if (UI.filter === "pending" && rec && rec.status === "paid") return false;
    if (UI.filter === "paid" && (!rec || rec.status !== "paid")) return false;
    if (UI.filter === "advance" && !c.advTotal) return false;
    return true;
  });
  const meta = monthMeta(UI.year, UI.month);
  let gross=0, adv=0, ded=0, net=0;
  rows.forEach(({c}) => { gross+=c.grossEarnings; adv+=c.advTotal; ded+=c.dedTotal; net+=c.net; });
  const noHours = rows.filter(({c}) => c.needsHours).map(({w}) => w.name);
  const pendCount = all.filter(({rec}) => !rec || rec.status !== "paid").length;

  return (
    (noHours.length ? '<div class="banner warn"><span>⏱️</span><div><b>Total hours missing:</b> '+esc(noHours.join(", "))+
      ' — hourly worker ki pay <b>hours × rate</b> se banti hai. Table ke <b>Hours</b> column me hours daalo.</div></div>' : "") +

    '<div class="card" style="margin-bottom:14px"><div class="card-h" style="padding:13px 16px">'+
      '<div class="toolbar">'+
        '<div class="seg">'+
          [["all","Sab"],["pending","Pending"],["paid","Paid"],["advance","Advance"]].map(([v,l])=>
            '<button class="'+(UI.filter===v?"on":"")+'" data-act="setFilter" data-filter="'+v+'">'+l+'</button>').join("")+
        '</div>'+
        '<div class="gsearch" style="min-width:190px"><span>🔍</span>'+
          '<input id="hisaabSearch" data-role="hisaabSearch" placeholder="Worker dhoondo…" value="'+esc(UI.search)+'">'+
        '</div>'+
      '</div>'+
      '<div class="toolbar">'+
        '<button class="btn sm" data-act="autoFillAll" title="Har worker ke present days = working days">⚡ Auto-fill</button>'+
        '<button class="btn sm" data-act="copyPrev" title="Pichhle mahine ki attendance copy karo">▤ Copy prev</button>'+
        '<button class="btn sm '+(pendCount?"ok":"")+'" data-act="markAllPaid">✔ Mark all paid</button>'+
        '<button class="btn sm" data-act="printAll">🖨 Print</button>'+
        '<button class="btn sm" data-act="pdfAll">⬇ PDFs</button>'+
        '<button class="btn sm" data-act="exportCsv">⤓ CSV</button>'+
      '</div></div>'+
      (rows.length ? hisaabTable(rows) : emptyState("Koi worker match nahi hua","Search badlo ya naya worker add karo.","addWorker","+ Add Worker")) +
      (rows.length ? '<div class="card-b" style="border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end;font-size:12.8px;background:var(--surface-2)">'+
        '<div>Gross: <b id="sumGross">'+moneyS(gross)+'</b></div>'+
        '<div>Advances: <b id="sumAdv" style="color:var(--bad)">'+(adv? "−"+moneyS(adv): moneyS(0))+'</b></div>'+
        '<div>Other: <b id="sumDed" style="color:var(--bad)">'+(ded? "−"+moneyS(ded): moneyS(0))+'</b></div>'+
        '<div style="font-size:14px">Net payable: <b id="sumNet" style="color:var(--primary)">'+moneyS(net)+'</b></div></div>' : "") +
    '</div>'+

    '<div class="banner info" style="margin-bottom:0"><span>ℹ️</span><div><b>'+monthLabel(UI.year, UI.month)+':</b> '+
      meta.dim+' days · <b>'+meta.sundays+' Sundays</b> auto-excluded → <b>'+meta.workingDays+' payable days</b>. '+
      'Monthly salary ÷ <b>30</b> (fixed). Hourly workers: <b>hours × rate</b>.</div></div>'

    return '<tr class="clickable" data-act="openRec" data-wid="'+w.id+'">'+
      '<td><div class="who">'+av(w.name,'sm')+'<div style="min-width:0"><div class="nm">'+esc(w.name)+'</div>'+
        '<div class="rl"><span class="tag '+(w.type==="monthly"?"m":"h")+'">'+money0(w.rate)+(w.type==="monthly"?"/mo":"/hr")+'</span>'+
        ' '+esc(w.role||"")+'</div></div></div></td>'+
      '<td class="num"><input class="cell-inp'+(c.overAttendance?" bad":"")+'" type="number" min="0" step="1" data-wid="'+w.id+'" data-f="presentDays" value="'+c.present+'"></td>'+

      '<td class="num" data-cell="gross">'+moneyS(c.grossEarnings)+'</td>'+

      '<td class="num" data-cell="ded" style="color:var(--bad)">'+(c.dedTotal? "−"+moneyS(c.dedTotal):"—")+'</td>'+

        '<button class="btn xs" data-act="openRec" data-wid="'+w.id+'" title="Hisaab kholo">✎</button>'+
        '<button class="btn xs" data-act="togglePaid" data-wid="'+w.id+'" title="'+(rec && rec.status==="paid"?"Pending karo":"Paid mark karo")+'">'+(rec && rec.status==="paid"?"↺":"✔")+'</button>'+
        '<button class="btn xs" data-act="printRec" data-wid="'+w.id+'" title="Statement print">🖨</button>'+
        '<button class="btn xs" data-act="pdfRec" data-wid="'+w.id+'" title="PDF download">⬇</button>'+
      '</div></td></tr>';
  }).join("");

  return '<div class="twrap"><table class="tbl has-actions"><thead><tr>'+
    '<th>Worker</th><th class="num">Present</th><th class="num">Absent</th><th class="num">Sun</th><th class="num">Days</th>'+
    '<th class="num" title="Hourly workers ke liye">Hours</th><th class="num">Rate/day</th><th class="num">Gross</th>'+
    '<th class="num">Adv</th><th class="num">Other</th><th class="num">Net</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>'+body+'</tbody>'+
    '<tfoot><tr><td colspan="7">Totals ('+rows.length+' workers)</td>'+
    '<td class="num" id="totGross">'+moneyS(t.gross)+'</td>'+
    '<td class="num" id="totAdv">'+(t.adv? "−"+moneyS(t.adv):"—")+'</td>'+
    '<td class="num" id="totDed">'+(t.ded? "−"+moneyS(t.ded):"—")+'</td>'+

    '<td colspan="2"></td></tr></tfoot></table></div>';
}

/* ============================= 10b. LEDGER (new) ============================ */
function viewLedger(){
  const rows = rowsForMonth(UI.year, UI.month);
  const advs = [], deds = [];
  rows.forEach(({w,rec,c}) => {
    (c.advances||[]).forEach(a => advs.push({ w, a, rec, kind:"adv" }));
    (c.deductions||[]).forEach(d => deds.push({ w, d, rec, kind:"ded" }));
  });
  const sumA = advs.reduce((t,x)=>t+num(x.a.amount),0);
  const sumD = deds.reduce((t,x)=>t+num(x.d.amount),0);
  const dateSort = (x)=>String(x.a ? x.a.date : "");
  advs.sort((x,y)=> dateSort(y).localeCompare(dateSort(x)));
  const line = (x, side) => {
    const item = side === "adv" ? x.a : x.d;
    const d = side === "adv" ? (x.a.date || "—") : "—";
    const note = side === "adv" ? (x.a.note || "Advance") : (x.d.label || "Deduction");
    return '<tr class="clickable" data-act="openRec" data-wid="'+x.w.id+'">'+
      '<td style="white-space:nowrap">'+esc(d)+'</td>'+
      '<td><div class="who">'+av(x.w.name,"sm")+'<div class="nm">'+esc(x.w.name)+'</div></div></td>'+
      '<td>'+esc(note)+'</td>'+
      '<td class="num strong" style="color:var(--bad)">−'+moneyS(item.amount)+'</td></tr>';
  };
  return (
    '<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+
      kpiCard({label:"Advances", value:money0(sumA), icon:"↑", tone:"k-warn", sub:advs.length+" entries this month"})+
      kpiCard({label:"Other deductions", value:money0(sumD), icon:"↓", tone:"k-bad", sub:deds.length+" entries"})+
      kpiCard({label:"Total cut", value:money0(sumA+sumD), icon:"∑", sub:"wages se ghatega"})+
      kpiCard({label:"Workers affected", value:new Set(advs.map(x=>x.w.id).concat(deds.map(x=>x.w.id))).size, icon:"👥", tone:"k-cyan", sub:"jinke paas entry hai"})+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><div class="card-h"><div><h3>Advances</h3><div class="sub">'+monthLabel(UI.year, UI.month)+'</div></div>'+
        '<span class="tag warn">'+money0(sumA)+'</span></div>'+
        '<div class="twrap"><table class="tbl" style="min-width:420px"><thead><tr><th>Date</th><th>Worker</th><th>Note</th><th class="num">Amount</th></tr></thead>'+
        '<tbody>'+(advs.length ? advs.map(x=>line(x,"adv")).join("") : '<tr><td colspan="4"><div class="empty" style="padding:28px"><p>Is mahine koi advance nahi.</p></div></td></tr>')+
        '</tbody></table></div></div>'+
      '<div class="card"><div class="card-h"><div><h3>Other deductions</h3><div class="sub">'+monthLabel(UI.year, UI.month)+'</div></div>'+
        '<span class="tag bad">'+money0(sumD)+'</span></div>'+
        '<div class="twrap"><table class="tbl" style="min-width:420px"><thead><tr><th>Date</th><th>Worker</th><th>Reason</th><th class="num">Amount</th></tr></thead>'+
        '<tbody>'+(deds.length ? deds.map(x=>line(x,"ded")).join("") : '<tr><td colspan="4"><div class="empty" style="padding:28px"><p>Koi extra deduction nahi.</p></div></td></tr>')+
        '</tbody></table></div></div>'+
    '</div>'
  );
}

/* ======================== 10c. PROFILE DRAWER (new) ======================== */
function openProfile(wid){
  const w = Store.worker(wid); if (!w) return;
  const hist = [];
  for (let i=5;i>=0;i--){
    let m = UI.month - i, y = UI.year;
    while (m < 0){ m += 12; y--; }
    const rec = Store.record(wid, y, m);
    const c = calc(w, rec || Store.ensureRecord(wid, y, m, false), Store.data.settings);
    hist.push({ rec, c, y, m, label: MONTHS_S[m] });
  }
  const lifePaid = Store.data.records.filter(r=>r.workerId===wid && r.status==="paid").length;
  const avg = hist.filter(h=>h.c.net>0).reduce((t,h)=>t+h.c.net,0) / (hist.filter(h=>h.c.net>0).length || 1);
  const root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="overlay" data-close="1">'+
    '<div class="drawer" data-stop="1">'+
      '<div class="drawer-head">'+av(w.name,"lg")+
        '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px;letter-spacing:-.02em">'+esc(w.name)+'</div>'+
        '<div class="muted" style="font-size:12px">'+esc(w.role||"—")+' · '+(w.type==="monthly"?"Monthly":"Hourly")+' '+money0(w.rate)+(w.type==="monthly"?"/mo":"/hr")+'</div></div>'+
        '<button class="x" data-act="closeDrawer">✕</button></div>'+
      '<div class="drawer-body">'+
        '<div class="strip" style="margin-bottom:14px">'+
          '<div><small>Net this month</small><b>'+money0(hist[5].c.net)+'</b></div>'+
          '<div><small>Avg (6 mo)</small><b>'+money0(avg)+'</b></div>'+
          '<div><small>Months paid</small><b>'+lifePaid+'</b></div>'+
        '</div>'+
        '<div class="card" style="margin-bottom:12px"><div class="card-h" style="padding:12px 14px"><div><h3 style="font-size:13px">6 month trend</h3></div></div>'+
          '<div class="card-b" style="padding:10px 14px">'+
            '<div class="chart" style="height:120px">'+hist.map(h=>'<div class="col'+(h.m===UI.month&&h.y===UI.year?" now":"")+'">'+
              '<div class="val">'+money0(h.c.net)+'</div>'+
              '<div class="bar" style="height:'+Math.max(4,(h.c.net/(Math.max.apply(null,hist.map(z=>z.c.net))||1))*100)+'%"></div>'+
              '<div class="cap">'+h.label+'</div></div>').join("")+'</div></div></div>'+
        '<div class="card"><div class="card-h" style="padding:12px 14px"><div><h3 style="font-size:13px">History</h3></div></div>'+
          '<div class="twrap"><table class="tbl" style="min-width:340px"><thead><tr><th>Month</th><th class="num">Net</th><th class="num">Adv</th><th>Status</th></tr></thead><tbody>'+
          hist.map(h=>'<tr><td>'+h.label+" "+String(h.y).slice(2)+'</td><td class="num">'+money0(h.c.net)+'</td>'+
            '<td class="num" style="color:var(--bad)">'+(h.c.advTotal? "−"+money0(h.c.advTotal):"—")+'</td>'+
            '<td>'+statusTag(h.rec)+'</td></tr>').join("")+
          '</tbody></table></div></div>'+
      '</div>'+
      '<div class="modal-f" style="border-radius:0">'+
        '<div class="left"><button class="btn sm" data-act="editWorker" data-wid="'+w.id+'">Edit</button>'+
        '<button class="btn sm" data-act="delWorker" data-wid="'+w.id+'" style="color:var(--bad)">Delete</button></div>'+
        '<button class="btn sm" data-act="shareWa" data-wid="'+w.id+'">✆ WA</button>'+
        '<button class="btn sm" data-act="pdfRec" data-wid="'+w.id+'">⬇ PDF</button>'+
        '<button class="btn sm primary" data-act="openRec" data-wid="'+w.id+'">Hisaab kholo</button>'+
      '</div>'+
    '</div></div>';
  const ov = $(".overlay", root);
  if (ov) ov.addEventListener("mousedown", (e)=>{ if (e.target === ov) closeDrawer(); });
}
function closeDrawer(){ const r = document.getElementById("modalRoot"); if (r) r.innerHTML = ""; }

function statusTag(rec) {
  return rec && rec.status === "paid"
    ? '<span class="tag ok" style="white-space:nowrap">✔ Paid<span class="st-date">' + (rec.paidOn ? " " + esc(rec.paidOn.slice(5).split("-").reverse().join("/")) : "") + "</span></span>"
    : '<span class="tag warn" style="white-space:nowrap">● Pending</span>';
}
