/* ============================= 17. THEME ============================= */
function applyTheme(t){
  const mode = t === "dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", mode);
  try { localStorage.setItem("hisaabPro.theme", mode); } catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", mode === "dark" ? "#070c16" : "#f4f6fc");
}
function initTheme(){
  let t = "light";
  try { t = localStorage.getItem("hisaabPro.theme") || (Store.data.settings && Store.data.settings.theme) || "light"; } catch(e){}
  if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
  applyTheme(t);
}
function toggleTheme(t){
  applyTheme(t);
  if (Store.data.settings) { Store.data.settings.theme = t; Store.save(true); }
  render();
  toast(t === "dark" ? "Dark mode on" : "Light mode on", "ok");
}

/* ============================ 18. EXPORTS ============================ */
function csvCell(v){ const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCsv(){
  const rows = rowsForMonth(UI.year, UI.month);
  if (!rows.length) return toast("Koi data nahi hai", "bad");
  const head = ["Worker","Type","Rate","Present","Absent","Sundays","Working days","Hours","Per day","Gross","Advances","Other deductions","Net payable","Status","Paid on"];
  const lines = [head.join(",")];
  rows.forEach(({w, rec, c}) => {
    lines.push([w.name, w.type, w.rate, c.present, c.absent, c.sundays, c.workingDays,
      c.isHourly ? c.totalHours : "", c.isHourly ? "" : c.perDay, c.grossEarnings, c.advTotal, c.dedTotal, c.net,
      rec && rec.status === "paid" ? "PAID" : "PENDING", rec ? (rec.paidOn || "") : ""].map(csvCell).join(","));
  });
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Hisaab_" + MONTHS_S[UI.month] + "-" + UI.year + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("CSV download ho gayi", "ok");
}
function shareWa(wid, y, m){
  const w = Store.worker(wid); if (!w) return;
  y = y == null ? UI.year : y; m = m == null ? UI.month : m;
  const rec = Store.ensureRecord(wid, y, m, false);
  const c = calc(w, rec, Store.data.settings);
  const shop = Store.data.settings.shopName || "Hisaab Pro";
  const L = [];
  L.push("*" + shop + " — Salary Statement*");
  L.push(monthLabel(y, m));
  L.push("Worker: " + w.name + (w.role ? " (" + w.role + ")" : ""));
  L.push("");
  L.push("Days: " + c.present + " present · " + c.absent + " absent · " + c.sundays + " Sundays");
  if (c.isHourly) L.push("Rate: " + money(w.rate) + "/hr · Hours: " + c.totalHours);
  else L.push("Rate: " + money(c.perDay) + "/day (salary ÷ 30)");
  L.push("Earned wages: " + money(c.earned));
  if (c.bonus) L.push("Bonus: " + money(c.bonus));
  if (c.advTotal) L.push("Advances: −" + money(c.advTotal));
  if (c.dedTotal) L.push("Other deductions: −" + money(c.dedTotal));
  L.push("");
  L.push("*NET PAYABLE: " + money(c.net) + "*");
  L.push("(" + inWords(c.net) + ")");
  const text = encodeURIComponent(L.join("\n"));
  const phone = String(w.phone || "").replace(/[^0-9]/g, "");
  const url = phone ? "https://wa.me/91" + phone.replace(/^91/, "") + "?text=" + text : "https://wa.me/?text=" + text;
  window.open(url, "_blank");
  toast("WhatsApp khol rahe hain…", "ok");
}

function openCmdk(){
  if ($("#cmdk")) return;
  const div = document.createElement("div");
  div.className = "cmdk"; div.id = "cmdk";
  div.innerHTML = '<div class="cmdk-box"><input class="cmdk-inp" id="cmdkInp" placeholder="Kuch bhi dhoondo — worker, page, action…" autocomplete="off"><div class="cmdk-list" id="cmdkList"></div></div>';
  document.body.appendChild(div);
  const inp = $("#cmdkInp"), list = $("#cmdkList");
  let idx = 0, shown = [];
  const paint = () => {
    const q = inp.value.trim().toLowerCase();
    shown = cmdkItems().filter(i => !q || i.t.toLowerCase().includes(q));
    idx = 0;
    list.innerHTML = shown.map((i, n) => '<div class="cmdk-item' + (n === idx ? " on" : "") + '" data-i="' + n + '"><span>' + i.ic + "</span>" + esc(i.t) + '<span class="k">' + i.k + "</span></div>").join("") ||
      '<div class="cmdk-item">Kuch nahi mila</div>';
  };
  const run = (i) => {
    const it = shown[i]; if (!it) return;
    closeCmdk();
    if (it.act === "nav") go(it.v);
    else if (it.act === "ctTabNav") { ctUI().tab = it.v; go("canteen"); }
    else if (it.act === "ctAddNew") { if (UI.view !== "canteen") go("canteen"); openCtModal(); }
    else if (it.act === "openRec") openRecordModal(it.wid, UI.year, UI.month);
    else if (it.act === "addWorker") openWorkerModal();
    else if (it.act === "exportCsv") exportCsv();
    else if (it.act === "pdfAll") downloadAllPdfs();
    else if (it.act === "printAll") printAll();
    else if (it.act === "toggleTheme2") toggleTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  };
  inp.addEventListener("input", paint);
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { idx = Math.min(shown.length - 1, idx + 1); paint2(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { idx = Math.max(0, idx - 1); paint2(); e.preventDefault(); }
    else if (e.key === "Enter") { run(idx); }
    else if (e.key === "Escape") closeCmdk();
  });
  const paint2 = () => { $$(".cmdk-item", list).forEach((el, n) => el.classList.toggle("on", n === idx)); };
  list.addEventListener("click", (e) => { const it = e.target.closest(".cmdk-item"); if (it && it.dataset.i != null) run(Number(it.dataset.i)); });
  div.addEventListener("mousedown", (e) => { if (e.target === div) closeCmdk(); });
  paint();
  setTimeout(() => inp.focus(), 30);
}
function closeCmdk(){ const el = $("#cmdk"); if (el) el.remove(); }


/* ------------------------ 12. MODALS & DIALOGS -------------------------- */
function openModal(html, opts) {
  const root = $("#modalRoot");
  root.innerHTML = '<div class="overlay" id="overlay">' + html + "</div>";
  const ov = $("#overlay");
  ov.addEventListener("mousedown", (e) => { if (e.target === ov && !(opts && opts.sticky)) closeModal(); });
  document.body.style.overflow = "hidden";
}
function closeModal() {
  $("#modalRoot").innerHTML = "";
  document.body.style.overflow = "";
  UI.openRec = null;
}
function confirmDialog(title, msg, okLabel, onOk, danger) {
  openModal(
    '<div class="modal" style="max-width:430px"><div class="modal-h"><div><h3>' + esc(title) + '</h3></div>' +
      '<button class="x" data-act="closeModal">✕</button></div>' +

      '<button class="btn ' + (danger ? "danger" : "primary") + '" id="cfmOk">' + esc(okLabel) + "</button></div></div>"
  );
  $("#cfmOk").addEventListener("click", () => { closeModal(); onOk(); });
}

        '<div class="sec-title">Advances &amp; deductions</div>' +

        "</div>" +

        '<div class="sec-title">Final hisaab</div>' +
        '<div class="sum">' +
          '<div class="sum-box"><div class="hd">Earnings</div><div id="sumEarn"></div></div>' +
          '<div class="sum-box"><div class="hd">Deductions</div><div id="sumDed"></div></div>' +
        "</div>" +
        '<div id="netBox"></div>' +

        '<div class="sec-title">Notes &amp; payment</div>' +

          '<div class="field"><label>Payment date</label><input class="inp" type="date" id="mPaidOn" value="' + esc(rec.paidOn || "") + '">' +

        "</div>" +
      "</div></div>"
  );
  renderAdvDedLists();
  refreshRecModal();
  renderPrevMonths(wid, y, m);

  /* quick attendance chips */
  const q = $("[data-quick]");
  if (q) {
    q.innerHTML = [0, 1, 2, 3].map((n) => '<button class="btn xs" data-act="quickAbsent" data-n="' + n + '" title="Mark ' + n + " absent and rest present\">" + (n === 0 ? "All present" : n + " absent") + "</button>").join("");
  }

  ["mPresent", "mAbsent", "mHours", "mBonus", "mNote", "mPaidOn", "mIncludeSun", "mStatus"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", () => { commitModal(); refreshRecModal(); });
    el.addEventListener("change", () => { commitModal(); refreshRecModal(); if (id === "mStatus") syncStatusUI(); });
  });
}

function syncStatusUI() {
  const rec = currentModalRec();
  if (!rec) return;
  if (rec.status === "paid" && !rec.paidOn) {
    const d = new Date();
    rec.paidOn = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const el = $("#mPaidOn"); if (el) el.value = rec.paidOn;
    Store.persistRecord(rec);
  }
}

function currentModalRec() {
  if (!UI.openRec) return null;
  return Store.record(UI.openRec.wid, UI.openRec.y, UI.openRec.m);
}

function commitModal() {
  const st = UI.openRec;
  if (!st || !document.getElementById("mPresent")) return;
  const rec = Store.record(st.wid, st.y, st.m);
  if (!rec) return;
  const meta = monthMeta(st.y, st.m);
  const includeSun = $("#mIncludeSun").checked;
  const wd = includeSun ? meta.dim : meta.workingDays;
  rec.includeSundays = includeSun;
  rec.presentDays = clamp(Math.round(num($("#mPresent").value)), 0, wd);
  rec.absentDays = clamp(Math.round(num($("#mAbsent").value)), 0, wd);
  if (rec.presentDays + rec.absentDays > wd) rec.absentDays = Math.max(0, wd - rec.presentDays);
  if ($("#mHours")) rec.totalHours = Math.max(0, num($("#mHours").value));
  rec.bonus = Math.max(0, num($("#mBonus").value));
  rec.note = $("#mNote").value;
  rec.status = $("#mStatus").value;
  rec.paidOn = $("#mPaidOn").value;
  $("#advList") && (rec.advances = $$("#advList .adv-row").map((row) => ({
    id: row.dataset.id, date: $(".a-date", row).value, note: $(".a-note", row).value, amount: num($(".a-amt", row).value)
  })));
  $("#dedList") && (rec.deductions = $$("#dedList .ded-row").map((row) => ({
    id: row.dataset.id, label: $(".d-label", row).value, amount: num($(".d-amt", row).value)
  })));
  Store.persistRecord(rec);
}

function refreshRecModal() {
  const st = UI.openRec;
  if (!st) return;
  const w = Store.worker(st.wid), rec = currentModalRec();
  if (!w || !rec) return;
  const c = calc(w, rec, Store.data.settings);

  const set = (sel, val) => { const el = $(sel); if (el) el.innerHTML = val; };
  set('[data-live="advTotal"]', money(c.advTotal));
  set('[data-live="dedTotal"]', money(c.dedTotal));
  set('[data-live="rateMain"]', money(c.isHourly ? c.perHour : c.perDay));
  set('[data-live="qtyMain"]', c.isHourly ? c.totalHours + " hrs" : c.present + " days");
  set('[data-live="earned"]', money(c.earned));
  set('[data-live="sunDates"]', c.includeSundays ? "Counting Sundays as working" : "Excluded · " + c.meta.sundayDates.slice(0, 8).join(", ") + (c.meta.sundayDates.length > 8 ? "…" : ""));
  set('[data-live="wdHint"]', c.meta.dim + " days − " + c.sundays + " Sundays");
  set('[data-live="rateMainLbl"]', c.isHourly ? "PER HOUR RATE" : "PER DAY RATE");
  set('[data-live="qtyMainLbl"]', c.isHourly ? "TOTAL HOURS" : "PRESENT DAYS");
  set('[data-live="rateMainBasis"]', c.isHourly ? "Hourly wage (fixed rate)" : money0(c.rate) + " ÷ 30 (fixed 30-day month)");
  set('[data-live="qtyMainBasis"]', c.isHourly ? "Hours worked this month" : money(c.perDay) + " per present day");
  set('[data-live="earnedBasis"]', c.isHourly ? c.totalHours + " hrs × " + money(c.rate) : c.present + " days × " + money(c.perDay));
  set('[data-live="hoursHint"]', c.isHourly ? "Pay = " + c.totalHours + " hrs × " + money(c.rate) + " = " + money(c.earned) : "");

  const sunEl = $("#mSundays"); if (sunEl) sunEl.value = c.sundays;
  const wdEl = $("#mWorkDays"); if (wdEl) wdEl.value = c.workingDays;

  const warn = $("#attWarn");
  if (warn) {
    if (c.overAttendance) warn.innerHTML = '<div class="banner warn" style="margin-top:10px;margin-bottom:0"><span>⚠️</span><div>Present + absent (' + (c.present + c.absent) + ") is more than the " + c.workingDays + " payable working days. Attendance has been auto-adjusted.</div></div>";
    else if (c.present + c.absent < c.workingDays) warn.innerHTML = '<div class="banner info" style="margin-top:10px;margin-bottom:0"><span>ℹ️</span><div>' + (c.workingDays - c.present - c.absent) + " working day(s) not accounted for — they will <b>not</b> be paid. Increase present days if the worker was on duty.</div></div>";
    else warn.innerHTML = "";
  }

  const earn = $("#sumEarn"), ded = $("#sumDed");
  if (earn) earn.innerHTML =
    line(c.isHourly ? "Earned wages (" + c.totalHours + " hrs × " + money(c.rate) + ")" : "Earned wages (" + c.present + " days)", money(c.earned), "plus") +
    (c.bonus ? line("Bonus / allowance", money(c.bonus), "plus") : "") +
    line("<b>Gross earnings</b>", "<b>" + money(c.grossEarnings) + "</b>") +
    (c.isHourly ? line("Hourly rate", money(c.rate) + " / hr") : line("Per-day rate (÷30)", money(c.perDay))) +
    (c.absent ? line("Unpaid absent days (" + c.absent + ")", "−" + money(c.absentValue), "minus") : "");
  if (ded) ded.innerHTML =
    line("Advances (" + c.advances.length + ")", c.advTotal ? "−" + money(c.advTotal) : money(0), c.advTotal ? "minus" : "") +
    line("Other deductions (" + c.deductions.length + ")", c.dedTotal ? "−" + money(c.dedTotal) : money(0), c.dedTotal ? "minus" : "") +
    line("<b>Total deductions</b>", "<b>−" + money(c.totalDeductions) + "</b>") +
    line("Net payable", "<b style='color:#4f46e5'>" + money(c.net) + "</b>");

  const nb = $("#netBox");
  if (nb) nb.innerHTML =
    '<div class="netbox ' + (c.negative ? "neg" : "pos") + '">' +
      "<div><div class=\"l\">" + (c.negative ? "ADVANCES EXCEED EARNINGS" : "FINAL PAYABLE — " + MONTHS[st.m].toUpperCase() + " " + st.y) + "</div>" +
      '<div class="words">' + esc(inWords(c.net)) + "</div></div>" +
      '<div class="v">' + money(c.net) + "</div></div>";

  const stSel = $("#mStatus");
  if (stSel) stSel.value = rec.status;
}

}

/* ------------------------- 14. PDF ENGINE (offline) --------------------- */
/* A tiny PDF writer — no libraries, no internet needed. */
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];

function toAscii(str) {
  const map = { "₹": "Rs.", "–": "-", "—": "-", "’": "'", "‘": "'", "“": '"', "”": '"', "•": "-", "…": "...", "≤": "<=", "≥": ">=", "✔": "v", "✕": "x", "✖": "x", "→": "->", "×": "x", "÷": "/", "−": "-", "⚡": "*", "⧉": "|", "°": " deg", "\n": " " };
  let out = "";
  for (const ch of String(str == null ? "" : str)) {
    if (map[ch] !== undefined) out += map[ch];
    else if (ch.charCodeAt(0) < 128) out += ch;
    else if (ch.charCodeAt(0) < 256) out += ch;
    else out += "?";
  }
  return out;
}
function pdfEsc(s) { return toAscii(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }
function pdfWidth(str, size, bold) {
  const s = toAscii(str);
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    const code = s.charCodeAt(i);
    w += (code >= 32 && code <= 126) ? HELV_W[code - 32] : 556;
  }
  return (w * size) / 1000 * (bold ? 1.045 : 1);
}

function PdfDoc() { this.pages = []; this.cur = null; this.newPage(); }
PdfDoc.prototype.newPage = function () { this.cur = []; this.pages.push(this.cur); this.y = 800; return this; };
PdfDoc.prototype.op = function (s) { this.cur.push(s); };
PdfDoc.prototype.text = function (x, y, size, str, opt) {
  opt = opt || {};
  const bold = !!opt.bold;
  const col = opt.color || [0.06, 0.09, 0.16];
  let xx = x;
  if (opt.align === "right") xx = x - pdfWidth(str, size, bold);
  else if (opt.align === "center") xx = x - pdfWidth(str, size, bold) / 2;
  this.op("BT /" + (bold ? "F2" : "F1") + " " + size + " Tf " + col[0] + " " + col[1] + " " + col[2] + " rg 1 0 0 1 " + xx.toFixed(2) + " " + y.toFixed(2) + " Tm (" + pdfEsc(str) + ") Tj ET");
  return this;
};
PdfDoc.prototype.line = function (x1, y1, x2, y2, color, w) {
  const c = color || [0.85, 0.87, 0.9];
  this.op((w || 0.7) + " w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x1.toFixed(2) + " " + y1.toFixed(2) + " m " + x2.toFixed(2) + " " + y2.toFixed(2) + " l S");
  return this;
};
PdfDoc.prototype.rect = function (x, y, w, h, color) {
  const c = color || [0.96, 0.97, 0.99];
  this.op(c[0] + " " + c[1] + " " + c[2] + " rg " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re f");
  return this;
};
PdfDoc.prototype.box = function (x, y, w, h, stroke, fill) {
  if (fill) this.rect(x, y, w, h, fill);
  const c = stroke || [0.87, 0.89, 0.92];
  this.op("0.7 w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re S");
  return this;
};
PdfDoc.prototype.wrap = function (str, size, maxW, bold) {
  const words = toAscii(str).split(/\s+/);
  const lines = []; let cur = "";
  words.forEach((word) => {
    const test = cur ? cur + " " + word : word;
    if (pdfWidth(test, size, bold) > maxW && cur) { lines.push(cur); cur = word; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
};
PdfDoc.prototype.build = function () {
  const objs = [];
  objs.push("<< /Type /Catalog /Pages 2 0 R >>");
  objs.push(""); // pages placeholder
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const kids = [];
  this.pages.forEach((ops) => {
    const body = ops.join("\n");
    const cid = objs.length + 1;
    objs.push("<< /Length " + body.length + " >>\nstream\n" + body + "\nendstream");
    const pid = objs.length + 1;
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + cid + " 0 R >>");
    kids.push(pid);
  });
  objs[1] = "<< /Type /Pages /Kids [" + kids.map((k) => k + " 0 R").join(" ") + "] /Count " + kids.length + " >>";
  let out = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((body, i) => { offsets.push(out.length); out += (i + 1) + " 0 obj\n" + body + "\nendobj\n"; });
  const xref = out.length;
  out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
  offsets.forEach((o) => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
  out += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  return out;
};

/* ---- statement drawing ---- */
const C = { ink: [0.06, 0.09, 0.16], muted: [0.42, 0.45, 0.5], line: [0.85, 0.87, 0.9], light: [0.96, 0.97, 0.99], primary: [0.31, 0.27, 0.9], dark: [0.06, 0.09, 0.16], white: [1, 1, 1], green: [0.02, 0.6, 0.4], red: [0.78, 0.13, 0.13], hdr: [0.95, 0.96, 0.98] };
const PW = 595.28, M = 40, CW = PW - M * 2, RIGHT = PW - M;

function pdfHeader(p, title, year, month, d) {
  p.text(M, 800, 16, d.shopName || "My Shop", { bold: true, color: C.ink });
  let yy = 786;
  p.wrap(toAscii(d.address || ""), 8.5, 300).forEach((l) => { p.text(M, yy, 8.5, l, { color: C.muted }); yy -= 10.5; });
  if (d.phone) { p.text(M, yy, 8.5, "Phone: " + d.phone, { color: C.muted }); yy -= 10.5; }
  p.text(RIGHT, 800, 12, title, { bold: true, align: "right", color: C.ink });
  p.text(RIGHT, 787, 8.5, "Masik Vetan Vivaran", { align: "right", color: C.muted });
  p.text(RIGHT, 776, 9, monthLabel(year, month), { align: "right", color: C.ink, bold: true });
  p.line(M, 764, RIGHT, 764, C.ink, 1.6);
  p.y = 748;
}

function pdfKV(p, x, y, w, k, v) {
  p.text(x, y, 7.8, k.toUpperCase(), { color: C.muted, bold: true });
  p.text(x + w, y, 9, v, { align: "right", color: C.ink, bold: true });
  p.line(x, y - 4, x + w, y - 4, [0.92, 0.93, 0.95], 0.5);
}

function pdfSectionTitle(p, text) {
  if (p.y < 120) { p.newPage(); }
  p.y -= 14;
  p.text(M, p.y, 8.2, text.toUpperCase(), { bold: true, color: C.primary });
  p.y -= 4.5;
  p.line(M, p.y, RIGHT, p.y, C.line, 0.8);
  p.y -= 13;
}

function pdfTableHeader(p, cols) {
  const h = 15;
  p.rect(M, p.y - h + 3, CW, h, C.hdr);
  cols.forEach((c) => {
    if (c.align === "right") p.text(M + c.x + c.w, p.y - 5, 7.6, c.t.toUpperCase(), { align: "right", color: C.muted, bold: true });
    else p.text(M + c.x, p.y - 5, 7.6, c.t.toUpperCase(), { color: C.muted, bold: true });
  });
  p.y -= h;
  p.line(M, p.y + 3, RIGHT, p.y + 3, C.line, 0.7);
}

function pdfRow(p, cols, vals, opt) {
  opt = opt || {};
  if (p.y < 90) {
    p.newPage();
    pdfTableHeader(p, cols);
  }
  const h = 14.5;
  if (opt.bg) p.rect(M, p.y - h + 2.5, CW, h, opt.bg);
  cols.forEach((c, i) => {
    const v = vals[i] == null ? "" : String(vals[i]);
    const bold = opt.bold || (c.bold && true);
    if (c.wrap) {
      const lines = p.wrap(v, 8.6, c.w);
      lines.slice(0, 2).forEach((l, li) => p.text(M + c.x, p.y - 5 - li * 10, 8.6, l, { color: opt.color || C.ink, bold: bold }));
    } else if (c.align === "right") p.text(M + c.x + c.w, p.y - 5, 8.8, v, { align: "right", color: opt.color || C.ink, bold: bold });
    else p.text(M + c.x, p.y - 5, 8.8, v, { color: opt.color || C.ink, bold: bold });
  });
  p.y -= h;
  p.line(M, p.y + 2.5, RIGHT, p.y + 2.5, [0.92, 0.93, 0.95], 0.5);
}

function drawStatement(p, w, rec, c) {
  const d = Store.data.settings;
  pdfHeader(p, "SALARY STATEMENT", rec.year, rec.month, d);

  /* worker identity band */
  p.rect(M, p.y - 34, CW, 37, [0.97, 0.98, 1]);
  p.text(M + 10, p.y - 13, 12.5, w.name, { bold: true, color: C.ink });
  p.text(M + 10, p.y - 26, 8.5, (w.role || "-") + (w.phone ? "  |  " + w.phone : ""), { color: C.muted });
  const st = rec.status === "paid" ? "PAID on " + (rec.paidOn || "-") : "PAYMENT PENDING";
  p.text(RIGHT - 10, p.y - 13, 8.6, st, { align: "right", bold: true, color: rec.status === "paid" ? C.green : C.red });
  p.text(RIGHT - 10, p.y - 26, 8.2, "Statement No: HSB/" + rec.year + "-" + String(rec.month + 1).padStart(2, "0") + "/" + w.id.slice(0, 4).toUpperCase(), { align: "right", color: C.muted });
  p.y -= 50;

  /* attendance boxes */
  pdfSectionTitle(p, "Attendance summary");
  const boxes = [
    ["Days in month", String(c.meta.dim)],
    ["Sundays excluded", String(c.sundays)],
    ["Working days", String(c.workingDays)],
    ["Present days", String(c.present)],
    ["Absent days", String(c.absent)]
  ];
  const bw = (CW - 8 * 4) / 5;
  boxes.forEach((b, i) => {
    const x = M + i * (bw + 8);
    p.box(x, p.y - 30, bw, 32, C.line, C.light);
    p.text(x + bw / 2, p.y - 13, 7.4, b[0].toUpperCase(), { align: "center", color: C.muted, bold: true });
    p.text(x + bw / 2, p.y - 26, 12, b[1], { align: "center", color: C.ink, bold: true });
  });
  p.y -= 44;

  /* salary computation */
  pdfSectionTitle(p, "Salary computation");
  const c1 = [{ t: "Particulars", x: 8, w: 190, wrap: false }, { t: "Basis", x: 204, w: 218 }, { t: "Amount (Rs.)", x: 430, w: CW - 438, align: "right" }];
  pdfTableHeader(p, c1);
  if (w.type === "monthly") {
    pdfRow(p, c1, ["Monthly salary", "Fixed monthly salary", money(c.rate)]);
    pdfRow(p, c1, ["Salary per day", money(c.rate) + " / 30 days (fixed)", money(c.perDay)]);
    pdfRow(p, c1, ["Earned wages", money(c.perDay) + " x " + c.present + " present days", money(c.earned)], { bold: true });
  } else {
    pdfRow(p, c1, ["Hourly wage", "Rate per hour (fixed)", money(c.rate)]);
    pdfRow(p, c1, ["Total hours worked", c.present + " days attendance", c.totalHours + " hrs"]);
    pdfRow(p, c1, ["Earned wages", money(c.rate) + " x " + c.totalHours + " hours", money(c.earned)], { bold: true });
  }
  if (c.bonus) pdfRow(p, c1, ["Bonus / allowance", "-", money(c.bonus)]);
  if (c.absent) pdfRow(p, c1, ["Unpaid absent days (not payable)", c.absent + " days x " + money(c.perDay), "(" + money(c.absentValue) + ")"], { color: C.muted });
  pdfRow(p, c1, ["GROSS EARNINGS", "", money(c.grossEarnings)], { bold: true, bg: [0.95, 0.96, 0.99] });

  /* deductions */
  pdfSectionTitle(p, "Advances & deductions");
  const c2 = [{ t: "Date", x: 8, w: 60 }, { t: "Particulars", x: 78, w: 330 }, { t: "Amount (Rs.)", x: 425, w: CW - 433, align: "right" }];
  pdfTableHeader(p, c2);
  const entries = c.advances.map((a) => ({ date: a.date || "-", label: a.note || "Advance", amount: num(a.amount), kind: "Advance" }))
    .concat(c.deductions.map((x) => ({ date: "-", label: x.label || "Deduction", amount: num(x.amount), kind: "Deduction" })));
  if (!entries.length) pdfRow(p, c2, ["-", "No advances or deductions this month", money(0)]);
  entries.forEach((e) => pdfRow(p, c2, [e.date, (e.label || e.kind) + (e.label && e.label.toLowerCase().indexOf(e.kind.toLowerCase()) === -1 && e.kind === "Advance" ? "" : ""), money(e.amount)], { color: C.red }));
  pdfRow(p, c2, ["", "TOTAL DEDUCTIONS", money(c.totalDeductions)], { bold: true, bg: [0.99, 0.96, 0.96] });

  /* net box */
  if (p.y < 150) p.newPage();
  p.y -= 10;
  const netColor = c.negative ? [0.6, 0.11, 0.11] : [0.06, 0.09, 0.16];
  p.rect(M, p.y - 44, CW, 46, netColor);
  p.text(M + 14, p.y - 18, 8.4, c.negative ? "ADVANCES EXCEED EARNINGS" : "FINAL PAYABLE AMOUNT", { color: [0.75, 0.8, 0.9], bold: true });
  p.text(M + 14, p.y - 34, 9, "Gross " + money(c.grossEarnings) + "  -  Deductions " + money(c.totalDeductions), { color: [0.75, 0.8, 0.9] });
  p.text(RIGHT - 14, p.y - 26, 19, money(c.net), { align: "right", bold: true, color: C.white });
  p.y -= 56;

  /* words */
  const wl = p.wrap("Amount in words: " + inWords(c.net), 8.6, CW - 20);
  const wh = wl.length * 11 + 12;
  p.box(M, p.y - wh + 4, CW, wh, [0.85, 0.87, 0.9], [0.98, 0.99, 1]);
  wl.forEach((l, i) => p.text(M + 10, p.y - 8 - i * 11, 8.6, l, { color: C.ink }));
  p.y -= wh + 6;

  if (rec.note) {
    const nl = p.wrap("Note: " + rec.note, 8.2, CW - 20);
    nl.forEach((l, i) => p.text(M + 2, p.y - 8 - i * 10, 8.2, l, { color: C.muted }));
    p.y -= nl.length * 10 + 4;
  }

  /* signatures */
  if (p.y < 150) p.newPage();
  const sy = Math.max(96, Math.min(p.y - 40, 150));
  p.line(M + 10, sy, M + 170, sy, [0.6, 0.62, 0.66], 0.8);
  p.text(M + 10, sy - 11, 8, "Worker signature", { color: C.muted });
  p.line(RIGHT - 170, sy, RIGHT - 10, sy, [0.6, 0.62, 0.66], 0.8);
  p.text(RIGHT - 170, sy - 11, 8, (d.ownerName || "Authorised signatory") + " / For " + (d.shopName || ""), { color: C.muted });

  p.line(M, 48, RIGHT, 48, C.line, 0.6);
  p.text(M, 38, 7.2, p.wrap(d.statementNote || "", 7.2, 380)[0] || "", { color: C.muted });
  p.text(RIGHT, 38, 7.2, "Generated " + new Date().toLocaleDateString("en-IN"), { align: "right", color: C.muted });
}

function savePdf(filename, str) {
  try {
    /* write as raw Latin-1 bytes so the xref offsets stay exact */
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const blob = new Blob([bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast("PDF downloaded: " + filename, "ok");
  } catch (e) { toast("Could not create PDF — open the file in a browser tab and retry", "bad"); }
}
function safeName(s) { return String(s || "worker").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, ""); }

function downloadStatementPdf(wid, y, m) {
  const w = Store.worker(wid); if (!w) return;
  const rec = Store.ensureRecord(wid, y, m, false);
  const c = calc(w, rec, Store.data.settings);
  const p = new PdfDoc();
  drawStatement(p, w, rec, c);
  savePdf("Salary_" + safeName(w.name) + "_" + MONTHS_S[m] + "-" + y + ".pdf", p.build());
}
function downloadAllPdfs() {
  const rows = rowsForMonth(UI.year, UI.month);
  if (!rows.length) return toast("No workers to export", "bad");
  const p = new PdfDoc();
  drawSummaryPage(p, rows, UI.year, UI.month);
  rows.forEach(({ w, rec, c }) => { p.newPage(); drawStatement(p, w, rec, c); });
  savePdf("Payroll_" + MONTHS_S[UI.month] + "-" + UI.year + ".pdf", p.build());
}

function togglePaid(wid, y, m) {
  const rec = Store.ensureRecord(wid, y, m, true);
  if (rec.status === "paid") { rec.status = "pending"; rec.paidOn = ""; toast("Marked as pending"); }
  else {
    rec.status = "paid";
    if (!rec.paidOn) { const d = new Date(); rec.paidOn = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    toast("Marked as paid ✔", "ok");
  }
  Store.persistRecord(rec);
}

function autoFillAll() {
  confirmDialog("Auto-fill attendance?", "Set <b>present days = all payable working days</b> and absent = 0 for every active worker in " + monthLabel(UI.year, UI.month) + ". Existing values will be overwritten.", "Yes, auto-fill", () => {
    Store.activeWorkers().forEach((w) => {
      const rec = Store.ensureRecord(w.id, UI.year, UI.month, true);
      const meta = monthMeta(UI.year, UI.month);
      const wd = rec.includeSundays ? meta.dim : meta.workingDays;
      rec.presentDays = wd; rec.absentDays = 0;
      Store.persistRecord(rec);
    });
    render(); toast("Attendance auto-filled", "ok");
  });
}
function copyPreviousMonth() {
  const pm = UI.month === 0 ? { y: UI.year - 1, m: 11 } : { y: UI.year, m: UI.month - 1 };
  let n = 0;
  Store.activeWorkers().forEach((w) => {
    const src = Store.record(w.id, pm.y, pm.m);
    if (!src) return;
    const rec = Store.ensureRecord(w.id, UI.year, UI.month, true);
    rec.presentDays = src.presentDays; rec.absentDays = src.absentDays; rec.includeSundays = src.includeSundays;
    Store.persistRecord(rec); n++;
  });
  render();
  toast(n ? "Copied attendance from " + MONTHS_S[pm.m] + " for " + n + " workers" : "No records found for " + monthLabel(pm.y, pm.m), n ? "ok" : "bad");
}
function markAllPaid() {
  confirmDialog("Mark all as paid?", "Set every worker’s " + monthLabel(UI.year, UI.month) + " record to <b>PAID</b> with today’s date.", "Mark all paid", () => {
    Store.activeWorkers().forEach((w) => {
      const rec = Store.ensureRecord(w.id, UI.year, UI.month, true);
      rec.status = "paid";
      const d = new Date();
      rec.paidOn = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      Store.persistRecord(rec);
    });
    render(); toast("All workers marked paid", "ok");

}
function exportData() {
  const blob = new Blob([JSON.stringify(Store.data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "hisaab-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast("Backup downloaded", "ok");
}
function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d.workers || !d.records) throw new Error("bad");
        Store.data = { settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) }, workers: d.workers, records: d.records, canteen: normCanteen(d.canteen) };
        Store.save(); render(); toast("Backup restored", "ok");
      } catch (e) { toast("Invalid backup file", "bad"); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ------------------ 18. CLOUD LOGIN & SYNC (Supabase) ------------------- */
const CLOUD_KEY = "hisaabPro.cloud.v1";
const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}

const Cloud = {
  cfg: null, client: null, user: null, mode: "in",
  status: "local", lastSync: 0, dirty: false, busy: false, pushTimer: null, blocked: false,

  readCfg() {
    try { const r = localStorage.getItem(CLOUD_KEY); this.cfg = r ? JSON.parse(r) : null; }
    catch (e) { this.cfg = null; }
    return this.cfg;
  },
  writeCfg(c) {
    this.cfg = c;
    try { if (c) localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); else localStorage.removeItem(CLOUD_KEY); } catch (e) {}
  },
  configured() { return !!(this.cfg && this.cfg.url && this.cfg.key); },

  async initClient() {
    if (this.client) return this.client;
    if (!window.supabase) await loadScriptOnce(SUPABASE_CDN);
    if (!window.supabase) throw new Error("Supabase library load failed");
    this.client = window.supabase.createClient(this.cfg.url, this.cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
    return this.client;
  },

  async boot() {
    this.readCfg();
    if (!this.configured()) { this.status = "local"; updateCloudBadge(); return; }
    try {
      await this.initClient();
      const res = await this.client.auth.getSession();
      const session = res && res.data ? res.data.session : null;
      this.user = session ? session.user : null;
      if (this.user) {
        this.status = "synced"; showLogin(false);
        await this.maybePull(true);
      } else { this.status = "loggedout"; showLogin(true); }
    } catch (e) {
      this.status = "error"; showLogin(true);
    }
    updateCloudBadge();
  },

  setStatus(s, msg) { this.status = s; updateCloudBadge(msg); },

  async signIn(email, password) {
    await this.initClient();
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    this.user = data.user;
    await this.afterLogin();
  },

  async signUp(email, password) {
    await this.initClient();
    const { data, error } = await this.client.auth.signUp({ email, password });
    if (error) throw error;
    if (!data.session) return { needsConfirm: true };
    this.user = data.user;
    await this.afterLogin();
    return { needsConfirm: false };
  },

  async signOut() {
    try { if (this.client) await this.client.auth.signOut(); } catch (e) {}
    this.user = null; this.status = "loggedout";
    showLogin(true); render();
  },

  async fetchRemote() {
    if (!this.user) return null;
    const { data, error } = await this.client.from("hisaab_data").select("payload,updated_at").eq("user_id", this.user.id).maybeSingle();
    if (error) throw error;
    return data || null;
  },

  schedulePush() {
    if (!this.user) return;
    this.dirty = true;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.pushNow(), 1200);
  },

  async pushNow() {
    if (!this.user || this.busy) return;
    this.busy = true; this.setStatus("saving");
    try {
      const payload = JSON.parse(JSON.stringify(Store.data));
      delete payload.settings.demo;
      const { error } = await this.client.from("hisaab_data")
        .upsert({ user_id: this.user.id, payload: payload, updated_at: new Date().toISOString() });
      if (error) throw error;
      this.dirty = false; this.lastSync = Date.now(); this.setStatus("synced");
    } catch (e) {
      this.setStatus("offline");
    }
    this.busy = false;
  },

  async afterLogin() {
    showLogin(false);
    this.setStatus("synced");
    try {
      const remote = await this.fetchRemote();
      const remoteHas = remote && remote.payload && Array.isArray(remote.payload.workers) && remote.payload.workers.length > 0;
      const localHas = Store.data.workers.length > 0 && Store.data.settings.demo !== true;
      if (remoteHas && localHas && !samePayload(remote.payload, Store.data)) {
        askWhichData(remote);
      } else if (remoteHas && !localHas) {
        adoptRemote(remote);
        toast("Cloud ka data load ho gaya ✔", "ok");
      } else {
        await this.pushNow();
        toast("Data cloud par save ho gaya ✔", "ok");
      }
    } catch (e) {
      toast("Cloud se connect nahi ho paya — internet check karein", "bad");
      this.setStatus("offline");
    }
    render();
  },

  /* pull newer data made on another device */
  async maybePull(force) {
    if (!this.user || this.dirty || this.busy) return;
    if ($("#overlay")) return; /* skip while a dialog is open */
    try {
      const remote = await this.fetchRemote();
      if (!remote || !remote.payload) return;
      const stamp = new Date(remote.updated_at).getTime();
      const remoteHas = Array.isArray(remote.payload.workers);
      if (!remoteHas) return;
      if (stamp > this.lastSync + 1500) {
        if (force || !this.dirty) {
          Store.data = normalizeData(remote.payload);
          Store.save(true);
          this.lastSync = stamp;
          render();
          toast("Doosre device ka naya data aa gaya ✔", "ok");
        }
      } else if (!this.lastSync) { this.lastSync = stamp; }
    } catch (e) { /* silent */ }
  }
};

function normalizeData(d) {
  return {
    settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) },
    workers: Array.isArray(d.workers) ? d.workers : [],
    records: Array.isArray(d.records) ? d.records : [],
    canteen: normCanteen(d.canteen)
  };
}
function adoptRemote(remote) {
  Store.data = normalizeData(remote.payload);
  Store.save(true);
  Cloud.lastSync = new Date(remote.updated_at).getTime();
  closeModal(); render();
}
/* dono taraf normalize kar ke compare — warna naya canteen key har login par
   "kaunsa data rakhein?" dialog dikha deta, jabki asal me kuch badla hi nahi hota */
function samePayload(a, b) {
  try { return JSON.stringify(normalizeData(a)) === JSON.stringify(normalizeData(b)); }
  catch (e) { return false; }
}
function ctCountOf(payload) {
  return ((payload && payload.canteen && Array.isArray(payload.canteen.entries)) ? payload.canteen.entries : []).length;
}
function askWhichData(remote) {
  Cloud._pending = remote;
  const remoteCount = (remote.payload.workers || []).length;
  openModal(
    '<div class="modal" style="max-width:480px"><div class="modal-h"><div><h3>Kaunsa data rakhein?</h3>' +
      '<p>Aapke account me pehle se data hai, aur is device me bhi data hai.</p></div><button class="x" data-act="closeModal">✕</button></div>' +
      '<div class="modal-b" style="font-size:13px;color:#475569">' +

          '<b style="color:var(--ink)">Cloud par:</b> ' + remoteCount + " workers · " + ctCountOf(remote.payload) + " canteen entries<br>" +
          '<span style="font-size:11.5px">Last update: ' + esc(String(remote.updated_at).slice(0, 16).replace("T", " ")) + "</span></div>" +
        '<div style="border:1px solid var(--line);border-radius:11px;padding:11px 13px">' +
          '<b style="color:var(--ink)">Is device par:</b> ' + Store.data.workers.length + " workers · " +
          ctCountOf(Store.data) + " canteen entries</div>" +
        '<p style="margin-top:12px;font-size:12px">Agar aap pehli baar login kar rahe hain, to <b>“Is device ka data upload”</b> chunein. ' +
        "Baaki device par kaam kiya hai to <b>“Cloud ka data download”</b> chunein.</p>" +

        '<button class="btn" data-act="useCloud">☁️ Cloud ka data download</button>' +
        '<button class="btn primary" data-act="useLocal">⤒ Is device ka data upload</button>' +
      "</div></div>"
  );
}

function showLogin(show) {
  const root = $("#loginRoot");

  Cloud.blocked = !!show;
  if (!show) { root.innerHTML = ""; document.body.style.overflow = ""; return; }
  root.innerHTML = loginScreenHTML();
  document.body.style.overflow = "hidden";
  const go = $("#lcGo");
  if (go) go.addEventListener("click", submitLogin);
  const pass = $("#lcPass");
  if (pass) pass.addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });
  const em = $("#lcEmail");
  if (em) setTimeout(() => em.focus(), 80);

  const el = $("#lcMsg");

async function submitLogin() {
  const email = ($("#lcEmail") ? $("#lcEmail").value : "").trim();
  const pass = $("#lcPass") ? $("#lcPass").value : "";
  if (!email || email.indexOf("@") < 1) { lcError("Sahi email address likhein."); return; }
  if (!pass || pass.length < 6) { lcError("Password kam se kam 6 characters ka hona chahiye."); return; }
  const btn = $("#lcGo");
  if (btn) { btn.disabled = true; btn.textContent = "Please wait…"; }
  try {
    if (Cloud.mode === "up") {
      const r = await Cloud.signUp(email, pass);
      if (r && r.needsConfirm) {
        const el = $("#lcMsg");
        if (el) el.innerHTML = '<div class="banner info" style="margin-bottom:11px"><span>📧</span><div style="font-size:12.5px">' +
          "Account ban gaya! Ab apne email par aaya <b>confirmation link</b> kholkar verify karein, phir yahan <b>Sign in</b> karein.</div></div>";
        Cloud.mode = "in"; showLogin(true);
        return;
      }
    } else {
      await Cloud.signIn(email, pass);
    }
    showLogin(false); render();
    toast("Login ho gaya ✔", "ok");
  } catch (e) {
    const m = (e && e.message ? e.message : "").toLowerCase();
    let msg = "Login nahi ho paya. Internet aur details check karein.";
    if (m.indexOf("invalid login") >= 0) msg = "Email ya password galat hai.";
    else if (m.indexOf("already registered") >= 0) msg = "Ye email pehle se registered hai — <b>Sign in</b> karein.";
    else if (m.indexOf("email not confirmed") >= 0) msg = "Pehle email par aaya confirmation link kholkar verify karein.";
    else if (m.indexOf("failed to fetch") >= 0 || m.indexOf("network") >= 0) msg = "Internet ya Supabase URL/key galat hai.";
    lcError(msg + '<div style="font-size:11px;margin-top:5px;opacity:.8">' + esc(e && e.message ? e.message : "") + "</div>");
    if (btn) { btn.disabled = false; btn.textContent = Cloud.mode === "up" ? "Create account & login" : "Sign in"; }
  }
}

/* ============================================================================
   21. CANTEEN MODULE
   Canteen me aane wala saman — rate-wise entry YA ek-saath pura total.
   Bikri / kharcha bhi. Din ka ledger, mahine ka ledger, rate list,
   udhaar (baki) aur poori activity log.
   Data: Store.data.canteen = { entries[], rates[], log[] }
   ========================================================================== */

const CT_KIND = {
  purchase: { label: "Saman aaya",      en: "Purchase", sign: -1, ico: "⬇", tone: "k-warn", tag: "warn", col: "#f59e0b" },
  sale:     { label: "Bikri / income",  en: "Sale",     sign:  1, ico: "⬆", tone: "k-ok",   tag: "ok",   col: "#10b981" },
  expense:  { label: "Kharcha",         en: "Expense",  sign: -1, ico: "↯", tone: "k-bad",  tag: "bad",  col: "#ef4444" }
};
const CT_KINDS = ["purchase", "sale", "expense"];
const CT_PAY = { cash: "Cash", upi: "UPI", bank: "Bank / cheque", udhaar: "Udhaar (baad me)" };
const CT_UNITS = ["kg", "gram", "ltr", "ml", "pkt", "pcs", "dozen", "box", "bag", "plate", "cup", "bundle", "carton"];
const CT_LOG_MAX = 1500;

/* ------------------------- 21a. DATE HELPERS ------------------------- */
function isoDate(d) {
  const x = d instanceof Date ? d : new Date(d);
  const t = isNaN(x.getTime()) ? new Date() : x;
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
function ctParts(iso) {
  const p = String(iso || "").split("-");
  const now = new Date();
  const y = Number(p[0]) || now.getFullYear();
  const m = clamp((Number(p[1]) || now.getMonth() + 1) - 1, 0, 11);
  const d = clamp(Number(p[2]) || 1, 1, 31);
  return { y, m, d };
}
function ctDateObj(iso) { const p = ctParts(iso); return new Date(p.y, p.m, p.d); }
function ctDayName(iso) { return DAYS[ctDateObj(iso).getDay()]; }
function ctPretty(iso) { const p = ctParts(iso); return String(p.d).padStart(2, "0") + " " + MONTHS_S[p.m] + " " + p.y; }
function ctShort(iso) { const p = ctParts(iso); return String(p.d).padStart(2, "0") + " " + MONTHS_S[p.m]; }
function ctShiftDate(iso, days) { const t = ctDateObj(iso); t.setDate(t.getDate() + days); return isoDate(t); }
function ctIsToday(iso) { return String(iso) === isoDate(new Date()); }
function monthFirst(y, m) { return y + "-" + String(m + 1).padStart(2, "0") + "-01"; }
function monthLast(y, m) { return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(new Date(y, m + 1, 0).getDate()).padStart(2, "0"); }
function ctTime(ts) {
  const d = new Date(num(ts) || Date.now());
  let h = d.getHours(); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12;
  return h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ap;
}

/* ------------------------- 21b. DATA SHAPE ------------------------- */
function blankCanteen() { return { entries: [], rates: [], log: [], demo: false }; }

function normCtItem(i) {
  i = i || {};
  return {
    name: String(i.name == null ? "" : i.name).slice(0, 90),
    qty: Math.max(0, num(i.qty)),
    unit: String(i.unit == null || i.unit === "" ? "kg" : i.unit).slice(0, 18),
    rate: Math.max(0, num(i.rate))
  };
}
function normCtEntry(e) {
  e = e || {};
  const kind = CT_KINDS.indexOf(e.kind) >= 0 ? e.kind : "purchase";
  const mode = e.mode === "total" ? "total" : "itemized";
  const items = (Array.isArray(e.items) ? e.items : []).map(normCtItem);
  const itemsTotal = r2(items.reduce((t, i) => t + i.qty * i.rate, 0));
  const amount = r2(Math.max(0, mode === "total" ? num(e.amount) : (num(e.amount) || itemsTotal)));
  const payMode = CT_PAY[e.payMode] ? e.payMode : "cash";
  return {
    id: String(e.id || uid()),
    date: /^\d{4}-\d{2}-\d{2}$/.test(String(e.date || "")) ? String(e.date) : isoDate(new Date()),
    kind: kind, mode: mode, items: items, amount: amount,
    party: String(e.party == null ? "" : e.party).slice(0, 90),
    billNo: String(e.billNo == null ? "" : e.billNo).slice(0, 40),
    paid: r2(clamp(num(e.paid), 0, amount || num(e.paid) || 0)),
    payMode: payMode,
    note: String(e.note == null ? "" : e.note).slice(0, 500),
    createdAt: num(e.createdAt) || Date.now(),
    updatedAt: num(e.updatedAt) || Date.now()
  };
}
function normCtRate(r) {
  r = r || {};
  return {
    id: String(r.id || uid()),
    name: String(r.name == null ? "" : r.name).slice(0, 90),
    unit: String(r.unit == null || r.unit === "" ? "kg" : r.unit).slice(0, 18),
    rate: Math.max(0, num(r.rate)),
    cat: String(r.cat == null ? "" : r.cat).slice(0, 40)
  };
}
function normCanteen(c) {
  const b = blankCanteen();
  if (!c || typeof c !== "object") return b;
  b.entries = (Array.isArray(c.entries) ? c.entries : []).map(normCtEntry);
  b.rates = (Array.isArray(c.rates) ? c.rates : []).map(normCtRate).filter((r) => r.name);
  b.log = (Array.isArray(c.log) ? c.log : []).slice(-CT_LOG_MAX);
  b.demo = !!c.demo;
  return b;
}
/* safe accessor — hamesha ek valid canteen object deta hai */
function ct() {
  const d = Store.data;
  if (!d.canteen || typeof d.canteen !== "object" || !Array.isArray(d.canteen.entries) ||
      !Array.isArray(d.canteen.rates) || !Array.isArray(d.canteen.log)) {
    d.canteen = normCanteen(d.canteen);
  }
  return d.canteen;
}
function ctUI() {
  if (!UI.ct || typeof UI.ct !== "object") UI.ct = {};
  const u = UI.ct;
  if (["day", "month", "entries", "rates", "activity"].indexOf(u.tab) < 0) u.tab = "day";
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(u.date || ""))) u.date = isoDate(new Date());
  if (u.kind !== "all" && CT_KINDS.indexOf(u.kind) < 0) u.kind = "all";
  if (u.q == null) u.q = "";
  if (u.from == null) u.from = "";
  if (u.to == null) u.to = "";
  if (u.scope !== "all" && u.scope !== "custom") u.scope = "month";
  if (u.logScope !== "all") u.logScope = "month";
  return u;
}

/* ------------------------- 21c. ENTRY MATH ------------------------- */
function ctKindOf(e) { return CT_KIND[(e && e.kind) || "purchase"] || CT_KIND.purchase; }
function ctAmount(e) { return r2(Math.max(0, num(e && e.amount))); }
function ctPaid(e) { return r2(clamp(num(e && e.paid), 0, 1e12)); }
function ctBalance(e) { return r2(Math.max(0, ctAmount(e) - Math.min(ctPaid(e), ctAmount(e)))); }
function ctItemsSum(e) { return r2(((e && e.items) || []).reduce((t, i) => t + num(i.qty) * num(i.rate), 0)); }
function ctNetOf(e) { return r2(ctKindOf(e).sign * ctAmount(e)); }
function ctItemCount(e) { return ((e && e.items) || []).filter((i) => i.name || i.qty || i.rate).length; }
function ctItemLabel(e) {
  const its = ((e && e.items) || []).filter((i) => i.name);
  if (!its.length) return "";
  return its.map((i) => i.name + (i.qty ? " (" + num(i.qty) + (i.unit || "") + ")" : "")).join(", ");
}
function ctTotals(list) {
  const t = { count: list.length, purchase: 0, sale: 0, expense: 0, paid: 0, balance: 0,
              items: 0, itemizedAmt: 0, totalModeAmt: 0, totalModeCount: 0, net: 0, out: 0 };
  (list || []).forEach((e) => {
    const a = ctAmount(e);
    if (e.kind === "sale") t.sale += a;
    else if (e.kind === "expense") t.expense += a;
    else t.purchase += a;
    t.paid += Math.min(ctPaid(e), a);
    t.balance += ctBalance(e);
    t.items += ctItemCount(e);
    if (e.mode === "total") { t.totalModeAmt += a; t.totalModeCount++; } else t.itemizedAmt += a;
  });
  t.purchase = r2(t.purchase); t.sale = r2(t.sale); t.expense = r2(t.expense);
  t.paid = r2(t.paid); t.balance = r2(t.balance);
  t.itemizedAmt = r2(t.itemizedAmt); t.totalModeAmt = r2(t.totalModeAmt);
  t.out = r2(t.purchase + t.expense);
  t.net = r2(t.sale - t.out);
  return t;
}

/* ------------------------- 21d. QUERIES ------------------------- */
function ctAll() {
  return ct().entries.slice().sort((a, b) =>
    a.date === b.date ? num(b.createdAt) - num(a.createdAt) : (a.date < b.date ? 1 : -1));
}
function ctEntry(id) { return ct().entries.find((e) => e.id === id) || null; }
function ctOnDate(iso) { return ctAll().filter((e) => e.date === iso); }
function ctInMonth(y, m) { return ctAll().filter((e) => { const p = ctParts(e.date); return p.y === y && p.m === m; }); }
function ctMonthDays(y, m) {
  /* har din ka roll-up — mahine ka ledger */
  const dim = new Date(y, m + 1, 0).getDate();
  const byDay = {};
  ctInMonth(y, m).forEach((e) => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const out = [];
  for (let d = 1; d <= dim; d++) {
    const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const list = byDay[iso] || [];
    out.push({ iso: iso, d: d, day: DAYS[new Date(y, m, d).getDay()], list: list, t: ctTotals(list) });
  }
  return out;
}
function ctLast6(y, m) {
  const out = [];
  for (let i = 5; i >= 0; i--) {
    let mm = m - i, yy = y;
    while (mm < 0) { mm += 12; yy--; }
    const t = ctTotals(ctInMonth(yy, mm));
    out.push({ y: yy, m: mm, label: MONTHS_S[mm], t: t, now: i === 0 });
  }
  return out;
}
function ctFilteredEntries() {
  const u = ctUI();
  const q = String(u.q || "").trim().toLowerCase();
  let list = ctAll();
  const from = /^\d{4}-\d{2}-\d{2}$/.test(String(u.from || "")) ? u.from : "";
  const to = /^\d{4}-\d{2}-\d{2}$/.test(String(u.to || "")) ? u.to : "";
  if (from) list = list.filter((e) => e.date >= from);
  if (to) list = list.filter((e) => e.date <= to);
  if (!from && !to && u.scope !== "all") {
    list = list.filter((e) => { const p = ctParts(e.date); return p.y === UI.year && p.m === UI.month; });
  }
  if (u.kind !== "all") list = list.filter((e) => e.kind === u.kind);
  if (q) {
    list = list.filter((e) =>
      String(e.party || "").toLowerCase().indexOf(q) >= 0 ||
      String(e.billNo || "").toLowerCase().indexOf(q) >= 0 ||
      String(e.note || "").toLowerCase().indexOf(q) >= 0 ||
      String(ctAmount(e)).indexOf(q) >= 0 ||
      ctItemLabel(e).toLowerCase().indexOf(q) >= 0);
  }
  return list;
}
function ctItemAgg(list) {
  const map = new Map();
  (list || []).forEach((e) => {
    if (e.mode !== "itemized") return;
    (e.items || []).forEach((i) => {
      const nm = String(i.name || "").trim();
      if (!nm) return;
      const unit = String(i.unit || "kg");
      const key = nm.toLowerCase() + "|" + unit.toLowerCase();
      const cur = map.get(key) || { name: nm, unit: unit, qty: 0, amt: 0, n: 0, lastRate: 0, lastDate: "", kind: e.kind };
      cur.qty += num(i.qty);
      cur.amt += num(i.qty) * num(i.rate);
      cur.n += 1;
      if (!cur.lastDate || e.date >= cur.lastDate) { cur.lastDate = e.date; cur.lastRate = num(i.rate); }
      map.set(key, cur);
    });
  });
  const out = Array.from(map.values()).map((x) => ({
    name: x.name, unit: x.unit, kind: x.kind, n: x.n,
    qty: r2(x.qty), amt: r2(x.amt), lastRate: r2(x.lastRate), lastDate: x.lastDate,
    avgRate: x.qty ? r2(x.amt / x.qty) : 0
  }));
  out.sort((a, b) => b.amt - a.amt || a.name.localeCompare(b.name));
  return out;
}
function ctPartyAgg(list) {
  const map = new Map();
  (list || []).forEach((e) => {
    const nm = String(e.party || "").trim();
    if (!nm) return;
    const key = nm.toLowerCase();
    const cur = map.get(key) || { name: nm, amt: 0, paid: 0, bal: 0, n: 0, purchase: 0, sale: 0, expense: 0, last: "" };
    const a = ctAmount(e);
    cur.amt += a; cur.paid += Math.min(ctPaid(e), a); cur.bal += ctBalance(e); cur.n += 1;
    cur[e.kind] = (cur[e.kind] || 0) + a;
    if (!cur.last || e.date > cur.last) cur.last = e.date;
    map.set(key, cur);
  });
  const out = Array.from(map.values()).map((x) => ({
    name: x.name, n: x.n, last: x.last,
    amt: r2(x.amt), paid: r2(x.paid), bal: r2(x.bal),
    purchase: r2(x.purchase || 0), sale: r2(x.sale || 0), expense: r2(x.expense || 0)
  }));
  out.sort((a, b) => b.amt - a.amt || a.name.localeCompare(b.name));
  return out;
}
function ctBakiList(list) {
  return (list || ctAll()).filter((e) => ctBalance(e) > 0.005)
    .sort((a, b) => ctBalance(b) - ctBalance(a) || (a.date < b.date ? -1 : 1));
}
function ctParties() {
  const s = new Set();
  ct().entries.forEach((e) => { if (e.party) s.add(e.party); });
  return Array.from(s).sort();
}
/* signed money — 0 par koi sign nahi (warna "−₹0" ajeeb lagta hai) */
function ctSgn(v) { return (v < 0 ? "−" : v > 0 ? "+" : "") + money0(Math.abs(v)); }
function ctSgnS(v) { return (v < 0 ? "−" : v > 0 ? "+" : "") + moneyS(Math.abs(v)); }

/* ------------------------- 21e. RATE LIST ------------------------- */
function ctRateFor(name) {
  const nm = String(name || "").trim().toLowerCase();
  if (!nm) return null;
  return ct().rates.find((r) => String(r.name).trim().toLowerCase() === nm) || null;
}
/* itemized entry se rate list apne aap tazaa hoti hai (aakhri rate yaad rehta hai) */
function ctSyncRates(entry, ratesArr) {
  if (!entry || entry.mode !== "itemized") return;
  const rates = Array.isArray(ratesArr) ? ratesArr : ct().rates;
  (entry.items || []).forEach((i) => {
    const nm = String(i.name || "").trim();
    if (!nm || num(i.rate) <= 0) return;
    const hit = rates.find((r) => String(r.name).trim().toLowerCase() === nm.toLowerCase());
    if (hit) { hit.rate = r2(num(i.rate)); if (i.unit) hit.unit = i.unit; }
    else rates.push(normCtRate({ name: nm, unit: i.unit || "kg", rate: num(i.rate), cat: "" }));
  });
}
function ctLastRateInfo(name) {
  const nm = String(name || "").trim().toLowerCase();
  if (!nm) return null;
  let best = null;
  ctAll().forEach((e) => {
    if (e.mode !== "itemized") return;
    (e.items || []).forEach((i) => {
      if (String(i.name || "").trim().toLowerCase() !== nm || num(i.rate) <= 0) return;
      if (!best || e.date >= best.date) best = { rate: num(i.rate), date: e.date, unit: i.unit };
    });
  });
  return best;
}

function ctLogText(e) {

}

          "<th>Type</th><th>Party / saman</th><th>Bill</th><th>Mode</th>" +
          '<th class="num">Amount</th><th class="num">Paid</th><th class="num">Baki</th><th></th>' +
          "</tr></thead><tbody>" + entryRows + "</tbody>" +
          '<tfoot><tr><td colspan="4">Din ka total</td>' +
            '<td class="num">' + ctSgnS(t.net) + "</td>" +
            '<td class="num">' + moneyS(t.paid) + "</td>" +
            '<td class="num">' + (t.balance ? moneyS(t.balance) : "—") + "</td><td></td></tr></tfoot>" +
          "</table></div>"
        : ctEmpty("🍽", first ? "Is din koi entry nahi" : "Canteen ki pehli entry daalo",
            first ? ctPretty(iso) + " ke liye saman, bikri ya kharcha add karo." :
              "Saman aaya, bikri ya kharcha — jo bhi ho, ek entry se shuru karo.", "ctAdd", "＋ Entry add karo")) +
    "</div>";

  const totModeSum = r2(totalMode.reduce((s, e) => s + ctAmount(e), 0));
  const itemRows = items.map((i) =>
    "<tr><td>" + esc(i.name) + "</td>" +
    '<td class="num strong">' + num(i.qty) + "</td>" +
    '<td class="muted">' + esc(i.unit) + "</td>" +
    '<td class="num">' + (i.avgRate ? moneyS(i.avgRate) : "—") + "</td>" +
    '<td class="num">' + (i.lastRate && i.lastRate !== i.avgRate ? '<span class="muted" style="font-size:11px">aakhri ' + moneyS(i.lastRate) + "</span>" : "") + "</td>" +
    '<td class="num strong">' + moneyS(i.amt) + "</td>" +
    '<td class="num muted">' + i.n + "</td></tr>").join("");
  const itemCard =
    '<div class="card"><div class="card-h"><div><h3>Saman item-wise (rate ke saath)</h3>' +
      '<div class="sub">Sirf rate-wise entries ka item detail — qty × rate</div></div>' +
      '<span class="tag warn">' + moneyS(t.itemizedAmt) + "</span></div>" +
      (totModeSum > 0
        ? '<div class="banner" style="margin:12px 14px 0;background:var(--cyan-soft);border-color:color-mix(in srgb,var(--cyan) 26%,var(--line))">' +
          "<span>Σ</span><div><b>" + totalMode.length + " entry me sirf total likha hai</b> — item ka alag rate nahi. " +
          "Unka jod: <b>" + money0(totModeSum) + "</b>. Item-wise rate chahiye to entry khol kar “Rate-wise” mode me daalo.</div></div>"
        : "") +
      (items.length
        ? '<div class="twrap"><table class="tbl" style="min-width:520px"><thead><tr>' +
          "<th>Item</th>" + '<th class="num">Qty</th><th>Unit</th><th class="num">Avg rate</th><th class="num">Aakhri rate</th>' +
          '<th class="num">Amount</th><th class="num">Entries</th>' +
          "</tr></thead><tbody>" + itemRows + "</tbody>" +
          '<tfoot><tr><td colspan="5">Item-wise total</td><td class="num">' + moneyS(t.itemizedAmt) + "</td><td></td></tr></tfoot>" +
          "</table></div>"
        : '<div class="ct-emptyline">Is din koi rate-wise item nahi.</div>') +
    "</div>";

  const bakiCard = baki.length
    ? '<div class="card" style="margin-top:14px"><div class="card-h"><div><h3>Baki / udhaar — is din</h3>' +
      '<div class="sub">Jin entries ka paisa poora nahi diya</div></div><span class="tag bad">' + moneyS(t.balance) + "</span></div>" +
      '<div class="card-b" style="display:flex;flex-direction:column;gap:9px">' +
      baki.map((e) => '<div class="ct-bal"><span>' + ctKindOf(e).ico + "</span>" +
        "<div style=\"flex:1;min-width:120px\"><b>" + esc(e.party || "—") + "</b> · " + ctKindOf(e).label +
        ' <span class="muted">(' + moneyS(ctAmount(e)) + " me se " + moneyS(Math.min(ctPaid(e), ctAmount(e))) + " diya)</span></div>" +
        '<button class="btn xs primary" data-act="ctPay" data-id="' + e.id + '">₹ Paid likho</button></div>').join("") +
      "</div></div>"
    : "";

  return dateBar + kpis + strip + '<div class="grid g2">' + entriesCard + itemCard + "</div>" + bakiCard;
}

/* ============ MAHINE KA LEDGER ============ */
function ctMonthLedger() {
  const y = UI.year, m = UI.month;
  const list = ctInMonth(y, m);
  const t = ctTotals(list);
  const pm = m === 0 ? { y: y - 1, m: 11 } : { y: y, m: m - 1 };
  const pt = ctTotals(ctInMonth(pm.y, pm.m));
  const days = ctMonthDays(y, m);
  const active = days.filter((d) => d.list.length);
  const hist = ctLast6(y, m);
  const items = ctItemAgg(list);
  const parties = ctPartyAgg(list);
  const bakiAll = ctBakiList(ctAll());

  const kpis =
    '<div class="kpis">' +
      kpiCard({ label: "Saman aaya — " + MONTHS_S[m], value: money0(t.purchase), icon: "⬇", tone: "k-warn",
        delta: moneyDelta(t.purchase, pt.purchase), spark: hist.map((h) => h.t.purchase), sparkColor: "#f59e0b",
        sub: list.filter((e) => e.kind === "purchase").length + " entries · " + active.length + " din" }) +
      kpiCard({ label: "Bikri / income", value: money0(t.sale), icon: "⬆", tone: "k-ok",
        delta: moneyDelta(t.sale, pt.sale), spark: hist.map((h) => h.t.sale), sparkColor: "#10b981",
        sub: "canteen ki kamai" }) +
      kpiCard({ label: "Kharcha", value: money0(t.expense), icon: "↯", tone: "k-bad",
        delta: moneyDelta(t.expense, pt.expense), sub: "gas, bijli, mazdoori, misc" }) +
      kpiCard({ label: "Mahine ka net", value: (t.net < 0 ? "−" : "") + money0(Math.abs(t.net)), icon: "∑",
        tone: t.net >= 0 ? "k-cyan" : "k-bad", delta: moneyDelta(t.net, pt.net),
        sub: "Baki udhaar " + money0(t.balance) }) +
    "</div>";

  const maxBar = Math.max.apply(null, hist.map((h) => Math.max(h.t.purchase, h.t.sale))) || 1;
  const chartCard =
    '<div class="card chartcard"><div class="card-h"><div><h3>6 mahine ka trend</h3>' +
      '<div class="sub"><span style="color:#f59e0b;font-weight:800">▮</span> Saman &nbsp; <span style="color:#10b981;font-weight:800">▮</span> Bikri</div></div>' +
      '<span class="tag grey">' + monthLabel(y, m) + "</span></div>" +
      '<div class="card-b"><div class="chart">' +
        hist.map((h) => {
          const mx = Math.max(h.t.purchase, h.t.sale);
          const wrapH = Math.max(3, (mx / maxBar) * 100);
          const aH = mx ? Math.max(3, (h.t.purchase / mx) * 100) : 0;
          const bH = mx ? Math.max(3, (h.t.sale / mx) * 100) : 0;
          return '<div class="col' + (h.now ? " now" : "") + '" title="' + h.label + ": saman " + money0(h.t.purchase) + " · bikri " + money0(h.t.sale) + '">' +
            '<div class="val">' + money0(h.t.net) + "</div>" +
            '<div class="ct-2bar" style="height:' + wrapH + '%"><i class="a" style="height:' + aH + '%"></i><i class="b" style="height:' + bH + '%"></i></div>' +
            '<div class="cap">' + h.label + "</div></div>";
        }).join("") +
      "</div></div></div>";

  const donutCard =
    '<div class="card"><div class="card-h"><div><h3>Paisa kahan gaya</h3>' +
      '<div class="sub">' + monthLabel(y, m) + " ka breakdown</div></div></div>" +
      '<div class="card-b"><div class="donut-wrap">' +
        donutSVG([
          { label: "Saman", value: Math.max(0, t.purchase), color: "#f59e0b" },
          { label: "Kharcha", value: Math.max(0, t.expense), color: "#ef4444" },
          { label: "Bikri", value: Math.max(0, t.sale), color: "#10b981" }
        ], 132, { l: "NET", v: (t.net < 0 ? "−" : "") + money0(Math.abs(t.net)) }) +
        '<div class="donut-legend">' +
          '<div><span class="sw" style="background:#f59e0b"></span>Saman aaya<b>' + money0(t.purchase) + "</b></div>" +
          '<div><span class="sw" style="background:#ef4444"></span>Kharcha<b>' + money0(t.expense) + "</b></div>" +
          '<div><span class="sw" style="background:#10b981"></span>Bikri<b>' + money0(t.sale) + "</b></div>" +
          '<div><span class="sw" style="background:#6366f1"></span>Paid kiya<b>' + money0(t.paid) + "</b></div>" +
          '<div><span class="sw" style="background:#dc2626"></span>Baki / udhaar<b>' + money0(t.balance) + "</b></div>" +
        "</div></div>" +
        (t.totalModeCount ? '<div class="ct-note" style="margin-top:12px">Σ <b>' + t.totalModeCount + "</b> entry me item ka alag rate nahi — sirf ek-saath total (" +
          money0(t.totalModeAmt) + ").</div>" : "") +
      "</div></div>";

  const dayRows = active.map((d) =>
    '<tr class="clickable" data-act="ctOpenDay" data-date="' + d.iso + '">' +
      '<td style="white-space:nowrap"><b>' + String(d.d).padStart(2, "0") + " " + MONTHS_S[m] + "</b>" + (ctIsToday(d.iso) ? ' <span class="tag ok">aaj</span>' : "") + "</td>" +
      '<td class="muted" style="white-space:nowrap">' + esc(d.day.slice(0, 3)) + "</td>" +
      '<td class="num muted">' + d.list.length + "</td>" +
      '<td class="num">' + (d.t.purchase ? '<span style="color:var(--bad)">−' + moneyS(d.t.purchase) + "</span>" : "—") + "</td>" +
      '<td class="num">' + (d.t.sale ? '<span style="color:var(--ok)">+' + moneyS(d.t.sale) + "</span>" : "—") + "</td>" +
      '<td class="num">' + (d.t.expense ? '<span style="color:var(--bad)">−' + moneyS(d.t.expense) + "</span>" : "—") + "</td>" +
      '<td class="num strong" style="color:' + (d.t.net >= 0 ? "var(--ok)" : "var(--bad)") + '">' + ctSgnS(d.t.net) + "</td>" +
      '<td class="num muted">' + moneyS(d.t.paid) + "</td>" +
      '<td class="num">' + (d.t.balance > 0.005 ? '<b style="color:var(--bad)">' + moneyS(d.t.balance) + "</b>" : "—") + "</td></tr>").join("");

  const dayCard =
    '<div class="card" style="margin-top:14px"><div class="card-h"><div><h3>Din-wise ledger — ' + monthLabel(y, m) + "</h3>" +
      '<div class="sub">Kisi din par tap karo — us din ka poora ledger khul jayega</div></div>' +
      '<div class="toolbar"><button class="btn sm" data-act="ctPrintMonth">🖨 Print</button>' +
      '<button class="btn sm" data-act="ctCsv">⤓ CSV</button></div></div>' +
      (active.length
        ? '<div class="twrap"><table class="tbl" style="min-width:760px"><thead><tr>' +
          "<th>Date</th><th>Din</th>" + '<th class="num">Entries</th><th class="num">Saman</th><th class="num">Bikri</th>' +
          '<th class="num">Kharcha</th><th class="num">Net</th><th class="num">Paid</th><th class="num">Baki</th>' +
          "</tr></thead><tbody>" + dayRows + "</tbody>" +
          '<tfoot><tr><td colspan="2">Mahine ka total (' + active.length + " din)</td>" +
            '<td class="num">' + t.count + "</td>" +
            '<td class="num">−' + moneyS(t.purchase) + "</td>" +
            '<td class="num">+' + moneyS(t.sale) + "</td>" +
            '<td class="num">−' + moneyS(t.expense) + "</td>" +
            '<td class="num">' + ctSgnS(t.net) + "</td>" +
            '<td class="num">' + moneyS(t.paid) + "</td>" +
            '<td class="num">' + (t.balance ? moneyS(t.balance) : "—") + "</td></tr></tfoot></table></div>"
        : ctEmpty("🗓", "Is mahine koi canteen entry nahi", monthLabel(y, m) + " me saman, bikri ya kharcha add karo.", "ctAdd", "＋ Entry add karo")) +
    "</div>";

  const maxItem = items.length ? items[0].amt || 1 : 1;
  const itemCard =
    '<div class="card"><div class="card-h"><div><h3>Item-wise summary</h3>' +
      '<div class="sub">Rate-wise entries ke items · sabse zyada pehle</div></div>' +
      '<span class="tag warn">' + items.length + " items</span></div>" +
      (items.length
        ? '<div class="twrap"><table class="tbl" style="min-width:460px"><thead><tr>' +
          "<th>Item</th>" + '<th class="num">Qty</th><th class="num">Avg rate</th><th class="num">Amount</th><th></th>' +
          "</tr></thead><tbody>" +
          items.slice(0, 14).map((i) =>
            "<tr><td>" + esc(i.name) + ' <span class="muted" style="font-size:11px">' + esc(i.unit) + " · " + i.n + "×</span></td>" +
            '<td class="num strong">' + num(i.qty) + "</td>" +
            '<td class="num">' + moneyS(i.avgRate) + "</td>" +
            '<td class="num strong">' + moneyS(i.amt) + "</td>" +
            '<td style="width:60px"><div class="ct-hbar"><i style="width:' + Math.max(4, Math.round((i.amt / maxItem) * 100)) + '%"></i></div></td></tr>').join("") +
          "</tbody></table></div>" +
          (items.length > 14 ? '<div class="ct-emptyline">…aur ' + (items.length - 14) + " items. Poori list “Sab entries” → item search me.</div>" : "")
        : '<div class="ct-emptyline">Is mahine koi rate-wise item nahi. Entry karte waqt “Item-wise rate” chuno to yahan summary banegi.</div>') +
    "</div>";

  const partyCard =
    '<div class="card"><div class="card-h"><div><h3>Party / supplier-wise</h3>' +
      '<div class="sub">Kis se kitna saman aaya, kitna diya, kitna baki</div></div></div>' +
      (parties.length
        ? '<div class="twrap"><table class="tbl" style="min-width:460px"><thead><tr>' +
          "<th>Party</th>" + '<th class="num">Entries</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Baki</th>' +
          "</tr></thead><tbody>" +
          parties.slice(0, 12).map((p) =>
            "<tr><td>" + esc(p.name) + '<div class="ct-ilist">aakhri ' + esc(ctShort(p.last)) + "</div></td>" +
            '<td class="num muted">' + p.n + "</td>" +
            '<td class="num strong">' + moneyS(p.amt) + "</td>" +
            '<td class="num muted">' + moneyS(p.paid) + "</td>" +
            '<td class="num">' + (p.bal > 0.005 ? '<b style="color:var(--bad)">' + moneyS(p.bal) + "</b>" : '<span class="muted">—</span>') + "</td></tr>").join("") +
          "</tbody></table></div>"
        : '<div class="ct-emptyline">Koi party nahi likhi gayi.</div>') +
    "</div>";

  const bakiCard = bakiAll.length
    ? '<div class="card" style="margin-top:14px"><div class="card-h"><div><h3>Baki / udhaar — sab time ka</h3>' +
      '<div class="sub">Jin entries ka paisa abhi baki hai</div></div>' +
      '<span class="tag bad">' + money0(bakiAll.reduce((s, e) => s + ctBalance(e), 0)) + "</span></div>" +
      '<div class="twrap"><table class="tbl" style="min-width:560px"><thead><tr>' +
      "<th>Date</th><th>Party</th><th>Type</th>" + '<th class="num">Amount</th><th class="num">Paid</th><th class="num">Baki</th><th></th>' +
      "</tr></thead><tbody>" +
      bakiAll.slice(0, 25).map((e) =>
        '<tr class="clickable" data-act="ctEdit" data-id="' + e.id + '">' +
        '<td style="white-space:nowrap">' + esc(ctShort(e.date)) + "</td>" +
        "<td>" + esc(e.party || "—") + "</td>" +
        "<td>" + ctKindTag(e) + "</td>" +
        '<td class="num">' + moneyS(ctAmount(e)) + "</td>" +
        '<td class="num muted">' + moneyS(Math.min(ctPaid(e), ctAmount(e))) + "</td>" +
        '<td class="num strong" style="color:var(--bad)">' + moneyS(ctBalance(e)) + "</td>" +
        '<td><button class="btn xs primary" data-act="ctPay" data-id="' + e.id + '">₹ Paid</button></td></tr>').join("") +
      "</tbody></table></div>" +
      (bakiAll.length > 25 ? '<div class="ct-emptyline">…aur ' + (bakiAll.length - 25) + " entries.</div>" : "") +
      "</div>"
    : "";

  return kpis + '<div class="grid g2" style="margin-bottom:14px">' + chartCard + donutCard + "</div>" +
    dayCard + '<div class="grid g2" style="margin-top:14px">' + itemCard + partyCard + "</div>" + bakiCard;
}

      '<span class="tag ok">Bikri ' + money0(t.sale) + "</span>" +
      '<span class="tag bad">Kharcha ' + money0(t.expense) + "</span></div></div>" +

      ? '<div class="twrap"><table class="tbl" style="min-width:980px"><thead><tr>' +

        "</tr></thead><tbody>" + rows + "</tbody>" +

    "</div>";

/* ============ RATE LIST ============ */
function ctRatesView() {
  const rates = ct().rates.slice().sort((a, b) => a.name.localeCompare(b.name));
  const used = ctItemAgg(ctAll());
  const unitOpts = (sel) => CT_UNITS.map((u) => '<option value="' + u + '"' + (u === sel ? " selected" : "") + ">" + u + "</option>").join("");
  const rows = rates.map((r) => {
    const last = ctLastRateInfo(r.name);
    const agg = used.find((x) => x.name.toLowerCase() === r.name.toLowerCase());

/* ============ ACTIVITY ============ */
function ctActivityView() {
  const u = ctUI();
  const logs = ctLogs();
  const ICO = { add: ["＋", "add"], edit: ["✎", "edit"], delete: ["🗑", "delete"], payment: ["₹", "pay"], rate: ["🏷", "rate"], restore: ["↺", "add"] };
  const groups = [];
  const byDay = {};
  logs.forEach((l) => {
    const iso = isoDate(new Date(num(l.ts)));
    if (!byDay[iso]) { byDay[iso] = []; groups.push({ iso: iso, items: byDay[iso] }); }
    byDay[iso].push(l);
  });
  const head =
    '<div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:12px 15px">' +
      '<div class="ct-datebar">' +
        '<div class="seg">' +
          '<button data-act="ctLogScope" data-scope="month" class="' + (u.logScope === "month" ? "on" : "") + '">Is mahine ki activity</button>' +
          '<button data-act="ctLogScope" data-scope="all" class="' + (u.logScope === "all" ? "on" : "") + '">Poori activity</button>' +
        "</div>" +
        '<span class="tag grey">' + logs.length + " events</span>" +
        '<div class="toolbar" style="margin-left:auto">' +
          '<button class="btn sm" data-act="ctCsv">⤓ CSV</button>' +
          '<button class="btn sm primary" data-act="ctAdd">＋ Entry add karo</button>' +
        "</div>" +
      "</div></div></div>";

  if (!logs.length) {
    return head + '<div class="card">' + ctEmpty("🕘", "Koi activity nahi",
      "Jab bhi aap canteen me entry add, edit ya delete karoge, yahan poori history dikhegi.", "ctAdd", "＋ Entry add karo") + "</div>";
  }

  return head +
    '<div class="card"><div class="card-h"><div><h3>Poori activity log</h3>' +
      '<div class="sub">Har add / edit / delete / payment time ke saath · delete ko wapas la sakte ho</div></div>' +
      '<span class="tag grey">max ' + CT_LOG_MAX + " events</span></div>" +
      '<div class="card-b" style="padding:6px 18px 14px">' +
      groups.map((g) => {
        const daySum = { add: 0, edit: 0, del: 0, pay: 0 };
        g.items.forEach((l) => {
          if (l.action === "add") daySum.add++;
          else if (l.action === "edit") daySum.edit++;
          else if (l.action === "delete") daySum.del++;
          else if (l.action === "payment") daySum.pay++;
        });
        const bits = [];
        if (daySum.add) bits.push(daySum.add + " add");
        if (daySum.edit) bits.push(daySum.edit + " edit");
        if (daySum.del) bits.push(daySum.del + " delete");
        if (daySum.pay) bits.push(daySum.pay + " payment");
        return '<div class="ct-dayhead"><span>' + esc(ctPretty(g.iso)) + "</span>" +
            '<span class="muted">' + esc(ctDayName(g.iso).slice(0, 3)) + " · " + bits.join(" · ") + "</span>" +
            (ctIsToday(g.iso) ? '<span class="tag ok">aaj</span>' : "") +
            '<span class="rt muted">' + g.items.length + " events</span></div>" +
          g.items.map((l) => {
            const ic = ICO[l.action] || ["•", "edit"];
            const k = CT_KIND[l.kind];
            const amt = num(l.amount);
            const canRestore = l.action === "delete" && l.snapshot && !ctEntry(l.entryId);
            return '<div class="ct-act">' +
              '<span class="ai ' + ic[1] + '">' + ic[0] + "</span>" +
              '<div style="flex:1;min-width:0">' +
                '<div class="tx">' + esc(l.text || (k ? k.label : "Canteen")) + "</div>" +
                '<div class="tm">' + esc(ctTime(l.ts)) +
                  (l.date ? " · entry date " + esc(ctShort(l.date)) : "") +
                  " · " + esc(l.action === "delete" ? "deleted" : l.action === "payment" ? "payment" : l.action === "restore" ? "restored" : l.action) +
                "</div>" +
              "</div>" +
              (canRestore ? '<button class="btn xs" data-act="ctRestore" data-log="' + l.id + '" title="Wapas la do">↺ Restore</button>' : "") +
              '<span class="am" style="color:' + (l.action === "delete" ? "var(--bad)" : (k && k.sign > 0 ? "var(--ok)" : "var(--ink)")) + '">' +
                (amt ? ((k && k.sign > 0 && l.action !== "delete") ? "+" : "") + moneyS(amt) : "—") + "</span>" +
            "</div>";
          }).join("");
      }).join("") +
      "</div></div>";
}

/* ------------------------- 21i. ENTRY MODAL ------------------------- */
function ctDefaultDate() {
  const u = ctUI();
  if (u.tab === "day") return u.date;
  const nowIso = isoDate(new Date());
  const np = ctParts(nowIso);
  if (np.y === UI.year && np.m === UI.month) return nowIso;
  const dp = ctParts(u.date);
  if (dp.y === UI.year && dp.m === UI.month) return u.date;
  return monthFirst(UI.year, UI.month);
}
function ctBlankItem() { return { name: "", qty: 1, unit: "kg", rate: 0 }; }
function ctDraftAmount(d) {
  if (!d) return 0;
  if (d.mode === "total") return r2(Math.max(0, num(d.amount)));
  return r2((d.items || []).reduce((t, i) => t + num(i.qty) * num(i.rate), 0));
}

function openCtModal(id, dateOverride) {
  const existing = id ? ctEntry(id) : null;
  let d;
  if (existing) {
    d = JSON.parse(JSON.stringify(existing));
  } else {
    d = { id: "", date: dateOverride || ctDefaultDate(), kind: "purchase", mode: "itemized",
          items: [ctBlankItem()], amount: 0, party: "", billNo: "", paid: 0, payMode: "cash", note: "" };
  }
  if (!Array.isArray(d.items) || !d.items.length) d.items = [ctBlankItem()];
  d.items = d.items.map(normCtItem);
  if (!d.date) d.date = ctDefaultDate();
  ctUI().edit = d;
  ctRenderModal(!!existing);
}

        (isEdit ? " · entry " + esc(String(d.id).slice(0, 6)) : "") + "</p></div>" +

      '<div class="modal-b">' +
        '<div class="seg" id="ctKindSeg" style="width:100%;display:flex">' +
          CT_KINDS.map((kk) => '<button data-act="ctSetKind" data-kind="' + kk + '" class="' + (d.kind === kk ? "on" : "") +

        "</div>" +

        '<div class="grid g3" style="margin-top:13px">' +
          field("Date (kab)", '<input type="date" class="inp" id="ctDateM" value="' + esc(d.date) + '">') +
          field(d.kind === "sale" ? "Kahan se / counter" : "Party / supplier / dukaan",
            '<input class="inp" id="ctParty" list="ctPartyList" value="' + esc(d.party) + '" placeholder="' + (d.kind === "sale" ? "Canteen counter" : "Jaise: Sabzi Mandi, Gupta Kirana") + '">') +
          field("Bill / parcha no. (optional)", '<input class="inp" id="ctBill" value="' + esc(d.billNo) + '" placeholder="Jaise SM-204">') +
        "</div>" +

        "</div>" +

          field("Kaise", '<select class="inp" id="ctPayMode">' +

          field("Baki / udhaar", '<input class="inp" id="ctBal" value="' + moneyS(bal) + '" readonly style="background:var(--surface-2);font-weight:800">') +

      "</div>" +

        '<div class="left">' +
          (isEdit ? '<button class="btn danger" data-act="ctDel" data-id="' + d.id + '">🗑 Delete</button>' : "") +

      "</div>" +
    "</div>"
  );
  ctPatchTotals();
}

function ctKindHint(kind) {
  if (kind === "sale") return "Canteen ki kamai — chai, nashta, khana jo becha. Ye amount din ke ledger me + (plus) judta hai.";
  if (kind === "expense") return "Saman ke alawa ka kharcha — gas, bijli, mazdoori, barbaadi. Ye amount din ke ledger me − (minus) hota hai.";

function ctItemsWrapHTML() {
  const d = ctUI().edit;
  if (!d) return "";

  if (isTotal) {
    return '<div class="ct-lump">' +
        '<div class="l">Pura saman ka total (₹)' +
          "<small>Har item ka alag rate likhne ki zaroorat nahi — bill / parche ka ek saath total daalo</small></div>" +

    '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px">' +
