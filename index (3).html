<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab Pro — Worker Monthly Salary &amp; Hisaab Panel</title>
<style>
/* ================= BASE ================= */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#eef2f9; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e4eaf3;
  --primary:#4f46e5; --primary-d:#4338ca; --primary-l:#eef2ff;
  --ok:#059669; --ok-l:#ecfdf5; --warn:#d97706; --warn-l:#fffbeb; --danger:#dc2626; --danger-l:#fef2f2;
  --side:#0f172a; --side2:#1a2540;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.16);
  --shadow-lg:0 24px 60px -20px rgba(15,23,42,.35);
  --ff:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Devanagari",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
html,body{margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,h5{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--primary)}
::selection{background:#c7d2fe}

/* ================= LAYOUT ================= */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:linear-gradient(180deg,#0f172a,#16213c 60%,#0e1729);color:#cbd5e1;
  padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 4px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;
  font-size:21px;font-weight:800;color:#fff;box-shadow:0 8px 20px -8px #4f46e5}
.brand h1{font-size:16.5px;color:#fff;line-height:1.1}
.brand span{font-size:10.5px;color:#7d8db0;text-transform:uppercase;letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;
  color:#a9b6cf;font-weight:600;font-size:13.5px;text-align:left;transition:.16s}
.nav button .ico{width:19px;text-align:center;font-size:15px;opacity:.9}
.nav button:hover{background:#1c2947;color:#fff}
.nav button.active{background:linear-gradient(90deg,rgba(99,102,241,.28),rgba(99,102,241,.06));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(129,140,248,.35)}
.nav button.active .ico{color:#a5b4fc}
.side-foot{margin-top:auto;font-size:11px;color:#6f7f9f;padding:10px 8px;border-top:1px solid #22304e;line-height:1.6}
.side-foot b{color:#93a4c4;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:middle}

.main{flex:1;min-width:0;padding:18px 24px 48px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar h2{font-size:21px}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.topbar-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mp{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--shadow)}
.mp button{border:0;background:transparent;width:30px;height:30px;border-radius:8px;color:var(--ink2);font-size:15px;font-weight:700}
.mp button:hover{background:#eef2f9}
.mp select{border:0;background:transparent;font-weight:700;font-size:13.5px;padding:4px 2px;outline:none;cursor:pointer}
.mp .sep{width:1px;height:18px;background:var(--line)}

/* ================= COMPONENTS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-weight:650;font-size:13px;color:var(--ink2);transition:.15s;white-space:nowrap;box-shadow:0 1px 1px rgba(15,23,42,.03)}
.btn:hover{background:#f7f9fd;border-color:#cfd9e8;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,#5b53ea,#463ed6);border-color:#4338ca;color:#fff;box-shadow:0 6px 16px -8px #4f46e5}
.btn.primary:hover{background:linear-gradient(180deg,#655df0,#4c43e0);color:#fff}
.btn.ok{background:var(--ok);border-color:#047857;color:#fff}
.btn.ok:hover{background:#047857;color:#fff}
.btn.danger{background:#fff;border-color:#f3c5c5;color:var(--danger)}
.btn.danger:hover{background:var(--danger-l)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:#eaeff8;color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:11.5px;border-radius:7px;gap:4px}
.btn[disabled]{opacity:.5;pointer-events:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:14.5px}
.card-h .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.card-b{padding:16px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--primary),#22d3ee)}
.kpi.ok::after{background:linear-gradient(90deg,#059669,#34d399)}
.kpi.warn::after{background:linear-gradient(90deg,#d97706,#fbbf24)}
.kpi.danger::after{background:linear-gradient(90deg,#dc2626,#f87171)}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi .val.mono{font-family:var(--ff)}

/* tables */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;min-width:900px}
table.tbl.has-actions{min-width:1080px}
table.tbl.has-actions th:last-child,table.tbl.has-actions td:last-child{position:sticky;right:0;background:#fff;
  box-shadow:-10px 0 14px -12px rgba(15,23,42,.55);z-index:3;width:1%;white-space:nowrap;border-left:1px solid var(--line)}
table.tbl.has-actions thead th:last-child{background:#f7f9fd;z-index:4}
table.tbl.has-actions tbody tr:hover td:last-child{background:#fafbff}
table.tbl th{position:sticky;top:0;background:#f7f9fd;color:var(--muted);font-size:10.4px;text-transform:uppercase;letter-spacing:.06em;
  font-weight:750;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.tbl td{padding:8px 8px;border-bottom:1px solid #eef2f9;vertical-align:middle}
table.tbl tbody tr:hover{background:#fafbff}
table.tbl tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.strong{font-weight:750;color:var(--ink)}
.muted{color:var(--muted)}
.tfoot td{background:#f7f9fd;font-weight:800;border-top:2px solid var(--line);border-bottom:0}
td.w-name{min-width:150px}
.w-sub{display:flex;align-items:center;gap:5px;margin-top:2px}
.w-name b{display:block;font-size:13.2px;font-weight:700}
.w-name small{color:var(--muted);font-size:11px}
.cell-inp{width:52px;padding:5px 5px;border:1px solid #dbe3ef;border-radius:7px;text-align:right;font-weight:700;
  font-variant-numeric:tabular-nums;background:#fff;outline:none;transition:.12s}
.cell-inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
.cell-inp.bad{border-color:#f0a3a3;background:var(--danger-l)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.m{background:var(--primary-l);color:#4338ca}
.tag.h{background:#ecfeff;color:#0e7490}
.tag.ok{background:var(--ok-l);color:#047857}
.tag.warn{background:var(--warn-l);color:#b45309}
.tag.bad{background:var(--danger-l);color:#b91c1c}
.tag.grey{background:#f1f5f9;color:#475569}
.row-actions{display:flex;gap:3px;justify-content:flex-end}
.row-actions .btn.xs{padding:4px 6px;font-size:11px;line-height:1}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:.01em}
.field .hint{font-size:11px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border:1px solid #dbe3ef;border-radius:10px;background:#fff;outline:none;transition:.14s;font-size:13.5px}
.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.13)}
.inp.err{border-color:#f0a3a3;background:var(--danger-l)}
textarea.inp{resize:vertical;min-height:64px}
.inp-group{display:flex;gap:1px}
.seg{display:inline-flex;background:#eef2f9;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--primary-d);box-shadow:0 1px 3px rgba(15,23,42,.13)}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--primary)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(3px);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:860px;box-shadow:var(--shadow-lg);animation:pop .18s ease-out;margin:auto 0}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:18px 18px 0 0;z-index:5}
.modal-h h3{font-size:16px}
.modal-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.x{border:0;background:#f1f5f9;width:32px;height:32px;border-radius:9px;font-size:16px;color:var(--muted);display:grid;place-items:center;flex:0 0 32px}
.x:hover{background:#e2e8f0;color:var(--ink)}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#fbfcff;border-radius:0 0 18px 18px}
.sec-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:18px 0 9px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* hisaab summary in modal */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum-box{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum-box .hd{background:#f7f9fd;padding:8px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sum-line{display:flex;justify-content:space-between;padding:7px 12px;font-size:12.8px;border-top:1px solid #f1f5f9}
.sum-line span:first-child{color:var(--ink2)}
.sum-line b{font-variant-numeric:tabular-nums}
.sum-line.minus b{color:var(--danger)}
.sum-line.plus b{color:var(--ok)}
.netbox{margin-top:12px;border-radius:13px;padding:14px 16px;background:linear-gradient(120deg,#0f172a,#1e293b);color:#fff;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.netbox .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#93a4c4;font-weight:800}
.netbox .v{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.netbox.neg{background:linear-gradient(120deg,#7f1d1d,#b91c1c)}
.netbox.pos{background:linear-gradient(120deg,#064e3b,#047857)}
.words{font-size:11.5px;color:#c7d2e4;margin-top:2px}

/* advances list */
.adv-list{display:flex;flex-direction:column;gap:7px}
.adv-item{display:grid;grid-template-columns:110px 1fr 110px 32px;gap:8px;align-items:center}
.adv-item .inp{padding:7px 9px;font-size:12.5px}
@media(max-width:640px){.adv-item{grid-template-columns:1fr 1fr 32px}.adv-item .a-note{grid-column:1/-1}}

/* worker cards */
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.wcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);transition:.16s}
.wcard:hover{transform:translateY(-2px);box-shadow:0 18px 40px -22px rgba(15,23,42,.4)}
.wcard .top{display:flex;gap:11px;align-items:center}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;flex:0 0 42px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.avatar.b{background:linear-gradient(135deg,#0ea5e9,#22d3ee)}
.wcard .nm{font-weight:750;font-size:14.5px;line-height:1.2}
.wcard .rl{font-size:11.5px;color:var(--muted)}
.wcard .money{margin-top:12px;display:flex;gap:14px;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px}
.wcard .money div{font-size:11px;color:var(--muted)}
.wcard .money b{display:block;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.wcard .foot{display:flex;gap:6px;margin-top:12px}

/* empty state */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px;opacity:.45}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:4px}
.empty p{font-size:12.5px;margin:0 auto 14px;max-width:380px}

/* chart */
.card.chartcard{display:flex;flex-direction:column}
.card.chartcard .card-b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:10px}
.chart{display:flex;align-items:flex-end;gap:10px;height:100%;min-height:180px;padding:8px 2px 0}
.chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.chart .bar .col{width:100%;max-width:54px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#6366f1,#4f46e5);
  min-height:4px;transition:height .45s ease;position:relative}
.chart .bar.sel .col{background:linear-gradient(180deg,#22d3ee,#0891b2)}
.chart .bar .lb{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.chart .bar .vl{font-size:9.6px;color:var(--ink2);font-weight:750;white-space:nowrap;letter-spacing:-.02em}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;
  border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#065f46}.toast.bad{background:#991b1b}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:12.5px;margin-bottom:13px;border:1px solid}
.banner.warn{background:var(--warn-l);border-color:#fde68a;color:#92400e}
.banner.info{background:var(--primary-l);border-color:#c7d2fe;color:#3730a3}
.banner b{font-weight:800}

/* ================= PRINT / STATEMENT ================= */
#print-root{display:none}
.stmt{width:794px;margin:0 auto;background:#fff;color:#111827;padding:0;font-family:var(--ff)}
.stmt .pad{padding:34px 40px}
.stmt .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #0f172a;padding-bottom:14px}
.stmt .shop{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stmt .shop small{display:block;font-size:11.5px;font-weight:600;color:#4b5563;letter-spacing:.04em;margin-top:3px}
.stmt .rt{text-align:right;font-size:11.5px;color:#374151;line-height:1.6}
.stmt .rt .ttl{font-size:15px;font-weight:800;color:#0f172a;letter-spacing:.02em}
.stmt .rt .hi{font-size:11px;color:#6b7280}
.stmt .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin:18px 0 6px;font-size:12px}
.stmt .meta .r{display:flex;justify-content:space-between;border-bottom:1px dotted #d1d5db;padding:5px 0}
.stmt .meta .r span{color:#6b7280}
.stmt .meta .r b{color:#111827;font-weight:700}
.stmt h4.sec{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#0f172a;margin:20px 0 8px;border-bottom:1.5px solid #e5e7eb;padding-bottom:5px}
.stmt table{width:100%;border-collapse:collapse;font-size:12px}
.stmt th{background:#f3f4f6;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#374151;text-align:left;padding:7px 9px;border:1px solid #e5e7eb}
.stmt td{padding:7px 9px;border:1px solid #e5e7eb}
.stmt td.r, .stmt th.r{text-align:right;font-variant-numeric:tabular-nums}
.stmt .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stmt .net{display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:#fff;padding:13px 16px;border-radius:10px;margin-top:16px}
.stmt .net .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-weight:700}
.stmt .net .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stmt .inwords{margin-top:9px;font-size:11.5px;color:#374151;background:#f9fafb;border:1px dashed #d1d5db;padding:9px 12px;border-radius:8px}
.stmt .inwords b{color:#111827}
.stmt .sign{display:flex;justify-content:space-between;gap:30px;margin-top:52px;font-size:11px;color:#4b5563}
.stmt .sign div{border-top:1px solid #9ca3af;padding-top:6px;width:180px;text-align:center}
.stmt .ft{margin-top:26px;border-top:1px solid #e5e7eb;padding-top:9px;font-size:10px;color:#9ca3af;display:flex;justify-content:space-between}
.stmt .watermark{color:#10b981;font-weight:800;letter-spacing:.1em;font-size:11px;border:1.5px solid #10b981;padding:3px 9px;border-radius:5px;display:inline-block}

@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .app,.toast,.overlay{display:none !important}
  #print-root{display:block !important}
  .stmt{width:auto;box-shadow:none}
  .stmt .pad{padding:0}
}

@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{position:static;height:auto;width:100%;flex:none;padding:12px;flex-direction:row;align-items:center;gap:10px;overflow-x:auto}
  .brand{flex:0 0 auto}.brand span{display:none}
  .brand h1{font-size:14px}
  .nav{flex-direction:row;flex:0 0 auto}
  .nav button{padding:8px 11px;font-size:12.5px;white-space:nowrap}
  .nav button .ico{display:none}
  .side-foot{display:none}
  .main{padding:14px 13px 40px}
  .g3,.g2{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr}
}
/* --- compact hisaab table on phones: tap a row to open the full hisaab --- */
.mstat{display:none}
@media(max-width:700px){
  table.tbl.has-actions{min-width:0;width:100%}
  table.tbl.has-actions th:nth-child(n+4):nth-child(-n+9),
  table.tbl.has-actions td:nth-child(n+4):nth-child(-n+9),
  table.tbl.has-actions th:nth-child(11), table.tbl.has-actions td:nth-child(11),

<script>
/* ============================================================================
   HISAAB PRO — Worker Monthly Salary & Hisaab Panel
   Single-file app. Data is stored in this browser (localStorage).
   Salary rule: monthly salary is ALWAYS divided by 30 (fixed 30-day month).
   Sundays are auto-excluded from payable working days.
   ========================================================================== */
(function () {
"use strict";

/* ----------------------------- 1. UTILITIES ----------------------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function money(n, dec) {
  const d = dec === undefined ? 2 : dec;
  const v = isFinite(n) ? n : 0;
  return "₹" + v.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
}
const money0 = (n) => money(n, 0);
/* compact money for dense tables: no ".00" when the amount is a whole number */
const moneyS = (n) => (Math.abs((n || 0) - Math.round(n || 0)) < 0.005 ? money(n, 0) : money(n, 2));
const signed = (n) => (n < 0 ? "−" : "") + money(Math.abs(n));

/* Indian number-to-words (for salary statements) */
function inWords(amount) {
  let n = Math.round(Math.abs(amount) * 100) / 100;
  const paise = Math.round((n - Math.floor(n)) * 100);
  let whole = Math.floor(n);
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = (x) => (x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? " " + a[x % 10] : ""));
  const three = (x) => (x >= 100 ? a[Math.floor(x / 100)] + " Hundred" + (x % 100 ? " " + two(x % 100) : "") : two(x));
  let out = "";
  const crore = Math.floor(whole / 10000000); whole %= 10000000;
  const lakh  = Math.floor(whole / 100000);   whole %= 100000;
  const thou  = Math.floor(whole / 1000);     whole %= 1000;
  if (crore) out += three(crore) + " Crore ";
  if (lakh)  out += three(lakh) + " Lakh ";
  if (thou)  out += three(thou) + " Thousand ";
  if (whole) out += three(whole);
  out = out.trim() || "Zero";
  let s = "Rupees " + out;
  if (paise) s += " and " + two(paise) + " Paise";
  return s + " Only";
}

/* ------------------------- 2. MONTH / SUNDAY MATH ------------------------ */
/* Month meta: how many days, how many Sundays, working days = days - Sundays */
function monthMeta(year, month) {
  const dim = new Date(year, month + 1, 0).getDate();
  let sundays = 0;
  const list = [];
  for (let d = 1; d <= dim; d++) {
    if (new Date(year, month, d).getDay() === 0) { sundays++; list.push(d); }
  }
  return { dim, sundays, sundayDates: list, workingDays: dim - sundays };
}
const monthLabel = (y, m) => MONTHS[m] + " " + y;

/* ------------------------------- 3. STORE ------------------------------- */
const KEY = "hisaabPro.v1";

const DEFAULT_SETTINGS = {
  shopName: "Sharma Traders",
  ownerName: "Proprietor",
  address: "Shop No. 12, Main Market, Delhi",
  phone: "",
  hoursPerDay: 8,
  otMultiplier: 1.5,
  statementNote: "This is a computer-generated salary statement. Please verify all figures before payment.",
  paidLabel: "PAID"
};

function blankData() {
  return { settings: { ...DEFAULT_SETTINGS }, workers: [], records: [] };
}

function sampleData() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const pm = m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 };
  const workers = [
    { id: uid(), name: "Ramesh Kumar",  role: "Tailor / Master", phone: "98765 43210", type: "monthly", rate: 21000, active: true, note: "Full-time, 6 days a week" },
    { id: uid(), name: "Sunita Devi",   role: "Helper",          phone: "98111 22334", type: "monthly", rate: 13500, active: true, note: "" },
    { id: uid(), name: "Imran Ali",     role: "Machine Operator",phone: "99999 11223", type: "hourly",  rate: 95,    active: true, note: "₹95 per hour" },
    { id: uid(), name: "Pooja Sharma",  role: "Accountant",      phone: "90000 55667", type: "monthly", rate: 18500, active: true, note: "Part-time evenings" }
  ];
  const recs = [];
  const mk = (w, yy, mm, present, absent, adv, status, bonus) => {
    const meta = monthMeta(yy, mm);
    recs.push({
      id: uid(), workerId: w.id, year: yy, month: mm,
      presentDays: present, absentDays: absent, includeSundays: false,
      otHours: 0, otMultiplier: null, bonus: bonus || 0,
      advances: adv.map((a, i) => ({ id: uid(), date: yy + "-" + String(mm + 1).padStart(2, "0") + "-" + String(5 + i * 9).padStart(2, "0"), note: a.n, amount: a.amt })),
      deductions: [],
      note: "", status, paidOn: status === "paid" ? yy + "-" + String(mm + 1).padStart(2, "0") + "-" + String(meta.dim).padStart(2, "0") : "",
      updatedAt: Date.now()
    });
  };
  const meta = monthMeta(y, m);
  mk(workers[0], y, m, meta.workingDays - 1, 1, [{ n: "Festival advance", amt: 3000 }, { n: "Medical", amt: 1500 }], "pending");
  mk(workers[1], y, m, meta.workingDays - 2, 2, [{ n: "Cash advance", amt: 2000 }], "pending");
  mk(workers[2], y, m, meta.workingDays, 0, [], "paid");
  const pmeta = monthMeta(pm.y, pm.m);
  mk(workers[0], pm.y, pm.m, pmeta.workingDays, 0, [{ n: "Advance", amt: 2000 }], "paid");
  mk(workers[1], pm.y, pm.m, pmeta.workingDays - 3, 3, [], "paid");
  mk(workers[2], pm.y, pm.m, pmeta.workingDays - 1, 1, [], "paid");
  mk(workers[3], pm.y, pm.m, pmeta.workingDays, 0, [], "paid", 1000);
  return { settings: { ...DEFAULT_SETTINGS, demo: true }, workers, records: recs };
}

const Store = {
  data: blankData(),
  load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) { this.data = sampleData(); this.save(true); return; }
    try {
      const d = JSON.parse(raw);
      this.data = {
        settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) },
        workers: Array.isArray(d.workers) ? d.workers : [],
        records: Array.isArray(d.records) ? d.records : []
      };
    } catch (e) { this.data = blankData(); }
  },
  save(silent) {
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {
      if (!silent) toast("Could not save — browser storage full or blocked", "bad");
    }
    if (!silent) flashSaved();
    try { Cloud.schedulePush(); } catch (e) {}
  },
  workers() { return this.data.workers; },
  activeWorkers() { return this.data.workers.filter((w) => w.active !== false); },
  worker(id) { return this.data.workers.find((w) => w.id === id); },
  record(workerId, year, month) {
    return this.data.records.find((r) => r.workerId === workerId && r.year === year && r.month === month) || null;
  },
  ensureRecord(workerId, year, month, create) {
    let rec = this.record(workerId, year, month);
    if (rec) return rec;
    const w = this.worker(workerId);
    const meta = monthMeta(year, month);
    rec = {
      id: uid(), workerId, year, month,
      presentDays: meta.workingDays, absentDays: 0, includeSundays: false,
      otHours: 0, otMultiplier: null, bonus: 0, advances: [], deductions: [],
      note: "", status: "pending", paidOn: "", updatedAt: Date.now()
    };
    if (create) { this.data.records.push(rec); this.save(); }
    return rec;
  },
  persistRecord(rec) { rec.updatedAt = Date.now(); this.save(); }
};

/* ---------------------------- 4. CALCULATIONS --------------------------- */
/* Core salary engine. Every figure the panel shows comes from here. */
function calc(w, rec, settings) {
  const s = settings || Store.data.settings;
  const meta = monthMeta(rec.year, rec.month);
  const includeSundays = !!rec.includeSundays;
  const sundays = includeSundays ? 0 : meta.sundays;
  const workingDays = meta.dim - sundays;

  const present = clamp(num(rec.presentDays), 0, 999);
  const absentRaw = clamp(num(rec.absentDays), 0, 999);
  const rate = num(w.rate);
  const hoursPerDay = num(s.hoursPerDay) || 8;

  /* Per-day / per-hour rates — monthly salary divided by 30 ALWAYS */
  const perDay  = w.type === "monthly" ? rate / 30 : rate * hoursPerDay;
  const perHour = w.type === "monthly" ? (rate / 30) / hoursPerDay : rate;
  const monthlyEquivalent = w.type === "monthly" ? rate : perDay * 30;

  const earned = perDay * present;                                  /* wages for present days */
  const absentValue = perDay * absentRaw;                           /* value of unpaid absence (info) */
  const otHours = num(rec.otHours);
  const otMult = rec.otMultiplier == null || rec.otMultiplier === "" ? num(s.otMultiplier) || 1.5 : num(rec.otMultiplier);
  const otPay = perHour * otHours * otMult;
  const bonus = num(rec.bonus);

  const advances = (rec.advances || []).filter((a) => num(a.amount) !== 0 || (a.note || "").trim());
  const advTotal = advances.reduce((t, a) => t + num(a.amount), 0);
  const deductions = (rec.deductions || []).filter((d) => num(d.amount) !== 0 || (d.label || "").trim());
  const dedTotal = deductions.reduce((t, d) => t + num(d.amount), 0);

  const grossEarnings = earned + otPay + bonus;
  const totalDeductions = advTotal + dedTotal;
  const net = r2(grossEarnings - totalDeductions);

  return {
    meta, sundays, workingDays, includeSundays, present, absent: absentRaw,
    rate, hoursPerDay, perDay: r2(perDay), perHour: r2(perHour), monthlyEquivalent: r2(monthlyEquivalent),
    earned: r2(earned), absentValue: r2(absentValue), otHours, otMult, otPay: r2(otPay), bonus: r2(bonus),
    advances, deductions, advTotal: r2(advTotal), dedTotal: r2(dedTotal),
    grossEarnings: r2(grossEarnings), totalDeductions: r2(totalDeductions), net,
    overAttendance: present + absentRaw > workingDays,
    negative: net < 0
  };
}

function rowsForMonth(year, month) {
  return Store.activeWorkers().map((w) => {
    const rec = Store.ensureRecord(w.id, year, month, false);
    return { w, rec, c: calc(w, rec, Store.data.settings) };
  });
}

/* ------------------------------ 5. UI STATE ----------------------------- */
const today = new Date();
const UI = {
  view: "dashboard",
  year: today.getFullYear(),
  month: today.getMonth(),
  search: "",
  filter: "all",
  openRec: null
};
let saveTimer = null;

function toast(msg, kind) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast"; }, 2600);
}
function flashSaved() {
  clearTimeout(saveTimer);
  const el = $("#sideStats");
  if (el) el.innerHTML = '<span style="color:#34d399">✔ Saved just now</span>';
  saveTimer = setTimeout(updateSideStats, 2200);
}
function updateSideStats() {
  const el = $("#sideStats");
  if (!el) return;
  el.textContent = Store.activeWorkers().length + " active worker" + (Store.activeWorkers().length === 1 ? "" : "s") + " · " + Store.data.records.length + " records";
}

/* ------------------------------ 6. ROUTER ------------------------------- */
const VIEW_META = {
  dashboard: ["Dashboard", "Monthly overview of wages, advances & payments"],
  hisaab:    ["Monthly Hisaab", "Attendance, advances and final payable for every worker"],
  workers:   ["Workers", "Add, edit, search and manage your workforce"],
  records:   ["Records & History", "Month-wise salary records with payment status"],
  settings:  ["Settings", "Shop details, working hours and your data"]
};

function go(view) {
  UI.view = view;
  $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  const m = VIEW_META[view] || ["", ""];
  $("#viewTitle").textContent = m[0];
  $("#viewSub").textContent = m[1];
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const root = $("#viewRoot");
  if (UI.view === "dashboard") root.innerHTML = viewDashboard();
  else if (UI.view === "hisaab") root.innerHTML = viewHisaab();
  else if (UI.view === "workers") root.innerHTML = viewWorkers();
  else if (UI.view === "records") root.innerHTML = viewRecords();
  else if (UI.view === "settings") root.innerHTML = viewSettings();
  updateSideStats();
  syncMonthPickers();
}

function syncMonthPickers() {
  const ms = $("#selMonth"), ys = $("#selYear");
  if (!ms || !ys) return;
  if (ms.options.length !== 12) {
    ms.innerHTML = MONTHS.map((m, i) => '<option value="' + i + '">' + m + "</option>").join("");
  }
  ms.value = String(UI.month);
  const years = new Set([today.getFullYear() - 3, today.getFullYear() - 2, today.getFullYear() - 1, today.getFullYear(), today.getFullYear() + 1, today.getFullYear() + 2, UI.year]);
  Store.data.records.forEach((r) => years.add(r.year));
  const list = Array.from(years).sort((a, b) => a - b);
  ys.innerHTML = list.map((y) => '<option value="' + y + '">' + y + "</option>").join("");
  ys.value = String(UI.year);
}

/* ----------------------------- 7. DASHBOARD ----------------------------- */
function viewDashboard() {
  const rows = rowsForMonth(UI.year, UI.month);
  const active = Store.activeWorkers().length;
  let gross = 0, adv = 0, ded = 0, net = 0, paidNet = 0, pendNet = 0, present = 0, absent = 0, paidCount = 0;
  rows.forEach(({ rec, c }) => {
    gross += c.grossEarnings; adv += c.advTotal; ded += c.dedTotal; net += c.net;
    present += c.present; absent += c.absent;
    if (rec && rec.status === "paid") { paidNet += c.net; paidCount++; } else { pendNet += c.net; }
  });
  const meta = monthMeta(UI.year, UI.month);

  /* last 6 months payout chart */
  const bars = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(UI.year, UI.month - i, 1);
    const yy = d.getFullYear(), mm = d.getMonth();
    let tot = 0;
    Store.activeWorkers().forEach((w) => {
      const rec = Store.ensureRecord(w.id, yy, mm, false);
      tot += calc(w, rec, Store.data.settings).net;
    });
    bars.push({ y: yy, m: mm, tot, sel: yy === UI.year && mm === UI.month });
  }
  const maxBar = Math.max(1, ...bars.map((b) => b.tot));

  const demoBanner = Store.data.settings.demo
    ? '<div class="banner info" style="align-items:center"><span>👋</span><div style="flex:1"><b>Demo data loaded</b> so you can explore every feature. ' +
      "When you are ready, clear it and add your own workers and shop details.</div>" +
      '<div style="display:flex;gap:6px"><button class="btn sm" data-act="keepDemo">Keep exploring</button>' +
      '<button class="btn sm primary" data-act="clearDemo">Start fresh</button></div></div>'
    : "";

  return (
    demoBanner +
    '<div class="grid g4" style="margin-bottom:14px">' +
      kpi("Net Payable — " + MONTHS_S[UI.month], money0(net), active + " active workers · incl. advances deducted", "") +
      kpi("Gross Earnings", money0(gross), "Wages + OT + bonus", "ok") +
      kpi("Advances + Deductions", money0(adv + ded), "Advances " + money0(adv) + " · Other " + money0(ded), "warn") +
      kpi("Pending to Pay", money0(pendNet), (rows.length - paidCount) + " of " + rows.length + " workers unpaid" + (paidNet ? " · Paid " + money0(paidNet) : ""), pendNet > 0 ? "danger" : "ok") +
    "</div>" +

    '<div class="grid g2" style="margin-bottom:14px;grid-template-columns:1.55fr 1fr">' +
      '<div class="card chartcard"><div class="card-h"><div><h3>Payout trend</h3><div class="sub">Net salary for the last 6 months</div></div>' +
        '<span class="tag grey">' + monthLabel(UI.year, UI.month) + "</span></div>" +
        '<div class="card-b"><div class="chart">' +
          bars.map((b) => {
            const pct = Math.max(2, Math.round((b.tot / maxBar) * 100));
            return '<div class="bar' + (b.sel ? " sel" : "") + '"><div class="vl">' + (b.tot ? money0(b.tot) : "—") + '</div>' +
              '<div class="col" style="height:' + pct + '%" title="' + esc(MONTHS[b.m] + " " + b.y) + ": " + money(b.tot) + '"></div>' +
              '<div class="lb">' + MONTHS_S[b.m] + "</div></div>";
          }).join("") +
        "</div></div></div>" +

      '<div class="card"><div class="card-h"><h3>This month at a glance</h3></div><div class="card-b" style="padding-top:6px">' +
        glance("Days in month", meta.dim + " days", "") +
        glance("Sundays (auto-excluded)", meta.sundays + " Sundays", "Excluded from pay") +
        glance("Payable working days", meta.workingDays + " days", "Days − Sundays") +
        glance("Present days (all workers)", present + " days", "of " + (rows.length * meta.workingDays) + " possible") +
        glance("Absent days (all workers)", absent + " days", "") +
        glance("Salary base rule", "Monthly ÷ 30", "Fixed 30-day month, always") +
      "</div></div>" +
    "</div>" +

    '<div class="card"><div class="card-h"><div><h3>Worker-wise summary</h3><div class="sub">' + monthLabel(UI.year, UI.month) + " · click any row to open full hisaab</div></div>" +
      '<div style="display:flex;gap:7px"><button class="btn sm" data-act="gotoHisaab">Open Monthly Hisaab →</button></div></div>' +
      (rows.length ? dashboardTable(rows) : emptyState("No workers yet", "Add your first worker to start calculating salaries.", "addWorker", "+ Add Worker")) +
    "</div>" +

    (active === 0 ? "" : "")
  );
}

function kpi(label, val, hint, kind) {
  return '<div class="kpi ' + (kind || "") + '"><div class="lbl">' + esc(label) + '</div><div class="val">' + val + '</div><div class="hint">' + esc(hint) + "</div></div>";
}
function glance(l, v, sub) {
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9">' +
    '<div><div style="font-size:12.5px;font-weight:600;color:#334155">' + esc(l) + '</div>' +

}

function dashboardTable(rows) {
  let t = { net: 0, adv: 0, gross: 0 };
  const body = rows.map(({ w, rec, c }) => {
    t.net += c.net; t.adv += c.advTotal; t.gross += c.grossEarnings;

      '<td class="num">' + c.absent + "</td>" +
      '<td class="num muted">' + c.sundays + "</td>" +
      '<td class="num">' + money(c.perDay) + "</td>" +
      '<td class="num">' + money(c.grossEarnings) + "</td>" +

    '<td class="num">' + money(t.net) + "</td><td></td></tr></tfoot></table></div>";

function emptyState(title, msg, act, btn) {
  return '<div class="empty"><div class="big">₹</div><h4>' + esc(title) + "</h4><p>" + esc(msg) + "</p>" +

/* --------------------------- 8. MONTHLY HISAAB -------------------------- */
function viewHisaab() {
  const all = rowsForMonth(UI.year, UI.month);
  const q = UI.search.trim().toLowerCase();
  const rows = all.filter(({ w, rec, c }) => {
    if (q && !(w.name + " " + (w.role || "")).toLowerCase().includes(q)) return false;
    if (UI.filter === "pending" && rec && rec.status === "paid") return false;
    if (UI.filter === "paid" && (!rec || rec.status !== "paid")) return false;
    if (UI.filter === "advance" && !c.advTotal) return false;
    return true;
  });
  const meta = monthMeta(UI.year, UI.month);
  let gross = 0, adv = 0, ded = 0, net = 0;
  rows.forEach(({ c }) => { gross += c.grossEarnings; adv += c.advTotal; ded += c.dedTotal; net += c.net; });

  return (
    '<div class="banner info"><span>ℹ️</span><div><b>' + monthLabel(UI.year, UI.month) + ":</b> " + meta.dim + " days, <b>" + meta.sundays +
      " Sundays</b> auto-excluded → <b>" + meta.workingDays + " payable working days</b>. " +
      "Per-day rate = monthly salary ÷ <b>30</b> (fixed), per-hour = per-day ÷ " + num(Store.data.settings.hoursPerDay) + " hrs.</div></div>" +

    '<div class="card"><div class="card-h">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<input class="inp" id="hisaabSearch" placeholder="🔍 Search worker…" value="' + esc(UI.search) + '" style="width:210px;padding:8px 11px">' +
        '<select class="inp" id="hisaabFilter" style="width:auto;padding:8px 11px">' +
          ["all|All workers", "pending|Pending only", "paid|Paid only", "advance|With advances"].map((o) => {
            const [v, l] = o.split("|");
            return '<option value="' + v + '"' + (UI.filter === v ? " selected" : "") + ">" + l + "</option>";
          }).join("") +
        "</select>" +
      "</div>" +
      '<div style="display:flex;gap:7px;flex-wrap:wrap">' +
        '<button class="btn sm" data-act="autoFillAll" title="Set present days = working days for every worker this month">⚡ Auto-fill attendance</button>' +
        '<button class="btn sm" data-act="copyPrev" title="Copy attendance from previous month">⧉ Copy previous month</button>' +
        '<button class="btn sm" data-act="markAllPaid">✔ Mark all paid</button>' +
        '<button class="btn sm" data-act="printAll">🖨 Print all</button>' +
        '<button class="btn sm primary" data-act="pdfAll">⬇ Download all PDFs</button>' +
      "</div>" +
    "</div>" +
    (rows.length ? hisaabTable(rows, meta) : emptyState("No workers match", "Try a different search or add a new worker.", "addWorker", "+ Add Worker")) +
    (rows.length ? '<div class="card-b" style="border-top:1px solid var(--line);display:flex;gap:22px;flex-wrap:wrap;justify-content:flex-end;font-size:13px">' +
      '<div>Gross: <b id="sumGross">' + moneyS(gross) + "</b></div>" +
      '<div>Advances: <b id="sumAdv" style="color:#dc2626">' + (adv ? "−" + moneyS(adv) : moneyS(0)) + "</b></div>" +
      '<div>Other deductions: <b id="sumDed" style="color:#dc2626">' + (ded ? "−" + moneyS(ded) : moneyS(0)) + "</b></div>" +
      '<div style="font-size:15px">Net payable: <b id="sumNet" style="color:#4f46e5">' + moneyS(net) + "</b></div></div>" : "") +
    "</div>"
  );
}

      '<td class="num"><input class="cell-inp' + (c.overAttendance ? " bad" : "") + '" type="number" min="0" step="1" data-rid="' + rid + '" data-wid="' + w.id + '" data-f="absentDays" value="' + c.absent + '"></td>' +

      '<td class="num" data-cell="perDay">' + money(c.perDay) + "</td>" +
      '<td class="num" data-cell="gross">' + moneyS(c.grossEarnings) + "</td>" +
      '<td class="num" data-cell="adv" style="color:#dc2626">' + (c.advTotal ? "−" + moneyS(c.advTotal) : "—") + "</td>" +

        '<button class="btn xs" data-act="printRec" data-wid="' + w.id + '" title="Print statement">🖨</button>' +
        '<button class="btn xs" data-act="pdfRec" data-wid="' + w.id + '" title="Download PDF">⬇</button>' +
      "</div></td></tr>";
  }).join("");

  return '<div class="twrap"><table class="tbl has-actions"><thead><tr>' +
    "<th>Worker</th><th class=\"num\">Present</th><th class=\"num\">Absent</th><th class=\"num\">Sun</th><th class=\"num\">Work days</th>" +
    "<th class=\"num\">Per day</th><th class=\"num\">Gross</th><th class=\"num\">Advance</th><th class=\"num\">Other</th><th class=\"num\">Net payable</th><th>Status</th><th></th>" +

    '<div class="top"><div class="avatar' + (w.type === "hourly" ? " b" : "") + '">' + esc(inits) + "</div>" +

}

/* ---------------------------- 10. RECORDS VIEW -------------------------- */
function viewRecords() {
  const recs = Store.data.records.slice().sort((a, b) => (b.year - a.year) || (b.month - a.month));
  const q = UI.search.trim().toLowerCase();
  const filtered = recs.filter((r) => {
    const w = Store.worker(r.workerId);
    if (!w) return false;
    if (q && !(w.name + " " + (w.role || "")).toLowerCase().includes(q)) return false;
    if (UI.filter === "pending" && r.status === "paid") return false;
    if (UI.filter === "paid" && r.status !== "paid") return false;
    return true;
  });
  const groups = {};
  filtered.forEach((r) => {
    const k = r.year + "-" + String(r.month).padStart(2, "0");
    (groups[k] = groups[k] || []).push(r);
  });
  const keys = Object.keys(groups).sort().reverse();

  return (
    '<div class="card" style="margin-bottom:14px"><div class="card-b" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<input class="inp" id="recordSearch" placeholder="🔍 Search worker…" value="' + esc(UI.search) + '" style="flex:1;min-width:200px;max-width:340px">' +
      '<select class="inp" id="recordFilter" style="width:auto">' +
        ["all|All records", "pending|Pending only", "paid|Paid only"].map((o) => { const [v, l] = o.split("|"); return '<option value="' + v + '"' + (UI.filter === v ? " selected" : "") + ">" + l + "</option>"; }).join("") +
      "</select><div style=\"flex:1\"></div>" +
      '<button class="btn sm" data-act="exportData">⤓ Backup JSON</button>' +
    "</div></div>" +
    (keys.length ? keys.map((k) => {
      const [y, m] = k.split("-").map(Number);
      const list = groups[k];
      let net = 0, paid = 0, cntPaid = 0;
      const rows = list.map((rec) => {
        const w = Store.worker(rec.workerId);
        const c = calc(w, rec, Store.data.settings);
        net += c.net; if (rec.status === "paid") { paid += c.net; cntPaid++; }
        return '<tr><td class="w-name"><b>' + esc(w.name) + "</b><small>" + esc(w.role || "—") + "</small></td>" +
          '<td><span class="tag ' + (w.type === "monthly" ? "m" : "h") + '">' + (w.type === "monthly" ? "Monthly" : "Hourly") + "</span></td>" +
          '<td class="num">' + c.present + " / " + c.workingDays + "</td>" +
          '<td class="num">' + money(c.grossEarnings) + "</td>" +
          '<td class="num" style="color:#dc2626">' + (c.totalDeductions ? "−" + money(c.totalDeductions) : "—") + "</td>" +
          '<td class="num strong">' + money(c.net) + "</td>" +
          "<td>" + statusTag(rec) + "</td>" +
          '<td><div class="row-actions">' +
            '<button class="btn xs" data-act="openRecAt" data-wid="' + w.id + '" data-y="' + rec.year + '" data-m="' + rec.month + '">✎</button>' +
            '<button class="btn xs" data-act="printRecAt" data-wid="' + w.id + '" data-y="' + rec.year + '" data-m="' + rec.month + '">🖨</button>' +
            '<button class="btn xs" data-act="pdfRecAt" data-wid="' + w.id + '" data-y="' + rec.year + '" data-m="' + rec.month + '">⬇</button>' +
          "</div></td></tr>";
      }).join("");
      return '<div class="card" style="margin-bottom:14px">' +
        '<div class="card-h"><div><h3>' + monthLabel(y, m) + '</h3><div class="sub">' + list.length + " worker records · " + cntPaid + " paid · " + (list.length - cntPaid) + " pending</div></div>" +
          '<div style="text-align:right"><div style="font-size:11px;color:var(--muted);font-weight:700">NET TOTAL</div>' +
          '<div style="font-weight:800;font-size:16px">' + money(net) + "</div></div></div>" +
        '<div class="twrap"><table class="tbl" style="min-width:760px"><thead><tr><th>Worker</th><th>Type</th><th class="num">Present/Work</th>' +
        '<th class="num">Gross</th><th class="num">Deductions</th><th class="num">Net</th><th>Status</th><th></th></tr></thead><tbody>' +
        rows + "</tbody></table></div></div>";
    }).join("")
    : emptyState("No records yet", "Open the Monthly Hisaab tab, set attendance and advances — records appear here automatically.", "gotoHisaab", "Go to Monthly Hisaab"))
  );
}

/* ------------------------ 12. MODALS & DIALOGS -------------------------- */
function openModal(html, opts) {
  const root = $("#modalRoot");
  root.innerHTML = '<div class="overlay" id="overlay">' + html + "</div>";
  const ov = $("#overlay");
  ov.addEventListener("mousedown", (e) => { if (e.target === ov && !(opts && opts.sticky)) closeModal(); });
  document.body.style.overflow = "hidden";
}
function closeModal() {
  $("#modalRoot").innerHTML = "";
  document.body.style.overflow = "";
  UI.openRec = null;
}
function confirmDialog(title, msg, okLabel, onOk, danger) {
  openModal(
    '<div class="modal" style="max-width:430px"><div class="modal-h"><div><h3>' + esc(title) + '</h3></div>' +
      '<button class="x" data-act="closeModal">✕</button></div>' +
      '<div class="modal-b" style="font-size:13px;color:#475569">' + msg + "</div>" +
      '<div class="modal-f" style="justify-content:flex-end">' +
      '<button class="btn" data-act="closeModal">Cancel</button>' +
      '<button class="btn ' + (danger ? "danger" : "primary") + '" id="cfmOk">' + esc(okLabel) + "</button></div></div>"
  );
  $("#cfmOk").addEventListener("click", () => { closeModal(); onOk(); });
}

        "</div>" +

          field("Phone (optional)", '<input class="inp" id="wPhone" value="' + esc(d.phone || "") + '" placeholder="98765 43210">') +
          '<div class="field"><label>Salary type</label><div class="seg" id="typeSeg">' +
            '<button type="button" data-type="monthly" class="' + (d.type === "monthly" ? "on" : "") + '">Monthly salary</button>' +
            '<button type="button" data-type="hourly" class="' + (d.type === "hourly" ? "on" : "") + '">Hourly wage</button>' +
          "</div></div>" +
        "</div>" +
        '<div style="margin-top:12px">' +
          field(d.type === "monthly" ? "Monthly salary (₹)" : "Hourly wage (₹)",
            '<input class="inp" type="number" id="wRate" min="0" step="0.01" value="' + (d.rate === "" || d.rate == null ? "" : d.rate) + '" placeholder="0">',
            "", "rateLbl") +
          '<div class="hint" id="rateHint" style="margin-top:5px"></div>' +
        "</div>" +
        '<div style="margin-top:12px">' + field("Note (optional)", '<input class="inp" id="wNote" value="' + esc(d.note || "") + '" placeholder="e.g. works 6 days a week">') + "</div>" +
        '<label class="chk" style="margin-top:14px"><input type="checkbox" id="wActive" ' + (d.active !== false ? "checked" : "") + "> Active worker (include in hisaab &amp; dashboard)</label>" +
      "</div>" +
      '<div class="modal-f" style="justify-content:flex-end">' +
        '<button class="btn" data-act="closeModal">Cancel</button>' +
        '<button class="btn primary" id="wSave">' + (isEdit ? "Save changes" : "Add worker") + "</button>" +
      "</div></div>"
  );
  let type = d.type;
  const paint = () => {
    $$("#typeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.type === type));
    $("#rateLbl").textContent = type === "monthly" ? "Monthly salary (₹)" : "Hourly wage (₹)";
    const r = num($("#wRate").value), h = num(Store.data.settings.hoursPerDay) || 8;
    $("#rateHint").innerHTML = type === "monthly"
      ? "Per day = " + money(r / 30) + " (salary ÷ 30) · Per hour = " + money((r / 30) / h) + " (" + h + " hrs/day)"
      : "Per day = " + money(r * h) + " (" + h + " hrs × " + money(r) + ") · 30-day equivalent = " + money(r * h * 30);
  };
  $$("#typeSeg button").forEach((b) => b.addEventListener("click", () => { type = b.dataset.type; paint(); }));
  $("#wRate").addEventListener("input", paint);
  paint();
  $("#wSave").addEventListener("click", () => {
    const name = $("#wName").value.trim();
    const rate = num($("#wRate").value);
    if (!name) { $("#wName").classList.add("err"); $("#wName").focus(); toast("Please enter the worker's name", "bad"); return; }
    if (rate <= 0) { $("#wRate").classList.add("err"); $("#wRate").focus(); toast("Please enter a valid salary rate", "bad"); return; }
    const payload = { name, role: $("#wRole").value.trim(), phone: $("#wPhone").value.trim(), type, rate, active: $("#wActive").checked, note: $("#wNote").value.trim() };
    if (isEdit) { Object.assign(w, payload); toast("Worker updated"); }
    else { Store.data.workers.push({ id: uid(), ...payload }); toast("Worker added — hisaab ready"); }
    Store.save(); closeModal(); render();
  });
  setTimeout(() => { const n = $("#wName"); if (n) n.focus(); }, 60);
}

/* ----------------------------- RECORD MODAL ----------------------------- */

function syncStatusUI() {
  const rec = currentModalRec();
  if (!rec) return;
  if (rec.status === "paid" && !rec.paidOn) {
    const d = new Date();
    rec.paidOn = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const el = $("#mPaidOn"); if (el) el.value = rec.paidOn;
    Store.persistRecord(rec);
  }
}

function currentModalRec() {
  if (!UI.openRec) return null;
  return Store.record(UI.openRec.wid, UI.openRec.y, UI.openRec.m);
}

function commitModal() {
  const st = UI.openRec;
  if (!st || !document.getElementById("mPresent")) return;
  const rec = Store.record(st.wid, st.y, st.m);
  if (!rec) return;
  const meta = monthMeta(st.y, st.m);
  const includeSun = $("#mIncludeSun").checked;
  const wd = includeSun ? meta.dim : meta.workingDays;
  rec.includeSundays = includeSun;
  rec.presentDays = clamp(Math.round(num($("#mPresent").value)), 0, wd);
  rec.absentDays = clamp(Math.round(num($("#mAbsent").value)), 0, wd);
  if (rec.presentDays + rec.absentDays > wd) rec.absentDays = Math.max(0, wd - rec.presentDays);
  rec.otHours = Math.max(0, num($("#mOT").value));
  rec.otMultiplier = $("#mOTMult").value === "" ? null : num($("#mOTMult").value);
  rec.bonus = Math.max(0, num($("#mBonus").value));
  rec.note = $("#mNote").value;
  rec.status = $("#mStatus").value;
  rec.paidOn = $("#mPaidOn").value;
  $("#advList") && (rec.advances = $$("#advList .adv-row").map((row) => ({
    id: row.dataset.id, date: $(".a-date", row).value, note: $(".a-note", row).value, amount: num($(".a-amt", row).value)
  })));
  $("#dedList") && (rec.deductions = $$("#dedList .ded-row").map((row) => ({
    id: row.dataset.id, label: $(".d-label", row).value, amount: num($(".d-amt", row).value)
  })));
  Store.persistRecord(rec);
}

function refreshRecModal() {
  const st = UI.openRec;
  if (!st) return;
  const w = Store.worker(st.wid), rec = currentModalRec();
  if (!w || !rec) return;
  const c = calc(w, rec, Store.data.settings);

  const set = (sel, val) => { const el = $(sel); if (el) el.innerHTML = val; };
  set('[data-live="advTotal"]', money(c.advTotal));
  set('[data-live="dedTotal"]', money(c.dedTotal));
  set('[data-live="perDay"]', money(c.perDay));
  set('[data-live="perHour"]', money(c.perHour));
  set('[data-live="earned"]', money(c.earned));
  set('[data-live="sunDates"]', c.includeSundays ? "Counting Sundays as working" : "Excluded · " + c.meta.sundayDates.slice(0, 8).join(", ") + (c.meta.sundayDates.length > 8 ? "…" : ""));
  set('[data-live="wdHint"]', c.meta.dim + " days − " + c.sundays + " Sundays");
  set('[data-live="perDayBasis"]', w.type === "monthly" ? money0(c.rate) + " ÷ 30 (fixed)" : money0(c.rate) + " × " + c.hoursPerDay + " hrs");
  set('[data-live="perHourBasis"]', w.type === "monthly" ? money(c.perDay) + " ÷ " + c.hoursPerDay + " hrs" : "Hourly wage");
  set('[data-live="earnedBasis"]', c.present + " days × " + money(c.perDay));

  const sunEl = $("#mSundays"); if (sunEl) sunEl.value = c.sundays;
  const wdEl = $("#mWorkDays"); if (wdEl) wdEl.value = c.workingDays;

  const warn = $("#attWarn");
  if (warn) {
    if (c.overAttendance) warn.innerHTML = '<div class="banner warn" style="margin-top:10px;margin-bottom:0"><span>⚠️</span><div>Present + absent (' + (c.present + c.absent) + ") is more than the " + c.workingDays + " payable working days. Attendance has been auto-adjusted.</div></div>";
    else if (c.present + c.absent < c.workingDays) warn.innerHTML = '<div class="banner info" style="margin-top:10px;margin-bottom:0"><span>ℹ️</span><div>' + (c.workingDays - c.present - c.absent) + " working day(s) not accounted for — they will <b>not</b> be paid. Increase present days if the worker was on duty.</div></div>";
    else warn.innerHTML = "";
  }

  const earn = $("#sumEarn"), ded = $("#sumDed");
  if (earn) earn.innerHTML =
    line("Earned wages (" + c.present + " days)", money(c.earned), "plus") +
    (c.otPay ? line("Overtime (" + c.otHours + " hrs × " + c.otMult + "×)", money(c.otPay), "plus") : "") +
    (c.bonus ? line("Bonus / allowance", money(c.bonus), "plus") : "") +
    line("<b>Gross earnings</b>", "<b>" + money(c.grossEarnings) + "</b>") +
    line("Per-day rate (÷30)", money(c.perDay)) +
    (c.absent ? line("Unpaid absent days (" + c.absent + ")", "−" + money(c.absentValue), "minus") : "");
  if (ded) ded.innerHTML =
    line("Advances (" + c.advances.length + ")", c.advTotal ? "−" + money(c.advTotal) : money(0), c.advTotal ? "minus" : "") +
    line("Other deductions (" + c.deductions.length + ")", c.dedTotal ? "−" + money(c.dedTotal) : money(0), c.dedTotal ? "minus" : "") +
    line("<b>Total deductions</b>", "<b>−" + money(c.totalDeductions) + "</b>") +
    line("Net payable", "<b style='color:#4f46e5'>" + money(c.net) + "</b>");

  const nb = $("#netBox");
  if (nb) nb.innerHTML =
    '<div class="netbox ' + (c.negative ? "neg" : "pos") + '">' +
      "<div><div class=\"l\">" + (c.negative ? "ADVANCES EXCEED EARNINGS" : "FINAL PAYABLE — " + MONTHS[st.m].toUpperCase() + " " + st.y) + "</div>" +
      '<div class="words">' + esc(inWords(c.net)) + "</div></div>" +
      '<div class="v">' + money(c.net) + "</div></div>";

  const stSel = $("#mStatus");
  if (stSel) stSel.value = rec.status;
}

function line(label, value, cls) {
  return '<div class="sum-line ' + (cls || "") + '"><span>' + label + "</span><b>" + value + "</b></div>";
}

function renderAdvDedLists() {
  const rec = currentModalRec();
  if (!rec) return;
  const al = $("#advList");
  if (al) {
    al.innerHTML = (rec.advances || []).map((a) =>
      '<div class="adv-item adv-row" data-id="' + a.id + '">' +
        '<input class="inp a-date" type="date" value="' + esc(a.date || "") + '">' +
        '<input class="inp a-note" placeholder="Note (festival advance…)" value="' + esc(a.note || "") + '">' +
        '<input class="inp a-amt" type="number" min="0" step="1" placeholder="Amount" value="' + (num(a.amount) || "") + '">' +
        '<button class="x" data-act="delAdv" data-id="' + a.id + '" style="width:30px;height:30px;font-size:13px" title="Remove">✕</button>' +
      "</div>").join("") ||
      '<div style="font-size:12px;color:var(--muted);padding:8px 0">No advances this month. Use “+ Add advance” to record one.</div>';
  }
  const dl = $("#dedList");
  if (dl) {
    dl.innerHTML = (rec.deductions || []).map((d) =>
      '<div class="adv-item ded-row" data-id="' + d.id + '" style="grid-template-columns:1fr 110px 32px">' +
        '<input class="inp d-label" placeholder="Reason (food, fine, uniform…)" value="' + esc(d.label || "") + '">' +
        '<input class="inp d-amt" type="number" min="0" step="1" placeholder="Amount" value="' + (num(d.amount) || "") + '">' +
        '<button class="x" data-act="delDed" data-id="' + d.id + '" style="width:30px;height:30px;font-size:13px" title="Remove">✕</button>' +
      "</div>").join("") ||
      '<div style="font-size:12px;color:var(--muted);padding:8px 0">No other deductions.</div>';
  }
}

function renderPrevMonths(wid, y, m) {
  const el = $("#prevMonths");
  if (!el) return;
  const prev = Store.data.records.filter((r) => r.workerId === wid && (r.year < y || (r.year === y && r.month < m)))
    .sort((a, b) => (b.year - a.year) || (b.month - a.month)).slice(0, 3);
  if (!prev.length) { el.innerHTML = ""; return; }
  el.innerHTML = '<div class="sec-title">Previous months</div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
    prev.map((r) => {
      const w = Store.worker(wid); const c = calc(w, r, Store.data.settings);
      return '<div style="flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px">' +
        '<div style="font-size:11px;color:var(--muted);font-weight:700">' + MONTHS_S[r.month] + " " + r.year + "</div>" +
        '<div style="font-weight:800">' + money(c.net) + "</div>" +
        '<div style="font-size:11px">' + (r.status === "paid" ? "✔ Paid" : "● Pending") + " · " + c.present + "/" + c.workingDays + " days" + "</div>" +
        "</div>";
    }).join("") + "</div>";
}

/* ---------------------------- 13. PRINT VIEW ---------------------------- */

  const s = Store.data.settings;
  const advRows = c.advances.concat(c.deductions.map((d) => ({ date: "", note: d.label, amount: d.amount, _ded: true })));
  return '<div class="stmt"><div class="pad">' +
    '<div class="hd"><div><div class="shop">' + esc(s.shopName || "My Shop") + "<small>" + esc(s.address || "") + (s.phone ? " · " + esc(s.phone) : "") + "</small></div></div>" +
      '<div class="rt"><div class="ttl">SALARY STATEMENT</div><div class="hi">मासिक वेतन विवरण</div>' +

      "<div>" + (rec.status === "paid" ? '<span class="watermark">' + esc(s.paidLabel || "PAID") + "</span>" : "PENDING") + "</div></div></div>" +

      mRow("Worker", w.name) + mRow("Role", w.role || "—") + mRow("Phone", w.phone || "—") +

      mRow("Salary type", w.type === "monthly" ? "Monthly salary" : "Hourly wage") +

    "</div></div>" +

    '<h4 class="sec">Attendance</h4>' +
    '<table><thead><tr><th>Days in month</th><th>Sundays excluded</th><th>Working days</th><th>Present</th><th>Absent</th><th class="r">Paid leave</th></tr></thead>' +

/* A tiny PDF writer — no libraries, no internet needed. */
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];

function toAscii(str) {
  const map = { "₹": "Rs.", "–": "-", "—": "-", "’": "'", "‘": "'", "“": '"', "”": '"', "•": "-", "…": "...", "≤": "<=", "≥": ">=", "✔": "v", "✕": "x", "✖": "x", "→": "->", "×": "x", "÷": "/", "−": "-", "⚡": "*", "⧉": "|", "°": " deg", "\n": " " };
  let out = "";
  for (const ch of String(str == null ? "" : str)) {
    if (map[ch] !== undefined) out += map[ch];
    else if (ch.charCodeAt(0) < 128) out += ch;
    else if (ch.charCodeAt(0) < 256) out += ch;
    else out += "?";
  }
  return out;
}
function pdfEsc(s) { return toAscii(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }
function pdfWidth(str, size, bold) {
  const s = toAscii(str);
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    const code = s.charCodeAt(i);
    w += (code >= 32 && code <= 126) ? HELV_W[code - 32] : 556;
  }
  return (w * size) / 1000 * (bold ? 1.045 : 1);
}

function PdfDoc() { this.pages = []; this.cur = null; this.newPage(); }
PdfDoc.prototype.newPage = function () { this.cur = []; this.pages.push(this.cur); this.y = 800; return this; };
PdfDoc.prototype.op = function (s) { this.cur.push(s); };
PdfDoc.prototype.text = function (x, y, size, str, opt) {
  opt = opt || {};
  const bold = !!opt.bold;
  const col = opt.color || [0.06, 0.09, 0.16];
  let xx = x;
  if (opt.align === "right") xx = x - pdfWidth(str, size, bold);
  else if (opt.align === "center") xx = x - pdfWidth(str, size, bold) / 2;
  this.op("BT /" + (bold ? "F2" : "F1") + " " + size + " Tf " + col[0] + " " + col[1] + " " + col[2] + " rg 1 0 0 1 " + xx.toFixed(2) + " " + y.toFixed(2) + " Tm (" + pdfEsc(str) + ") Tj ET");
  return this;
};
PdfDoc.prototype.line = function (x1, y1, x2, y2, color, w) {
  const c = color || [0.85, 0.87, 0.9];
  this.op((w || 0.7) + " w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x1.toFixed(2) + " " + y1.toFixed(2) + " m " + x2.toFixed(2) + " " + y2.toFixed(2) + " l S");
  return this;
};
PdfDoc.prototype.rect = function (x, y, w, h, color) {
  const c = color || [0.96, 0.97, 0.99];
  this.op(c[0] + " " + c[1] + " " + c[2] + " rg " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re f");
  return this;
};
PdfDoc.prototype.box = function (x, y, w, h, stroke, fill) {
  if (fill) this.rect(x, y, w, h, fill);
  const c = stroke || [0.87, 0.89, 0.92];
  this.op("0.7 w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re S");
  return this;
};
PdfDoc.prototype.wrap = function (str, size, maxW, bold) {
  const words = toAscii(str).split(/\s+/);
  const lines = []; let cur = "";
  words.forEach((word) => {
    const test = cur ? cur + " " + word : word;
    if (pdfWidth(test, size, bold) > maxW && cur) { lines.push(cur); cur = word; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
};
PdfDoc.prototype.build = function () {
  const objs = [];
  objs.push("<< /Type /Catalog /Pages 2 0 R >>");
  objs.push(""); // pages placeholder
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const kids = [];
  this.pages.forEach((ops) => {
    const body = ops.join("\n");
    const cid = objs.length + 1;
    objs.push("<< /Length " + body.length + " >>\nstream\n" + body + "\nendstream");
    const pid = objs.length + 1;
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + cid + " 0 R >>");
    kids.push(pid);
  });
  objs[1] = "<< /Type /Pages /Kids [" + kids.map((k) => k + " 0 R").join(" ") + "] /Count " + kids.length + " >>";
  let out = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((body, i) => { offsets.push(out.length); out += (i + 1) + " 0 obj\n" + body + "\nendobj\n"; });
  const xref = out.length;
  out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
  offsets.forEach((o) => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
  out += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  return out;
};

const C = { ink: [0.06, 0.09, 0.16], muted: [0.42, 0.45, 0.5], line: [0.85, 0.87, 0.9], light: [0.96, 0.97, 0.99], primary: [0.31, 0.27, 0.9], dark: [0.06, 0.09, 0.16], white: [1, 1, 1], green: [0.02, 0.6, 0.4], red: [0.78, 0.13, 0.13], hdr: [0.95, 0.96, 0.98] };
const PW = 595.28, M = 40, CW = PW - M * 2, RIGHT = PW - M;

function pdfHeader(p, title, year, month, d) {
  p.text(M, 800, 16, d.shopName || "My Shop", { bold: true, color: C.ink });
  let yy = 786;
  p.wrap(toAscii(d.address || ""), 8.5, 300).forEach((l) => { p.text(M, yy, 8.5, l, { color: C.muted }); yy -= 10.5; });
  if (d.phone) { p.text(M, yy, 8.5, "Phone: " + d.phone, { color: C.muted }); yy -= 10.5; }
  p.text(RIGHT, 800, 12, title, { bold: true, align: "right", color: C.ink });
  p.text(RIGHT, 787, 8.5, "Masik Vetan Vivaran", { align: "right", color: C.muted });
  p.text(RIGHT, 776, 9, monthLabel(year, month), { align: "right", color: C.ink, bold: true });
  p.line(M, 764, RIGHT, 764, C.ink, 1.6);
  p.y = 748;
}

function pdfKV(p, x, y, w, k, v) {
  p.text(x, y, 7.8, k.toUpperCase(), { color: C.muted, bold: true });
  p.text(x + w, y, 9, v, { align: "right", color: C.ink, bold: true });
  p.line(x, y - 4, x + w, y - 4, [0.92, 0.93, 0.95], 0.5);
}

function pdfSectionTitle(p, text) {
  if (p.y < 120) { p.newPage(); }
  p.y -= 14;
  p.text(M, p.y, 8.2, text.toUpperCase(), { bold: true, color: C.primary });
  p.y -= 4.5;
  p.line(M, p.y, RIGHT, p.y, C.line, 0.8);
  p.y -= 13;
}

function pdfTableHeader(p, cols) {
  const h = 15;
  p.rect(M, p.y - h + 3, CW, h, C.hdr);
  cols.forEach((c) => {
    if (c.align === "right") p.text(M + c.x + c.w, p.y - 5, 7.6, c.t.toUpperCase(), { align: "right", color: C.muted, bold: true });
    else p.text(M + c.x, p.y - 5, 7.6, c.t.toUpperCase(), { color: C.muted, bold: true });
  });
  p.y -= h;
  p.line(M, p.y + 3, RIGHT, p.y + 3, C.line, 0.7);
}

function pdfRow(p, cols, vals, opt) {
  opt = opt || {};
  if (p.y < 90) {
    p.newPage();
    pdfTableHeader(p, cols);
  }
  const h = 14.5;
  if (opt.bg) p.rect(M, p.y - h + 2.5, CW, h, opt.bg);
  cols.forEach((c, i) => {
    const v = vals[i] == null ? "" : String(vals[i]);
    const bold = opt.bold || (c.bold && true);
    if (c.wrap) {
      const lines = p.wrap(v, 8.6, c.w);
      lines.slice(0, 2).forEach((l, li) => p.text(M + c.x, p.y - 5 - li * 10, 8.6, l, { color: opt.color || C.ink, bold: bold }));
    } else if (c.align === "right") p.text(M + c.x + c.w, p.y - 5, 8.8, v, { align: "right", color: opt.color || C.ink, bold: bold });
    else p.text(M + c.x, p.y - 5, 8.8, v, { color: opt.color || C.ink, bold: bold });
  });
  p.y -= h;
  p.line(M, p.y + 2.5, RIGHT, p.y + 2.5, [0.92, 0.93, 0.95], 0.5);
}

function savePdf(filename, str) {
  try {
    /* write as raw Latin-1 bytes so the xref offsets stay exact */
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const blob = new Blob([bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast("PDF downloaded: " + filename, "ok");
  } catch (e) { toast("Could not create PDF — open the file in a browser tab and retry", "bad"); }
}
function safeName(s) { return String(s || "worker").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, ""); }

/* ------------------ 18. CLOUD LOGIN & SYNC (Supabase) ------------------- */
const CLOUD_KEY = "hisaabPro.cloud.v1";
const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}

const Cloud = {
  cfg: null, client: null, user: null, mode: "in",
  status: "local", lastSync: 0, dirty: false, busy: false, pushTimer: null, blocked: false,

  readCfg() {
    try { const r = localStorage.getItem(CLOUD_KEY); this.cfg = r ? JSON.parse(r) : null; }
    catch (e) { this.cfg = null; }
    return this.cfg;
  },
  writeCfg(c) {
    this.cfg = c;
    try { if (c) localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); else localStorage.removeItem(CLOUD_KEY); } catch (e) {}
  },
  configured() { return !!(this.cfg && this.cfg.url && this.cfg.key); },

  async initClient() {
    if (this.client) return this.client;
    if (!window.supabase) await loadScriptOnce(SUPABASE_CDN);
    if (!window.supabase) throw new Error("Supabase library load failed");
    this.client = window.supabase.createClient(this.cfg.url, this.cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
    return this.client;
  },

  async boot() {
    this.readCfg();
    if (!this.configured()) { this.status = "local"; updateCloudBadge(); return; }
    try {
      await this.initClient();
      const res = await this.client.auth.getSession();
      const session = res && res.data ? res.data.session : null;
      this.user = session ? session.user : null;
      if (this.user) {
        this.status = "synced"; showLogin(false);
        await this.maybePull(true);
      } else { this.status = "loggedout"; showLogin(true); }
    } catch (e) {
      this.status = "error"; showLogin(true);
    }
    updateCloudBadge();
  },

  setStatus(s, msg) { this.status = s; updateCloudBadge(msg); },

  async signIn(email, password) {
    await this.initClient();
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    this.user = data.user;
    await this.afterLogin();
  },

  async signUp(email, password) {
    await this.initClient();
    const { data, error } = await this.client.auth.signUp({ email, password });
    if (error) throw error;
    if (!data.session) return { needsConfirm: true };
    this.user = data.user;
    await this.afterLogin();
    return { needsConfirm: false };
  },

  async signOut() {
    try { if (this.client) await this.client.auth.signOut(); } catch (e) {}
    this.user = null; this.status = "loggedout";
    showLogin(true); render();
  },

  async fetchRemote() {
    if (!this.user) return null;
    const { data, error } = await this.client.from("hisaab_data").select("payload,updated_at").eq("user_id", this.user.id).maybeSingle();
    if (error) throw error;
    return data || null;
  },

  schedulePush() {
    if (!this.user) return;
    this.dirty = true;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.pushNow(), 1200);
  },

  async pushNow() {
    if (!this.user || this.busy) return;
    this.busy = true; this.setStatus("saving");
    try {
      const payload = JSON.parse(JSON.stringify(Store.data));
      delete payload.settings.demo;
      const { error } = await this.client.from("hisaab_data")
        .upsert({ user_id: this.user.id, payload: payload, updated_at: new Date().toISOString() });
      if (error) throw error;
      this.dirty = false; this.lastSync = Date.now(); this.setStatus("synced");
    } catch (e) {
      this.setStatus("offline");
    }
    this.busy = false;
  },

  async afterLogin() {
    showLogin(false);
    this.setStatus("synced");
    try {
      const remote = await this.fetchRemote();
      const remoteHas = remote && remote.payload && Array.isArray(remote.payload.workers) && remote.payload.workers.length > 0;
      const localHas = Store.data.workers.length > 0 && Store.data.settings.demo !== true;
      if (remoteHas && localHas && JSON.stringify(remote.payload) !== JSON.stringify(Store.data)) {
        askWhichData(remote);
      } else if (remoteHas && !localHas) {
        adoptRemote(remote);
        toast("Cloud ka data load ho gaya ✔", "ok");
      } else {
        await this.pushNow();
        toast("Data cloud par save ho gaya ✔", "ok");
      }
    } catch (e) {
      toast("Cloud se connect nahi ho paya — internet check karein", "bad");
      this.setStatus("offline");
    }
    render();
  },

  /* pull newer data made on another device */
  async maybePull(force) {
    if (!this.user || this.dirty || this.busy) return;
    if ($("#overlay")) return; /* skip while a dialog is open */
    try {
      const remote = await this.fetchRemote();
      if (!remote || !remote.payload) return;
      const stamp = new Date(remote.updated_at).getTime();
      const remoteHas = Array.isArray(remote.payload.workers);
      if (!remoteHas) return;
      if (stamp > this.lastSync + 1500) {
        if (force || !this.dirty) {
          Store.data = normalizeData(remote.payload);
          Store.save(true);
          this.lastSync = stamp;
          render();
          toast("Doosre device ka naya data aa gaya ✔", "ok");
        }
      } else if (!this.lastSync) { this.lastSync = stamp; }
    } catch (e) { /* silent */ }
  }
};

function normalizeData(d) {
  return {
    settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) },
    workers: Array.isArray(d.workers) ? d.workers : [],
    records: Array.isArray(d.records) ? d.records : []
  };
}
function adoptRemote(remote) {
  Store.data = normalizeData(remote.payload);
  Store.save(true);
  Cloud.lastSync = new Date(remote.updated_at).getTime();
  closeModal(); render();
}
function askWhichData(remote) {
  Cloud._pending = remote;
  const remoteCount = (remote.payload.workers || []).length;
  openModal(

          '<b style="color:var(--ink)">Cloud par:</b> ' + remoteCount + " workers<br>" +
          '<span style="font-size:11.5px">Last update: ' + esc(String(remote.updated_at).slice(0, 16).replace("T", " ")) + "</span></div>" +
        '<div style="border:1px solid var(--line);border-radius:11px;padding:11px 13px">' +
          '<b style="color:var(--ink)">Is device par:</b> ' + Store.data.workers.length + " workers</div>" +
        '<p style="margin-top:12px;font-size:12px">Agar aap pehli baar login kar rahe hain, to <b>“Is device ka data upload”</b> chunein. ' +
        "Baaki device par kaam kiya hai to <b>“Cloud ka data download”</b> chunein.</p>" +

        '<button class="btn primary" data-act="useLocal">⤒ Is device ka data upload</button>' +
      "</div></div>"
  );
}

function showLogin(show) {
  const root = $("#loginRoot");
  if (!root) return;
  Cloud.blocked = !!show;
  if (!show) { root.innerHTML = ""; document.body.style.overflow = ""; return; }
  root.innerHTML = loginScreenHTML();
  document.body.style.overflow = "hidden";
  const go = $("#lcGo");
  if (go) go.addEventListener("click", submitLogin);
  const pass = $("#lcPass");
  if (pass) pass.addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });
  const em = $("#lcEmail");
  if (em) setTimeout(() => em.focus(), 80);

  const el = $("#lcMsg");
  if (el) el.innerHTML = '<div class="banner warn" style="margin-bottom:11px"><span>⚠️</span><div style="font-size:12.5px">' + msg + "</div></div>";
}

async function submitLogin() {
  const email = ($("#lcEmail") ? $("#lcEmail").value : "").trim();
  const pass = $("#lcPass") ? $("#lcPass").value : "";
  if (!email || email.indexOf("@") < 1) { lcError("Sahi email address likhein."); return; }
  if (!pass || pass.length < 6) { lcError("Password kam se kam 6 characters ka hona chahiye."); return; }
  const btn = $("#lcGo");
  if (btn) { btn.disabled = true; btn.textContent = "Please wait…"; }
  try {
    if (Cloud.mode === "up") {
      const r = await Cloud.signUp(email, pass);
      if (r && r.needsConfirm) {
        const el = $("#lcMsg");
        if (el) el.innerHTML = '<div class="banner info" style="margin-bottom:11px"><span>📧</span><div style="font-size:12.5px">' +
          "Account ban gaya! Ab apne email par aaya <b>confirmation link</b> kholkar verify karein, phir yahan <b>Sign in</b> karein.</div></div>";
        Cloud.mode = "in"; showLogin(true);
        return;
      }
    } else {
      await Cloud.signIn(email, pass);
    }
    showLogin(false); render();
    toast("Login ho gaya ✔", "ok");
  } catch (e) {
    const m = (e && e.message ? e.message : "").toLowerCase();
    let msg = "Login nahi ho paya. Internet aur details check karein.";
    if (m.indexOf("invalid login") >= 0) msg = "Email ya password galat hai.";
    else if (m.indexOf("already registered") >= 0) msg = "Ye email pehle se registered hai — <b>Sign in</b> karein.";
    else if (m.indexOf("email not confirmed") >= 0) msg = "Pehle email par aaya confirmation link kholkar verify karein.";
    else if (m.indexOf("failed to fetch") >= 0 || m.indexOf("network") >= 0) msg = "Internet ya Supabase URL/key galat hai.";
    lcError(msg + '<div style="font-size:11px;margin-top:5px;opacity:.8">' + esc(e && e.message ? e.message : "") + "</div>");
    if (btn) { btn.disabled = false; btn.textContent = Cloud.mode === "up" ? "Create account & login" : "Sign in"; }
  }
}
