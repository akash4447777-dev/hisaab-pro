/* ------------------------- 14. PDF ENGINE (offline) --------------------- */
/* Offline PDF writer: genuine Segoe UI Regular/Bold/Black document subsets.
   Font outlines/metrics match the supplied Windows-Chrome reference PDF.
   Font data stays inside the standalone HTML; see PDF-FONTS.md for notices. */
const PDF_FONT_DATA = JSON.parse(document.getElementById("hisaab-pdf-fonts").textContent);
const PDF_FONT_KEYS = ["regular", "bold", "black"];
const PDF_FONT_HEX = {};
const PDF_UNICODE_BYTES = {};
PDF_FONT_DATA.codepoints.forEach((cp, i) => { if (cp) PDF_UNICODE_BYTES[cp] = i + 32; });
(function pdfInstallPrintFonts() {
  const style = document.createElement("style");
  style.id = "hisaab-document-fonts";
  style.textContent = PDF_FONT_KEYS.map((key) => {
    const font = PDF_FONT_DATA[key];
    return '@font-face{font-family:"Hisaab Segoe";font-style:normal;font-weight:' + font.weight +
      ';font-display:block;src:url(data:font/ttf;base64,' + font.data + ') format("truetype")}';
  }).join("") + '.stmt{font-family:"Hisaab Segoe","Segoe UI",sans-serif}';
  document.head.appendChild(style);
})();
/* Historical name retained: this encodes document bytes, NOT an ASCII fallback.
   0x80 = rupee, 0x81 = minus; other printable bytes follow WinAnsi.
   Unsupported symbols are dropped, never replaced by ? or a missing-glyph box. */
function toAscii(str) {
  const aliases = { "•": "-", "…": "...", "≤": "<=", "≥": ">=", "✔": "v", "✕": "x", "✖": "x",
    "→": "->", "×": "x", "÷": "/", "⚡": "*", "⧉": "|", "°": " deg", "\n": " ", "\r": " ", "\t": " " };
  let out = "";
  for (const ch of String(str == null ? "" : str)) {
    const code = ch.codePointAt(0);
    if (aliases[ch] !== undefined) out += aliases[ch];
    else if (code >= 32 && code < 256) out += ch; // encoded strings are idempotent
    else if (PDF_UNICODE_BYTES[code] !== undefined) out += String.fromCharCode(PDF_UNICODE_BYTES[code]);
  }
  return out;
}
function pdfEsc(s) { return toAscii(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }
function pdfFontKey(weight) { return weight === "black" ? "black" : weight === true || weight === "bold" ? "bold" : "regular"; }
function pdfWidth(str, size, weight) {
  const s = toAscii(str), font = PDF_FONT_DATA[pdfFontKey(weight)];
  let w = 0;
  for (let i = 0; i < s.length; i++) w += font.widths[s.charCodeAt(i) - 32] || 0;
  return w * size / 1000;
}
function pdfPrintWhenReady() {
  const ready = document.fonts && document.fonts.load
    ? Promise.all([400, 700, 900].map((w) => document.fonts.load(w + ' 12px "Hisaab Segoe"')))
    : Promise.resolve();
  ready.then(() => window.print()).catch(() => toast("Print font load nahi hua — dobara try karo", "bad"));
}

function PdfDoc() { this.pages = []; this.cur = null; this.newPage(); }
PdfDoc.prototype.newPage = function () { this.cur = []; this.pages.push(this.cur); this.y = 800; return this; };
PdfDoc.prototype.op = function (s) { this.cur.push(s); };
PdfDoc.prototype.text = function (x, y, size, str, opt) {
  opt = opt || {};
  const weight = opt.black ? "black" : opt.bold ? "bold" : "regular";
  const fontId = weight === "black" ? "F3" : weight === "bold" ? "F2" : "F1";
  const col = opt.color || [0.06, 0.09, 0.16];
  const text = toAscii(str), spacing = opt.charSpace || 0;
  let width = pdfWidth(text, size, weight) + Math.max(0, text.length - 1) * spacing;
  if (opt.maxWidth && width > opt.maxWidth) {
    size *= Math.max(0.01, opt.maxWidth - Math.max(0, text.length - 1) * spacing) / Math.max(0.01, pdfWidth(text, size, weight));
    width = pdfWidth(text, size, weight) + Math.max(0, text.length - 1) * spacing;
  }
  let xx = x;
  if (opt.align === "right") xx = x - width;
  else if (opt.align === "center") xx = x - width / 2;
  this.op("BT /" + fontId + " " + size + " Tf " + spacing + " Tc " + col[0] + " " + col[1] + " " + col[2] +
    " rg 1 0 0 1 " + xx.toFixed(2) + " " + y.toFixed(2) + " Tm (" + pdfEsc(text) + ") Tj ET");
  return this;
};
PdfDoc.prototype.line = function (x1, y1, x2, y2, color, w) {
  const c = color || [0.85, 0.87, 0.9];
  this.op((w || 0.7) + " w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x1.toFixed(2) + " " + y1.toFixed(2) + " m " + x2.toFixed(2) + " " + y2.toFixed(2) + " l S");
  return this;
};
PdfDoc.prototype.rect = function (x, y, w, h, color) {
  const c = color || [0.96, 0.97, 0.99];
  this.op(c[0] + " " + c[1] + " " + c[2] + " rg " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re f");
  return this;
};
PdfDoc.prototype.box = function (x, y, w, h, stroke, fill) {
  if (fill) this.rect(x, y, w, h, fill);
  const c = stroke || [0.87, 0.89, 0.92];
  this.op("0.7 w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re S");
  return this;
};
/* Rounded dashed border: q/Q keeps dash/colour state out of later tables. */
PdfDoc.prototype.roundBox = function (x, y, w, h, r, stroke, fill) {
  const k = r * 0.55228475, n = (v) => v.toFixed(2);
  const col = (c) => c.join(" ");
  this.op("q 0.65 w [2.25 1.5] 0 d " + col(stroke) + " RG " + col(fill || [1, 1, 1]) + " rg");
  this.op([n(x + r), n(y), "m", n(x + w - r), n(y), "l",
    n(x + w - r + k), n(y), n(x + w), n(y + r - k), n(x + w), n(y + r), "c",
    n(x + w), n(y + h - r), "l", n(x + w), n(y + h - r + k), n(x + w - r + k), n(y + h), n(x + w - r), n(y + h), "c",
    n(x + r), n(y + h), "l", n(x + r - k), n(y + h), n(x), n(y + h - r + k), n(x), n(y + h - r), "c",
    n(x), n(y + r), "l", n(x), n(y + r - k), n(x + r - k), n(y), n(x + r), n(y), "c h B Q"].join(" "));
  return this;
};
PdfDoc.prototype.wrap = function (str, size, maxW, bold) {
  const words = toAscii(str).split(/\s+/).filter(Boolean), lines = [];
  let cur = "";
  words.forEach((word) => {
    const test = cur ? cur + " " + word : word;
    if (pdfWidth(test, size, bold) <= maxW) { cur = test; return; }
    if (cur) { lines.push(cur); cur = ""; }
    for (const ch of word) {
      if (cur && pdfWidth(cur + ch, size, bold) > maxW) { lines.push(cur); cur = ""; }
      cur += ch;
    }
  });
  if (cur) lines.push(cur);
  return lines;
};
PdfDoc.prototype.build = function () {
  const objs = ["<< /Type /Catalog /Pages 2 0 R >>", ""];
  const add = (body) => { objs.push(body); return objs.length; };
  const stream = (body, attr) => "<< /Length " + body.length + (attr ? " " + attr : "") + " >>\nstream\n" + body + "\nendstream";
  const unicode = PDF_FONT_DATA.codepoints.map((cp, i) => cp ?
    "<" + (i + 32).toString(16).padStart(2, "0") + "> <" + cp.toString(16).padStart(4, "0") + ">" : "").filter(Boolean);
  let cmap = "/CIDInit /ProcSet findresource begin 12 dict begin begincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n" +
    "/CMapName /HisaabDocumentUnicode def /CMapType 2 def\n1 begincodespacerange\n<00> <ff>\nendcodespacerange\n";
  for (let i = 0; i < unicode.length; i += 100) {
    const chunk = unicode.slice(i, i + 100);
    cmap += chunk.length + " beginbfchar\n" + chunk.join("\n") + "\nendbfchar\n";
  }
  cmap += "endcmap CMapName currentdict /CMap defineresource pop end end";
  const unicodeId = add(stream(cmap)), fontIds = [];
  PDF_FONT_KEYS.forEach((key) => {
    const font = PDF_FONT_DATA[key];
    if (!PDF_FONT_HEX[key]) {
      PDF_FONT_HEX[key] = Array.from(atob(font.data), (ch) => ch.charCodeAt(0).toString(16).padStart(2, "0")).join("") + ">";
    }
    const fontFile = add(stream(PDF_FONT_HEX[key], "/Filter /ASCIIHexDecode /Length1 " + atob(font.data).length));
    const descriptor = add("<< /Type /FontDescriptor /FontName /" + font.name + " /Flags 32 /FontBBox [" + font.bbox.join(" ") +
      "] /ItalicAngle 0 /Ascent " + font.ascent + " /Descent " + font.descent + " /CapHeight " + font.capHeight +
      " /StemV " + (font.weight >= 900 ? 160 : font.weight >= 700 ? 120 : 80) + " /FontWeight " + font.weight + " /FontFile2 " + fontFile + " 0 R >>");
    fontIds.push(add("<< /Type /Font /Subtype /TrueType /BaseFont /" + font.name + " /FirstChar 32 /LastChar 255 /Widths [" +
      font.widths.join(" ") + "] /Encoding << /Type /Encoding /BaseEncoding /WinAnsiEncoding /Differences [128 /uni20B9 /minus] >>" +
      " /FontDescriptor " + descriptor + " 0 R /ToUnicode " + unicodeId + " 0 R >>"));
  });
  const kids = [];
  this.pages.forEach((ops) => {
    const cid = add(stream(ops.join("\n")));
    kids.push(add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << " +
      fontIds.map((id, i) => "/F" + (i + 1) + " " + id + " 0 R").join(" ") + " >> >> /Contents " + cid + " 0 R >>"));
  });
  objs[1] = "<< /Type /Pages /Kids [" + kids.map((k) => k + " 0 R").join(" ") + "] /Count " + kids.length + " >>";
  let out = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((body, i) => { offsets.push(out.length); out += (i + 1) + " 0 obj\n" + body + "\nendobj\n"; });
  const xref = out.length;
  out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
  offsets.forEach((o) => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
  out += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  return out;
};
PdfDoc.measure = pdfWidth;
PdfDoc.encode = toAscii;

/* PDF string → Blob (raw Latin-1 bytes, taaki xref offsets exact rahein) */
function pdfBlob(str) {
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
  return new Blob([bytes], { type: "application/pdf" });
}
function savePdf(filename, str) {
  try {
    const blob = pdfBlob(str);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast("PDF downloaded: " + filename, "ok");
  } catch (e) { toast("Could not create PDF — open the file in a browser tab and retry", "bad"); }
}
function safeName(s) { return String(s || "worker").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, ""); }

function downloadStatementPdf(wid, y, m) {
  const w = Store.worker(wid); if (!w) return;
  const rec = Store.ensureRecord(wid, y, m, false);
  const c = calc(w, rec, Store.data.settings);

  drawStatement(p, w, rec, c);
  savePdf("Salary_" + safeName(w.name) + "_" + MONTHS_S[m] + "-" + y + ".pdf", p.build());
}
function downloadAllPdfs() {
  const rows = rowsForMonth(UI.year, UI.month);
  if (!rows.length) return toast("No workers to export", "bad");
  const p = new PdfDoc();
  drawSummaryPage(p, rows, UI.year, UI.month);

}

function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        validateRemote({ payload: d });
        const previous = syncClone(Store.data);
        Store.data = { settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) }, workers: d.workers, records: d.records, canteen: normCanteen(d.canteen) };
        if (!Store.save(false, { checkpoint: true })) { Store.data = previous; return; }
        render(); toast("Backup restored — cloud status check karein", "ok");
      } catch (e) { toast("Invalid backup file", "bad"); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ------------------ 18. CLOUD LOGIN & SAFE SYNC (Supabase) -------------- */
const CLOUD_KEY = "hisaabPro.cloud.v1";
const OWNER_KEY = "hisaabPro.owner.v1";
const SYNC_PREFIX = "hisaabPro.sync.v2.";
const RECOVERY_PREFIX = "hisaabPro.recovery.v1.";
const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error("Cloud library load nahi hui — internet check karein"));
    document.head.appendChild(s);
  });
}
function normalizeData(d) {
  d = d || {};
  return {
    settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) },
    workers: Array.isArray(d.workers) ? d.workers : [],
    records: Array.isArray(d.records) ? d.records : [],
    canteen: normCanteen(d.canteen)
  };
}
function syncClone(d) { return d === undefined ? undefined : JSON.parse(JSON.stringify(d)); }
function syncStable(d) {
  if (d === undefined) return "undefined";
  if (d === null || typeof d !== "object") return JSON.stringify(d);
  if (Array.isArray(d)) return "[" + d.map(syncStable).join(",") + "]";
  return "{" + Object.keys(d).filter((k) => !["__proto__", "constructor", "prototype", "createdAt", "updatedAt"].includes(k)).sort()
    .map((k) => JSON.stringify(k) + ":" + syncStable(d[k])).join(",") + "}";
}
/* Theme belongs to this device; demo markers are never financial data. */
function syncView(d) {
  const x = normalizeData(syncClone(d));
  delete x.settings.demo; delete x.settings.theme; delete x.canteen.demo;
  return x;
}
function samePayload(a, b) { return syncStable(syncView(a)) === syncStable(syncView(b)); }
function dataCounts(d) {
  const c = d && d.canteen || {};
  return { workers: (d && d.workers || []).length, records: (d && d.records || []).length,
    entries: (c.entries || []).length, rates: (c.rates || []).length, log: (c.log || []).length };
}
function hasRows(d) { return Object.values(dataCounts(d)).some((n) => n > 0); }
function hasUserData(d) {
  if (hasRows(d)) return true;
  const s = syncView(d).settings;
  return Object.keys(s).some((key) => syncStable(s[key]) !== syncStable(DEFAULT_SETTINGS[key]));
}
function ctCountOf(d) { return dataCounts(d).entries; }
function dataCountText(d) {
  const n = dataCounts(d);
  return n.workers + " workers · " + n.records + " salary records · " + n.entries + " canteen · " + n.rates + " rates";
}
function syncEntityKey(item, path) {
  if (!item || typeof item !== "object" || Array.isArray(item)) return null;
  if (path === "records" && item.workerId != null && item.year != null && item.month != null)
    return String(item.workerId) + ":" + item.year + ":" + item.month;
  return item.id == null ? null : String(item.id);
}
/* Three-way merge, NOT last-device-wins. Unknown/first-login absence is never a
   deletion. A known baseline propagates intentional row/field deletions; a
   concurrent edit-v-delete or different financial value pauses for a choice. */
function mergeSyncData(base, local, remote, preference) {
  const conflicts = [], details = [];
  const eq = (a, b) => syncStable(a) === syncStable(b);
  const merge = (b, l, r, path) => {
    if (eq(l, r)) return syncClone(l);
    if (eq(l, b)) return syncClone(r);
    if (eq(r, b)) return syncClone(l);
    if (path.endsWith(".updatedAt")) return Math.max(num(l), num(r));
    if (path.startsWith("records[") && path.endsWith(".id")) return syncClone(r || l);
    if (Array.isArray(l) && Array.isArray(r) && (b === undefined || Array.isArray(b))) {
      const all = (b || []).concat(l, r);
      if (all.every((item) => syncEntityKey(item, path) !== null)) {
        const map = (list) => new Map((list || []).map((v) => [syncEntityKey(v, path), v]));
        const bm = map(b), lm = map(l), rm = map(r), keys = new Set([...rm.keys(), ...lm.keys(), ...bm.keys()]);
        return Array.from(keys).map((key) => merge(bm.get(key), lm.get(key), rm.get(key), path + "[" + key + "]"))
          .filter((v) => v !== undefined);
      }
    }
    const object = (x) => x && typeof x === "object" && !Array.isArray(x);
    if (object(l) && object(r) && (b === undefined || object(b))) {
      const out = {};
      new Set([...Object.keys(b || {}), ...Object.keys(l), ...Object.keys(r)]).forEach((key) => {
        if (["__proto__", "constructor", "prototype"].includes(key)) return;
        const value = merge(b && b[key], l[key], r[key], path ? path + "." + key : key);
        if (value !== undefined) out[key] = value;
      });
      return out;
    }
    conflicts.push(path); details.push({ path, local: syncStable(l), remote: syncStable(r) });
    return syncClone(preference === "remote" ? r : l);
  };
  const data = merge(base, local, remote, "");
  const conflict = (path, l, r) => { conflicts.push(path); details.push({ path, local: syncStable(l), remote: syncStable(r) }); };
  /* A worker-delete and a new/edited salary must not leave an invisible orphan
     record. Choosing the deleting side explicitly removes worker + salaries;
     choosing the surviving side retains the worker for those records. */
  if (data && Array.isArray(data.workers) && Array.isArray(data.records)) {
    const ids = new Set(data.workers.map((w) => w.id));
    new Set(data.records.filter((r) => !ids.has(r.workerId)).map((r) => r.workerId)).forEach((id) => {

          : mergeSyncData(base, local, rdata, options.preference);
        const choiceValid = options.preference && result.details.every((detail) => (options.approved || []).some((ok) =>
          ok.path === detail.path && ok.local === detail.local && ok.remote === detail.remote));
        if (result.conflicts.length && !choiceValid) { this.hold(remote, result.conflicts, "fields", result.details, !!options.recover); return false; }
        if (result.conflicts.length && !Recovery.capture(rdata, "Cloud values — conflict se pehle")) throw new Error("Conflict backup save nahi hua — overwrite roka gaya");
        const storedRemote = remote ? syncView(remote.payload) : rdata;
        if (samePayload(result.data, storedRemote)) {
          this.applyMerged(result.data, rdata, remote && remote.updated_at || null, false, ctx);
          this._pending = null; this.retryDelay = 2000; this.setStatus("synced"); return true;
        }
        /* No sample/empty first-login upload; read failure never reaches here. */
        if (!remote && !hasUserData(result.data)) {
          this.applyMerged(result.data, rdata, null, false, ctx);
          this._pending = null; this.setStatus("synced"); return true;
        }
        if (remote && !Recovery.capture(rdata, "Cloud write se pehle")) throw new Error("Cloud pre-write backup save nahi hui — overwrite roka gaya");
        this.applyMerged(result.data, rdata, remote && remote.updated_at || null, true, ctx);
        const sent = syncView(Store.data), revision = uid();
        const updatedAt = new Date(Math.max(Date.now(), (Date.parse(remote && remote.updated_at) || 0) + 1)).toISOString();
        const row = { user_id: ctx.userId, payload: { ...sent, _sync: { v: 2, revision, app: APP_VERSION,
          cleared: !hasRows(sent) && hasRows(rdata),
          deletedCollections: Object.keys(dataCounts(rdata)).filter((key) => dataCounts(rdata)[key] > 0 && dataCounts(sent)[key] === 0) } }, updated_at: updatedAt };
        this.setStatus("saving");
        let query;
        if (remote) {
          query = ctx.client.from("hisaab_data").update({ payload: row.payload, updated_at: updatedAt }).eq("user_id", ctx.userId);
          query = remote.updated_at == null ? query.is("updated_at", null) : query.eq("updated_at", remote.updated_at);
        } else query = ctx.client.from("hisaab_data").insert(row);
        const { data, error } = await query.select("payload,updated_at").maybeSingle();
        if (!this.current(ctx)) return false;
        this.requireSaved(); /* a failed local save during this request is NOT an ACK */
        if (error) { if (error.code === "23505") continue; throw error; }
        if (!data) continue; /* compare-and-set lost: re-fetch and re-merge, never upsert */
        validateRemote(data);
        if (!samePayload(data.payload, sent)) throw new Error("Cloud ne bheja hua data confirm nahi kiya — pending rakha hai");
        const dirty = !samePayload(Store.data, sent);
        this.applyMerged(Store.data, sent, data.updated_at || updatedAt, dirty, ctx);
        this._pending = null;
        if (!dirty) { this.retryDelay = 2000; this.setStatus("synced"); return true; }
        /* A save while the request was in flight is NOT acknowledged by it. */
      }
      throw new Error("Dono devices abhi changes bhej rahe hain. Local changes safe hain; sync dobara try hoga.");
    } catch (e) {
      if (!this.current(ctx)) return false;
      const code = e && e.code;
      const msg = code === "42501" || code === "PGRST301" ? "Cloud permission/session error — Supabase RLS/setup check karein; local data safe hai." :
        e && e.message || "Cloud sync fail — local data safe, retry pending";
      this.setStatus(this.status === "storage" ? "storage" : code === "EDITOR_OPEN" ? "pending" : "offline", msg);
      this.retry(); return false;
    }
  },
  pushNow() { return this.syncNow(); },
  async maybePull() {
    if (!this.user || this.busy || this._pending || this.offlineMode || $("#overlay")) return false;
    return this.syncNow();
  },
  async resolve(preference) {
    if (!this._pending || this._pending.scope !== this.scope) return false;
    const recover = this._pending.kind === "empty" || this._pending.recover, approved = this._pending.details;
    closeModal();
    const ok = await this.syncNow({ preference, recover, approved });
    if (ok) { render(); toast("Safe merge + cloud sync ho gaya ✔", "ok"); }
    else if (!this._pending) toast("Sync confirm nahi hua — local changes safe hain", "bad");
    return ok;
  }
};

function conflictRows(pending) {
  const remote = pending.remote && pending.remote.payload || blankData();
  const text = (raw) => {
    if (raw === "undefined") return "Deleted / hata diya";
    let value; try { value = JSON.parse(raw); } catch (e) { value = raw; }
    if (value && typeof value === "object") {
      if (value.worker) return value.worker.name + " · " + (value.records || []).length + " salary records";
      if (value.amount !== undefined) return "Amount " + money(value.amount) + (value.paid !== undefined ? " · Paid " + money(value.paid) : "");
      if (Array.isArray(value)) return value.length + " rows · " + JSON.stringify(value).slice(0, 80);
      return JSON.stringify(value).slice(0, 100);
    }
    return String(value === "" ? "(blank)" : value).slice(0, 100);
  };
  return (pending.details || []).slice(0, 8).map((detail) => {
    const entryId = /^canteen\.entries\[([^\]]+)\]/.exec(detail.path);
    const entry = entryId && [...((Store.data.canteen || {}).entries || []), ...((remote.canteen || {}).entries || [])].find((e) => e.id === entryId[1]);
    const title = entry ? (entry.party || "Canteen entry") + " · " + entry.date + " · " + detail.path.split(".").pop() : detail.path;
    return '<tr><td style="overflow-wrap:anywhere"><b>' + esc(title) + '</b></td><td>' + esc(text(detail.local)) + '</td><td>' + esc(text(detail.remote)) + '</td></tr>';
  }).join("");
}
function askWhichData() {
  const pending = Cloud._pending;
  if (!pending || pending.scope !== Cloud.scope) return;
  const remote = pending.remote && pending.remote.payload || blankData(), empty = pending.kind === "empty";
  openModal('<div class="modal" style="max-width:600px"><div class="modal-h"><div><h3>🛡️ Data overwrite roka gaya</h3>' +
    '<p>' + (empty ? "Cloud me unconfirmed missing/demo data aaya. Is device ka bacha data delete nahi kiya gaya." :

      conflictRows(pending) + '</tbody></table></div>' + (pending.conflicts.length > 8 ? '<p>… aur ' + (pending.conflicts.length - 8) + ' conflicts. Choice sab matching conflicts par apply hogi.</p>' : "") : "") +
    '<p style="font-size:12px">Choice se pehle safety copy banegi. Abhi band karoge to sync paused rahega; background me koi choice apply nahi hogi. Backup JSON bhi download kar sakte ho.</p></div>' +
    '<div class="modal-f" style="flex-wrap:wrap"><button class="btn" data-act="exportData">⤓ Current backup</button>' +
    (empty ? '<button class="btn primary" data-act="useLocal">🛟 Bacha data safely cloud me jodo</button>' :
      '<button class="btn" data-act="useCloud">Cloud ki conflicting values</button><button class="btn primary" data-act="useLocal">Device ki conflicting values</button>') + '</div></div>');
}
function downloadJson(data, name) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

async function submitLogin() {
  const email = ($("#lcEmail") ? $("#lcEmail").value : "").trim();
  const pass = $("#lcPass") ? $("#lcPass").value : "";
  if (!email || email.indexOf("@") < 1) { lcError("Sahi email address likhein."); return; }
  if (!pass || pass.length < 6) { lcError("Password kam se kam 6 characters ka hona chahiye."); return; }
  const btn = $("#lcGo");
  if (btn) { btn.disabled = true; btn.textContent = "Please wait…"; }
  try {
    if (Cloud.mode === "up") {
      const r = await Cloud.signUp(email, pass);
      if (r && r.needsConfirm) {
        const el = $("#lcMsg");
        if (el) el.innerHTML = '<div class="banner info" style="margin-bottom:11px"><span>📧</span><div style="font-size:12.5px">' +
          "Account ban gaya! Ab apne email par aaya <b>confirmation link</b> kholkar verify karein, phir yahan <b>Sign in</b> karein.</div></div>";
        Cloud.mode = "in"; showLogin(true);
        return;
      }
    } else {
      await Cloud.signIn(email, pass);
    }
    if (!Cloud.user) { showLogin(true); return; }
    showLogin(false); render();
    if (Cloud.status === "synced") toast("Login + cloud sync ho gaya ✔", "ok");
  } catch (e) {
    const m = (e && e.message ? e.message : "").toLowerCase();
    let msg = "Login nahi ho paya. Internet aur details check karein.";
    if (m.indexOf("invalid login") >= 0) msg = "Email ya password galat hai.";
    else if (m.indexOf("already registered") >= 0) msg = "Ye email pehle se registered hai — <b>Sign in</b> karein.";
    else if (m.indexOf("email not confirmed") >= 0) msg = "Pehle email par aaya confirmation link kholkar verify karein.";
    else if (m.indexOf("failed to fetch") >= 0 || m.indexOf("network") >= 0) msg = "Internet ya Supabase URL/key galat hai.";
    lcError(msg + '<div style="font-size:11px;margin-top:5px;opacity:.8">' + esc(e && e.message ? e.message : "") + "</div>");
    if (btn) { btn.disabled = false; btn.textContent = Cloud.mode === "up" ? "Create account & login" : "Sign in"; }
  }
}

/* ------------------------- 21a. DATE HELPERS ------------------------- */
function isoDate(d) {
  const x = d instanceof Date ? d : new Date(d);
  const t = isNaN(x.getTime()) ? new Date() : x;
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
function ctParts(iso) {
  const p = String(iso || "").split("-");
  const now = new Date();
  const y = Number(p[0]) || now.getFullYear();
  const m = clamp((Number(p[1]) || now.getMonth() + 1) - 1, 0, 11);
  const d = clamp(Number(p[2]) || 1, 1, 31);
  return { y, m, d };
}
function ctDateObj(iso) { const p = ctParts(iso); return new Date(p.y, p.m, p.d); }
function ctDayName(iso) { return DAYS[ctDateObj(iso).getDay()]; }
function ctPretty(iso) { const p = ctParts(iso); return String(p.d).padStart(2, "0") + " " + MONTHS_S[p.m] + " " + p.y; }
function ctShort(iso) { const p = ctParts(iso); return String(p.d).padStart(2, "0") + " " + MONTHS_S[p.m]; }
function ctShiftDate(iso, days) { const t = ctDateObj(iso); t.setDate(t.getDate() + days); return isoDate(t); }
function ctIsToday(iso) { return String(iso) === isoDate(new Date()); }
function monthFirst(y, m) { return y + "-" + String(m + 1).padStart(2, "0") + "-01"; }
function monthLast(y, m) { return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(new Date(y, m + 1, 0).getDate()).padStart(2, "0"); }
function ctTime(ts) {
  const d = new Date(num(ts) || Date.now());
  let h = d.getHours(); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12;
  return h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ap;
}

/* ------------------------- 21b. DATA SHAPE ------------------------- */
function blankCanteen() { return { entries: [], rates: [], log: [], demo: false }; }

/* Item ka price do tarah se likha ja sakta hai:
   - "unit"  : price = 1 unit (1 kg) ka daam  -> amount = qty × rate
   - "line"  : price = POORI line ka total    -> amount = lineTotal, rate = lineTotal ÷ qty
   Canonical fields: rate hamesha PER-UNIT hota hai; line mode me wo khud nikalta hai. */
function normCtItem(i) {
  i = i || {};
  const qty = Math.max(0, num(i.qty));
  const unit = String(i.unit == null || i.unit === "" ? "kg" : i.unit).slice(0, 18);
  const priceMode = i.priceMode === "line" ? "line" : "unit";
  let rate = Math.max(0, num(i.rate));
  let lineTotal = Math.max(0, num(i.lineTotal));
  if (priceMode === "line") {
    /* poori line ka total likha hai — per-unit rate isi se banta hai (360 ÷ 4 = 90/kg) */
    rate = qty > 0 ? lineTotal / qty : lineTotal;
  } else {
    lineTotal = qty * rate;
  }
  return {
    name: String(i.name == null ? "" : i.name).slice(0, 90),
    qty: qty,
    unit: unit,
    rate: rRate(rate),
    lineTotal: r2(lineTotal),
    priceMode: priceMode
  };
}
/* kisi item line ka asli amount — mode ke hisaab se */
function ctItemAmt(i) {
  i = i || {};
  if (i.priceMode === "line") return r2(Math.max(0, num(i.lineTotal)));
  return r2(Math.max(0, num(i.qty)) * Math.max(0, num(i.rate)));
}
/* line mode me per-unit rate (dikhane / rate list ke liye) */
function ctItemUnitRate(i) {
  i = i || {};
  const q = Math.max(0, num(i.qty));
  if (i.priceMode === "line") return q > 0 ? rRate(Math.max(0, num(i.lineTotal)) / q) : rRate(Math.max(0, num(i.lineTotal)));
  return rRate(Math.max(0, num(i.rate)));
}
function normCtEntry(e) {
  e = e || {};
  const kind = CT_KINDS.indexOf(e.kind) >= 0 ? e.kind : "purchase";
  const mode = e.mode === "total" ? "total" : "itemized";
  const items = (Array.isArray(e.items) ? e.items : []).map(normCtItem);
  const itemsTotal = r2(items.reduce((t, i) => t + ctItemAmt(i), 0));
  const amount = r2(Math.max(0, mode === "total" ? num(e.amount) : (num(e.amount) || itemsTotal)));
  const payMode = CT_PAY[e.payMode] ? e.payMode : "cash";
  return {
    id: String(e.id || uid()),
    date: /^\d{4}-\d{2}-\d{2}$/.test(String(e.date || "")) ? String(e.date) : isoDate(new Date()),
    kind: kind, mode: mode, items: items, amount: amount,
    party: String(e.party == null ? "" : e.party).slice(0, 90),
    billNo: String(e.billNo == null ? "" : e.billNo).slice(0, 40),
    paid: r2(clamp(num(e.paid), 0, amount || num(e.paid) || 0)),
    payMode: payMode,
    note: String(e.note == null ? "" : e.note).slice(0, 500),
    /* v3.4 — bill/parche ki photo (compressed dataURL); purani entries me ye field nahi hoti */
    photo: typeof e.photo === "string" ? e.photo.slice(0, 400000) : "",
    createdAt: num(e.createdAt) || Date.now(),
    updatedAt: num(e.updatedAt) || Date.now()
  };
}
function normCtRate(r) {
  r = r || {};
  return {
    id: String(r.id || uid()),
    name: String(r.name == null ? "" : r.name).slice(0, 90),
    unit: String(r.unit == null || r.unit === "" ? "kg" : r.unit).slice(0, 18),
    rate: Math.max(0, num(r.rate)),
    cat: String(r.cat == null ? "" : r.cat).slice(0, 40)
  };
}
function normCanteen(c) {
  const b = blankCanteen();
  if (!c || typeof c !== "object") return b;
  b.entries = (Array.isArray(c.entries) ? c.entries : []).map(normCtEntry);
  b.rates = (Array.isArray(c.rates) ? c.rates : []).map(normCtRate).filter((r) => r.name);
  b.log = (Array.isArray(c.log) ? c.log : []).slice(-CT_LOG_MAX);
  b.demo = !!c.demo;
  return b;
}
/* safe accessor — hamesha ek valid canteen object deta hai */
function ct() {
  const d = Store.data;
  if (!d.canteen || typeof d.canteen !== "object" || !Array.isArray(d.canteen.entries) ||
      !Array.isArray(d.canteen.rates) || !Array.isArray(d.canteen.log)) {
    d.canteen = normCanteen(d.canteen);
  }
  return d.canteen;
}
function ctUI() {
  if (!UI.ct || typeof UI.ct !== "object") UI.ct = {};
  const u = UI.ct;
  if (["day", "month", "entries", "rates", "activity"].indexOf(u.tab) < 0) u.tab = "day";
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(u.date || ""))) u.date = isoDate(new Date());
  if (u.kind !== "all" && CT_KINDS.indexOf(u.kind) < 0) u.kind = "all";
  if (u.q == null) u.q = "";
  if (u.from == null) u.from = "";
  if (u.to == null) u.to = "";
  if (u.scope !== "all" && u.scope !== "custom") u.scope = "month";
  if (u.logScope !== "all") u.logScope = "month";
  return u;
}

/* ------------------------- 21c. ENTRY MATH ------------------------- */
function ctKindOf(e) { return CT_KIND[(e && e.kind) || "purchase"] || CT_KIND.purchase; }
function ctAmount(e) { return r2(Math.max(0, num(e && e.amount))); }
function ctPaid(e) { return r2(clamp(num(e && e.paid), 0, 1e12)); }
function ctBalance(e) { return r2(Math.max(0, ctAmount(e) - Math.min(ctPaid(e), ctAmount(e)))); }
function ctItemsSum(e) { return r2(((e && e.items) || []).reduce((t, i) => t + ctItemAmt(i), 0)); }
function ctNetOf(e) { return r2(ctKindOf(e).sign * ctAmount(e)); }
function ctItemCount(e) { return ((e && e.items) || []).filter((i) => i.name || i.qty || i.rate).length; }
function ctItemLabel(e) {
  const its = ((e && e.items) || []).filter((i) => i.name);
  if (!its.length) return "";
  return its.map((i) => i.name + (i.qty ? " (" + num(i.qty) + (i.unit || "") + ")" : "")).join(", ");
}
function ctTotals(list) {
  const t = { count: list.length, purchase: 0, sale: 0, expense: 0, paid: 0, balance: 0,
              items: 0, itemizedAmt: 0, totalModeAmt: 0, totalModeCount: 0, net: 0, out: 0 };
  (list || []).forEach((e) => {
    const a = ctAmount(e);
    if (e.kind === "sale") t.sale += a;
    else if (e.kind === "expense") t.expense += a;
    else t.purchase += a;
    t.paid += Math.min(ctPaid(e), a);
    t.balance += ctBalance(e);
    t.items += ctItemCount(e);
    if (e.mode === "total") { t.totalModeAmt += a; t.totalModeCount++; } else t.itemizedAmt += a;
  });
  t.purchase = r2(t.purchase); t.sale = r2(t.sale); t.expense = r2(t.expense);
  t.paid = r2(t.paid); t.balance = r2(t.balance);
  t.itemizedAmt = r2(t.itemizedAmt); t.totalModeAmt = r2(t.totalModeAmt);
  t.out = r2(t.purchase + t.expense);
  t.net = r2(t.sale - t.out);
  return t;
}

/* ------------------------- 21d. QUERIES ------------------------- */
function ctAll() {
  return ct().entries.slice().sort((a, b) =>
    a.date === b.date ? num(b.createdAt) - num(a.createdAt) : (a.date < b.date ? 1 : -1));
}
function ctEntry(id) { return ct().entries.find((e) => e.id === id) || null; }
function ctOnDate(iso) { return ctAll().filter((e) => e.date === iso); }
function ctInMonth(y, m) { return ctAll().filter((e) => { const p = ctParts(e.date); return p.y === y && p.m === m; }); }
function ctMonthDays(y, m) {
  /* har din ka roll-up — mahine ka ledger */
  const dim = new Date(y, m + 1, 0).getDate();
  const byDay = {};
  ctInMonth(y, m).forEach((e) => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const out = [];
  for (let d = 1; d <= dim; d++) {
    const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const list = byDay[iso] || [];
    out.push({ iso: iso, d: d, day: DAYS[new Date(y, m, d).getDay()], list: list, t: ctTotals(list) });
  }
  return out;
}
function ctLast6(y, m) {
  const out = [];
  for (let i = 5; i >= 0; i--) {
    let mm = m - i, yy = y;
    while (mm < 0) { mm += 12; yy--; }
    const t = ctTotals(ctInMonth(yy, mm));
    out.push({ y: yy, m: mm, label: MONTHS_S[mm], t: t, now: i === 0 });
  }
  return out;
}
function ctFilteredEntries() {
  const u = ctUI();
  const q = String(u.q || "").trim().toLowerCase();
  let list = ctAll();
  const from = /^\d{4}-\d{2}-\d{2}$/.test(String(u.from || "")) ? u.from : "";
  const to = /^\d{4}-\d{2}-\d{2}$/.test(String(u.to || "")) ? u.to : "";
  if (from) list = list.filter((e) => e.date >= from);
  if (to) list = list.filter((e) => e.date <= to);
  if (!from && !to && u.scope !== "all") {
    list = list.filter((e) => { const p = ctParts(e.date); return p.y === UI.year && p.m === UI.month; });
  }
  if (u.kind !== "all") list = list.filter((e) => e.kind === u.kind);
  if (q) {
    list = list.filter((e) =>
      String(e.party || "").toLowerCase().indexOf(q) >= 0 ||
      String(e.billNo || "").toLowerCase().indexOf(q) >= 0 ||
      String(e.note || "").toLowerCase().indexOf(q) >= 0 ||
      String(ctAmount(e)).indexOf(q) >= 0 ||
      ctItemLabel(e).toLowerCase().indexOf(q) >= 0);
  }
  return list;
}
function ctItemAgg(list) {
  const map = new Map();
  (list || []).forEach((e) => {
    if (e.mode !== "itemized") return;
    (e.items || []).forEach((i) => {
      const nm = String(i.name || "").trim();
      if (!nm) return;
      const unit = String(i.unit || "kg");
      const key = nm.toLowerCase() + "|" + unit.toLowerCase();
      const cur = map.get(key) || { name: nm, unit: unit, qty: 0, amt: 0, n: 0, lastRate: 0, lastDate: "", kind: e.kind, lineItems: 0 };
      cur.qty += num(i.qty);
      cur.amt += ctItemAmt(i);
      cur.n += 1;
      if (i.priceMode === "line") cur.lineItems += 1;
      if (!cur.lastDate || e.date >= cur.lastDate) { cur.lastDate = e.date; cur.lastRate = ctItemUnitRate(i); }
      map.set(key, cur);
    });
  });
  const out = Array.from(map.values()).map((x) => ({
    name: x.name, unit: x.unit, kind: x.kind, n: x.n, lineItems: x.lineItems || 0,
    qty: r2(x.qty), amt: r2(x.amt), lastRate: rRate(x.lastRate), lastDate: x.lastDate,
    avgRate: x.qty ? rRate(x.amt / x.qty) : 0
  }));
  out.sort((a, b) => b.amt - a.amt || a.name.localeCompare(b.name));
  return out;
}
function ctPartyAgg(list) {
  const map = new Map();
  (list || []).forEach((e) => {
    const nm = String(e.party || "").trim();
    if (!nm) return;
    const key = nm.toLowerCase();
    const cur = map.get(key) || { name: nm, amt: 0, paid: 0, bal: 0, n: 0, purchase: 0, sale: 0, expense: 0, last: "" };
    const a = ctAmount(e);
    cur.amt += a; cur.paid += Math.min(ctPaid(e), a); cur.bal += ctBalance(e); cur.n += 1;
    cur[e.kind] = (cur[e.kind] || 0) + a;
    if (!cur.last || e.date > cur.last) cur.last = e.date;
    map.set(key, cur);
  });
  const out = Array.from(map.values()).map((x) => ({
    name: x.name, n: x.n, last: x.last,
    amt: r2(x.amt), paid: r2(x.paid), bal: r2(x.bal),
    purchase: r2(x.purchase || 0), sale: r2(x.sale || 0), expense: r2(x.expense || 0)
  }));
  out.sort((a, b) => b.amt - a.amt || a.name.localeCompare(b.name));
  return out;
}
function ctBakiList(list) {
  return (list || ctAll()).filter((e) => ctBalance(e) > 0.005)
    .sort((a, b) => ctBalance(b) - ctBalance(a) || (a.date < b.date ? -1 : 1));
}
function ctParties() {
  const s = new Set();
  ct().entries.forEach((e) => { if (e.party) s.add(e.party); });
  return Array.from(s).sort();
}
/* signed money — 0 par koi sign nahi (warna "−₹0" ajeeb lagta hai) */
function ctSgn(v) { return (v < 0 ? "−" : v > 0 ? "+" : "") + money0(Math.abs(v)); }
function ctSgnS(v) { return (v < 0 ? "−" : v > 0 ? "+" : "") + moneyS(Math.abs(v)); }

/* ------------------------- 21e. RATE LIST ------------------------- */
function ctRateFor(name) {
  const nm = String(name || "").trim().toLowerCase();
  if (!nm) return null;
  return ct().rates.find((r) => String(r.name).trim().toLowerCase() === nm) || null;
}
/* itemized entry se rate list apne aap tazaa hoti hai (aakhri rate yaad rehta hai) */
function ctSyncRates(entry, ratesArr) {
  if (!entry || entry.mode !== "itemized") return;
  const rates = Array.isArray(ratesArr) ? ratesArr : ct().rates;
  (entry.items || []).forEach((i) => {
    const nm = String(i.name || "").trim();
    const perUnit = ctItemUnitRate(i);      /* line mode me bhi per-unit rate hi save hota hai */
    if (!nm || perUnit <= 0) return;
    const hit = rates.find((r) => String(r.name).trim().toLowerCase() === nm.toLowerCase());
    if (hit) { hit.rate = rRate(perUnit); if (i.unit) hit.unit = i.unit; }
    else rates.push(normCtRate({ name: nm, unit: i.unit || "kg", rate: perUnit, cat: "" }));
  });
}
function ctLastRateInfo(name) {
  const nm = String(name || "").trim().toLowerCase();
  if (!nm) return null;
  let best = null;
  ctAll().forEach((e) => {
    if (e.mode !== "itemized") return;
    (e.items || []).forEach((i) => {
      if (String(i.name || "").trim().toLowerCase() !== nm || num(i.rate) <= 0) return;
      if (!best || e.date >= best.date) best = { rate: num(i.rate), date: e.date, unit: i.unit };
    });
  });
  return best;
}

/* ------------------------- 21f. ACTIVITY LOG ------------------------- */
function ctLogText(e) {
  const k = ctKindOf(e);

  return k.label + (e.party ? " · " + e.party : "") +
    (n ? " · " + n + " item" + (n > 1 ? "s" : "") : "") +
    (e.mode === "total" ? " · ek-saath total" : (n ? " · rate-wise" : ""));
}
function ctLogIt(action, entry, snapshot, text) {
  const C = ct();

  const L = C.log;
  L.push({

    text: text || (entry ? ctLogText(entry) : ""),
    snapshot: snapshot ? JSON.parse(JSON.stringify(snapshot)) : null
  });
  if (L.length > CT_LOG_MAX) L.splice(0, L.length - CT_LOG_MAX);
}
function ctLogs() {

}

        '<button class="btn sm primary" data-act="ctAdd">＋ Entry add karo</button>' +
      "</div>" +
    "</div>";
  let body;
  if (u.tab === "day") body = ctDayLedger();
  else if (u.tab === "month") body = ctMonthLedger();
  else if (u.tab === "entries") body = ctEntriesView();
  else if (u.tab === "rates") body = ctRatesView();
  else body = ctActivityView();
  return head + body;
}

/* ============ DIN KA LEDGER ============ */
function ctDayLedger() {
  const u = ctUI();
  const iso = u.date;
  const p = ctParts(iso);
  const list = ctOnDate(iso);
  const t = ctTotals(list);
  const mt = ctTotals(ctInMonth(p.y, p.m));
  const items = ctItemAgg(list);
  const totalMode = list.filter((e) => e.mode === "total" && e.kind === "purchase");
  const baki = ctBakiList(list);
  const isToday = ctIsToday(iso);
  const first = !!ct().entries.length;

  const dateBar =
    '<div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:12px 15px">' +
      '<div class="ct-datebar">' +
        '<button class="btn sm" data-act="ctDayShift" data-d="-1" title="Pichhla din">‹ Pichhla</button>' +
        '<input type="date" class="inp" id="ctDatePick" value="' + esc(iso) + '">' +
        '<button class="btn sm" data-act="ctDayShift" data-d="1" title="Agla din">Agla ›</button>' +

        '<div class="toolbar" style="margin-left:auto">' +
          '<button class="btn sm" data-act="ctAdd" data-date="' + esc(iso) + '">＋ ' + esc(ctPretty(iso)) + " ki entry</button>" +
        "</div>" +
      "</div>" +
    "</div></div>";

  const kpis =

        sub: list.filter((e) => e.kind === "purchase").length + " entry · " + mt.count + " is mahine ab tak" }) +
      kpiCard({ label: "Bikri / income", value: money0(t.sale), icon: "⬆", tone: "k-ok",
        sub: "Din bhar ki kamai" }) +
      kpiCard({ label: "Kharcha", value: money0(t.expense), icon: "↯", tone: "k-bad",
        sub: "Saman ke alawa" }) +
      kpiCard({ label: "Din ka net", value: (t.net < 0 ? "−" : "") + money0(Math.abs(t.net)), icon: "∑",
        tone: t.net >= 0 ? "k-cyan" : "k-bad", sub: "Bikri − saman − kharcha" }) +
    "</div>";

  const strip =
    '<div class="card" style="margin-bottom:14px"><div class="card-h"><div><h3>' + esc(ctPretty(iso)) + " — din ka hisaab</h3>" +
      '<div class="sub">' + esc(ctDayName(iso)) + " · " + t.count + " entries" + (t.items ? " · " + t.items + " item lines" : "") + "</div></div>" +
      '<div class="toolbar">' +
        '<button class="btn sm" data-act="ctPrintDay">🖨 Print</button>' +
        '<button class="btn sm" data-act="ctShareDay">✆ WhatsApp</button>' +
        '<button class="btn sm" data-act="ctSharePdfDay" title="PDF seedha WhatsApp par bhejo">📤 WhatsApp PDF</button>' +
      "</div></div>" +
      '<div class="strip">' +
        '<div><small>Saman (purchase)</small><b style="color:var(--warn)">' + ctSgn(-t.purchase) + '</b><div class="sub">canteen me aaya</div></div>' +
        '<div><small>Bikri (sale)</small><b style="color:var(--ok)">' + ctSgn(t.sale) + '</b><div class="sub">canteen se gayi</div></div>' +
        '<div><small>Kharcha</small><b style="color:var(--bad)">' + ctSgn(-t.expense) + '</b><div class="sub">gas, bijli, mazdoori…</div></div>' +
        '<div><small>Din ka net</small><b>' + (t.net < 0 ? "−" : "") + money0(Math.abs(t.net)) + '</b><div class="sub">bikri − saman − kharcha</div></div>' +
        '<div><small>Paisa diya (paid)</small><b>' + money0(t.paid) + '</b><div class="sub">cash / upi / bank</div></div>' +
        '<div><small>Baki (udhaar)</small><b style="color:' + (t.balance > 0 ? "var(--bad)" : "var(--muted)") + '">' + money0(t.balance) + '</b><div class="sub">abhi dena banta hai</div></div>' +
        '<div><small>Is mahine saman</small><b>' + money0(mt.purchase) + '</b><div class="sub">' + MONTHS[p.m] + " total</div></div>" +
      "</div></div>";

  const entryRows = list.map((e) => {
    const il = ctItemLabel(e);
    return '<tr class="clickable" data-act="ctEdit" data-id="' + e.id + '">' +
      "<td>" + ctKindTag(e) + "</td>" +
      '<td><div class="nm" style="font-weight:750">' + esc(e.party || (e.kind === "sale" ? "Canteen counter" : "—")) +
        (e.photo ? '<span class="ct-phTag" data-act="ctPhotoView" data-id="' + e.id + '" title="Bill / parche ki photo dekhe">📷 photo</span>' : "") + "</div>" +
        (il ? '<div class="ct-ilist">' + esc(il.length > 96 ? il.slice(0, 96) + "…" : il) + "</div>" : "") +
        (e.note ? '<div class="ct-ilist" style="font-style:italic">“' + esc(e.note) + "”</div>" : "") + "</td>" +
      '<td class="muted" style="white-space:nowrap">' + esc(e.billNo || "—") + "</td>" +
      "<td>" + ctModeTag(e) + "</td>" +
      '<td class="num">' + ctSignMoney(e) + "</td>" +
      '<td class="num muted">' + moneyS(Math.min(ctPaid(e), ctAmount(e))) + "</td>" +
      '<td class="num">' + (ctBalance(e) > 0.005 ? '<b style="color:var(--bad)">' + moneyS(ctBalance(e)) + "</b>" : '<span class="muted">—</span>') + "</td>" +
      '<td><div class="row-actions">' +
        (ctBalance(e) > 0.005 ? '<button class="btn xs" data-act="ctPay" data-id="' + e.id + '" title="Paisa diya likho">₹</button>' : "") +
        '<button class="btn xs" data-act="ctEdit" data-id="' + e.id + '" title="Edit">✎</button>' +
        '<button class="btn xs" data-act="ctDup" data-id="' + e.id + '" title="Duplicate (aaj ki date)">⧉</button>' +
      "</div></td></tr>";
  }).join("");

  const entriesCard =
    '<div class="card"><div class="card-h"><div><h3>Din ki entries</h3>' +
      '<div class="sub">Row par tap karo — poori entry khulegi</div></div>' +

      (list.length
        ? '<div class="twrap"><table class="tbl" style="min-width:720px"><thead><tr>' +
          "<th>Type</th><th>Party / saman</th><th>Bill</th><th>Mode</th>" +
          '<th class="num">Amount</th><th class="num">Paid</th><th class="num">Baki</th><th></th>' +
          "</tr></thead><tbody>" + entryRows + "</tbody>" +
          '<tfoot><tr><td colspan="4">Din ka total</td>' +
            '<td class="num">' + ctSgnS(t.net) + "</td>" +
            '<td class="num">' + moneyS(t.paid) + "</td>" +
            '<td class="num">' + (t.balance ? moneyS(t.balance) : "—") + "</td><td></td></tr></tfoot>" +
          "</table></div>"
        : ctEmpty("🍽", first ? "Is din koi entry nahi" : "Canteen ki pehli entry daalo",
            first ? ctPretty(iso) + " ke liye saman, bikri ya kharcha add karo." :
              "Saman aaya, bikri ya kharcha — jo bhi ho, ek entry se shuru karo.", "ctAdd", "＋ Entry add karo")) +
    "</div>";

  const totModeSum = r2(totalMode.reduce((s, e) => s + ctAmount(e), 0));
  const itemRows = items.map((i) =>
    "<tr><td>" + esc(i.name) +
      (i.lineItems ? ' <span class="ct-modeTag tot" title="' + i.lineItems + ' line poori-line total se likhi gayi — rate yahan se nikla hai">Σ</span>' : "") + "</td>" +
    '<td class="num strong">' + num(i.qty) + "</td>" +
    '<td class="muted">' + esc(i.unit) + "</td>" +
    '<td class="num">' + (i.avgRate ? rateS(i.avgRate) : "—") + "</td>" +
    '<td class="num">' + (i.lastRate && i.lastRate !== i.avgRate ? '<span class="muted" style="font-size:11px">aakhri ' + rateS(i.lastRate) + "</span>" : "") + "</td>" +
    '<td class="num strong">' + moneyS(i.amt) + "</td>" +
    '<td class="num muted">' + i.n + "</td></tr>").join("");
  const itemCard =
    '<div class="card"><div class="card-h"><div><h3>Saman item-wise (rate ke saath)</h3>' +
      '<div class="sub">Sirf rate-wise entries ka item detail — qty × rate</div></div>' +
      '<span class="tag warn">' + moneyS(t.itemizedAmt) + "</span></div>" +
      (totModeSum > 0
        ? '<div class="banner" style="margin:12px 14px 0;background:var(--cyan-soft);border-color:color-mix(in srgb,var(--cyan) 26%,var(--line))">' +
          "<span>Σ</span><div><b>" + totalMode.length + " entry me sirf total likha hai</b> — item ka alag rate nahi. " +
          "Unka jod: <b>" + money0(totModeSum) + "</b>. Item-wise rate chahiye to entry khol kar “Rate-wise” mode me daalo.</div></div>"
        : "") +
      (items.length
        ? '<div class="twrap"><table class="tbl" style="min-width:520px"><thead><tr>' +
          "<th>Item</th>" + '<th class="num">Qty</th><th>Unit</th><th class="num">Avg rate</th><th class="num">Aakhri rate</th>' +
          '<th class="num">Amount</th><th class="num">Entries</th>' +
          "</tr></thead><tbody>" + itemRows + "</tbody>" +
          '<tfoot><tr><td colspan="5">Item-wise total</td><td class="num">' + moneyS(t.itemizedAmt) + "</td><td></td></tr></tfoot>" +
          "</table></div>"
        : '<div class="ct-emptyline">Is din koi rate-wise item nahi.</div>') +
    "</div>";

  const bakiCard = baki.length
    ? '<div class="card" style="margin-top:14px"><div class="card-h"><div><h3>Baki / udhaar — is din</h3>' +
      '<div class="sub">Jin entries ka paisa poora nahi diya</div></div><span class="tag bad">' + moneyS(t.balance) + "</span></div>" +
      '<div class="card-b" style="display:flex;flex-direction:column;gap:9px">' +
      baki.map((e) => '<div class="ct-bal"><span>' + ctKindOf(e).ico + "</span>" +
        "<div style=\"flex:1;min-width:120px\"><b>" + esc(e.party || "—") + "</b> · " + ctKindOf(e).label +
        ' <span class="muted">(' + moneyS(ctAmount(e)) + " me se " + moneyS(Math.min(ctPaid(e), ctAmount(e))) + " diya)</span></div>" +
        '<button class="btn xs primary" data-act="ctPay" data-id="' + e.id + '">₹ Paid likho</button></div>').join("") +
      "</div></div>"
    : "";

  return dateBar + kpis + strip + '<div class="grid g2">' + entriesCard + itemCard + "</div>" + bakiCard;
}

/* ============ MAHINE KA LEDGER ============ */
function ctMonthLedger() {
  const y = UI.year, m = UI.month;
  const list = ctInMonth(y, m);
  const t = ctTotals(list);
  const pm = m === 0 ? { y: y - 1, m: 11 } : { y: y, m: m - 1 };
  const pt = ctTotals(ctInMonth(pm.y, pm.m));
  const days = ctMonthDays(y, m);
  const active = days.filter((d) => d.list.length);
  const hist = ctLast6(y, m);
  const items = ctItemAgg(list);
  const parties = ctPartyAgg(list);
  const bakiAll = ctBakiList(ctAll());

  const kpis =
    '<div class="kpis">' +
      kpiCard({ label: "Saman aaya — " + MONTHS_S[m], value: money0(t.purchase), icon: "⬇", tone: "k-warn",
        delta: moneyDelta(t.purchase, pt.purchase), spark: hist.map((h) => h.t.purchase), sparkColor: "#f59e0b",
        sub: list.filter((e) => e.kind === "purchase").length + " entries · " + active.length + " din" }) +
      kpiCard({ label: "Bikri / income", value: money0(t.sale), icon: "⬆", tone: "k-ok",
        delta: moneyDelta(t.sale, pt.sale), spark: hist.map((h) => h.t.sale), sparkColor: "#10b981",
        sub: "canteen ki kamai" }) +
      kpiCard({ label: "Kharcha", value: money0(t.expense), icon: "↯", tone: "k-bad",
        delta: moneyDelta(t.expense, pt.expense), sub: "gas, bijli, mazdoori, misc" }) +
      kpiCard({ label: "Mahine ka net", value: (t.net < 0 ? "−" : "") + money0(Math.abs(t.net)), icon: "∑",
        tone: t.net >= 0 ? "k-cyan" : "k-bad", delta: moneyDelta(t.net, pt.net),
        sub: "Baki udhaar " + money0(t.balance) }) +
    "</div>";

  const maxBar = Math.max.apply(null, hist.map((h) => Math.max(h.t.purchase, h.t.sale))) || 1;

    '<div class="card chartcard"><div class="card-h"><div><h3>6 mahine ka trend</h3>' +

      '<span class="tag grey">' + monthLabel(y, m) + "</span></div>" +

        hist.map((h) => {
          const mx = Math.max(h.t.purchase, h.t.sale);
          const wrapH = Math.max(3, (mx / maxBar) * 100);
          const aH = mx ? Math.max(3, (h.t.purchase / mx) * 100) : 0;
          const bH = mx ? Math.max(3, (h.t.sale / mx) * 100) : 0;
          return '<div class="col' + (h.now ? " now" : "") + '" title="' + h.label + ": saman " + money0(h.t.purchase) + " · bikri " + money0(h.t.sale) + '">' +
            '<div class="val">' + money0(h.t.net) + "</div>" +

  const dayCard =

          '<tfoot><tr><td colspan="2">Mahine ka total (' + active.length + " din)</td>" +
            '<td class="num">' + t.count + "</td>" +
            '<td class="num">−' + moneyS(t.purchase) + "</td>" +
            '<td class="num">+' + moneyS(t.sale) + "</td>" +
            '<td class="num">−' + moneyS(t.expense) + "</td>" +

/* file → chhota JPEG dataURL (localStorage meAtana hi rahe jitna zaroori) */
function ctReadPhoto(file, cb) {
  if (!file) return;
  if (!/^image\//.test(file.type || "")) return toast("Sirf photo (image) file chahiye", "bad");
  if (file.size > 15 * 1024 * 1024) return toast("Photo bahut badi hai — 15MB se chhoti lo", "bad");
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      try {
        const MAX = 1100;
        const s = Math.min(1, MAX / Math.max(img.width || MAX, img.height || MAX));
        const w = Math.max(1, Math.round((img.width || MAX) * s));
        const h = Math.max(1, Math.round((img.height || MAX) * s));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = 0.72, url = cv.toDataURL("image/jpeg", q);
        while (url.length > 320000 && q > 0.38) { q -= 0.08; url = cv.toDataURL("image/jpeg", q); }
        cb(url);
      } catch (err) { toast("Photo process nahi hui — dobara try karo", "bad"); }
    };
    img.onerror = () => toast("Photo padhi nahi gayi — dobara try karo", "bad");
    img.src = fr.result;
  };
  fr.onerror = () => toast("Photo padhi nahi gayi — dobara try karo", "bad");
  fr.readAsDataURL(file);
}

function ctDefaultDate() {

  const dp = ctParts(u.date);
  if (dp.y === UI.year && dp.m === UI.month) return u.date;
  return monthFirst(UI.year, UI.month);
}

function ctDraftAmount(d) {
  if (!d) return 0;
  if (d.mode === "total") return r2(Math.max(0, num(d.amount)));
  return r2((d.items || []).reduce((t, i) => t + ctItemAmt(i), 0));
}

  const unitSel = '<select class="inp" data-ct-item="' + i + '" data-ct-f="unit">' +
    units.map((u) => '<option value="' + esc(u) + '"' + (u === (it.unit || "kg") ? " selected" : "") + ">" + esc(u) + "</option>").join("") + "</select>";
  const pm = it.priceMode === "line" ? "line" : "unit";

    ? '<input class="inp" value="—" disabled style="text-align:center;color:var(--faint)" title="Ek-saath total mode me item ka rate nahi likhte">'
    : '<div class="ct-price">' +
        '<input class="inp" type="number" min="0" step="0.5" placeholder="' + (pm === "line" ? "Poori line ₹" : "Rate ₹") +
          '" value="' + (pm === "line" ? (num(it.lineTotal) || "") : (num(it.rate) || "")) +
          '" data-ct-item="' + i + '" data-ct-f="' + (pm === "line" ? "lineTotal" : "rate") + '">' +
        '<select class="ct-pm" data-ct-item="' + i + '" data-ct-f="priceMode" title="Ye price kiska hai — 1 unit ka ya poori line ka?">' +
          '<option value="unit"' + (pm === "unit" ? " selected" : "") + ">₹ / " + esc(unitLbl) + "</option>" +

/* amount cell ka HTML — line mode me per-unit rate bhi chhota sa dikhta hai */
function ctAmtHTML(it, isTotal) {
  if (isTotal) return "—";
  const v = ctItemAmt(it);
  if (!v) return "—";
  const extra = it.priceMode === "line" && num(it.qty) > 0
    ? '<small>= ' + rateS(ctItemUnitRate(it)) + "/" + esc(String(it.unit || "kg")) + "</small>"
    : "";
  return moneyS(v) + extra;
}
function ctPatchRowAmt(row, it) {
  if (!row) return;
  const a = $(".amt", row);
  if (!a) return;
  a.innerHTML = ctAmtHTML(it, false);
  a.classList.toggle("zero", !ctItemAmt(it));
}

function ctRepaintItems() {
  const wrap = $("#ctItemsWrap");
  if (!wrap) return;
  const scroll = window.scrollY;
  wrap.innerHTML = ctItemsWrapHTML();
  window.scrollTo(0, scroll);
  ctPatchTotals();
}
function ctPatchTotals() {
  const d = ctUI().edit;
  if (!d) return;
  const amt = ctDraftAmount(d);
  const big = $("#ctTotalBig");
  if (big) big.textContent = moneyS(amt);
  const paidEl = $("#ctPaid");
  const balEl = $("#ctBal");
  if (balEl) balEl.value = moneyS(Math.max(0, amt - num(paidEl ? paidEl.value : d.paid)));
  const cnt = $("#ctItemsCount");
  if (cnt) {
    const n = (d.items || []).filter((i) => i.name || num(i.qty) || num(i.rate) || num(i.lineTotal)).length;
    cnt.textContent = n ? n + " item line" + (n > 1 ? "s" : "") : "Koi item nahi";
  }
  const hint = $("#ctKindHint");
  if (hint) hint.textContent = ctKindHint(d.kind);
}

/* modal ke andar ka input — draft update + sirf totals patch (focus nahi tootta) */
function ctFieldInput(el) {
  const d = ctUI().edit;
  if (!d || !el) return;
  const idx = el.dataset ? el.dataset.ctItem : null;
  if (idx !== undefined && idx !== null && idx !== "") {
    const i = Number(idx), f = el.dataset.ctF;
    const it = (d.items || [])[i];
    if (!it) return;
    const row = el.closest ? el.closest(".ct-row") : null;
    if (f === "priceMode") {
      /* “₹ / unit”  ↔  “₹ poori line” — likha hua number carry hota hai */
      const nv = el.value === "line" ? "line" : "unit";
      if (nv === (it.priceMode === "line" ? "line" : "unit")) return;
      if (nv === "line") it.lineTotal = r2(num(it.qty) * num(it.rate));
      else it.rate = num(it.qty) > 0 ? rRate(num(it.lineTotal) / num(it.qty)) : rRate(num(it.lineTotal));
      it.priceMode = nv;
      ctRepaintItems();
      return;
    }
    if (f === "name" || f === "unit") {
      it[f] = el.value;
      if (f === "unit" && row) {
        it.unitTouched = true;   /* user ne khud unit chuni — auto-guess ab nahi */
        const o = $('.ct-pm option[value="unit"]', row);
        if (o) o.textContent = "₹ / " + (el.value || "kg");
      }
    } else if (f === "lineTotal") {
      it.lineTotal = Math.max(0, num(el.value));
    } else {
      it[f] = Math.max(0, num(el.value));
    }
    if (row && d.mode !== "total") ctPatchRowAmt(row, it);
    ctPatchTotals();
    return;
  }
  const id = el.id;
  if (id === "ctLump") { d.amount = Math.max(0, num(el.value)); ctPatchTotals(); }
  else if (id === "ctPaid") { d.paid = Math.max(0, num(el.value)); ctPatchTotals(); }
  else if (id === "ctParty") d.party = el.value;
  else if (id === "ctBill") d.billNo = el.value;
  else if (id === "ctNote") d.note = el.value;
  else if (id === "ctDateM") { if (el.value) d.date = el.value; }
  else if (id === "ctPayMode") { d.payMode = CT_PAY[el.value] ? el.value : "cash"; }
}
/* v3.4 — item ke NAAM se unit ka andaza (jab rate list me rate na ho):
   naam likhte hi unit apne aap — doodh→ltr, kesar/dhaniya→gram, anda→dozen, bread→pcs… */
const CT_UNIT_HINTS = [
  [/doodh|dudh|milk|pani|paani|water|cola|juice|ras\b|sharbat|lassi|chhaach|dahi|curd|oil|tel\b|ghee|syrup|squash|nimbu pani/i, "ltr"],
  [/kesar|zafron|zafran|elaichi|cardamom|zeera|jeera|saunf|ajwain|heeng|hing|tejpatta|pudina|mint|dhaniya|coriander|adrak|ginger|lahsun|garlic|mirch|chilli|haldi|turmeric|sounth|masala|namak|salt|kali mirch|long|laung|dalchini/i, "gram"],
  [/anda|egg/i, "dozen"],
  [/biscuit|biskut|namkeen|chips|kurkure|bhujia|wafer|waffer|chocolate|toffee|candy|muran|papad|soup packet/i, "pkt"],
  [/bread|pav\b|pao\b|bun\b|cup\b|glass|gilas|spoon|chammach|cylinder|regulator|stove|chulha|kadai|tawa|bartan|knife|chaku|dibba|box|bottle|boti|cap\b|lid\b/i, "pcs"],
  [/aata|flour|chawal|rice|dal\b|daal|cheeni|sugar|chai|tea|maggi|noodle|sabzi|sabji|vegetable|aloo|pyaz|onion|tamatar|tomato|gobhi|bhindi|baigan|gajar|mooli|koyla|coal|lakdi|wood|barf|ice|maida|suji|besan/i, "kg"]
];
function ctAutoUnit(el, it) {
  if (!it || it.unitTouched) return;
  const nm = String(el.value || "");
  if (!nm.trim()) return;
  const m = CT_UNIT_HINTS.find((h) => h[0].test(nm));
  const hitU = m ? m[1] : "";
  if (!hitU || hitU === it.unit) return;
  it.unit = hitU;
  const row = el.closest ? el.closest(".ct-row") : null;
  if (row) {
    const uSel = $('[data-ct-f="unit"]', row);
    if (uSel) {
      if (!Array.from(uSel.options).some((o) => o.value === hitU)) uSel.add(new Option(hitU, hitU));
      uSel.value = hitU;
    }
    const o = $('.ct-pm option[value="unit"]', row);
    if (o) o.textContent = "₹ / " + hitU;
  }
}
/* item ka naam blur/change hone par rate list se rate + unit bhar do */
function ctAutoRate(el) {
  const d = ctUI().edit;
  if (!d || d.mode === "total" || !el || el.dataset.ctF !== "name") return;
  const i = Number(el.dataset.ctItem);
  const it = (d.items || [])[i];
  if (!it) return;
  const hit = ctRateFor(el.value) || ctLastRateInfo(el.value);
  if (!hit) { ctAutoUnit(el, it); return; }
  const rate = num(hit.rate);
  if (!rate) return;
  const row = el.closest(".ct-row");
  if (!num(it.rate) && !num(it.lineTotal)) {
    /* rate list ka rate PER-UNIT hai — is line ko "₹ / unit" par palat do */
    it.priceMode = "unit";
    it.rate = rRate(rate);
    const pInp = row ? $(".ct-price .inp", row) : null;
    if (pInp) {
      pInp.dataset.ctF = "rate";
      pInp.placeholder = "Rate ₹";
      pInp.value = num(it.rate) || "";
    }
    const pmSel = row ? $(".ct-pm", row) : null;
    if (pmSel) pmSel.value = "unit";
  }
  if (hit.unit && it.unit !== hit.unit && !it.unitTouched) {
    it.unit = hit.unit;
    const uSel = row ? $('[data-ct-f="unit"]', row) : null;
    if (uSel) {
      if (!Array.from(uSel.options).some((o) => o.value === hit.unit)) uSel.add(new Option(hit.unit, hit.unit));
      uSel.value = hit.unit;
    }
    const o = row ? $('.ct-pm option[value="unit"]', row) : null;
    if (o) o.textContent = "₹ / " + hit.unit;
  }
  if (row) ctPatchRowAmt(row, it);
  ctPatchTotals();
}

/* ------------------------- 21j. SAVE / DELETE ------------------------- */
function ctSave() {
  const d = ctUI().edit;
  if (!d) return;
  const el = (id) => document.getElementById(id);
  const party = el("ctParty") ? el("ctParty").value.trim() : String(d.party || "");
  const billNo = el("ctBill") ? el("ctBill").value.trim() : String(d.billNo || "");
  const note = el("ctNote") ? el("ctNote").value.trim() : String(d.note || "");
  const date = el("ctDateM") && el("ctDateM").value ? el("ctDateM").value : d.date;
  const payMode = el("ctPayMode") && CT_PAY[el("ctPayMode").value] ? el("ctPayMode").value : d.payMode;
  const paidRaw = Math.max(0, num(el("ctPaid") ? el("ctPaid").value : d.paid));
  const lumpRaw = Math.max(0, num(el("ctLump") ? el("ctLump").value : d.amount));

  const items = (d.items || []).map(normCtItem).filter((i) => i.name || i.qty || i.rate || i.lineTotal);
  const itemsTotal = r2(items.reduce((t, i) => t + ctItemAmt(i), 0));
  const amount = d.mode === "total" ? r2(lumpRaw) : itemsTotal;

  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date))) return toast("Sahi date chuno", "bad");
  if (amount <= 0 && !items.length) return toast("Kuch to likho — item ka price ya pura total", "bad");
  if (amount <= 0 && d.mode !== "total") {
    return toast("Price nahi bhara. Har line me price likho — ₹/unit, ya select me “₹ poori line” chun kar line ka total — ya “Σ Ek saath pura total” chuno.", "bad");
  }
  if (amount <= 0 && d.mode === "total") return toast("Pura total (₹) likho — jaise 3450", "bad");

  const isNew = !d.id;
  const beforeSave = syncClone(Store.data);
  const C = ct();
  const prev = isNew ? null : (C.entries.find((x) => x.id === d.id) || null);
  const prevSnap = prev ? JSON.parse(JSON.stringify(prev)) : null;

  const entry = normCtEntry({
    id: isNew ? uid() : d.id,
    date: date, kind: d.kind, mode: d.mode, items: items, amount: amount,
    party: party, billNo: billNo, paid: r2(clamp(paidRaw, 0, amount)), payMode: payMode, note: note,
    photo: String(d.photo || ""),
    createdAt: prevSnap ? prevSnap.createdAt : Date.now(), updatedAt: Date.now()
  });

  if (isNew) C.entries.push(entry);
  else {
    const i = C.entries.findIndex((x) => x.id === entry.id);
    if (i >= 0) C.entries[i] = entry; else C.entries.push(entry);
  }
  ctSyncRates(entry);
  ctLogIt(isNew ? "add" : "edit", entry, prevSnap, ctLogText(entry) + (isNew ? "" : " — edited"));

  /* Failed persistence never announces success or leaves half-updated rates. */
  if (!Store.save()) {
    Store.data = beforeSave;
    return toast("Save NAHIN hua — draft yahin hai. Storage/JSON backup check karke dobara Save karein.", "bad");
  }
  closeModal();
  const u = ctUI();
  u.edit = null;
  u.date = entry.date;
  if (UI.view === "canteen") { const p = ctParts(entry.date); UI.year = p.y; UI.month = p.m; }
  if (UI.view !== "canteen") go("canteen"); else render();

  if (isNew) {
    setUndo(() => {
      const CC = ct();
      const j = CC.entries.findIndex((x) => x.id === entry.id);
      if (j >= 0) CC.entries.splice(j, 1);
      ctLogIt("delete", entry, entry, ctLogText(entry) + " — undo");
      if (!Store.saveChange()) { render(); return; } render(); toast("Entry hata di", "ok");
    }, "Entry save ho gayi — " + ctKindOf(entry).label + " " + money0(entry.amount));
  } else {
    toast("Entry update ho gayi ✔", "ok");
  }
}

function ctDelEntry(id) {
  const e = ctEntry(id);
  if (!e) return;
  confirmDialog("Entry delete karein?",
    "<b>" + esc(ctKindOf(e).label) + "</b> · " + esc(e.party || "—") + " · <b>" + money0(ctAmount(e)) + "</b><br>" +
    esc(ctPretty(e.date)) + " — ye entry ledger se hat jayegi. Delete ke baad <b>Undo</b> ya Activity → Restore se wapas la sakte ho.",
    "Delete", () => {
      const C = ct();
      const i = C.entries.findIndex((x) => x.id === id);
      if (i < 0) return closeModal();
      const snap = JSON.parse(JSON.stringify(C.entries[i]));
      C.entries.splice(i, 1);
      ctLogIt("delete", snap, snap, ctLogText(snap) + " — deleted");
      if (!Store.saveChange()) { render(); return; }
      closeModal();
      render();
      setUndo(() => {
        ct().entries.push(snap);
        ctSyncRates(snap);
        ctLogIt("restore", snap, null, ctLogText(snap) + " — restored");
        if (!Store.saveChange()) { render(); return; } render(); toast("Entry wapas aa gayi ✔", "ok");
      }, "Entry delete ho gayi");
    }, true);
}

function ctDupEntry(id) {
  const e = ctEntry(id);
  if (!e) return;
  const copy = JSON.parse(JSON.stringify(e));
  copy.id = "";
  copy.date = isoDate(new Date());
  copy.paid = 0;
  copy.payMode = copy.payMode === "udhaar" ? "udhaar" : "cash";
  closeModal();
  openCtModal(null, copy.date);
  const d = ctUI().edit;
  Object.assign(d, copy, { id: "", createdAt: Date.now(), updatedAt: Date.now() });
  ctRenderModal(false);
  toast("Entry copy ho gayi — date aaj kar di. Check kar ke save karo.", "ok");
}

/* Activity log se delete ki hui entry wapas laao */
function ctRestoreLog(logId) {
  const C = ct();
  const l = C.log.find((x) => x.id === logId);
  if (!l || !l.snapshot) return toast("Is event se entry wapas nahi la sakte", "bad");
  if (ctEntry(l.entryId)) return toast("Ye entry pehle se maujood hai", "bad");
  const e = normCtEntry(l.snapshot);
  C.entries.push(e);
  ctSyncRates(e);
  ctLogIt("restore", e, null, ctLogText(e) + " — activity se restore");
  if (!Store.saveChange()) { render(); return; }
  render();
  toast("Entry wapas aa gayi ✔ — " + ctPretty(e.date), "ok");
}

/* ------------------------- 21k. PAYMENT (baki chukta) ------------------------- */
function ctPayModal(id) {
  const e = ctEntry(id);
  if (!e) return;
  const bal = ctBalance(e);
  const paidNow = Math.min(ctPaid(e), ctAmount(e));
  openModal(
    '<div class="modal sm"><div class="modal-h"><div><h3>Paisa diya likho</h3>' +
      "<p>" + esc(ctKindOf(e).label) + " · " + esc(e.party || "—") + " · " + esc(ctPretty(e.date)) + "</p></div>" +
      '<button class="x" data-act="closeModal">✕</button></div>' +

/* ------------------------- 21m. CSV / PRINT / SHARE ------------------------- */
function ctCsvList() {
  const u = ctUI();
  if (u.tab === "day") return ctOnDate(u.date);
  if (u.tab === "entries") return ctFilteredEntries();
  return ctInMonth(UI.year, UI.month);
}
function ctCsv() {
  const list = ctCsvList();
  if (!list.length) return toast("Export karne ke liye koi entry nahi", "bad");
  const head = ["Date", "Day", "Type", "Party", "Bill no", "Mode", "Item", "Qty", "Unit", "Price mode", "Rate (per unit)", "Item amount",
                "Entry total", "Paid", "Balance", "Pay mode", "Note"];
  const lines = [head.join(",")];
  list.slice().sort((a, b) => (a.date === b.date ? num(a.createdAt) - num(b.createdAt) : (a.date < b.date ? -1 : 1))).forEach((e) => {
    const its = (e.items || []).filter((i) => i.name || i.qty || i.rate);
    const base = [e.date, ctDayName(e.date), ctKindOf(e).en, e.party || "", e.billNo || "",
                  e.mode === "total" ? "Lump-sum total" : "Item-wise rate"];
    const tail = [ctAmount(e), Math.min(ctPaid(e), ctAmount(e)), ctBalance(e), CT_PAY[e.payMode] || "Cash", e.note || ""];
    if (e.mode === "itemized" && its.length) {
      its.forEach((i) => lines.push(base.concat([i.name, num(i.qty), i.unit,
        i.priceMode === "line" ? "Poori line ka total" : "Per unit (1 " + (i.unit || "kg") + ")",
        ctItemUnitRate(i), ctItemAmt(i)], tail).map(csvCell).join(",")));
    } else {
      lines.push(base.concat([its.length ? ctItemLabel(e) : "(ek saath total)", "", "", "", "", ""], tail).map(csvCell).join(","));
    }
  });
  const t = ctTotals(list);
  lines.push([]);
  lines.push(["TOTALS", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""].map(csvCell).join(","));
  lines.push(["", "", "Purchase (saman)", "", "", "", "", "", "", "", "", t.purchase].map(csvCell).join(","));
  lines.push(["", "", "Sale", "", "", "", "", "", "", "", "", t.sale].map(csvCell).join(","));
  lines.push(["", "", "Expense", "", "", "", "", "", "", "", "", t.expense].map(csvCell).join(","));
  lines.push(["", "", "Net", "", "", "", "", "", "", "", "", t.net].map(csvCell).join(","));
  lines.push(["", "", "Paid", "", "", "", "", "", "", "", "", t.paid].map(csvCell).join(","));
  lines.push(["", "", "Balance", "", "", "", "", "", "", "", "", t.balance].map(csvCell).join(","));
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const u = ctUI();
  a.download = u.tab === "day" ? "Canteen_Din_" + u.date + ".csv"
    : u.tab === "entries" ? "Canteen_Entries_" + isoDate(new Date()) + ".csv"
    : "Canteen_" + MONTHS_S[UI.month] + "-" + UI.year + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Canteen CSV download ho gayi", "ok");
}

function ctPdfTable(p, y, cols, rows, totalRow) {
  const T = ctTpl();
  const G = T.style === "minimal" ? T.line : CT_PDF_GRID;
  const HF = T.hdr;
  const xs = []; let xa = M; cols.forEach((c) => { xs.push(xa); xa += c.w; });
  let segTop = null, mergeTop = null, mergeSpan = 1;
  const closeSeg = (yBot) => {
    if (segTop == null) return;
    p.line(M, segTop, M + CW, segTop, G, 0.6);
    p.line(M, yBot, M + CW, yBot, G, 0.6);
    p.line(M, segTop, M, yBot, G, 0.6);
    p.line(M + CW, segTop, M + CW, yBot, G, 0.6);
    xs.slice(1).forEach((x, i) => p.line(x, segTop, x, mergeTop != null && i + 1 < mergeSpan ? mergeTop : yBot, G, 0.6));
    if (T.style === "bill") {
      p.line(M, segTop, M + CW, segTop, T.brand, 0.9);
      p.line(M, yBot, M + CW, yBot, T.brand, 0.9);
      p.line(M, segTop, M, yBot, T.brand, 0.9);
      p.line(M + CW, segTop, M + CW, yBot, T.brand, 0.9);
    }
    segTop = null; mergeTop = null; mergeSpan = 1;
  };
  const head = () => {
    p.rect(M, y - 6, CW, 16, HF);
    let x = M;
    cols.forEach((c) => {
      p.text(c.r ? x + c.w - CT_PDF_PR : x + CT_PDF_PL, y, 7.875, String(c.l).toUpperCase(),
        { bold: true, color: T.style === "minimal" ? T.ink : CT_PDF_SECC, align: c.r ? "right" : undefined, charSpace: .39375, maxWidth: c.w - 14 });
      x += c.w;
    });
    segTop = y + 10;
    p.line(M, y - 6, M + CW, y - 6, G, 0.6);
    return y - 6;
  };
  y = ctEnsure(p, y, 50);
  y = head();
  const nextPage = () => { closeSeg(y); p.newPage(); y = 780; y = head(); };
  const drawRow = (cells, bold, span) => {
    const lines = Math.max.apply(null, cells.map((c) => c.length).concat([1]));
    const fullHeight = lines * 12 + 8;
    if (y - fullHeight < 64 && fullHeight <= 710) nextPage();
    let offset = 0;
    while (offset < lines) {
      let capacity = Math.floor((y - 64 - 8) / 12);
      if (capacity < 1) { nextPage(); capacity = Math.floor((y - 64 - 8) / 12); }
      const count = Math.min(lines - offset, capacity), h = count * 12 + 8;
      if (span > 1) { mergeTop = y; mergeSpan = span; }
      let x = M;
      cells.forEach((cs, i) => {
        const width = i === 0 && span > 1 ? cols.slice(0, span).reduce((sum, c) => sum + c.w, 0) : cols[i].w;
        cs.slice(offset, offset + count).forEach((ln, li) => {
          p.text(cols[i].r ? x + width - CT_PDF_PR : x + CT_PDF_PL, y - 11 - li * 12, 9, ln,
            { align: cols[i].r ? "right" : undefined, bold: bold || !!cols[i].b, color: T.ink, maxWidth: width - 14 });
        });
        x += cols[i].w;
      });
      y -= h;
      p.line(M, y, M + CW, y, G, .6);
      offset += count;
      if (offset < lines) nextPage();
    }
  };
  const cells = (row, bold, span) => row.map((v, i) => {
    const s = String(v == null ? "" : v);
    const width = i === 0 && span > 1 ? cols.slice(0, span).reduce((sum, c) => sum + c.w, 0) : cols[i].w;
    return cols[i].r ? [s] : p.wrap(s, 9, width - 14, bold || !!cols[i].b);
  });
  rows.forEach((r) => drawRow(cells(r, false, 1), false, 1));

  }

}

function ctPdfRichLines(p, parts, size, maxW) {
  const lines = [[]]; let used = 0;

    const tokens = toAscii(part[0]).match(/\S+\s*/g) || [];
    tokens.forEach((token) => {
      const pieces = pdfWidth(token.trimEnd(), size, !!part[1]) > maxW ? p.wrap(token, size, maxW, !!part[1]) : [token];
      pieces.forEach((piece) => {
        const w = pdfWidth(piece, size, !!part[1]);

        const current = lines[lines.length - 1], last = current[current.length - 1];

    });
