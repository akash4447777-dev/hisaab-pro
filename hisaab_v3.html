/* A tiny PDF writer — no libraries, no internet needed. */
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];

function toAscii(str) {
  const map = { "₹": "Rs.", "–": "-", "—": "-", "’": "'", "‘": "'", "“": '"', "”": '"', "•": "-", "…": "...", "≤": "<=", "≥": ">=", "✔": "v", "✕": "x", "✖": "x", "→": "->", "×": "x", "÷": "/", "−": "-", "⚡": "*", "⧉": "|", "°": " deg", "\n": " " };
  let out = "";
  for (const ch of String(str == null ? "" : str)) {
    if (map[ch] !== undefined) out += map[ch];
    else if (ch.charCodeAt(0) < 128) out += ch;
    else if (ch.charCodeAt(0) < 256) out += ch;
    else out += "?";
  }
  return out;
}
function pdfEsc(s) { return toAscii(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }
function pdfWidth(str, size, bold) {
  const s = toAscii(str);
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    const code = s.charCodeAt(i);
    w += (code >= 32 && code <= 126) ? HELV_W[code - 32] : 556;
  }
  return (w * size) / 1000 * (bold ? 1.045 : 1);
}

function PdfDoc() { this.pages = []; this.cur = null; this.newPage(); }
PdfDoc.prototype.newPage = function () { this.cur = []; this.pages.push(this.cur); this.y = 800; return this; };
PdfDoc.prototype.op = function (s) { this.cur.push(s); };
PdfDoc.prototype.text = function (x, y, size, str, opt) {
  opt = opt || {};
  const bold = !!opt.bold;
  const col = opt.color || [0.06, 0.09, 0.16];
  let xx = x;
  if (opt.align === "right") xx = x - pdfWidth(str, size, bold);
  else if (opt.align === "center") xx = x - pdfWidth(str, size, bold) / 2;
  this.op("BT /" + (bold ? "F2" : "F1") + " " + size + " Tf " + col[0] + " " + col[1] + " " + col[2] + " rg 1 0 0 1 " + xx.toFixed(2) + " " + y.toFixed(2) + " Tm (" + pdfEsc(str) + ") Tj ET");
  return this;
};
PdfDoc.prototype.line = function (x1, y1, x2, y2, color, w) {
  const c = color || [0.85, 0.87, 0.9];
  this.op((w || 0.7) + " w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x1.toFixed(2) + " " + y1.toFixed(2) + " m " + x2.toFixed(2) + " " + y2.toFixed(2) + " l S");
  return this;
};
PdfDoc.prototype.rect = function (x, y, w, h, color) {
  const c = color || [0.96, 0.97, 0.99];
  this.op(c[0] + " " + c[1] + " " + c[2] + " rg " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re f");
  return this;
};
PdfDoc.prototype.box = function (x, y, w, h, stroke, fill) {
  if (fill) this.rect(x, y, w, h, fill);
  const c = stroke || [0.87, 0.89, 0.92];
  this.op("0.7 w " + c[0] + " " + c[1] + " " + c[2] + " RG " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re S");
  return this;
};
PdfDoc.prototype.wrap = function (str, size, maxW, bold) {
  const words = toAscii(str).split(/\s+/);
  const lines = []; let cur = "";
  words.forEach((word) => {
    const test = cur ? cur + " " + word : word;
    if (pdfWidth(test, size, bold) > maxW && cur) { lines.push(cur); cur = word; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
};
PdfDoc.prototype.build = function () {
  const objs = [];
  objs.push("<< /Type /Catalog /Pages 2 0 R >>");
  objs.push(""); // pages placeholder
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const kids = [];
  this.pages.forEach((ops) => {
    const body = ops.join("\n");
    const cid = objs.length + 1;
    objs.push("<< /Length " + body.length + " >>\nstream\n" + body + "\nendstream");
    const pid = objs.length + 1;
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + cid + " 0 R >>");
    kids.push(pid);
  });
  objs[1] = "<< /Type /Pages /Kids [" + kids.map((k) => k + " 0 R").join(" ") + "] /Count " + kids.length + " >>";
  let out = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((body, i) => { offsets.push(out.length); out += (i + 1) + " 0 obj\n" + body + "\nendobj\n"; });
  const xref = out.length;
  out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
  offsets.forEach((o) => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
  out += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  return out;
};

/* ---- statement drawing ---- */
const C = { ink: [0.06, 0.09, 0.16], muted: [0.42, 0.45, 0.5], line: [0.85, 0.87, 0.9], light: [0.96, 0.97, 0.99], primary: [0.31, 0.27, 0.9], dark: [0.06, 0.09, 0.16], white: [1, 1, 1], green: [0.02, 0.6, 0.4], red: [0.78, 0.13, 0.13], hdr: [0.95, 0.96, 0.98] };
const PW = 595.28, M = 40, CW = PW - M * 2, RIGHT = PW - M;

function pdfHeader(p, title, year, month, d) {
  p.text(M, 800, 16, d.shopName || "My Shop", { bold: true, color: C.ink });
  let yy = 786;
  p.wrap(toAscii(d.address || ""), 8.5, 300).forEach((l) => { p.text(M, yy, 8.5, l, { color: C.muted }); yy -= 10.5; });
  if (d.phone) { p.text(M, yy, 8.5, "Phone: " + d.phone, { color: C.muted }); yy -= 10.5; }
  p.text(RIGHT, 800, 12, title, { bold: true, align: "right", color: C.ink });
  p.text(RIGHT, 787, 8.5, "Masik Vetan Vivaran", { align: "right", color: C.muted });
  p.text(RIGHT, 776, 9, monthLabel(year, month), { align: "right", color: C.ink, bold: true });
  p.line(M, 764, RIGHT, 764, C.ink, 1.6);
  p.y = 748;
}

function pdfKV(p, x, y, w, k, v) {
  p.text(x, y, 7.8, k.toUpperCase(), { color: C.muted, bold: true });
  p.text(x + w, y, 9, v, { align: "right", color: C.ink, bold: true });
  p.line(x, y - 4, x + w, y - 4, [0.92, 0.93, 0.95], 0.5);
}

function pdfSectionTitle(p, text) {
  if (p.y < 120) { p.newPage(); }
  p.y -= 14;
  p.text(M, p.y, 8.2, text.toUpperCase(), { bold: true, color: C.primary });
  p.y -= 4.5;
  p.line(M, p.y, RIGHT, p.y, C.line, 0.8);
  p.y -= 13;
}

function pdfTableHeader(p, cols) {
  const h = 15;
  p.rect(M, p.y - h + 3, CW, h, C.hdr);
  cols.forEach((c) => {
    if (c.align === "right") p.text(M + c.x + c.w, p.y - 5, 7.6, c.t.toUpperCase(), { align: "right", color: C.muted, bold: true });
    else p.text(M + c.x, p.y - 5, 7.6, c.t.toUpperCase(), { color: C.muted, bold: true });
  });
  p.y -= h;
  p.line(M, p.y + 3, RIGHT, p.y + 3, C.line, 0.7);
}

function pdfRow(p, cols, vals, opt) {
  opt = opt || {};
  if (p.y < 90) {
    p.newPage();
    pdfTableHeader(p, cols);
  }
  const h = 14.5;
  if (opt.bg) p.rect(M, p.y - h + 2.5, CW, h, opt.bg);
  cols.forEach((c, i) => {
    const v = vals[i] == null ? "" : String(vals[i]);
    const bold = opt.bold || (c.bold && true);
    if (c.wrap) {
      const lines = p.wrap(v, 8.6, c.w);
      lines.slice(0, 2).forEach((l, li) => p.text(M + c.x, p.y - 5 - li * 10, 8.6, l, { color: opt.color || C.ink, bold: bold }));
    } else if (c.align === "right") p.text(M + c.x + c.w, p.y - 5, 8.8, v, { align: "right", color: opt.color || C.ink, bold: bold });
    else p.text(M + c.x, p.y - 5, 8.8, v, { color: opt.color || C.ink, bold: bold });
  });
  p.y -= h;
  p.line(M, p.y + 2.5, RIGHT, p.y + 2.5, [0.92, 0.93, 0.95], 0.5);
}

  /* deductions */
  pdfSectionTitle(p, "Advances & deductions");
  const c2 = [{ t: "Date", x: 8, w: 60 }, { t: "Particulars", x: 78, w: 330 }, { t: "Amount (Rs.)", x: 425, w: CW - 433, align: "right" }];

function savePdf(filename, str) {
  try {
    /* write as raw Latin-1 bytes so the xref offsets stay exact */
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const blob = new Blob([bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast("PDF downloaded: " + filename, "ok");
  } catch (e) { toast("Could not create PDF — open the file in a browser tab and retry", "bad"); }
}
function safeName(s) { return String(s || "worker").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, ""); }

function downloadStatementPdf(wid, y, m) {
  const w = Store.worker(wid); if (!w) return;
  const rec = Store.ensureRecord(wid, y, m, false);
  const c = calc(w, rec, Store.data.settings);
  const p = new PdfDoc();
  drawStatement(p, w, rec, c);
  savePdf("Salary_" + safeName(w.name) + "_" + MONTHS_S[m] + "-" + y + ".pdf", p.build());
}
function downloadAllPdfs() {
  const rows = rowsForMonth(UI.year, UI.month);
  if (!rows.length) return toast("No workers to export", "bad");
  const p = new PdfDoc();
  drawSummaryPage(p, rows, UI.year, UI.month);

  savePdf("Payroll_" + MONTHS_S[UI.month] + "-" + UI.year + ".pdf", p.build());
}

function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d.workers || !d.records) throw new Error("bad");
        Store.data = { settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) }, workers: d.workers, records: d.records };
        Store.save(); render(); toast("Backup restored", "ok");
      } catch (e) { toast("Invalid backup file", "bad"); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ------------------ 18. CLOUD LOGIN & SYNC (Supabase) ------------------- */
const CLOUD_KEY = "hisaabPro.cloud.v1";
const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}

const Cloud = {
  cfg: null, client: null, user: null, mode: "in",
  status: "local", lastSync: 0, dirty: false, busy: false, pushTimer: null, blocked: false,

  readCfg() {
    try { const r = localStorage.getItem(CLOUD_KEY); this.cfg = r ? JSON.parse(r) : null; }
    catch (e) { this.cfg = null; }
    return this.cfg;
  },
  writeCfg(c) {
    this.cfg = c;
    try { if (c) localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); else localStorage.removeItem(CLOUD_KEY); } catch (e) {}
  },
  configured() { return !!(this.cfg && this.cfg.url && this.cfg.key); },

  async initClient() {
    if (this.client) return this.client;
    if (!window.supabase) await loadScriptOnce(SUPABASE_CDN);
    if (!window.supabase) throw new Error("Supabase library load failed");
    this.client = window.supabase.createClient(this.cfg.url, this.cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
    return this.client;
  },

  async boot() {
    this.readCfg();
    if (!this.configured()) { this.status = "local"; updateCloudBadge(); return; }
    try {
      await this.initClient();
      const res = await this.client.auth.getSession();
      const session = res && res.data ? res.data.session : null;
      this.user = session ? session.user : null;
      if (this.user) {
        this.status = "synced"; showLogin(false);
        await this.maybePull(true);
      } else { this.status = "loggedout"; showLogin(true); }
    } catch (e) {
      this.status = "error"; showLogin(true);
    }
    updateCloudBadge();
  },

  setStatus(s, msg) { this.status = s; updateCloudBadge(msg); },

  async signIn(email, password) {
    await this.initClient();
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    this.user = data.user;
    await this.afterLogin();
  },

  async signUp(email, password) {
    await this.initClient();
    const { data, error } = await this.client.auth.signUp({ email, password });
    if (error) throw error;
    if (!data.session) return { needsConfirm: true };
    this.user = data.user;
    await this.afterLogin();
    return { needsConfirm: false };
  },

  async signOut() {
    try { if (this.client) await this.client.auth.signOut(); } catch (e) {}
    this.user = null; this.status = "loggedout";
    showLogin(true); render();
  },

  async fetchRemote() {
    if (!this.user) return null;
    const { data, error } = await this.client.from("hisaab_data").select("payload,updated_at").eq("user_id", this.user.id).maybeSingle();
    if (error) throw error;
    return data || null;
  },

  schedulePush() {
    if (!this.user) return;
    this.dirty = true;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.pushNow(), 1200);
  },

  async pushNow() {
    if (!this.user || this.busy) return;
    this.busy = true; this.setStatus("saving");
    try {
      const payload = JSON.parse(JSON.stringify(Store.data));
      delete payload.settings.demo;
      const { error } = await this.client.from("hisaab_data")
        .upsert({ user_id: this.user.id, payload: payload, updated_at: new Date().toISOString() });
      if (error) throw error;
      this.dirty = false; this.lastSync = Date.now(); this.setStatus("synced");
    } catch (e) {
      this.setStatus("offline");
    }
    this.busy = false;
  },

  async afterLogin() {
    showLogin(false);
    this.setStatus("synced");
    try {
      const remote = await this.fetchRemote();
      const remoteHas = remote && remote.payload && Array.isArray(remote.payload.workers) && remote.payload.workers.length > 0;
      const localHas = Store.data.workers.length > 0 && Store.data.settings.demo !== true;
      if (remoteHas && localHas && JSON.stringify(remote.payload) !== JSON.stringify(Store.data)) {
        askWhichData(remote);
      } else if (remoteHas && !localHas) {
        adoptRemote(remote);
        toast("Cloud ka data load ho gaya ✔", "ok");
      } else {
        await this.pushNow();
        toast("Data cloud par save ho gaya ✔", "ok");
      }
    } catch (e) {
      toast("Cloud se connect nahi ho paya — internet check karein", "bad");
      this.setStatus("offline");
    }
    render();
  },

  /* pull newer data made on another device */
  async maybePull(force) {
    if (!this.user || this.dirty || this.busy) return;
    if ($("#overlay")) return; /* skip while a dialog is open */
    try {
      const remote = await this.fetchRemote();
      if (!remote || !remote.payload) return;
      const stamp = new Date(remote.updated_at).getTime();
      const remoteHas = Array.isArray(remote.payload.workers);
      if (!remoteHas) return;
      if (stamp > this.lastSync + 1500) {
        if (force || !this.dirty) {
          Store.data = normalizeData(remote.payload);
          Store.save(true);
          this.lastSync = stamp;
          render();
          toast("Doosre device ka naya data aa gaya ✔", "ok");
        }
      } else if (!this.lastSync) { this.lastSync = stamp; }
    } catch (e) { /* silent */ }
  }
};

function normalizeData(d) {
  return {
    settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) },
    workers: Array.isArray(d.workers) ? d.workers : [],
    records: Array.isArray(d.records) ? d.records : []
  };
}
function adoptRemote(remote) {
  Store.data = normalizeData(remote.payload);
  Store.save(true);
  Cloud.lastSync = new Date(remote.updated_at).getTime();
  closeModal(); render();
}
function askWhichData(remote) {
  Cloud._pending = remote;
  const remoteCount = (remote.payload.workers || []).length;
  openModal(
    '<div class="modal" style="max-width:480px"><div class="modal-h"><div><h3>Kaunsa data rakhein?</h3>' +
      '<p>Aapke account me pehle se data hai, aur is device me bhi data hai.</p></div><button class="x" data-act="closeModal">✕</button></div>' +
      '<div class="modal-b" style="font-size:13px;color:#475569">' +
        '<div style="border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px">' +
          '<b style="color:var(--ink)">Cloud par:</b> ' + remoteCount + " workers<br>" +
          '<span style="font-size:11.5px">Last update: ' + esc(String(remote.updated_at).slice(0, 16).replace("T", " ")) + "</span></div>" +
        '<div style="border:1px solid var(--line);border-radius:11px;padding:11px 13px">' +
          '<b style="color:var(--ink)">Is device par:</b> ' + Store.data.workers.length + " workers</div>" +
        '<p style="margin-top:12px;font-size:12px">Agar aap pehli baar login kar rahe hain, to <b>“Is device ka data upload”</b> chunein. ' +
        "Baaki device par kaam kiya hai to <b>“Cloud ka data download”</b> chunein.</p>" +
      '</div>' +
      '<div class="modal-f" style="justify-content:flex-end;flex-wrap:wrap">' +
        '<button class="btn" data-act="useCloud">☁️ Cloud ka data download</button>' +
        '<button class="btn primary" data-act="useLocal">⤒ Is device ka data upload</button>' +
      "</div></div>"
  );
}

function showLogin(show) {
  const root = $("#loginRoot");
  if (!root) return;
  Cloud.blocked = !!show;
  if (!show) { root.innerHTML = ""; document.body.style.overflow = ""; return; }
  root.innerHTML = loginScreenHTML();
  document.body.style.overflow = "hidden";
  const go = $("#lcGo");
  if (go) go.addEventListener("click", submitLogin);
  const pass = $("#lcPass");
  if (pass) pass.addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });
  const em = $("#lcEmail");
  if (em) setTimeout(() => em.focus(), 80);
}

function lcError(msg) {
  const el = $("#lcMsg");
  if (el) el.innerHTML = '<div class="banner warn" style="margin-bottom:11px"><span>⚠️</span><div style="font-size:12.5px">' + msg + "</div></div>";
}

async function submitLogin() {
  const email = ($("#lcEmail") ? $("#lcEmail").value : "").trim();
  const pass = $("#lcPass") ? $("#lcPass").value : "";
  if (!email || email.indexOf("@") < 1) { lcError("Sahi email address likhein."); return; }
  if (!pass || pass.length < 6) { lcError("Password kam se kam 6 characters ka hona chahiye."); return; }
  const btn = $("#lcGo");
  if (btn) { btn.disabled = true; btn.textContent = "Please wait…"; }
  try {
    if (Cloud.mode === "up") {
      const r = await Cloud.signUp(email, pass);
      if (r && r.needsConfirm) {
        const el = $("#lcMsg");
        if (el) el.innerHTML = '<div class="banner info" style="margin-bottom:11px"><span>📧</span><div style="font-size:12.5px">' +
          "Account ban gaya! Ab apne email par aaya <b>confirmation link</b> kholkar verify karein, phir yahan <b>Sign in</b> karein.</div></div>";
        Cloud.mode = "in"; showLogin(true);
        return;
      }
    } else {
      await Cloud.signIn(email, pass);
    }
    showLogin(false); render();
    toast("Login ho gaya ✔", "ok");
  } catch (e) {
    const m = (e && e.message ? e.message : "").toLowerCase();
    let msg = "Login nahi ho paya. Internet aur details check karein.";
    if (m.indexOf("invalid login") >= 0) msg = "Email ya password galat hai.";
    else if (m.indexOf("already registered") >= 0) msg = "Ye email pehle se registered hai — <b>Sign in</b> karein.";
    else if (m.indexOf("email not confirmed") >= 0) msg = "Pehle email par aaya confirmation link kholkar verify karein.";
    else if (m.indexOf("failed to fetch") >= 0 || m.indexOf("network") >= 0) msg = "Internet ya Supabase URL/key galat hai.";
    lcError(msg + '<div style="font-size:11px;margin-top:5px;opacity:.8">' + esc(e && e.message ? e.message : "") + "</div>");
    if (btn) { btn.disabled = false; btn.textContent = Cloud.mode === "up" ? "Create account & login" : "Sign in"; }
  }
}

/* ------------------------------ cloud widgets -------------------------- */
function cloudStatusText() {
  if (!Cloud.configured()) return { txt: "Local only", cls: "grey", tip: "Cloud login off hai" };
  if (Cloud.status === "loggedout") return { txt: "Sign in needed", cls: "warn", tip: "Login karein" };
  if (Cloud.status === "error") return { txt: "Cloud error", cls: "bad", tip: "Setup check karein" };
  if (Cloud.status === "saving") return { txt: "Saving…", cls: "grey", tip: "Cloud par save ho raha hai" };
  if (Cloud.status === "offline") return { txt: "Offline", cls: "bad", tip: "Internet aane par khud save hoga" };
  const t = Cloud.lastSync ? new Date(Cloud.lastSync) : null;
  const hh = t ? String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") : "";
  return { txt: "Cloud synced" + (hh ? " · " + hh : ""), cls: "ok", tip: Cloud.user ? Cloud.user.email : "" };
}

function updateCloudBadge() {
  const s = cloudStatusText();
  const html = '<span class="tag ' + s.cls + '" style="font-size:10.5px" title="' + esc(s.tip) + '">☁️ ' + esc(s.txt) + "</span>";
  $$("[data-cloud-badge]").forEach((el) => { el.innerHTML = html; });
}

      "Ek baar free Supabase account banana hoga (2 minute).</div></div>" +
      '<div class="grid g2">' +
        field("Supabase Project URL", '<input class="inp" id="cfgUrl" placeholder="https://abcdefgh.supabase.co" value="' + esc(Cloud.cfg ? Cloud.cfg.url : "") + '">') +
        field("Supabase anon public key", '<input class="inp" id="cfgKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6…" value="' + esc(Cloud.cfg ? Cloud.cfg.key : "") + '">') +
      "</div>" +
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center">' +
        '<button class="btn primary" data-act="cloudConnect">☁️ Connect &amp; login</button>' +
        '<span class="muted" style="font-size:11.5px">Setup steps: <b>Cloud-Login-Setup-Guide.html</b> file me likhe hain</span>' +

async function connectCloud() {
  const url = ($("#cfgUrl") ? $("#cfgUrl").value : "").trim().replace(/\/+$/, "");
  const key = ($("#cfgKey") ? $("#cfgKey").value : "").trim();
  if (!url || url.indexOf("supabase.co") < 0) return toast("Sahi Supabase Project URL daalein", "bad");
  if (!key || key.length < 30) return toast("Sahi anon public key daalein", "bad");
  Cloud.client = null;
  Cloud.writeCfg({ url: url, key: key });
  Cloud.status = "connecting";
  try {
    await Cloud.initClient();
    Cloud.mode = "in";
    showLogin(true);
    toast("Connected — ab email se login karein", "ok");
  } catch (e) {
    toast("Connection fail — URL/key check karein", "bad");
  }
}

function disconnectCloud() {
  confirmDialog("Disconnect cloud?", "Is device par cloud sync band ho jayega. Aapka data browser me safe rahega, aur cloud me bhi rahega. (Dobara connect kar sakte hain.)", "Disconnect", () => {
    try { if (Cloud.client) Cloud.client.auth.signOut(); } catch (e) {}
    Cloud.user = null; Cloud.client = null; Cloud.writeCfg(null); Cloud.status = "local";
    showLogin(false); render(); toast("Cloud disconnect ho gaya");
  }, true);
}

/* ------------------------------ 16. EVENTS ------------------------------ */
document.addEventListener("click", (e) => {
  const nav = e.target.closest("#nav button");
  if (nav) { UI.search = ""; UI.filter = "all"; go(nav.dataset.view); return; }

  if (e.target.closest("input, select, textarea, label")) return;
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const wid = btn.dataset.wid;
  const Y = btn.dataset.y ? Number(btn.dataset.y) : UI.year;
  const M2 = btn.dataset.m !== undefined && btn.dataset.y ? Number(btn.dataset.m) : UI.month;

  switch (act) {
    case "prevMonth": UI.month--; if (UI.month < 0) { UI.month = 11; UI.year--; } render(); break;
    case "nextMonth": UI.month++; if (UI.month > 11) { UI.month = 0; UI.year++; } render(); break;
    case "todayMonth": UI.year = today.getFullYear(); UI.month = today.getMonth(); render(); break;
    case "addWorker": openWorkerModal(); break;
    case "editWorker": openWorkerModal(wid); break;
    case "delWorker":
      const w = Store.worker(wid);
      confirmDialog("Delete worker?", "Remove <b>" + esc(w ? w.name : "") + "</b> and all of their salary records? This cannot be undone.", "Delete worker", () => {
        Store.data.workers = Store.data.workers.filter((x) => x.id !== wid);
        Store.data.records = Store.data.records.filter((r) => r.workerId !== wid);
        Store.save(); render(); toast("Worker deleted");
      }, true); break;
    case "workerHistory": { const ww = Store.worker(wid); UI.search = ww ? ww.name : ""; UI.filter = "all"; go("records"); break; }
    case "closeModal": closeModal(); break;
    case "closeDrawer": closeDrawer(); break;
    case "openProfile": closeModal(); openProfile(wid); break;
    case "toggleThemeIcon": toggleTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); break;
    case "toggleTheme": toggleTheme(btn.dataset.theme); break;
    case "setFilter": UI.filter = btn.dataset.filter; render(); break;
    case "exportCsv": exportCsv(); break;
    case "shareWa": shareWa(wid, Y, M2); break;
    case "doUndo": doUndo(); break;
    case "openCmdk": openCmdk(); break;
    case "openRec": openRecordModal(wid, UI.year, UI.month); break;
    case "openRecAt": openRecordModal(wid, Y, M2); break;
    case "printRec": printStatement(wid, UI.year, UI.month); break;
    case "printRecAt": printStatement(wid, Y, M2); break;
    case "pdfRec": downloadStatementPdf(wid, UI.year, UI.month); break;
    case "pdfRecAt": downloadStatementPdf(wid, Y, M2); break;
    case "togglePaid": togglePaid(wid, UI.year, UI.month); render(); break;
    case "gotoHisaab": go("hisaab"); break;
    case "autoFillAll": autoFillAll(); break;
    case "copyPrev": copyPreviousMonth(); break;
    case "markAllPaid": markAllPaid(); break;
    case "printAll": printAll(); break;
    case "pdfAll": downloadAllPdfs(); break;
    case "addAdv": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      const d = new Date();
      rec.advances.push({ id: uid(), date: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"), note: "", amount: 0 });
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal();
      const rows = $$("#advList .adv-row"); const last = rows[rows.length - 1];
      if (last) { const n = $(".a-note", last); if (n) n.focus(); }
      break;
    }
    case "delAdv": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.advances = rec.advances.filter((a) => a.id !== btn.dataset.id);
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal(); break;
    }
    case "addDed": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.deductions.push({ id: uid(), label: "", amount: 0 });
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal();
      const rows = $$("#dedList .ded-row"); const last = rows[rows.length - 1];
      if (last) { const n = $(".d-label", last); if (n) n.focus(); }
      break;
    }
    case "delDed": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.deductions = rec.deductions.filter((d) => d.id !== btn.dataset.id);
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal(); break;
    }
    case "fillFull": {
      const rec = currentModalRec(); if (!rec) return;
      const meta = monthMeta(rec.year, rec.month);
      const wd = rec.includeSundays ? meta.dim : meta.workingDays;
      $("#mPresent").value = wd; $("#mAbsent").value = 0;
      commitModal(); refreshRecModal(); break;
    }
    case "quickAbsent": {
      const rec = currentModalRec(); if (!rec) return;
      const meta = monthMeta(rec.year, rec.month);
      const wd = rec.includeSundays ? meta.dim : meta.workingDays;
      const n = Number(btn.dataset.n);
      $("#mAbsent").value = n; $("#mPresent").value = Math.max(0, wd - n);
      commitModal(); refreshRecModal(); break;
    }
    case "delRec":
      confirmDialog("Delete record?", "Delete the " + monthLabel(UI.openRec.y, UI.openRec.m) + " hisaab for this worker?", "Delete", () => {
        const st = UI.openRec;
        Store.data.records = Store.data.records.filter((r) => !(r.workerId === st.wid && r.year === st.y && r.month === st.m));
        Store.save(); closeModal(); render(); toast("Record deleted");
      }, true); break;
    case "saveRecClose": commitModal(); closeModal(); render(); toast("Saved", "ok"); break;
    case "printRecModal": { const st = UI.openRec; commitModal(); printStatement(st.wid, st.y, st.m); break; }
    case "pdfRecModal": { const st = UI.openRec; commitModal(); downloadStatementPdf(st.wid, st.y, st.m); break; }
    case "saveSettings": {
      const s = Store.data.settings;
      s.shopName = $("#sShop").value.trim() || "My Shop";
      s.ownerName = $("#sOwner").value.trim();
      s.phone = $("#sPhone").value.trim();
      s.address = $("#sAddress").value.trim();
      s.statementNote = $("#sNote").value;
      Store.save(); render(); toast("Settings saved", "ok"); break;
    }
    case "keepDemo": Store.data.settings.demo = false; Store.save(); render(); break;
    case "clearDemo":
      confirmDialog("Start fresh?", "Erase the demo workers and records so you can add your own. <b>Your shop details in Settings are kept.</b>", "Start fresh", () => {
        const keep = { ...Store.data.settings, demo: false };
        Store.data = { settings: keep, workers: [], records: [] };
        Store.save(); render(); toast("Demo data cleared — add your first worker", "ok");
      }, true); break;
    case "lcMode": Cloud.mode = btn.dataset.mode; showLogin(true); break;
    case "continueOffline": showLogin(false); toast("Bina login — data sirf is device par save hoga"); break;
    case "cloudConnect": connectCloud(); break;
    case "cloudLogin": Cloud.mode = "in"; showLogin(true); break;
    case "cloudLogout": Cloud.signOut(); break;
    case "cloudDisconnect": disconnectCloud(); break;
    case "cloudSyncNow":
      Cloud.pushNow().then(() => { toast("Cloud par sync ho gaya ✔", "ok"); render(); });
      break;
    case "useCloud":
      if (Cloud._pending) { adoptRemote(Cloud._pending); Cloud._pending = null; toast("Cloud ka data load ho gaya ✔", "ok"); }
      break;
    case "useLocal":
      closeModal();
      Cloud.pushNow().then(() => { toast("Is device ka data cloud par upload ho gaya ✔", "ok"); render(); });
      break;
    case "exportData": exportData(); break;
    case "importData": importData(); break;
    case "loadSample":
      confirmDialog("Load sample data?", "This replaces all current workers and records with a demo set.", "Load sample", () => {
        Store.data = sampleData(); Store.save(); render(); toast("Sample data loaded", "ok");
      }, true); break;
    case "wipeData":
      confirmDialog("Erase all data?", "This deletes <b>all workers and salary records</b> from this browser. Download a backup first if unsure.", "Erase everything", () => {
        Store.data = blankData(); Store.save(); render(); toast("All data erased");
      }, true); break;
  }
});

/* month / year pickers */
document.addEventListener("change", (e) => {
  if (e.target.id === "selMonth") { UI.month = Number(e.target.value); render(); }
  if (e.target.id === "selYear") { UI.year = Number(e.target.value); render(); }
  if (e.target.id === "hisaabFilter" || e.target.id === "recordFilter") { UI.filter = e.target.value; render(); }
});

/* search inputs (debounced, focus preserved) */
let searchTimer = null;
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "hisaabSearch" || id === "workerSearch" || id === "recordSearch") {
    UI.search = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const pos = e.target.selectionStart;
      render();
      const n = document.getElementById(id);
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
    }, 220);
  }
  /* inline attendance editing in the hisaab table */
  if (e.target.classList && e.target.classList.contains("cell-inp")) {
    const inp = e.target;
    const f = inp.dataset.f;
    const wid2 = inp.dataset.wid;
    const rec = Store.ensureRecord(wid2, UI.year, UI.month, true);
    const meta = monthMeta(UI.year, UI.month);
    const wd = rec.includeSundays ? meta.dim : meta.workingDays;
    if (f === "totalHours") {
      rec.totalHours = Math.max(0, num(inp.value));
    } else {
      let v = clamp(Math.round(num(inp.value)), 0, wd);
      rec[f] = v;
      if (f === "presentDays") rec.absentDays = Math.max(0, wd - v);
      else rec.presentDays = Math.max(0, wd - v);
    }
    Store.persistRecord(rec);
    patchRow(wid2);
    patchAllTotals();
  }
  /* modal advance/deduction amount edits */
  if (e.target.closest && e.target.closest("#advList, #dedList")) {
    commitModal(); refreshRecModal();
  }
});
document.addEventListener("change", (e) => {
  if (e.target.classList && e.target.classList.contains("cell-inp")) patchAllTotals();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#overlay")) closeModal(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) { try { Cloud.maybePull(); } catch (e) {} } });
setInterval(() => { try { Cloud.maybePull(); } catch (e) {} }, 60000);

/* patch one hisaab row after inline edit (keeps focus) */
function patchRow(wid) {
  const tr = $('tr[data-wid="' + wid + '"]');
  if (!tr || !tr.querySelector(".cell-inp")) return;
  const rec = Store.record(wid, UI.year, UI.month);
  const w = Store.worker(wid);
  if (!rec || !w) return;
  const c = calc(w, rec, Store.data.settings);
  $$(".cell-inp", tr).forEach((inp) => {
    const f = inp.getAttribute("data-f");
    if (f === "presentDays" && document.activeElement !== inp) inp.value = c.present;
    if (f === "absentDays" && document.activeElement !== inp) inp.value = c.absent;
    if (f === "totalHours" && document.activeElement !== inp) inp.value = c.totalHours;
    inp.classList.toggle("bad", f === "totalHours" ? c.needsHours : c.overAttendance);
  });
  const cell = (k) => $('[data-cell="' + k + '"]', tr);
  if (cell("sundays")) cell("sundays").textContent = c.sundays;
  if (cell("wd")) cell("wd").textContent = c.workingDays;
  if (cell("perDay")) cell("perDay").innerHTML = c.isHourly ? '<span class="muted">' + money0(w.rate) + "/hr</span>" : money(c.perDay);
  if (cell("gross")) cell("gross").textContent = moneyS(c.grossEarnings);
  if (cell("adv")) { cell("adv").textContent = c.advTotal ? "−" + moneyS(c.advTotal) : "—"; cell("adv").style.color = "#dc2626"; }
  if (cell("ded")) { cell("ded").textContent = c.dedTotal ? "−" + moneyS(c.dedTotal) : "—"; cell("ded").style.color = "#dc2626"; }
  if (cell("net")) cell("net").textContent = moneyS(c.net);
}

/* recompute totals without re-rendering the table (keeps input focus) */
function patchAllTotals() {
  let g = 0, a = 0, d = 0, n = 0;
  rowsForMonth(UI.year, UI.month).forEach(({ c }) => { g += c.grossEarnings; a += c.advTotal; d += c.dedTotal; n += c.net; });
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("totGross", moneyS(g)); set("totAdv", a ? "−" + moneyS(a) : "—"); set("totDed", d ? "−" + moneyS(d) : "—"); set("totNet", moneyS(n));
  set("sumGross", moneyS(g)); set("sumAdv", a ? "−" + moneyS(a) : moneyS(0));
  set("sumDed", d ? "−" + moneyS(d) : moneyS(0)); set("sumNet", moneyS(n));
}

/* ----------------------------- 17. BOOTSTRAP ---------------------------- */
Store.load();
initTheme();

/* ---- keyboard shortcuts: Ctrl/Cmd+K = command palette, g+key = pages ---- */
let gKey = false, gTimer = null;
document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmdk(); return; }
  if (e.key === "Escape") { closeCmdk(); closeDrawer(); return; }
  if (typing) return;
  if (e.key.toLowerCase() === "g") { gKey = true; clearTimeout(gTimer); gTimer = setTimeout(() => { gKey = false; }, 900); return; }
  if (gKey) {
    gKey = false;
    const map = { d: "dashboard", h: "hisaab", w: "workers", l: "ledger", r: "records", s: "settings" };
    const v = map[e.key.toLowerCase()];
    if (v) { e.preventDefault(); UI.search = ""; UI.filter = "all"; go(v); }
  }
});

/* ---- global search box in the topbar ---- */
document.addEventListener("input", (e) => {
  if (e.target.id !== "gSearch") return;
  UI.search = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const pos = e.target.selectionStart;
    if (UI.view !== "hisaab" && UI.view !== "workers" && UI.view !== "records") UI.view = "hisaab";
    $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === UI.view));
    const m = VIEW_META[UI.view] || ["", ""];
    if ($("#viewTitle")) $("#viewTitle").textContent = m[0];
    if ($("#viewSub")) $("#viewSub").textContent = m[1];
    render();
    const g = document.getElementById("gSearch");
    if (g) { g.focus(); try { g.setSelectionRange(pos, pos); } catch (err) {} }
  }, 200);
});

syncMonthPickers();
go("dashboard");
try { Cloud.boot(); } catch (e) {}
window.Hisaab = { Store, calc, monthMeta, PdfDoc, inWords, UI, render, Cloud };
})();
