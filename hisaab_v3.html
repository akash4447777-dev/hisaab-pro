/* ---------- 📋 BULK PASTE (v3.5): ek saath text paste → alag-alag entries ---------- */
const CT_BULK_UNITS = {
  "kg": "kg", "k.g": "kg", "kilo": "kg", "quintal": "bag",
  "gram": "gram", "gm": "gram", "g": "gram",
  "ltr": "ltr", "litre": "ltr", "liter": "ltr", "l": "ltr", "ml": "ml",
  "pcs": "pcs", "pc": "pcs", "piece": "pcs", "pieces": "pcs",
  "pkt": "pkt", "packet": "pkt", "pack": "pkt",
  "dozen": "dozen", "dz": "dozen",
  "nos": "pcs", "nos.": "pcs", "nag": "pcs", "pair": "pcs",
  "box": "box", "bag": "bag", "plate": "plate", "cup": "cup", "bundle": "bundle", "carton": "carton"
};
const CT_BULK_GLUE = /^(\d+(?:\.\d+)?)(kg|kilo|gram|gm|g|ltr|litre|liter|l|ml|pcs|pc|piece|pkt|packet|dozen|dz|box|bag|plate|cup|bundle|carton)$/;
/* ek line → ek item row. Formats:
   "Maggi 4 kg 360"        → poori line ka total (₹360, ₹90/kg apne aap)
   "Aata 20 kg @ 42"       → per-unit rate (42/kg)
   "Maggi 4x90"            → per-unit rate
   "Maggi 4 kg 90 360"     → qty rate total (rate wala jeetta)
   "Maggi 360"             → qty 1, poori line ka total
   "14/11/2026"            → iske baad ki lines us date par */
function ctParseBulk(text, baseDate) {
  const rows = [], skipped = [];
  let curDate = String(baseDate || isoDate(new Date()));
  let verify = null, paidHint = null;
  String(text == null ? "" : text).split(/\r?\n/).forEach((raw, idx) => {
    let t = String(raw).trim();
    if (!t) return;
    /* Devanagari digits → ASCII (४५ → 45) — Hindi parche/OCR ke liye */
    t = t.replace(/[०-९]/g, (d) => String("०१२३४५६७८९".indexOf(d)));
    t = t.replace(/^[•\-*▪›>]+\s*/, "");                       /* bullet lines */
    t = t.replace(/₹|rs\.?|rp\.?|rupees?/gi, "");
    /* line ke saath judi date: "14/11/2026 Maggi 4 kg 360" */
    let lineDate = "";
    const idm = t.match(/^(\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?)[\s,]+(?=\D)/);
    if (idm) {
      const pp = idm[1].split(/[\/.]/).map(Number);
      let dd = pp[0], mm = pp[1], yy = pp[2];
      if (yy == null) { yy = new Date().getFullYear(); }
      if (mm > 12 && dd <= 12) { const sw = dd; dd = mm; mm = sw; }
      if (yy < 100) yy += 2000;
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
        lineDate = yy + "-" + String(mm).padStart(2, "0") + "-" + String(dd).padStart(2, "0");
        t = t.slice(idm[0].length).trim();
      }
    }
    /* "1." / "2)" sr-no hatan */
    const ordm = t.match(/^(\d{1,3}[.)])\s+(?=\S)/);
    if (ordm && t.split(/\s+/).length > 2) t = t.slice(ordm[1].length).trim();
    let prev = "";
    while (prev !== t) { prev = t; t = t.replace(/(\d),(\d)/g, "$1$2"); }   /* 1,740 → 1740 */
    const dm = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const dm2 = !dm && t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);
    if (dm) { curDate = dm[0]; return; }
    if (dm2) {
      let dd = Number(dm2[1]), mm = Number(dm2[2]), yy = Number(dm2[3]);
      if (mm > 12 && dd <= 12) { const sw = dd; dd = mm; mm = sw; }
      if (yy < 100) yy += 2000;
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
        curDate = yy + "-" + String(mm).padStart(2, "0") + "-" + String(dd).padStart(2, "0");
        return;
      }
    }
    /* info lines — total (verify), paid, baki */
    const tv = t.match(/^\W*(grand\s*total|total|kul|jod|sum|yog|net)\b[^\d]*([0-9][0-9,.]*(?:\.\d+)?)/i);
    if (tv) { verify = num(tv[2]); skipped.push({ line: idx + 1, raw: raw, why: "TOTAL line — preview me verify hoga", info: true }); return; }
    const pv = t.match(/^\W*(paid|jama|diya|advance|adv|cash|upi)\b[^\d]*([0-9][0-9,.]*(?:\.\d+)?)/i);
    if (pv) { paidHint = num(pv[2]); skipped.push({ line: idx + 1, raw: raw, why: "PAID line — entry ke ₹ button se laga lena", info: true }); return; }
    const bv = t.match(/^\W*(balance|baki|udhaar|bacat|due)\b[^\d]*([0-9][0-9,.]*(?:\.\d+)?)/i);
    if (bv) { skipped.push({ line: idx + 1, raw: raw, why: "BAKI line — info, entry nahi bani", info: true }); return; }

    const words = t.split(/\s+/);
    const nameParts = []; const P = []; const V = [];
    let unit = "", nextRate = false, perMode = false, seenName = false;
    words.forEach((w0) => {
      let w = w0.replace(/[,;|]+$/, "").toLowerCase();
      w = w.replace(/[-/]+$/, "");                      /* "360/-" → "360" */
      if (/^(qty|rate|amt|amount|price|no|sr|srno|sno|#|item|code)[:.]?$/.test(w)) return;
      const wu = w.replace(/\.$/, "");
      if (CT_BULK_UNITS[wu]) {
        /* pichhla number qty thi (jaise "4 kg") — price nahi */
        const arr = V.length ? V : P;
        const ln = arr[arr.length - 1];
        if (ln && !ln.rate && !ln.eq) ln.q = true;
        unit = CT_BULK_UNITS[wu]; perMode = false; return;
      }
      if (w === "x" || w === "×" || w === "@") { nextRate = true; return; }
      if (w === "per") { if (V.length) V[V.length - 1].rate = true; else if (P.length) P[P.length - 1].rate = true; perMode = true; return; }
      const sm = w.match(/^(\d+(?:\.\d+)?)\/(kg|gram|gm|g|ltr|l|ml|pcs|pc|pkt|dozen|unit)$/);  /* 90/kg */
      if (sm) { V.push({ v: Number(sm[1]), rate: true, eq: false }); if (!unit) unit = CT_BULK_UNITS[sm[2]] || "kg"; return; }
      const bm = w.match(/^\((\d+(?:\.\d+)?)\)$/);   /* (4) */
      if (bm) { (seenName ? V : P).push({ v: Number(bm[1]), rate: false, eq: false }); return; }
      const xm = w.match(/^(\d+(?:\.\d+)?)[x×@](\d+(?:\.\d+)?)$/);   /* 4x90 */
      if (xm) {
        V.push({ v: Number(xm[1]), rate: false, eq: false });
        V.push({ v: Number(xm[2]), rate: true, eq: false });
        seenName = seenName || nameParts.length > 0;
        return;
      }
      const gm = w.match(CT_BULK_GLUE);
      if (gm) { (seenName ? V : P).push({ v: Number(gm[1]), rate: false, eq: false, q: true }); if (!unit) unit = CT_BULK_UNITS[gm[2]] || ""; return; }
      const nm = w.match(/^=?(\d+(?:\.\d+)?)$/);
      if (nm) { (seenName ? V : P).push({ v: Number(nm[1]), rate: nextRate, eq: w[0] === "=" }); nextRate = false; return; }
      nextRate = false; perMode = false;
      nameParts.push(w0); seenName = true;
    });
    const name = nameParts.join(" ").replace(/[-–—:=]+$/, "").trim();
    if (!name) { skipped.push({ line: idx + 1, raw: raw, why: "item ka naam nahi mila" }); return; }
    const cleanV = V.filter((n) => !n.eq);
    if (!P.length && !cleanV.length && !V.some((n) => n.rate)) { skipped.push({ line: idx + 1, raw: raw, why: "koi number (qty/price) nahi mila" }); return; }
    /* sirf qty likhi hai, price nahi — galat entry banane se behtar skip */
    if (!P.length && !V.some((n) => n.rate) && cleanV.length && cleanV.every((n) => n.q)) {
      skipped.push({ line: idx + 1, raw: raw, why: "price nahi mila — sirf qty/unit likhi hai" }); return;
    }
    /* ---- scoring: kaun sa interpretation sahi hai ---- */
    const cands = [];
    const rateFlag = V.find((n) => n.rate);
    const eqNum = V.find((n) => n.eq);
    const near = (a, b) => Math.abs(a - b) < 0.51;
    if (rateFlag) {
      const q = P.length ? P[0].v : ((cleanV.find((n) => n !== rateFlag) || { v: 1 }).v);
      cands.push({ qty: q, rate: rateFlag.v, mode: "unit", score: 3 + (eqNum && near(q * rateFlag.v, eqNum.v) ? 1 : 0) });
    }
    if (cleanV.length === 1 && !rateFlag) {
      cands.push({ qty: P.length ? P[0].v : 1, lineTotal: cleanV[0].v, mode: "line", score: 2 });
    }
    if (cleanV.length >= 2 && !rateFlag) {
      const rest = P.length ? cleanV : cleanV.slice(1);
      const qty0 = P.length ? P[0].v : cleanV[0].v;
      const tt = rest[rest.length - 1].v;
      if (rest.length >= 2 && near(qty0 * rest[0].v, tt)) cands.push({ qty: qty0, rate: rest[0].v, mode: "unit", score: 3 });
      if (rest.length >= 3 && near(rest[0].v * rest[1].v, rest[2].v)) cands.push({ qty: rest[0].v, rate: rest[1].v, mode: "unit", score: 3 });
      if (P.length && cleanV.length === 2) cands.push({ qty: cleanV[0].v, lineTotal: cleanV[1].v, mode: "line", score: 2.5 });
      if (P.length && cleanV.length === 3 && near(cleanV[0].v * cleanV[1].v, cleanV[2].v))
        cands.push({ qty: cleanV[0].v, rate: cleanV[1].v, mode: "unit", score: 3 });
      cands.push({ qty: qty0, lineTotal: tt, mode: "line", score: rest.length === 1 ? 2 : 1 });
    }
    if (!cands.length) cands.push({ qty: P.length ? P[0].v : 1, lineTotal: (cleanV[0] || { v: 0 }).v, mode: "line", score: 0 });
    cands.sort((a, b2) => b2.score - a.score);
    const c = cands[0];
    let unit2 = unit || "";
    if (!unit2) {
      const hm = CT_UNIT_HINTS.find((h) => h[0].test(name));
      unit2 = hm ? hm[1] : "kg";
    }
    const it = normCtItem({ name: name, qty: c.qty, unit: unit2, rate: c.mode === "unit" ? c.rate : 0,
      lineTotal: c.mode === "line" ? c.lineTotal : 0, priceMode: c.mode });
    const row = {
      name: it.name, qty: it.qty, unit: it.unit, rate: it.rate, lineTotal: it.lineTotal,
      priceMode: it.priceMode, amt: ctItemAmt(it), date: lineDate || curDate, raw: raw
    };
    /* ACCURACY: rate list se cross-check — parsed per-unit rate list se 35%+ alag ho to flag */
    const lr = ctRateFor(name);
    const pu = ctItemUnitRate(it);
    if (lr && lr.rate > 0 && pu > 0 && Math.abs(pu - lr.rate) / lr.rate > 0.35) row.warnRate = lr.rate;
    rows.push(row);
  });
  return { rows: rows, skipped: skipped, verify: verify, paid: paidHint };
}

/* ---- OCR (v3.6): bill photo → text → rows. Browser me hi, internet se engine aata hai ---- */
const CT_OCR_CDN = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
function ctEnsureTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return new Promise((res, rej) => {
    const old = document.getElementById("ctOcrScript");
    if (old) old.remove();
    const s = document.createElement("script");
    s.id = "ctOcrScript";
    s.src = CT_OCR_CDN;
    let done = false;
    s.onload = () => { done = true; window.Tesseract ? res(window.Tesseract) : rej(new Error("engine nahi mila")); };
    s.onerror = () => { if (!done) rej(new Error("cdn fail")); };
    document.head.appendChild(s);
    setTimeout(() => { if (!done) rej(new Error("timeout")); }, 25000);
  });
}
/* OCR text ki safai: symbols hatan + number-jaise token me OCR confusions (O→0, l/I→1) */
function ctOcrClean(txt) {
  return String(txt == null ? "" : txt).split(/\r?\n/).map((l) => {
    let s = l.replace(/[|<>{}~^`_]/g, "").replace(/\s+/g, " ").trim();
    s = s.split(/\s+/).map((w) => {
      if (/^[0-9OolI.,\/\-x×@()%]+$/.test(w) && (w.match(/\d/g) || []).length >= 1 && /[OolI]/.test(w)) {
        return w.replace(/O/g, "0").replace(/o/g, "0").replace(/l/g, "1").replace(/I/g, "1");
      }
      return w;
    }).join(" ");
    return s.replace(/[०-९]/g, (d) => String("०१२३४५६७८९".indexOf(d)));
  }).filter((l) => l.length > 1).join("\n");
}
/* photo ko OCR-friendly banana: grayscale + contrast stretch (pure pixel fn — testable) */
function ctEnhancePixels(px) {
  const n = px.length;
  let mn = 255, mx = 0;
  for (let i = 0; i < n; i += 4) {
    const g = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) | 0;
    px[i] = px[i + 1] = px[i + 2] = g;
    if (g < mn) mn = g;
    if (g > mx) mx = g;
  }
  const span = Math.max(24, mx - mn);
  const k = 255 / span;
  for (let i = 0; i < n; i += 4) {
    let v = (px[i] - mn) * k;
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    /* halka sa S-curve: text ke kinare saaf */
    v = v < 128 ? v * v / 128 : 255 - (255 - v) * (255 - v) / 128;
    px[i] = px[i + 1] = px[i + 2] = v | 0;
  }
  return px;
}
function ctEnhanceForOcr(dataUrl) {
  return new Promise((res) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; res(v); } };
    setTimeout(() => done(dataUrl), 1500);   /* environment me image load na ho to original photo */
    const img = new Image();
    img.onload = () => {
      if (settled) return;
      try {
        const scale = Math.min(2.5, Math.max(1, 1500 / Math.max(1, img.width)));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const cx = cv.getContext("2d");
        cx.drawImage(img, 0, 0, w, h);
        const id = cx.getImageData(0, 0, w, h);
        ctEnhancePixels(id.data);
        cx.putImageData(id, 0, 0);
        res(cv.toDataURL("image/png"));
      } catch (e) { res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}
function ctRunOcr(dataUrl, onStatus) {
  if (onStatus) onStatus("photo saaf ho rahi hai…", 8);
  return ctEnhanceForOcr(dataUrl).then((good) => {
    if (onStatus) onStatus("engine load ho raha hai…", 12);
    return ctEnsureTesseract().then((T) => {
      if (onStatus) onStatus("photo padha ja raha hai…", 25);
      return T.recognize(good, "eng", {
        logger: (m) => {
          if (onStatus && m && m.status) onStatus(m.status, 25 + Math.round((m.progress || 0) * 70));
        },
        tessedit_pageseg_mode: 6
      });
    });
  }).then((res) => {
    const txt = (res && res.data && res.data.text) || "";
    const conf = res && res.data && res.data.confidence;
    return { text: ctOcrClean(txt), conf: conf == null ? null : Math.round(conf) };
  });
}

    '<div class="modal" style="max-width:760px">' +

        "<p>" + esc(r.unit) + " · default rate " + (r.rate ? rateS(r.rate) : "—") +
        (agg ? " · ab tak " + num(agg.qty) + " " + esc(agg.unit) + " · " + moneyS(agg.amt) + " · " + agg.n + " lines" : "") + "</p></div>" +
        '<button class="x" data-act="closeModal">✕</button></div>' +

        (hist.length
          ? '<div class="twrap"><table class="tbl"><thead><tr><th>Date</th><th>Party</th><th class="num">Qty</th><th>Mode</th><th class="num">Per-unit rate</th><th class="num">Amount</th></tr></thead><tbody>' +
            rows + "</tbody></table></div>" +
            (agg ? '<div class="ct-note" style="margin-top:10px">Avg rate ab tak: <b>' + rateS(agg.avgRate) + "/" + esc(agg.unit) +
              "</b> · aakhri: <b>" + rateS(agg.lastRate) + "</b> (" + esc(ctShort(agg.lastDate)) + ") — isi se OCR/paste ka ⚠ cross-check hota hai</div>" : "")
          : '<div class="empty"><div class="big">🕘</div><h4>Abhi koi kharid nahi</h4><p>Is item ki entry save karoge to history yahan dikhegi.</p></div>') +
      "</div>" +
      '<div class="modal-f"><div class="left">' +
        '<button class="btn" data-act="ctRateEdit" data-id="' + r.id + '">✎ Rate badlo</button></div>' +
        '<button class="btn primary" data-act="closeModal">Band karo</button></div>' +
    "</div>"
  );
}

/* ------------------------------ 16. EVENTS ------------------------------ */
document.addEventListener("click", (e) => {
  const nav = e.target.closest("#nav button");
  if (nav) { UI.search = ""; UI.filter = "all"; go(nav.dataset.view); return; }

  if (e.target.closest("input, select, textarea, label")) return;
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const wid = btn.dataset.wid;
  const Y = btn.dataset.y ? Number(btn.dataset.y) : UI.year;
  const M2 = btn.dataset.m !== undefined && btn.dataset.y ? Number(btn.dataset.m) : UI.month;

  switch (act) {
    case "prevMonth": UI.month--; if (UI.month < 0) { UI.month = 11; UI.year--; } render(); break;
    case "nextMonth": UI.month++; if (UI.month > 11) { UI.month = 0; UI.year++; } render(); break;
    case "todayMonth": UI.year = today.getFullYear(); UI.month = today.getMonth(); render(); break;
    case "addWorker": openWorkerModal(); break;
    case "editWorker": openWorkerModal(wid); break;
    case "delWorker":
      const w = Store.worker(wid);
      confirmDialog("Delete worker?", "Remove <b>" + esc(w ? w.name : "") + "</b> and all of their salary records? This cannot be undone.", "Delete worker", () => {
        Store.data.workers = Store.data.workers.filter((x) => x.id !== wid);
        Store.data.records = Store.data.records.filter((r) => r.workerId !== wid);
        if (!Store.saveChange()) { render(); return; } render(); toast("Worker deleted");
      }, true); break;
    case "workerHistory": { const ww = Store.worker(wid); UI.search = ww ? ww.name : ""; UI.filter = "all"; go("records"); break; }
    case "closeModal": closeModal(); break;
    case "closeDrawer": closeDrawer(); break;
    case "openProfile": closeModal(); openProfile(wid); break;
    case "toggleThemeIcon": toggleTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); break;
    case "toggleTheme": toggleTheme(btn.dataset.theme); break;
    case "setFilter": UI.filter = btn.dataset.filter; render(); break;
    case "exportCsv": exportCsv(); break;
    case "shareWa": shareWa(wid, Y, M2); break;
    case "doUndo": doUndo(); break;
    case "openCmdk": openCmdk(); break;
    case "openRec": openRecordModal(wid, UI.year, UI.month); break;
    case "openRecAt": openRecordModal(wid, Y, M2); break;
    case "printRec": printStatement(wid, UI.year, UI.month); break;
    case "printRecAt": printStatement(wid, Y, M2); break;
    case "pdfRec": downloadStatementPdf(wid, UI.year, UI.month); break;
    case "pdfRecAt": downloadStatementPdf(wid, Y, M2); break;
    case "togglePaid": togglePaid(wid, UI.year, UI.month); render(); break;
    case "gotoHisaab": go("hisaab"); break;
    case "autoFillAll": autoFillAll(); break;
    case "copyPrev": copyPreviousMonth(); break;
    case "markAllPaid": markAllPaid(); break;
    case "printAll": printAll(); break;
    case "pdfAll": downloadAllPdfs(); break;
    case "addAdv": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      const d = new Date();
      rec.advances.push({ id: uid(), date: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"), note: "", amount: 0 });
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal();
      const rows = $$("#advList .adv-row"); const last = rows[rows.length - 1];
      if (last) { const n = $(".a-note", last); if (n) n.focus(); }
      break;
    }
    case "delAdv": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.advances = rec.advances.filter((a) => a.id !== btn.dataset.id);
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal(); break;
    }
    case "addDed": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.deductions.push({ id: uid(), label: "", amount: 0 });
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal();
      const rows = $$("#dedList .ded-row"); const last = rows[rows.length - 1];
      if (last) { const n = $(".d-label", last); if (n) n.focus(); }
      break;
    }
    case "delDed": {
      const rec = currentModalRec(); if (!rec) return;
      commitModal();
      rec.deductions = rec.deductions.filter((d) => d.id !== btn.dataset.id);
      Store.persistRecord(rec); renderAdvDedLists(); refreshRecModal(); break;
    }
    case "fillFull": {
      const rec = currentModalRec(); if (!rec) return;
      const meta = monthMeta(rec.year, rec.month);
      const wd = rec.includeSundays ? meta.dim : meta.workingDays;
      $("#mPresent").value = wd; $("#mAbsent").value = 0;
      commitModal(); refreshRecModal(); break;
    }
    case "quickAbsent": {
      const rec = currentModalRec(); if (!rec) return;
      const meta = monthMeta(rec.year, rec.month);
      const wd = rec.includeSundays ? meta.dim : meta.workingDays;
      const n = Number(btn.dataset.n);
      $("#mAbsent").value = n; $("#mPresent").value = Math.max(0, wd - n);
      commitModal(); refreshRecModal(); break;
    }
    case "delRec":
      confirmDialog("Delete record?", "Delete the " + monthLabel(UI.openRec.y, UI.openRec.m) + " hisaab for this worker?", "Delete", () => {
        const st = UI.openRec;
        Store.data.records = Store.data.records.filter((r) => !(r.workerId === st.wid && r.year === st.y && r.month === st.m));
        if (!Store.saveChange()) { render(); return; } closeModal(); render(); toast("Record deleted");
      }, true); break;
    case "saveRecClose": if (!commitModal()) break; closeModal(); render(); toast("Is device par saved", "ok"); break;
    case "printRecModal": { const st = UI.openRec; commitModal(); printStatement(st.wid, st.y, st.m); break; }
    case "pdfRecModal": { const st = UI.openRec; commitModal(); downloadStatementPdf(st.wid, st.y, st.m); break; }
    case "saveSettings": {
      const s = Store.data.settings;
      s.shopName = $("#sShop").value.trim() || "My Shop";
      s.ownerName = $("#sOwner").value.trim();
      s.phone = $("#sPhone").value.trim();
      s.address = $("#sAddress").value.trim();
      s.statementNote = $("#sNote").value;
      if (!Store.saveChange()) { render(); return; } render(); toast("Settings saved", "ok"); break;
    }
    case "keepDemo": Store.data.settings.demo = false; if (!Store.saveChange()) { render(); return; } render(); break;
    case "clearDemo":
      confirmDialog("Start fresh?", "Erase the demo workers and records so you can add your own. <b>Your shop details in Settings are kept.</b>" +
        (ct().demo ? " Demo canteen entries bhi hat jayengi." : " <b>Aapki canteen entries safe rahengi.</b>"), "Start fresh", () => {
        const keep = { ...Store.data.settings, demo: false };
        const keepCt = ct().demo ? blankCanteen() : ct();
        Store.data = { settings: keep, workers: [], records: [], canteen: keepCt };
        if (!Store.saveChange()) { render(); return; } render(); toast("Demo data cleared — add your first worker", "ok");
      }, true); break;
    /* ------------------------- CANTEEN MODULE ------------------------- */
    case "gotoCanteen": ctUI().tab = ctUI().tab || "day"; go("canteen"); break;
    case "ctTab": { const u = ctUI(); u.tab = btn.dataset.tab || "day"; render(); break; }
    case "ctDayShift": {
      const u = ctUI();
      u.date = ctShiftDate(u.date, Number(btn.dataset.d) || 0);
      const p = ctParts(u.date); UI.year = p.y; UI.month = p.m;
      render(); break;
    }
    case "ctGoToday": {
      const u = ctUI(); u.date = isoDate(new Date());
      const p = ctParts(u.date); UI.year = p.y; UI.month = p.m;
      render(); break;
    }
    case "ctOpenDay": {
      const u = ctUI();
      if (btn.dataset.date) u.date = btn.dataset.date;
      u.tab = "day";
      const p = ctParts(u.date); UI.year = p.y; UI.month = p.m;
      render(); break;
    }
    case "ctAdd": openCtModal(null, btn.dataset.date || undefined); break;
    case "ctEdit": openCtModal(btn.dataset.id); break;
    case "ctDel": ctDelEntry(btn.dataset.id); break;
    case "ctDup": ctDupEntry(btn.dataset.id); break;
    case "ctPay": ctPayModal(btn.dataset.id); break;
    case "ctPaySave": ctPaySave(btn.dataset.id); break;
    case "ctPayZero": ctPayZero(btn.dataset.id); break;
    case "ctSave": ctSave(); break;
    case "ctSetKind": {
      const d = ctUI().edit; if (!d) break;
      if (CT_KINDS.indexOf(btn.dataset.kind) >= 0) d.kind = btn.dataset.kind;
      ctRenderModal(!!d.id); break;
    }
    case "ctSetMode": {
      const d = ctUI().edit; if (!d) break;
      const mode = btn.dataset.mode === "total" ? "total" : "itemized";
      if (mode === d.mode) break;
      /* item-wise ka bana hua total, lump-sum box me carry kar lo */
      if (mode === "total" && !num(d.amount)) d.amount = ctDraftAmount(d);
      d.mode = mode;
      ctRenderModal(!!d.id);
      break;
    }
    case "ctAddItem": { const d = ctUI().edit; if (!d) break; d.items = (d.items || []).concat([ctBlankItem()]); ctRepaintItems(); break; }
    case "ctDelItem": {
      const d = ctUI().edit; if (!d) break;
      const i = Number(btn.dataset.i);
      if (!isNaN(i) && Array.isArray(d.items) && d.items.length > i) d.items.splice(i, 1);
      if (!d.items.length) d.items = [ctBlankItem()];
      ctRepaintItems(); break;
    }
    case "ctClearItems": { const d = ctUI().edit; if (!d) break; d.items = [ctBlankItem()]; ctRepaintItems(); break; }
    case "ctPayFull": {
      const d = ctUI().edit; if (!d) break;
      const amt = ctDraftAmount(d);
      d.paid = amt;
      const p = $("#ctPaid"); if (p) p.value = amt || "";
      const pm = $("#ctPayMode"); if (pm && pm.value === "udhaar") { pm.value = "cash"; d.payMode = "cash"; }
      ctPatchTotals();
      toast(amt ? "Poora " + money0(amt) + " paid likh diya" : "Pehle saman ka total bharo", amt ? "ok" : "bad");
      break;
    }
    case "ctPayNone": {
      const d = ctUI().edit; if (!d) break;
      d.paid = 0; d.payMode = "udhaar";
      const p = $("#ctPaid"); if (p) p.value = "";
      const pm = $("#ctPayMode"); if (pm) pm.value = "udhaar";
      ctPatchTotals(); toast("Poora udhaar — baki me chala gaya"); break;
    }
    case "ctScope": {
      const u = ctUI(); const s = btn.dataset.scope;
      u.scope = s === "all" ? "all" : (s === "custom" ? "custom" : "month");
      if (u.scope !== "custom") { u.from = ""; u.to = ""; }
      else { if (!u.from) u.from = monthFirst(UI.year, UI.month); if (!u.to) u.to = monthLast(UI.year, UI.month); }
      render(); break;
    }
    case "ctLogScope": { const u = ctUI(); u.logScope = btn.dataset.scope === "all" ? "all" : "month"; render(); break; }
    case "ctResetFilter": {
      const u = ctUI(); u.q = ""; u.kind = "all"; u.from = ""; u.to = ""; u.scope = "month";
      render(); toast("Filter reset"); break;
    }
    case "ctRateAdd": ctRateAdd(); break;
    case "ctRateEdit": ctRateEditModal(btn.dataset.id); break;
    case "ctRateHist": ctRateHist(btn.dataset.id); break;
    case "ctRateSave": ctRateSave(btn.dataset.id); break;
    case "ctRateDel": ctRateDel(btn.dataset.id); break;
    case "ctCsv": ctCsv(); break;
    case "ctPrintDay": ctPrintDay(); break;
    case "ctBulk": ctBulkOpen(); break;
    case "ctOcrPick": {
      const fi = document.querySelector('[data-ct-ocr="1"]');
      if (fi) fi.click();
      break;
    }
    case "ctPhotoOcr": {
      const d = ctUI().edit;
      if (!d || !d.photo) break;
      toast("🔍 OCR chal raha hai — photo padhi ja rahi hai…");
      ctRunOcr(d.photo, () => {})
        .then((o) => {
          const text = o.text;
          if (!text.trim()) return toast("Photo se text nahi padha — roshni me saaf photo lo", "bad");
          ctUI().bulk = {
            text: text, kind: d.kind === "sale" ? "sale" : (d.kind === "expense" ? "expense" : "purchase"),
            date: d.date, party: d.party, split: true, photo: d.photo, rows: null
          };
          ctRenderBulk();
          toast(o.conf != null && o.conf < 55
            ? "OCR confidence kam (" + o.conf + "%) — preview me har cell check karo"
            : "OCR text aa gaya" + (o.conf != null ? " (confidence " + o.conf + "%)" : "") + " — preview me check karke save karo",
            o.conf != null && o.conf < 55 ? "bad" : "ok");
        })
        .catch(() => toast("OCR ke liye internet chahiye — photo lagi rahegi, text paste karke bhi chal sakte ho", "bad"));
      break;
    }
    case "ctBulkSplit": {
      const b = ctUI().bulk;
      if (b) { b.split = btn.dataset.v === "1"; ctRenderBulk(); }
      break;
    }
    case "ctBulkSave": ctBulkSave(); break;
    case "ctPdfDay": ctPdfDay(ctUI().date); break;
    case "ctPdfMonth": ctPdfMonth(UI.year, UI.month); break;
    case "ctPhotoView": {
      const pid = btn.dataset.id;
      const pe = pid ? ctEntry(pid) : null;
      const src = pid ? (pe || {}).photo : (ctUI().edit || {}).photo;
      if (src) ctLightbox(src, pe ? ctPretty(pe.date) + " · " + (pe.party || ctKindOf(pe).label) : "Bill / parche ki photo");
      break;
    }
    case "ctPhotoDel": {
      const d = ctUI().edit;
      if (d) { d.photo = ""; const b = document.getElementById("ctPhotoBox"); if (b) b.innerHTML = ctPhotoBoxHTML(d); }
      break;
    }
    case "ctPrintMonth": ctPrintMonth(); break;
    case "ctShareDay": ctShareDay(); break;
    case "ctShareMonth": ctShareMonth(); break;
    case "ctTplPick": ctTplPick(); break;
    case "ctTplSet": if (ctSetTpl(btn.dataset.id)) ctTplPick(); break;
    case "ctSharePdfDay": ctSharePdf("day", ctUI().date); break;
    case "ctSharePdfMonth": ctSharePdf("month", null, UI.year, UI.month); break;
    case "ctRestore": ctRestoreLog(btn.dataset.log); break;
    case "ctWipe": ctWipe(); break;

    case "lcMode": Cloud.mode = btn.dataset.mode; showLogin(true); break;
    case "continueOffline":
      Cloud.resetSession(); Cloud.user = null; Cloud.offlineMode = true;
      showLogin(false); toast("Bina cloud sync — data sirf is device par; pending changes safe hain"); break;
    case "cloudConnect": connectCloud(); break;
    case "cloudLogin": Cloud.mode = "in"; showLogin(true); break;
    case "cloudLogout": Cloud.signOut(); break;
    case "cloudDisconnect": disconnectCloud(); break;
    case "cloudSyncNow":
      if (Cloud._pending) { askWhichData(); break; }
      Cloud.syncNow().then((ok) => { toast(ok ? "Cloud sync confirm ho gaya ✔" : "Sync confirm nahi hua — local data safe; status check karein", ok ? "ok" : "bad"); render(); });
      break;
    case "retrySave":
      if (Store.save()) {
        if (Cloud.user) Cloud.syncNow();
        else Cloud.setStatus(Cloud.configured() ? "loggedout" : "local");
        toast("Is device par save confirm hua", "ok");
      }
      break;
    case "cloudResolve": askWhichData(); break;
    case "useCloud": Cloud.resolve("remote"); break;
    case "useLocal": Cloud.resolve("local"); break;
    case "recoveryOpen": Recovery.open(); break;
    case "recoveryDownload": Recovery.download(btn.dataset.id); break;
    case "recoveryMerge": Recovery.merge(btn.dataset.id); break;
    case "exportData": exportData(); break;
    case "importData": importData(); break;
    case "loadSample":
      if (Cloud.scope) { toast("Account ke real data par demo load nahi kar sakte. Pehle JSON backup lein.", "bad"); break; }
      confirmDialog("Load sample data?", "Saare current workers, salary records aur canteen data demo se replace honge. Pehle JSON backup lein.", "Load sample", () => {
        const previous = Store.data; Store.data = sampleData();
        if (!Store.save(false, { checkpoint: true })) { Store.data = previous; return; }
        render(); toast("Sample data loaded", "ok");
      }, true); break;
    case "wipeData":
      confirmDialog("Erase all data?", "Ye <b>saare workers, salary records aur canteen data</b> erase karega. Cloud login on hai to doosre devices par bhi deletion sync hogi. Pehle JSON backup lein.", "Erase everything", () => {
        const previous = Store.data; Store.data = blankData();
        if (!Store.save(false, { checkpoint: true })) { Store.data = previous; return; }
        render(); toast("Data cleared — safety copy available; cloud status check karein");
      }, true); break;
  }
});

/* month / year pickers */
document.addEventListener("change", (e) => {
  if (e.target.id === "selMonth") { UI.month = Number(e.target.value); render(); }
  if (e.target.id === "selYear") { UI.year = Number(e.target.value); render(); }
  if (e.target.id === "hisaabFilter" || e.target.id === "recordFilter") { UI.filter = e.target.value; render(); }
});

/* search inputs (debounced, focus preserved) */
let searchTimer = null;
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "hisaabSearch" || id === "workerSearch" || id === "recordSearch") {
    UI.search = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const pos = e.target.selectionStart;
      render();
      const n = document.getElementById(id);
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
    }, 220);
  }
  /* inline attendance editing in the hisaab table */
  if (e.target.classList && e.target.classList.contains("cell-inp")) {
    const inp = e.target;
    const f = inp.dataset.f;
    const wid2 = inp.dataset.wid;
    const rec = Store.ensureRecord(wid2, UI.year, UI.month, true);
    const meta = monthMeta(UI.year, UI.month);
    const wd = rec.includeSundays ? meta.dim : meta.workingDays;
    if (f === "totalHours") {
      rec.totalHours = Math.max(0, num(inp.value));
    } else {
      let v = clamp(Math.round(num(inp.value)), 0, wd);
      rec[f] = v;
      if (f === "presentDays") rec.absentDays = Math.max(0, wd - v);
      else rec.presentDays = Math.max(0, wd - v);
    }
    Store.persistRecord(rec);
    patchRow(wid2);
    patchAllTotals();
  }
  /* modal advance/deduction amount edits */
  if (e.target.closest && e.target.closest("#advList, #dedList")) {
    commitModal(); refreshRecModal();
  }
});
document.addEventListener("change", (e) => {
  if (e.target.classList && e.target.classList.contains("cell-inp")) patchAllTotals();
});

/* ---------------- canteen: modal inputs, din chunna, entry filters ---------------- */
const CT_MODAL_IDS = ["ctLump", "ctPaid", "ctParty", "ctBill", "ctNote", "ctDateM", "ctPayMode"];
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el) return;
  if (el.dataset && el.dataset.ctItem !== undefined) { ctFieldInput(el); return; }
  if (el.id && CT_MODAL_IDS.indexOf(el.id) >= 0) { ctFieldInput(el); return; }
  if (el.id === "ctSearch") {
    /* sirf table dobara banao — search box ka focus nahi tootega */
    ctUI().q = el.value;
    const body = document.getElementById("ctEntriesBody");
    if (body) body.innerHTML = ctEntriesTable();
  }
  if (el.dataset && el.dataset.br !== undefined) { ctBulkRowEdit(el); return; }
  if (el.id === "ctBulkText") { const b = ctUI().bulk; if (b) { b.text = el.value; ctBulkPatch(); } return; }
  if (el.id === "ctBulkDate") { const b = ctUI().bulk; if (b && el.value) { b.date = el.value; ctBulkPatch(); } return; }
  if (el.id === "ctBulkParty") { const b = ctUI().bulk; if (b) b.party = el.value; return; }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (!el) return;
  if (el.dataset && el.dataset.br !== undefined) { ctBulkRowEdit(el); return; }
  if (el.dataset && el.dataset.ctPhoto !== undefined) { ctPhotoPick(el); return; }
  if (el.dataset && el.dataset.ctOcr !== undefined) { ctOcrFromFile(el); return; }
  if (el.id === "ctBulkKind") { const b = ctUI().bulk; if (b) b.kind = el.value; return; }
  if (el.dataset && el.dataset.ctItem !== undefined) {
    ctFieldInput(el);
    if (el.dataset.ctF === "name") ctAutoRate(el);
    return;
  }
  if (el.id === "ctDatePick") {
    const u = ctUI();
    if (el.value) { u.date = el.value; const p = ctParts(el.value); UI.year = p.y; UI.month = p.m; }
    render();
  } else if (el.id === "ctFrom" || el.id === "ctTo") {
    const u = ctUI();
    u[el.id === "ctFrom" ? "from" : "to"] = el.value || "";
    if (u.from || u.to) u.scope = "custom";
    render();
  } else if (el.id === "ctKindSel") {
    ctUI().kind = CT_KINDS.indexOf(el.value) >= 0 ? el.value : "all";
    render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#overlay")) closeModal(); }
});
window.addEventListener("storage", (event) => {
  if (event.key === KEY && event.newValue !== Store.diskValue || event.key === null) {
    Cloud.resetSession(); Cloud.user = null; Cloud.offlineMode = true;
    Cloud.setStatus("storage", "Doosre tab me data badla. Is tab ka JSON backup lekar reload karein; stale copy se overwrite blocked hai.");
  }
  if (event.key === OWNER_KEY && event.newValue !== Cloud.scope) {
    Cloud.resetSession(); Cloud.user = null; Cloud.offlineMode = true;
    Cloud.setStatus("storage", "Doosre tab me account badla. Is tab ka JSON backup lekar reload karein; is data ko doosre account me upload nahi kiya gaya.");
    toast(Cloud.lastError, "bad");
  }
});
window.addEventListener("online", () => { if (Cloud.user && !Cloud._pending) Cloud.syncNow(); });
window.addEventListener("focus", () => { Cloud.maybePull(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { try { Cloud.maybePull(); } catch (e) {} } });
setInterval(() => { try { Cloud.maybePull(); } catch (e) {} }, 60000);

/* patch one hisaab row after inline edit (keeps focus) */
function patchRow(wid) {
  const tr = $('tr[data-wid="' + wid + '"]');
  if (!tr || !tr.querySelector(".cell-inp")) return;
  const rec = Store.record(wid, UI.year, UI.month);
  const w = Store.worker(wid);
  if (!rec || !w) return;
  const c = calc(w, rec, Store.data.settings);
  $$(".cell-inp", tr).forEach((inp) => {
    const f = inp.getAttribute("data-f");
    if (f === "presentDays" && document.activeElement !== inp) inp.value = c.present;
    if (f === "absentDays" && document.activeElement !== inp) inp.value = c.absent;
    if (f === "totalHours" && document.activeElement !== inp) inp.value = c.totalHours;
    inp.classList.toggle("bad", f === "totalHours" ? c.needsHours : c.overAttendance);
  });
  const cell = (k) => $('[data-cell="' + k + '"]', tr);
  if (cell("sundays")) cell("sundays").textContent = c.sundays;
  if (cell("wd")) cell("wd").textContent = c.workingDays;
  if (cell("perDay")) cell("perDay").innerHTML = c.isHourly ? '<span class="muted">' + money0(w.rate) + "/hr</span>" : money(c.perDay);
  if (cell("gross")) cell("gross").textContent = moneyS(c.grossEarnings);
  if (cell("adv")) { cell("adv").textContent = c.advTotal ? "−" + moneyS(c.advTotal) : "—"; cell("adv").style.color = "#dc2626"; }
  if (cell("ded")) { cell("ded").textContent = c.dedTotal ? "−" + moneyS(c.dedTotal) : "—"; cell("ded").style.color = "#dc2626"; }
  if (cell("net")) cell("net").textContent = moneyS(c.net);
}

/* recompute totals without re-rendering the table (keeps input focus) */
function patchAllTotals() {
  let g = 0, a = 0, d = 0, n = 0;
  rowsForMonth(UI.year, UI.month).forEach(({ c }) => { g += c.grossEarnings; a += c.advTotal; d += c.dedTotal; n += c.net; });
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("totGross", moneyS(g)); set("totAdv", a ? "−" + moneyS(a) : "—"); set("totDed", d ? "−" + moneyS(d) : "—"); set("totNet", moneyS(n));
  set("sumGross", moneyS(g)); set("sumAdv", a ? "−" + moneyS(a) : moneyS(0));
  set("sumDed", d ? "−" + moneyS(d) : moneyS(0)); set("sumNet", moneyS(n));
}

/* ----------------------------- 17. BOOTSTRAP ---------------------------- */
Store.load();
initTheme();

/* ---- keyboard shortcuts: Ctrl/Cmd+K = command palette, g+key = pages ---- */
let gKey = false, gTimer = null;
document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmdk(); return; }
  if (e.key === "Escape") { closeCmdk(); closeDrawer(); return; }
  if (typing) return;
  if (e.key.toLowerCase() === "g") { gKey = true; clearTimeout(gTimer); gTimer = setTimeout(() => { gKey = false; }, 900); return; }
  if (gKey) {
    gKey = false;
    const map = { d: "dashboard", h: "hisaab", w: "workers", l: "ledger", c: "canteen", r: "records", s: "settings" };
    const v = map[e.key.toLowerCase()];
    if (v) { e.preventDefault(); UI.search = ""; UI.filter = "all"; go(v); }
  }
});

/* ---- global search box in the topbar ---- */
document.addEventListener("input", (e) => {
  if (e.target.id !== "gSearch") return;
  UI.search = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const pos = e.target.selectionStart;
    if (UI.view !== "hisaab" && UI.view !== "workers" && UI.view !== "records") UI.view = "hisaab";
    $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === UI.view));
    const m = VIEW_META[UI.view] || ["", ""];
    if ($("#viewTitle")) $("#viewTitle").textContent = m[0];
    if ($("#viewSub")) $("#viewSub").textContent = m[1];
    render();
    const g = document.getElementById("gSearch");
    if (g) { g.focus(); try { g.setSelectionRange(pos, pos); } catch (err) {} }
  }, 200);
});

syncMonthPickers();
go("dashboard");
try { Cloud.boot(); } catch (e) {}

  canteen: { data: ct, totals: ctTotals, entries: ctAll, onDate: ctOnDate, inMonth: ctInMonth,
             dayLedger: ctDayLedger, monthLedger: ctMonthLedger, openModal: openCtModal, save: ctSave,
             csv: ctCsv, printDay: ctPrintDay, printMonth: ctPrintMonth, blank: blankCanteen,
             pdfDay: ctPdfDay, pdfMonth: ctPdfMonth, renderModal: ctRenderModal, photoBox: ctPhotoBoxHTML,
             bulkParse: ctParseBulk, bulkOpen: ctBulkOpen, bulkSave: ctBulkSave, ocrRun: ctRunOcr,
             ocrClean: ctOcrClean, enhancePixels: ctEnhancePixels, shareMonth: ctShareMonth,
             pdfDayStr: ctPdfDayStr, pdfMonthStr: ctPdfMonthStr, sharePdf: ctSharePdf,
             tpls: CT_TPLS, tpl: ctTpl, setTpl: ctSetTpl, tplPick: ctTplPick,
             pdfCols: { day: CT_COLS_DAY, dayItems: CT_COLS_ITEMS, month: CT_COLS_MONTH,
                        monthItems: CT_COLS_ITEMS, party: CT_COLS_PARTY } } };
})();
